<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161f29"/>
      <stop offset="100%" stop-color="#0e141b"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- tuning dial ring -->
  <circle cx="50" cy="56" r="24" fill="none" stroke="#f2a71b" stroke-width="7"/>

  <!-- center hub -->
  <circle cx="50" cy="56" r="5" fill="#f2a71b"/>

  <!-- pointer (tuning indicator) -->
  <path d="M 50 26 L 44 38 L 56 38 Z" fill="#f2a71b"/>

  <!-- tick marks -->
  <rect x="47.5" y="80.5" width="5" height="7" rx="1.5" fill="#f2a71b"/>
  <rect x="18.5" y="52.5" width="7" height="5" rx="1.5" fill="#f2a71b" transform="rotate(0 22 55)"/>
  <rect x="74.5" y="52.5" width="7" height="5" rx="1.5" fill="#f2a71b"/>
</svg>
