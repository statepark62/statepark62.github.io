<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>일본사 학습 트리</title>
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f2a44">

<style>
:root{
  --bg:#f6f4ef; --card:#ffffff; --ink:#23262b; --sub:#5d636b; --line:#b9b2a3;
  --accent:#2f5d8a; --accent-soft:#e3edf6; --kor:#b2432f; --kor-soft:#fbebe7;
  --ok:#2e7d4f; --ok-soft:#e3f3e9; --warn:#8a6414; --warn-soft:#fbf1d8; --shadow:0 1px 3px rgba(0,0,0,.12);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#16181c; --card:#20242a; --ink:#e8e8e6; --sub:#a4abb4; --line:#5a5d63;
    --accent:#7fb2e0; --accent-soft:#233444; --kor:#f08a75; --kor-soft:#3a2420;
    --ok:#6fcf97; --ok-soft:#1f3328; --warn:#e3b95a; --warn-soft:#3a3120; --shadow:0 1px 3px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html{font-size:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Pretendard","Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  font-size:18.5px; line-height:1.7; text-align:center;
}
.wrap{max-width:1180px; margin:0 auto; padding:36px 20px 80px}
h1{font-size:clamp(32px,5vw,50px); line-height:1.25; margin:0 0 10px; letter-spacing:-.02em}
h2{font-size:28px; margin:0 0 8px}
h3{font-size:21px; margin:34px 0 14px}
.subtitle{font-size:19.5px; color:var(--sub); margin:0 auto 22px; max-width:820px}
.stat{display:inline-block; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:6px 20px; font-size:17px; margin:0 4px 6px}
.toolbar{margin:10px 0 0; display:flex; flex-wrap:wrap; justify-content:center; gap:10px}
button,select{font:inherit; font-size:16.5px; color:inherit}
.btn{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:7px 16px; cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.4; cursor:default}
.btn:disabled:hover{border-color:var(--line)}
.btn.on{background:var(--accent); color:#fff; border-color:var(--accent)}
.btn.kor.on{background:var(--kor); border-color:var(--kor)}

/* ───── 트리 ───── */
.tree{position:relative; margin:34px auto 10px; padding-top:4px}
.trunk{position:absolute; left:50%; top:60px; bottom:60px; width:3px; background:var(--line); transform:translateX(-50%); z-index:0}
.root{position:relative; z-index:1; display:inline-block; background:var(--accent); color:#fff; font-size:22px; font-weight:700; padding:10px 34px; border-radius:14px; box-shadow:var(--shadow)}
.row{position:relative; z-index:1; display:grid; grid-template-columns:repeat(6,1fr); gap:14px; margin-top:42px}
.row::before{content:""; position:absolute; top:-22px; left:calc(100%/12); right:calc(100%/12); height:3px; background:var(--line)}
.node{position:relative; background:var(--card); border:2px solid var(--line); border-radius:14px; padding:12px 8px 10px; cursor:pointer; box-shadow:var(--shadow); text-align:center; line-height:1.4; min-height:112px}
.node::before{content:""; position:absolute; left:50%; top:-24px; height:22px; width:3px; background:var(--line); transform:translateX(-50%)}
.node .nn{font-size:12.5px; color:var(--sub); font-weight:700}
.node .nm{display:block; font-size:18px; font-weight:700; margin:2px 0}
.node .pd{display:block; font-size:14.5px; color:var(--sub)}
.node .pg{display:block; margin-top:6px; font-size:14.5px; color:var(--accent); font-weight:600}
.node:hover{border-color:var(--accent)}
.node.sel{border-color:var(--accent); background:var(--accent-soft)}
.node.off{opacity:.5; cursor:not-allowed; background:transparent; box-shadow:none; border-style:dashed}
.node.off:hover{border-color:var(--line)}
.node:focus-visible{outline:3px solid var(--accent); outline-offset:2px}

/* ───── 패널 ───── */
.tabs{display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin:30px 0 8px}
.panel{margin-top:14px}
.era-head{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px 26px; margin:16px auto 4px; box-shadow:var(--shadow)}
.era-head .per{font-size:19.5px; color:var(--accent); font-weight:700; margin-bottom:8px}
.era-head p{margin:0 auto; max-width:900px; font-size:18px}
.filters{display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:10px; margin:18px 0 6px}
.filters select{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:7px 12px}
.cnt{font-size:16px; color:var(--sub)}
.empty{padding:36px 0; color:var(--sub)}

.item{background:var(--card); border:1px solid var(--line); border-radius:14px; margin:12px auto; max-width:1040px; box-shadow:var(--shadow); text-align:center}
.ihead{width:100%; background:none; border:0; padding:16px 20px; cursor:pointer; text-align:center; display:block}
.ihead:focus-visible{outline:3px solid var(--accent); outline-offset:-3px; border-radius:14px}
.ititle{display:block; font-size:20px; font-weight:700}
.iyear{display:block; font-size:16px; color:var(--sub); margin-top:2px}
.badges{display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin-top:8px}
.badges{gap:4px 16px}
.badge{font-size:15.5px; font-weight:600; line-height:1.6; padding:0; border:0; background:none; cursor:default}
.b-kor{color:var(--kor)}
.b-chk{color:var(--warn)}
.b-theme{color:var(--sub)}
.b-cand{color:#6b3f93}
.thbar{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:14px auto 0; max-width:1100px}
.thbar .btn{padding:5px 12px; font-size:15.5px}
@media (prefers-color-scheme: dark){ .b-cand{color:#c9a8ee} }
.ibody{padding:4px 26px 22px; border-top:1px dashed var(--line); margin:0 18px}
.ibody p{margin:14px auto 0; max-width:900px; font-size:18px}
.kbox{background:var(--kor-soft); border:1px solid var(--kor); border-radius:12px; padding:10px 16px; margin:14px auto 0; max-width:900px; font-size:17.5px}
.kbox b{color:var(--kor)}
.nbox{background:var(--warn-soft); border:1px solid var(--warn); border-radius:12px; padding:8px 16px; margin:12px auto 0; max-width:900px; font-size:16.5px}
.meta{font-size:17px; margin-top:12px; color:var(--sub)}
.meta b{color:var(--ink)}
.refs{list-style:none; padding:0; margin:6px auto 0; font-size:16.5px; color:var(--sub); max-width:900px}
.refs li{margin:3px 0}
.ctl{display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:16px; margin-top:16px}
.ctl label{font-size:16.5px; cursor:pointer}
.ctl select{background:var(--card); border:1px solid var(--line); border-radius:8px; padding:5px 10px}
textarea{display:block; width:100%; max-width:900px; margin:12px auto 0; min-height:70px; padding:10px 12px; font:inherit; font-size:16.5px; text-align:left; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:10px; resize:vertical}
.era-title{margin-top:36px}
.refsec{margin:44px auto 0; max-width:1040px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 24px; box-shadow:var(--shadow)}
.refsec h3{margin:0 0 10px}
.refsec .refs{max-width:none}
.foot{margin-top:46px; font-size:15.5px; color:var(--sub)}

/* ───── 지도 ───── */
.mapwrap{margin:16px auto 0; max-width:900px}
.map{height:290px; border:1px solid var(--line); border-radius:12px; overflow:hidden; position:relative; z-index:0}
.map.big{height:580px; max-width:1040px; margin:12px auto 0}
.plinks{display:flex; flex-wrap:wrap; justify-content:center; gap:4px 20px; margin-top:10px; font-size:16.5px}
.plinks a{color:var(--accent); text-decoration:none; border-bottom:1px dotted var(--accent)}
.legend{font-size:16px; color:var(--sub); margin-top:4px}
.dot{display:inline-block; width:12px; height:12px; border-radius:50%; vertical-align:-1px; margin-left:8px}
.dot.jp{background:#2f5d8a}
.dot.kr{background:#b2432f}
.leaflet-container{font-family:inherit}
.pop{text-align:center; font-size:16px; line-height:1.5; color:#23262b}
.pop ul{list-style:none; padding:0; margin:6px 0 0; font-size:14.5px; color:#5d636b; text-align:left}
.pop a{color:#2f5d8a}

/* ───── 연표 ───── */
.chbar{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin:14px auto 0; max-width:1100px}
.chbar .btn{padding:5px 12px; font-size:15.5px}
.chyear{display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:10px; margin:16px 0 0}
.chyear input{font:inherit; font-size:16.5px; width:150px; text-align:center; padding:6px 10px; border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink)}
.chsum{background:var(--card); border:1px solid var(--accent); border-radius:12px; padding:10px 18px; margin:16px auto 0; max-width:1040px; font-size:17px; line-height:1.6}
.chgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; max-width:1140px; margin:18px auto 0; align-items:start}
.lane{background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:12px 10px 14px}
.lane h3{margin:0 0 4px; font-size:20px}
.lane.kr h3{color:var(--kor)}
.lane .sub{font-size:14.5px; color:var(--sub); margin-bottom:8px}
.lane .gh{display:block; width:100%; background:none; border:0; border-top:1px dashed var(--line); margin-top:10px; padding:8px 0 4px; font-weight:700; font-size:16.5px; cursor:pointer}
.lane .gt{margin-top:10px; padding-top:6px; border-top:1px dashed var(--line); font-weight:700; font-size:16.5px}
.crow{display:block; width:100%; background:none; border:1px solid transparent; border-radius:8px; padding:4px 6px; margin:2px 0; cursor:pointer; line-height:1.35}
.crow:hover{border-color:var(--accent)}
.crow .cn{display:block; font-size:16.5px; font-weight:600}
.crow .cy{display:block; font-size:14px; color:var(--sub)}
.crow .cf{color:var(--warn); font-size:13px; font-weight:600}
.crow.hit{background:var(--accent-soft); border-color:var(--accent)}
.crow.sel{background:var(--accent); border-color:var(--accent)}
.crow.sel .cn,.crow.sel .cy,.crow.sel .cf{color:#fff}
.chnote{max-width:1040px; margin:22px auto 0; font-size:15.5px; color:var(--sub); text-align:left; line-height:1.6}
.chnote li{margin:3px 0}
@media (max-width:860px){ .chgrid{grid-template-columns:1fr} }

/* ───── 자료실 ───── */
.guide{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 22px; margin:16px auto 0; max-width:1040px; text-align:center}
.guide summary{cursor:pointer; font-weight:700; font-size:18px}
.guide table{margin:14px auto 6px; border-collapse:collapse; width:100%; font-size:16.5px}
.guide th,.guide td{border:1px solid var(--line); padding:7px 10px}
.guide th{background:var(--bg)}
.guide ol{text-align:left; max-width:900px; margin:10px auto; font-size:16.5px}
.mcard{background:var(--card); border:1px solid var(--line); border-radius:14px; margin:14px auto; max-width:1040px; box-shadow:var(--shadow); padding:18px 24px}
.mcard h3{margin:0 0 4px; font-size:21px}
.mcard h3 a{color:var(--accent); text-decoration:none; border-bottom:1px dotted var(--accent)}
.mcard .msub{color:var(--sub); font-size:16.5px}
.mcard p{margin:12px auto 0; max-width:900px; font-size:17.5px}
.mchips{display:flex; flex-wrap:wrap; justify-content:center; gap:6px 10px; margin-top:10px}
.mchips .btn{padding:3px 12px; font-size:15.5px}
.mcav{margin:12px auto 0; max-width:900px; text-align:left; font-size:16px}
.mcav li{margin:3px 0}
.mmeta{font-size:15.5px; color:var(--sub); margin-top:10px}
@media (max-width:860px){
  .map{height:240px} .map.big{height:440px}
}
@media (max-width:860px){
  body{font-size:17px}
  .trunk,.row::before,.node::before{display:none}
  .row{grid-template-columns:repeat(2,1fr); margin-top:18px}
}
.backfab{position:fixed; left:16px; bottom:16px; z-index:1000; display:none; align-items:center; gap:6px; background:var(--accent,#1f2a44); color:#fff; border:0; border-radius:999px; padding:11px 20px; font-size:16.5px; box-shadow:0 3px 12px rgba(0,0,0,.3); cursor:pointer}
.backfab.show{display:inline-flex}
.backfab:hover{filter:brightness(1.15)}
@keyframes flashbg{0%,60%{background:#fff0b8} 100%{background:transparent}}
.item.flash{animation:flashbg 2.4s ease-out}
</style>
</head>
<body>
<div class="wrap">
  <h1>일본사 학습 트리</h1>
  <p class="subtitle">시대를 누르면 공부할 항목이 나옵니다. 항목마다 한국 관련 내용, 답사 장소, 참고문헌, 집필 후보 표시와 메모를 담았습니다.</p>
  <div id="stats"></div>
  <div class="tree" id="tree"></div>

  <div class="tabs" id="tabs"></div>
  <div class="panel" id="panel"></div>

  <div class="foot">이 내용은 초안입니다. 책에 싣기 전에 연도·해석·서지 사항을 원문으로 확인하세요. 집필 후보와 메모는 이 브라우저에만 저장됩니다.</div>
</div>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="japan-history-data.js"></script>
<script src="japan-history-places.js"></script>
<script src="japan-history-chronology.js"></script>
<script src="japan-history-materials.js"></script>
<script>
(function(){
  'use strict';
  var ERAS = window.ERAS || [];
  var REFS = window.REFS || {};
  var KEY = 'japan-history-progress-v1';

  /* ───── 저장 ───── */
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e){ saved = {}; }
  function persist(){ try { localStorage.setItem(KEY, JSON.stringify(saved)); } catch(e){} }
  function get(id){ var s = saved[id] || {}; return {cand:!!s.cand, memo:s.memo||''}; }
  function set(id, patch){ var s = get(id); for (var k in patch) s[k] = patch[k]; saved[id] = s; persist(); }

  /* ───── 상태 ───── */
  var view = {mode:'era', era:'e1', koreaOnly:false, open:{}, mapEra:'all', theme:'', matTheme:'', matEra:'', matKind:'', matStatus:'', matKorea:false, chEra:'e1', chFocus:null, chYear:'', chOpen:{}};

  /* ───── 뒤로가기(이전 화면 기억) ─────
     링크로 다른 화면에 가거나(자료실의 ‘연결된 항목’ 등), 탭·시대 노드를 눌러 화면이 바뀔 때마다
     떠나는 화면(탭·필터·펼침 상태·스크롤 위치)을 저장해 두고, 왼쪽 아래 ‘돌아가기’ 버튼과
     브라우저·휴대폰의 뒤로가기로 되돌아옵니다. */
  var MODE_NAME = {era:'시대별 보기', korea:'한국 관련 모아보기', theme:'주제별 보기', cand:'집필 후보 모아보기', map:'지도 보기', chrono:'연표', mat:'자료실'};
  var navStack = [], backBtn = null;
  function snap(){ return JSON.parse(JSON.stringify(view)); }
  function whereLabel(v){
    if (v.mode === 'era'){ var e = eraById(v.era); return e ? e.name : MODE_NAME.era; }
    return MODE_NAME[v.mode] || '이전 화면';
  }
  function navTo(fn){
    navStack.push({v:snap(), y:window.pageYOffset || 0, label:whereLabel(view)});
    try { history.pushState({nav:navStack.length}, ''); } catch(e){}
    fn();
  }
  function navRestore(k){
    var e = navStack[k]; if (!e) return;
    navStack.length = k;
    view = e.v;
    renderAll();
    setTimeout(function(){ window.scrollTo(0, e.y); }, 30);
  }
  function navBack(){
    if (!navStack.length) return;
    var k = navStack.length - 1;
    var viaHistory = history.state && history.state.nav === navStack.length;
    if (viaHistory){ try { history.back(); return; } catch(e){} }
    navRestore(k);
  }
  function renderBack(){
    if (!backBtn){
      backBtn = el('button', {class:'backfab', type:'button', onclick:navBack});
      document.body.appendChild(backBtn);
    }
    var top = navStack[navStack.length - 1];
    if (!top){ backBtn.classList.remove('show'); return; }
    backBtn.textContent = '← 돌아가기 (' + top.label + ')';
    backBtn.setAttribute('aria-label', top.label + '으로 돌아가기');
    backBtn.classList.add('show');
  }
  window.addEventListener('popstate', function(ev){
    var target = (ev.state && ev.state.nav) || 0;
    if (target < navStack.length) navRestore(target);
  });
  try { history.replaceState({nav:0}, ''); } catch(e){}

  /* ───── 지도 데이터 ───── */
  var MATS = window.MATERIALS || [];
  var PLACES = window.PLACES || {};
  var ITEM_PLACES = window.ITEM_PLACES || {};
  var liveMaps = [], pendingInit = [];

  /* ───── 도우미 ───── */
  function el(tag, props){
    var n = document.createElement(tag);
    if (props) for (var k in props){
      var v = props[k];
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (k.indexOf('on') === 0) n.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) n.setAttribute(k, v === true ? '' : v);
    }
    for (var i = 2; i < arguments.length; i++){
      var c = arguments[i];
      if (c == null || c === false) continue;
      if (Array.isArray(c)) c.forEach(function(x){ if (x) n.appendChild(x.nodeType ? x : document.createTextNode(x)); });
      else n.appendChild(c.nodeType ? c : document.createTextNode(c));
    }
    return n;
  }
  function eraItems(e){
    var out = [];
    e.topics.forEach(function(t){ t.items.forEach(function(it){ out.push(it); }); });
    return out;
  }
  function eraById(id){ for (var i=0;i<ERAS.length;i++) if (ERAS[i].id===id) return ERAS[i]; return null; }
  function passes(it){
    return true;
  }

  /* ───── 상단 통계 ───── */
  function renderStats(){
    var box = document.getElementById('stats');
    box.textContent = '';
    var total = 0, kor = 0, cand = 0;
    ERAS.forEach(function(e){
      eraItems(e).forEach(function(it){
        total++;
        var s = get(it.id);
        if (it.korea) kor++;
        if (s.cand) cand++;
      });
    });
    box.appendChild(el('span', {class:'stat', text:'전체 항목 ' + total + '개'}));
    box.appendChild(el('span', {class:'stat', text:'한국 관련 항목 ' + kor + '개'}));
    box.appendChild(el('span', {class:'stat', text:'집필 후보 ' + cand + '개'}));
    if (MATS.length) box.appendChild(el('span', {class:'stat', text:'자료실 ' + MATS.length + '건'}));
  }

  /* ───── 트리 ───── */
  function renderTree(){
    var tree = document.getElementById('tree');
    tree.textContent = '';
    tree.appendChild(el('div', {class:'trunk'}));
    tree.appendChild(el('div', {class:'root', text:'일본사'}));
    for (var r = 0; r < 2; r++){
      var row = el('div', {class:'row'});
      ERAS.slice(r*6, r*6+6).forEach(function(e, idx){
        var no = ERAS.indexOf(e) + 1;
        var n;
        if (e.ready){
          var total = eraItems(e).length;
          n = el('div', {class:'node' + (view.mode==='era' && view.era===e.id ? ' sel' : ''), role:'button', tabindex:'0',
            onclick:function(){ pick(e.id); },
            onkeydown:function(ev){ if (ev.key==='Enter' || ev.key===' '){ ev.preventDefault(); pick(e.id); } }},
            el('span', {class:'nn', text:String(no)}),
            el('span', {class:'nm', text:e.name}),
            el('span', {class:'pd', text:e.period}),
            el('span', {class:'pg', text:total + '개 항목'}));
        } else {
          n = el('div', {class:'node off', 'aria-disabled':'true'},
            el('span', {class:'nn', text:String(no)}),
            el('span', {class:'nm', text:e.name}),
            el('span', {class:'pd', text:e.period}),
            el('span', {class:'pg', text:'준비 중'}));
        }
        row.appendChild(n);
      });
      tree.appendChild(row);
    }
  }
  function pick(id){
    function go(){

      '재위 연도는 자료에 따라 1~2년 차이가 납니다. 이 표는 천황 재위, 쇼군 정이대장군 재임, 한국 왕 재위(즉위~퇴위·사망)를 기준으로 하며, 겹침 판정은 같은 해를 포함합니다.',
      '천황 제1~14대는 전승(실재 불확실)으로 보는 견해가 일반적이고, 제15~28대는 실재와 연대에 논쟁이 있습니다. 비교적 확실한 시기는 제29대 긴메이 천황(6세기) 이후로 봅니다. 북조 천황(1331~1392)은 대수에 넣지 않고 [북조]로 표시했습니다.',
      '쇼군 목록은 가마쿠라 9명, 무로마치 15명(요시타네는 두 번 재임), 에도 15명입니다. 에도 막부는 이에야스의 1603년 임관부터 계산했고, 은퇴 뒤에도 실권을 쥔 오고쇼 정치(이에야스·히데타다)는 따로 구분하지 않았습니다.',
      '쇼군 줄이 비는 때는 1333~1338년(가마쿠라 멸망~무로마치 막부 성립), 1573~1603년(오다·도요토미 정권, 히데요시는 쇼군이 아니라 간파쿠·태합)입니다.',
      '고구려·백제·신라의 건국 초기 연대는 『삼국사기』 기년이어서 학계에서 그대로 믿지 않는 부분이 많습니다(⚠ 전승 기년). 금관가야 연대도 전승입니다. 대가야, 후백제·태봉, 탐라 등은 수록하지 않았습니다.',
      '고려의 충렬왕·충선왕·충숙왕·충혜왕은 퇴위와 복위가 있어 구간을 나누어 적었습니다. 조선 고종은 1897년 대한제국 황제에 오르고, 순종은 대한제국 황제입니다.',
      '출처: 일본 천황·쇼군 목록(궁내청 계보 등), 『삼국사기』, 『고려사』, 『조선왕조실록』과 영문 위키백과의 목록(보조 자료). 출판 전에 원사료와 대조하세요.'
    ].forEach(function(t){ notes.appendChild(el('li', {text:t})); });
    box.appendChild(notes);
  }


  /* ───── 자료실 ───── */
  function goItem(id){
    for (var i = 0; i < ERAS.length; i++){
      if (eraItems(ERAS[i]).some(function(it){ return it.id === id; })){
        navTo(function(){
          view.mode = 'era'; view.era = ERAS[i].id; view.koreaOnly = false; view.open[id] = true;
          renderAll();
          setTimeout(function(){
            var t = document.querySelector('[data-iid="' + id + '"]');
            if (t){ if (t.scrollIntoView) t.scrollIntoView({block:'center'}); t.classList.add('flash'); }
          }, 30);
        });
        return;
      }
    }
  }
  function itemTitle(id){
    for (var i = 0; i < ERAS.length; i++){
      var l = eraItems(ERAS[i]);
      for (var j = 0; j < l.length; j++) if (l[j].id === id) return l[j].title;
    }
    return id;
  }
  function renderMaterialsView(box){
    var KINDS = window.MATERIAL_KINDS || [], STAT = window.MATERIAL_STATUS || [], THEMES = window.THEMES || [];
    box.appendChild(el('div', {class:'era-head'},
      el('h2', {text:'자료실'}),
      el('p', {text:'올린 자료를 원본 그대로 보관하고, 종류·주제·시대·한국 관련 여부·확인 상태로 분류해 둔 곳입니다. 시대 항목과 서로 연결되며, 시대와 무관한 자료도 주제로 찾을 수 있습니다.'})));

    var g = el('details', {class:'guide'}, el('summary', {text:'자료 분류 기준과 처리 순서'}));
    var tb = el('table');
    tb.appendChild(el('tr', null, el('th', {text:'분류 축'}), el('th', {text:'값'}), el('th', {text:'쓰임'})));
    [
      ['종류', KINDS.join(' / '), '자료의 성격. 한 자료에 하나만 붙입니다.'],
      ['주제', '항목 꼬리표와 같은 ' + THEMES.length + '개 주제(여러 개 가능)', '시대와 무관한 자료를 찾는 주된 기준'],
      ['시대', '12개 시대(없어도 되고, 여러 개도 가능)', '시대 항목과 연결'],
      ['한국 관련', '예 / 아니오', '한국 관련 모아보기와 같은 기준'],
      ['상태', STAT.join(' → '), '확인 정도. 자료가 스스로 밝힌 미확인 사항은 ‘확인 필요’ 목록에 옮깁니다.'],
      ['출처 유형', '직접 조사 / 웹 검색 기반 / 현지 취재 / 문헌', '인용 책임을 가르는 기준'],
      ['연결', '항목 · 장소 · 책 장 후보', '항목에서 자료로, 자료에서 항목·지도로 오갈 수 있게 함']
    ].forEach(function(r){ tb.appendChild(el('tr', null, el('td', {text:r[0]}), el('td', {text:r[1]}), el('td', {text:r[2]}))); });
    g.appendChild(tb);
    var ol = el('ol');
    [
      '원본을 수정하지 않고 materials 폴더에 넣습니다.',
      '위 축으로 분류하고 한 줄 요약을 씁니다.',
      '자료가 밝힌 전승·미확인·인용 금지 사항을 ‘확인 필요’ 목록으로 옮깁니다.',
      '시대에 앉힐 수 있는 사건·제도·인물은 시대 항목으로 따로 만들고, 사례 연구·답사·긴 해설은 자료로만 둡니다.',
      '관련 항목·장소를 연결하고, 기존 항목과 내용이 어긋나면 표시합니다.'
    ].forEach(function(t){ ol.appendChild(el('li', {text:t})); });
    g.appendChild(ol);
    box.appendChild(g);

    function sel(label, key, opts){
      var s = el('select', {'aria-label':label, onchange:function(ev){ view[key] = ev.target.value; renderPanel(); }});
      s.appendChild(el('option', {value:'', text:label + ': 전체'}));
      opts.forEach(function(o){ var op = el('option', {value:o[0], text:o[1]}); if (view[key] === o[0]) op.selected = true; s.appendChild(op); });
      return s;
    }
    var f = el('div', {class:'filters'},
      sel('주제', 'matTheme', THEMES.map(function(t){ return [t, t]; })),
      sel('시대', 'matEra', ERAS.map(function(e){ return [e.id, e.name]; })),
      sel('종류', 'matKind', KINDS.map(function(t){ return [t, t]; })),
      sel('상태', 'matStatus', STAT.map(function(t){ return [t, t]; })));
    var kcb = el('input', {type:'checkbox', onchange:function(ev){ view.matKorea = ev.target.checked; renderPanel(); }});
    kcb.checked = view.matKorea;
    f.appendChild(el('label', null, kcb, ' 한국 관련만'));
    box.appendChild(f);

    var list = MATS.filter(function(m){
      return (!view.matTheme || (m.themes || []).indexOf(view.matTheme) >= 0)
        && (!view.matEra || (m.eras || []).indexOf(view.matEra) >= 0)
        && (!view.matKind || m.kind === view.matKind)
        && (!view.matStatus || m.status === view.matStatus)
        && (!view.matKorea || m.korea);
    });
    box.appendChild(el('div', {class:'cnt', text:list.length + '건 / 전체 ' + MATS.length + '건'}));
    if (!list.length){ box.appendChild(el('div', {class:'empty', text:'조건에 맞는 자료가 없습니다.'})); return; }
    list.forEach(function(m){
      var c = el('div', {class:'mcard'});
      c.appendChild(el('h3', null, el('a', {href:m.file, target:'_blank', rel:'noopener', text:m.title + ' ▸'})));
      if (m.sub) c.appendChild(el('div', {class:'msub', text:m.sub}));
      var badges = el('div', {class:'badges'});
      badges.appendChild(el('span', {class:'badge b-theme', text:m.kind}));
      if (m.korea) badges.appendChild(el('span', {class:'badge b-kor', text:'◆ 한국 관련'}));
      badges.appendChild(el('span', {class:'badge b-chk', text:'상태: ' + m.status}));
      (m.themes || []).forEach(function(t){ badges.appendChild(el('span', {class:'badge b-theme', text:'# ' + t})); });
      (m.eras || []).forEach(function(id){ var e = eraById(id); if (e) badges.appendChild(el('span', {class:'badge b-theme', text:e.name})); });
      c.appendChild(badges);
      c.appendChild(el('p', {text:m.summary}));
      if (m.caveats && m.caveats.length){
        var ul = el('ul', {class:'mcav'});
        m.caveats.forEach(function(t){ ul.appendChild(el('li', {text:t})); });
        c.appendChild(el('div', {class:'nbox'}, el('b', {text:'확인 필요 목록'}), ul));
      }
      if (m.items && m.items.length){
        var chips = el('div', {class:'mchips'}, el('span', {class:'cnt', text:'연결된 항목:'}));
        m.items.forEach(function(id){ chips.appendChild(el('button', {class:'btn', text:itemTitle(id), onclick:function(){ goItem(id); }})); });
        c.appendChild(chips);
      }
      var ps = (m.places || []).map(function(i){ return PLACES[i]; }).filter(Boolean);
      if (ps.length) c.appendChild(placeLinks(ps));
      var meta = [];
      if (m.chapter) meta.push('책 장 후보: ' + m.chapter);
      if (m.source) meta.push('출처 유형: ' + m.source);
      if (m.added) meta.push('등록: ' + m.added);
      c.appendChild(el('div', {class:'mmeta', text:meta.join('  ·  ')}));
      box.appendChild(c);
    });
  }

  function renderPanel(){
    liveMaps.forEach(function(m){ try { m.remove(); } catch(e){} });
    liveMaps = []; pendingInit = [];
    renderPanelInner();
    syncExpandButtons();
    var queue = pendingInit; pendingInit = [];
    setTimeout(function(){ queue.forEach(function(fn){ try { fn(); } catch(e){} }); }, 0);
  }
  function renderPanelInner(){
    var box = document.getElementById('panel');
    box.textContent = '';
    lastShown = [];
    if (view.mode === 'map'){ renderMapView(box); return; }
    if (view.mode === 'chrono'){ renderChronoView(box); return; }
    if (view.mode === 'mat'){ renderMaterialsView(box); return; }

    if (view.mode === 'era'){
      var e = eraById(view.era);
      if (!e || !e.ready){ box.appendChild(el('div', {class:'empty', text:'시대를 선택하세요.'})); return; }
      box.appendChild(el('div', {class:'era-head'},
        el('h2', {text:e.name}),
        el('div', {class:'per', text:e.period}),
        el('p', {text:e.summary})));
      var shownCount = 0, html = [];
      e.topics.forEach(function(t){
        var items = t.items.filter(function(it){ return passes(it) && (!view.koreaOnly || it.korea); });
        if (!items.length) return;
        shownCount += items.length;
        html.push(el('h3', {text:t.name + ' (' + items.length + ')'}));
        items.forEach(function(it){ lastShown.push(it.id); html.push(card(it)); });
      });
      box.appendChild(filters(true, shownCount));
      if (!shownCount) box.appendChild(el('div', {class:'empty', text:'조건에 맞는 항목이 없습니다.'}));
      html.forEach(function(n){ box.appendChild(n); });

      /* 시대 참고문헌 모음 */
      var seen = {}, keys = [];
      eraItems(e).forEach(function(it){ (it.refs||[]).forEach(function(k){ if (!seen[k]){ seen[k]=1; keys.push(k); } }); });
      if (keys.length){
        var ul = el('ul', {class:'refs'});
        keys.forEach(function(k){ ul.appendChild(el('li', {text:REFS[k] || k})); });
        box.appendChild(el('div', {class:'refsec'}, el('h3', {text:'이 시대의 참고문헌 모음'}), ul));
      }
      return;
    }

    /* 한국 관련 / 주제별 / 집필 후보 모아보기 */
    var list = [], total = 0;
    var THEMES = window.THEMES || [];
    if (view.mode === 'theme'){
      if (!view.theme || THEMES.indexOf(view.theme) < 0) view.theme = THEMES[0] || '';
      var counts = {};
      ERAS.forEach(function(e){ eraItems(e).forEach(function(it){ (it.themes || []).forEach(function(t){ counts[t] = (counts[t] || 0) + 1; }); }); });
      var tb = el('div', {class:'thbar'});
      THEMES.forEach(function(t){
        tb.appendChild(el('button', {class:'btn' + (view.theme === t ? ' on' : ''), text:t + ' (' + (counts[t] || 0) + ')', onclick:function(){ view.theme = t; renderPanel(); }}));
      });
      box.appendChild(el('div', {class:'era-head'},
        el('h2', {text:'주제로 읽는 일본'}),
        el('p', {text:'시대를 가로질러 같은 주제의 항목을 시대 순으로 모아 봅니다. 한 항목이 여러 주제에 속할 수 있습니다.'})));
      box.appendChild(tb);
    }
    ERAS.forEach(function(e){
      if (!e.ready) return;
      var items = eraItems(e).filter(function(it){
        if (!passes(it)) return false;
        if (view.mode === 'korea') return !!it.korea;
        if (view.mode === 'theme') return (it.themes || []).indexOf(view.theme) >= 0;
        return get(it.id).cand;
      });
      if (items.length){ list.push([e, items]); total += items.length; }
    });
    box.appendChild(filters(false, total));
    if (!total){
      box.appendChild(el('div', {class:'empty', text: view.mode==='korea' ? '한국 관련 항목이 없습니다.' : view.mode==='theme' ? '이 주제의 항목이 없습니다.' : '아직 집필 후보로 표시한 항목이 없습니다. 항목을 펼쳐 ‘책에서 다룰 후보’를 체크하세요.'}));
      return;
    }
    list.forEach(function(pair){
      box.appendChild(el('h3', {class:'era-title', text:pair[0].name + ' · ' + pair[0].period}));
      pair[1].forEach(function(it){ lastShown.push(it.id); box.appendChild(card(it)); });
    });
  }

  function renderAll(){ renderStats(); renderTree(); renderTabs(); renderPanel(); renderBack(); }

  renderAll();
})();
</script>
</body>
</html>
