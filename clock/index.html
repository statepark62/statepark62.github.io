<style>
  :root{
    --font-display: 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
    --font-mono: 'Courier New', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;

    --case: #201e1c;
    --case-edge: #3a3632;
    --case-edge-2: #14120f;
    --face: #141311;
    --face-shadow: #050503;
    --numeral: #ede8de;
    --numeral-dim: #7c766a;
    --amber: #e8952e;
    --amber-dim: rgba(232,149,46,0.14);
    --label: #8a8377;
    --crease: rgba(0,0,0,0.55);
  }

  * { box-sizing: border-box; }

  .flipclock-root{
    width: 100%;
    min-height: 520px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 20%, #2a2622 0%, #0e0d0b 75%);
    font-family: var(--font-mono);
    padding: 40px 16px;
  }

  .desk{ perspective: 1400px; }

  .clock{
    position: relative;
    background: linear-gradient(160deg, var(--case-edge) 0%, var(--case) 12%, var(--case) 88%, var(--case-edge-2) 100%);
    border-radius: 18px;
    padding: 26px 34px 24px;
    width: fit-content;
    max-width: 92vw;
    box-shadow:
      0 2px 0 rgba(255,255,255,0.04) inset,
      0 -6px 12px rgba(0,0,0,0.4) inset,
      0 30px 60px rgba(0,0,0,0.55),
      0 8px 14px rgba(0,0,0,0.4);
    transform: rotateX(4deg);
    transform-style: preserve-3d;
  }

  .clock::after{
    content:'';
    position:absolute;
    left: 50%; bottom: -26px;
    width: 78%; height: 26px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 72%);
  }

  .brandrow{
    display:flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
    padding: 0 2px;
  }
  .brand{
    font-size: 10px;
    letter-spacing: 0.22em;
    color: var(--label);
    text-transform: uppercase;
  }
  .modebtn{
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--label);
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 4px;
    padding: 4px 8px;
    cursor: pointer;
    text-transform: uppercase;
  }
  .modebtn:hover{ color: var(--numeral); border-color: rgba(255,255,255,0.18); }
  .modebtn:focus-visible{ outline: 2px solid var(--amber); outline-offset: 2px; }
  .modebtn[hidden]{ display:none; }

  /* style switcher */
  .switcher{
    display:flex;
    gap: 4px;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px;
    padding: 3px;
    margin-bottom: 20px;
  }
  .switcher button{
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.02em;
    white-space: nowrap;
    text-transform: uppercase;
    color: var(--label);
    background: transparent;
    border: none;
    border-radius: 5px;
    padding: 7px 2px 6px;
    cursor: pointer;
    transition: background 150ms, color 150ms;
  }
  .switcher button span{
    overflow: hidden;
    text-overflow: clip;
    max-width: 100%;
  }
  .switcher svg{
    width: 15px; height: 15px; flex-shrink: 0;
    stroke: currentColor; fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }
  .switcher button:hover{ color: var(--numeral); }
  .switcher button.active{
    background: var(--amber-dim);
    color: var(--amber);
  }
  .switcher button:focus-visible{ outline: 2px solid var(--amber); outline-offset: 1px; }

  .view{ display:none; }
  .view.active{ display:flex; flex-direction:column; align-items:center; }

  /* ================= FLIP ================= */
  .display{ display:flex; align-items:center; justify-content:center; gap: 8px; flex-shrink: 0; }
  .group{ display:flex; gap: 5px; flex-shrink: 0; }
  .colon{ display:flex; flex-direction:column; justify-content:center; gap: 12px; padding: 0 1px; height: 84px; flex-shrink: 0; }
  .colon i{ width:6px; height:6px; border-radius:50%; background: var(--amber); box-shadow: 0 0 7px 1px rgba(232,149,46,0.55); animation: blink 2s steps(1,end) infinite; }
  @media (prefers-reduced-motion: reduce){ .colon i, .led-colon i{ animation:none; } }
  @keyframes blink{ 0%,49%{opacity:1;} 50%,100%{opacity:0.18;} }

  .flip{
    position: relative;
    width: 54px; height: 84px;
    flex-shrink: 0;
    perspective: 300px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.02);
    border-radius: 6px;
  }
  .flip-inner{
    position: relative;
    width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform 380ms cubic-bezier(.45,.05,.55,.95);
  }
  .flip.flipping .flip-inner{ transform: rotateX(-180deg); }
  .face{
    position: absolute; inset: 0;
    backface-visibility: hidden;
    border-radius: 6px;
    background: var(--face);
    display: flex; align-items: center; justify-content: center;
  }
  .face span{
    color: var(--numeral);
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 52px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .face-front{ transform: rotateX(0deg); z-index: 2; }
  .face-back{ transform: rotateX(180deg); }

  /* ================= ANALOG ================= */
  .analog-face{ width: 220px; height: 220px; }
  .analog-tick{ stroke: var(--numeral-dim); stroke-width: 1.5; }
  .analog-tick.major{ stroke: var(--label); stroke-width: 2.5; }
  .analog-hand{ stroke-linecap: round; transform-origin: 100px 100px; }
  .analog-hub{ fill: var(--amber); }

  /* ================= LED ================= */
  .led-panel{
    background: #060504;
    border-radius: 8px;
    padding: 18px 16px;
    display:flex; align-items:center; justify-content:center; gap: 8px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04), inset 0 8px 20px rgba(0,0,0,0.6);
  }
  .seg-digit{ position:relative; width: 30px; height: 54px; margin: 0 2px; }
  .seg{
    position:absolute;
    background: #2a1608;
    transition: background 120ms, box-shadow 120ms;
  }
  .seg.on{ background: var(--amber); box-shadow: 0 0 6px 1px rgba(232,149,46,0.75); }
  .seg-a, .seg-d, .seg-g{ left:4px; width:22px; height:5px; clip-path: polygon(14% 0,86% 0,100% 50%,86% 100%,14% 100%,0 50%); }
  .seg-a{ top:0; }
  .seg-g{ top:24.5px; }
  .seg-d{ bottom:0; }
  .seg-b, .seg-c, .seg-e, .seg-f{ width:5px; height:22px; clip-path: polygon(0 14%,50% 0,100% 14%,100% 86%,50% 100%,0 86%); }
  .seg-f{ top:3px; left:0; }
  .seg-b{ top:3px; right:0; }
  .seg-e{ bottom:3px; left:0; }
  .seg-c{ bottom:3px; right:0; }
  .led-colon{ display:flex; flex-direction:column; gap:10px; justify-content:center; height:54px; }
  .led-colon i{ width:6px; height:6px; background: var(--amber); box-shadow: 0 0 6px 1px rgba(232,149,46,0.7); animation: blink 2s steps(1,end) infinite; }

  /* ================= MINIMAL ================= */
  .minimal{
    display:flex; flex-direction:column; align-items:center; gap: 6px;
    padding: 18px 0 8px;
  }
  .minimal-time{
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 58px;
    letter-spacing: 0.04em;
    color: var(--numeral);
    line-height: 1;
  }
  .minimal-time span.sec{ font-size: 22px; color: var(--numeral-dim); margin-left: 6px; vertical-align: super; }

  /* ================= shared bottom row ================= */
  .daterow{ display:flex; justify-content:center; align-items:center; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .datebadge{ font-size: 11px; letter-spacing: 0.14em; color: var(--label); background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 4px; padding: 5px 10px; }
  .ampm{ font-size: 11px; letter-spacing: 0.14em; color: var(--amber); background: rgba(232,149,46,0.08); border: 1px solid rgba(232,149,46,0.25); border-radius: 4px; padding: 5px 10px; }


  @media (max-width: 420px){
    .clock{ padding: 22px 18px 20px; }
    .display{ max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .flip{ width: 40px; height: 64px; }
    .face span{ font-size: 38px; }
    .colon{ height:64px; gap:8px; }
    .analog-face{ width: 180px; height: 180px; }
    .minimal-time{ font-size: 44px; }
  }
</style>

<div class="flipclock-root">
  <div class="desk">
    <div class="clock">
      <div class="brandrow">
        <span class="brand">탁상시계</span>
        <button class="modebtn" id="modeBtn" type="button" aria-label="12/24시간 전환">24H</button>
      </div>

      <div class="switcher" role="tablist" aria-label="시계 스타일 선택">
        <button type="button" class="active" data-view="flip">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="4" y="4" width="16" height="16" rx="2"/>

          </svg>
          <span>플립</span>
        </button>
        <button type="button" data-view="analog">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="8.5"/>

        </button>
        <button type="button" data-view="led">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="6" width="18" height="12" rx="2"/>

          <svg viewBox="0 0 24 24" aria-hidden="true">

            <circle cx="18" cy="9" r="1" fill="currentColor" stroke="none"/>
            <circle cx="18" cy="15" r="1" fill="currentColor" stroke="none"/>
          </svg>
          <span>미니멀</span>
        </button>

      <!-- FLIP -->
      <div class="view active" id="view-flip">
        <div class="display" id="display"></div>

      <!-- ANALOG -->
      <div class="view" id="view-analog">
        <svg class="analog-face" viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="96" fill="var(--face)" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
          <g id="ticks"></g>
          <line id="hourHand" class="analog-hand" x1="100" y1="100" x2="100" y2="58" stroke="var(--numeral)" stroke-width="5"/>
          <line id="minHand" class="analog-hand" x1="100" y1="100" x2="100" y2="34" stroke="var(--numeral)" stroke-width="3.5"/>
          <line id="secHand" class="analog-hand" x1="100" y1="112" x2="100" y2="26" stroke="var(--amber)" stroke-width="1.5"/>
          <circle class="analog-hub" cx="100" cy="100" r="4.5"/>
        </svg>
      </div>

      <!-- LED -->
      <div class="view" id="view-led">
        <div class="led-panel" id="ledPanel"></div>
      </div>

      <!-- MINIMAL -->
      <div class="view" id="view-minimal">
        <div class="minimal">
          <div class="minimal-time" id="minimalTime">00:00<span class="sec">00</span></div>
        </div>
      </div>

      <div class="daterow">
        <span class="datebadge" id="dateBadge">-</span>
        <span class="ampm" id="ampmBadge" style="display:none;">AM</span>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const display = document.getElementById('display');
  const dateBadge = document.getElementById('dateBadge');
  const ampmBadge = document.getElementById('ampmBadge');
  const modeBtn = document.getElementById('modeBtn');
  const switcher = document.querySelector('.switcher');
  const views = { flip: document.getElementById('view-flip'), analog: document.getElementById('view-analog'), led: document.getElementById('view-led'), minimal: document.getElementById('view-minimal') };

  let is24 = true;
  let currentView = 'flip';

  /* ---------- FLIP setup ---------- */
  const flipDigits = {};
  function makeFlip(id){
    const wrap = document.createElement('div');
    wrap.className = 'flip';
    wrap.innerHTML = `
      <div class="flip-inner">
        <div class="face face-front"><span>0</span></div>
        <div class="face face-back"><span>0</span></div>
      </div>`;
    flipDigits[id] = { el: wrap, value: null, animating: false };
    return wrap;
  }
  function flipGroup(prefix){
    const g = document.createElement('div');
    g.className = 'group';
    g.appendChild(makeFlip(prefix + '0'));
    g.appendChild(makeFlip(prefix + '1'));
    return g;
  }
  function colonDots(cls){
    const c = document.createElement('div');
    c.className = cls || 'colon';
    c.innerHTML = '<i></i><i></i>';
    return c;
  }
  display.appendChild(flipGroup('h'));
  display.appendChild(colonDots());
  display.appendChild(flipGroup('m'));
  display.appendChild(colonDots());
  display.appendChild(flipGroup('s'));

  function updateFlipDigits(pairs){
    const toAnimate = [];

    pairs.forEach(([id, val]) => {
      const d = flipDigits[id];
      if (d.value === val) return;
      const wasFirst = d.value === null;
      d.value = val;
      const el = d.el;
      const inner = el.querySelector('.flip-inner');
      const frontSpan = el.querySelector('.face-front span');
      const backSpan = el.querySelector('.face-back span');

      if (wasFirst){
        frontSpan.textContent = val;
        backSpan.textContent = val;
        return;
      }

      // If a previous flip on this digit hasn't finished, snap it first.
      if (d.animating){
        inner.style.transition = 'none';
        inner.style.transform = '';
        frontSpan.textContent = backSpan.textContent;
        el.classList.remove('flipping');
        void inner.offsetWidth;
        inner.style.transition = '';
        d.animating = false;
      }

      backSpan.textContent = val; // new value pre-loaded on the back face
      toAnimate.push({ id, d, el, inner, frontSpan, val });
    });

    if (toAnimate.length === 0) return;

    // Force one shared reflow for every changed digit BEFORE any class is
    // added, so all flips are committed on the same frame and stay in sync
    // (this is what prevents things like the tens digit visually finishing
    // its flip before the ones digit, which briefly reads as the wrong pair).
    toAnimate.forEach(item => { void item.el.offsetWidth; });

    toAnimate.forEach(item => {
      item.d.animating = true;
      item.el.classList.add('flipping');

      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        item.inner.removeEventListener('transitionend', onEnd);
        item.frontSpan.textContent = item.val;
        item.el.classList.remove('flipping');
        item.inner.style.transition = 'none';
        item.inner.style.transform = '';
        void item.inner.offsetWidth;
        item.inner.style.transition = '';
        item.d.animating = false;
      };
      const onEnd = (e) => {
        if (e.target !== item.inner) return;
        finish();
      };
      item.inner.addEventListener('transitionend', onEnd);
      // Safety net: if transitionend never fires (e.g. tab hidden mid-flip),
      // force-finish so this digit can never get stuck again.
      window.setTimeout(finish, 700);
    });
  }

  /* ---------- ANALOG setup ---------- */
  const ticksG = document.getElementById('ticks');
  for (let i = 0; i < 60; i++){
    const angle = (i / 60) * 360;
    const major = i % 5 === 0;
    const r1 = major ? 82 : 88;
    const r2 = 94;
    const rad = (angle - 90) * Math.PI / 180;
    const x1 = 100 + r1 * Math.cos(rad), y1 = 100 + r1 * Math.sin(rad);
    const x2 = 100 + r2 * Math.cos(rad), y2 = 100 + r2 * Math.sin(rad);
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('class', 'analog-tick' + (major ? ' major' : ''));
    ticksG.appendChild(line);
  }
  const hourHand = document.getElementById('hourHand');
  const minHand = document.getElementById('minHand');
  const secHand = document.getElementById('secHand');

  /* ---------- LED setup ---------- */
  const SEG_MAP = {
    '0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc',
    '5':'afgcd','6':'afgecd','7':'abc','8':'abcdefg','9':'abcdfg'
  };
  const ledPanel = document.getElementById('ledPanel');
  const ledDigits = {};
  function makeSegDigit(id){
    const d = document.createElement('div');
    d.className = 'seg-digit';
    'abcdefg'.split('').forEach(seg => {
      const s = document.createElement('div');
      s.className = 'seg seg-' + seg;
      d.appendChild(s);
      ledDigits[id + seg] = s;
    });
    return d;
  }
  function ledGroup(prefix){
    const g = document.createElement('div');
    g.style.display = 'flex';
    g.appendChild(makeSegDigit(prefix + '0'));
    g.appendChild(makeSegDigit(prefix + '1'));
    return g;
  }
  ledPanel.appendChild(ledGroup('h'));
  ledPanel.appendChild(colonDots('led-colon'));
  ledPanel.appendChild(ledGroup('m'));
  ledPanel.appendChild(colonDots('led-colon'));
  ledPanel.appendChild(ledGroup('s'));

  function setLedDigit(id, val){
    const lit = SEG_MAP[val] || '';
    'abcdefg'.split('').forEach(seg => {
      const el = ledDigits[id + seg];
      if (!el) return;
      el.classList.toggle('on', lit.indexOf(seg) !== -1);
    });
  }

  /* ---------- MINIMAL setup ---------- */
  const minimalTime = document.getElementById('minimalTime');

  function pad(n){ return n.toString().padStart(2, '0'); }

  function tick(){
    const now = new Date();
    let h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();
    const ampm = h >= 12 ? 'PM' : 'AM';
    let h24forAnalog = h;

    if (!is24){
      ampmBadge.style.display = 'inline-block';
      ampmBadge.textContent = ampm;
      h = h % 12; if (h === 0) h = 12;
    } else {
      ampmBadge.style.display = 'none';
    }

    const hh = pad(h), mm = pad(m), ss = pad(s);

    if (currentView === 'flip'){
      updateFlipDigits([
        ['h0', hh[0]], ['h1', hh[1]],
        ['m0', mm[0]], ['m1', mm[1]],
        ['s0', ss[0]], ['s1', ss[1]]
      ]);
    } else if (currentView === 'led'){
      setLedDigit('h0', hh[0]); setLedDigit('h1', hh[1]);
      setLedDigit('m0', mm[0]); setLedDigit('m1', mm[1]);
      setLedDigit('s0', ss[0]); setLedDigit('s1', ss[1]);
    } else if (currentView === 'minimal'){
      minimalTime.innerHTML = `${hh}:${mm}<span class="sec">${ss}</span>`;
    } else if (currentView === 'analog'){
      const secDeg = s * 6;
      const minDeg = m * 6 + s * 0.1;
      const hourDeg = (h24forAnalog % 12) * 30 + m * 0.5;
      secHand.style.transform = `rotate(${secDeg}deg)`;
      minHand.style.transform = `rotate(${minDeg}deg)`;
      hourHand.style.transform = `rotate(${hourDeg}deg)`;
    }

    const days = ['일','월','화','수','목','금','토'];
    dateBadge.textContent = `${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())} (${days[now.getDay()]})`;
  }

  modeBtn.addEventListener('click', () => {
    is24 = !is24;
    modeBtn.textContent = is24 ? '24H' : '12H';
    for (const k in flipDigits) flipDigits[k].value = null;
    tick();
  });

  switcher.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-view]');
    if (!btn) return;
    currentView = btn.dataset.view;
    switcher.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
    Object.keys(views).forEach(k => views[k].classList.toggle('active', k === currentView));
    modeBtn.hidden = (currentView === 'analog');
    if (currentView === 'flip') for (const k in flipDigits) flipDigits[k].value = null;
    tick();
  });

  tick();
  setInterval(tick, 1000);
})();
</script>
