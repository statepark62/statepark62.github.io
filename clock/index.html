<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --case: #201e1c;
    --case-edge: #3a3632;
    --case-edge-2: #14120f;
    --face: #141311;
    --face-shadow: #050503;
    --numeral: #ede8de;
    --numeral-dim: #7c766a;
    --amber: #e8952e;
    --amber-dim: rgba(232,149,46,0.14);
    --label: #8a8377;
    --crease: rgba(0,0,0,0.55);
  }

  * { box-sizing: border-box; }

  .flipclock-root{
    width: 100%;
    min-height: 520px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 20%, #2a2622 0%, #0e0d0b 75%);
    font-family: 'Space Mono', monospace;
    padding: 40px 16px;
  }

  .desk{ perspective: 1400px; }

  .clock{
    position: relative;
    background: linear-gradient(160deg, var(--case-edge) 0%, var(--case) 12%, var(--case) 88%, var(--case-edge-2) 100%);
    border-radius: 18px;
    padding: 26px 34px 24px;
    width: 360px;
    box-shadow:
      0 2px 0 rgba(255,255,255,0.04) inset,
      0 -6px 12px rgba(0,0,0,0.4) inset,
      0 30px 60px rgba(0,0,0,0.55),
      0 8px 14px rgba(0,0,0,0.4);
    transform: rotateX(4deg);
    transform-style: preserve-3d;
  }

  .clock::after{
    content:'';
    position:absolute;
    left: 50%; bottom: -26px;
    width: 78%; height: 26px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 72%);
  }

  .brandrow{
    display:flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
    padding: 0 2px;
  }
  .brand{
    font-size: 10px;
    letter-spacing: 0.22em;
    color: var(--label);
    text-transform: uppercase;
  }
  .modebtn{
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--label);
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 4px;
    padding: 4px 8px;
    cursor: pointer;
    text-transform: uppercase;
  }
  .modebtn:hover{ color: var(--numeral); border-color: rgba(255,255,255,0.18); }
  .modebtn:focus-visible{ outline: 2px solid var(--amber); outline-offset: 2px; }
  .modebtn[hidden]{ display:none; }

  /* style switcher */
  .switcher{
    display:flex;
    gap: 4px;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px;
    padding: 3px;
    margin-bottom: 20px;
  }
  .switcher button{
    flex: 1;
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--label);
    background: transparent;
    border: none;
    border-radius: 5px;
    padding: 7px 4px;
    cursor: pointer;
    transition: background 150ms, color 150ms;
  }
  .switcher button:hover{ color: var(--numeral); }
  .switcher button.active{
    background: var(--amber-dim);
    color: var(--amber);
  }
  .switcher button:focus-visible{ outline: 2px solid var(--amber); outline-offset: 1px; }

  .view{ display:none; }
  .view.active{ display:flex; flex-direction:column; align-items:center; }

  /* ================= FLIP ================= */
  .display{ display:flex; align-items:center; justify-content:center; gap: 8px; }
  .group{ display:flex; gap: 5px; }
  .colon{ display:flex; flex-direction:column; justify-content:center; gap: 12px; padding: 0 1px; height: 84px; }
  .colon i{ width:6px; height:6px; border-radius:50%; background: var(--amber); box-shadow: 0 0 7px 1px rgba(232,149,46,0.55); animation: blink 2s steps(1,end) infinite; }
  @media (prefers-reduced-motion: reduce){ .colon i, .led-colon i{ animation:none; } }
  @keyframes blink{ 0%,49%{opacity:1;} 50%,100%{opacity:0.18;} }

  .flip{
    position: relative;
    width: 54px; height: 84px;
    border-radius: 6px;
    background: var(--face-shadow);
    perspective: 260px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.02);
  }
  .flip .half{
    position:absolute; left:0; right:0; overflow:hidden;
    background: var(--face); display:flex; justify-content:center;
    color: var(--numeral); font-family:'Oswald', sans-serif; font-weight:600;
    font-size: 52px; line-height: 84px;
  }
  .flip .top, .flip .leaf-front{ top:0; height:42px; border-radius:6px 6px 0 0; align-items:flex-start; }
  .flip .bottom, .flip .leaf-back{ bottom:0; height:42px; border-radius:0 0 6px 6px; align-items:flex-end; }
  .flip .top span, .flip .leaf-front span{ transform: translateY(0); }
  .flip .bottom span, .flip .leaf-back span{ transform: translateY(-42px); }
  .flip .top{ z-index:1; }
  .flip .bottom{ z-index:1; box-shadow: 0 1px 0 rgba(255,255,255,0.03) inset; }
  .flip .top::after{ content:''; position:absolute; left:0; right:0; bottom:0; height:2px; background: var(--crease); }
  .flip .leaf-front, .flip .leaf-back{ z-index:3; backface-visibility:hidden; transform-origin:50% 100%; }
  .flip .leaf-back{ z-index:2; transform-origin:50% 0%; transform: rotateX(90deg); }
  .flip .leaf-front{ transform: rotateX(0deg); }
  .flip.flipping .leaf-front{ transition: transform 300ms cubic-bezier(.37,0,.63,1); transform: rotateX(-90deg); }
  .flip.flipping .leaf-back{ transition: transform 300ms cubic-bezier(.37,0,.63,1) 300ms; transform: rotateX(0deg); }

  /* ================= ANALOG ================= */
  .analog-face{ width: 220px; height: 220px; }
  .analog-tick{ stroke: var(--numeral-dim); stroke-width: 1.5; }
  .analog-tick.major{ stroke: var(--label); stroke-width: 2.5; }
  .analog-hand{ stroke-linecap: round; transform-origin: 100px 100px; }
  .analog-hub{ fill: var(--amber); }

  /* ================= LED ================= */
  .led-panel{
    background: #060504;
    border-radius: 8px;
    padding: 18px 16px;
    display:flex; align-items:center; justify-content:center; gap: 8px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04), inset 0 8px 20px rgba(0,0,0,0.6);
  }
  .seg-digit{ position:relative; width: 30px; height: 54px; margin: 0 2px; }
  .seg{
    position:absolute;
    background: #2a1608;
    transition: background 120ms, box-shadow 120ms;
  }
  .seg.on{ background: var(--amber); box-shadow: 0 0 6px 1px rgba(232,149,46,0.75); }
  .seg-a, .seg-d, .seg-g{ left:4px; width:22px; height:5px; clip-path: polygon(14% 0,86% 0,100% 50%,86% 100%,14% 100%,0 50%); }
  .seg-a{ top:0; }
  .seg-g{ top:24.5px; }
  .seg-d{ bottom:0; }
  .seg-b, .seg-c, .seg-e, .seg-f{ width:5px; height:22px; clip-path: polygon(0 14%,50% 0,100% 14%,100% 86%,50% 100%,0 86%); }
  .seg-f{ top:3px; left:0; }
  .seg-b{ top:3px; right:0; }
  .seg-e{ bottom:3px; left:0; }
  .seg-c{ bottom:3px; right:0; }
  .led-colon{ display:flex; flex-direction:column; gap:10px; justify-content:center; height:54px; }
  .led-colon i{ width:6px; height:6px; background: var(--amber); box-shadow: 0 0 6px 1px rgba(232,149,46,0.7); animation: blink 2s steps(1,end) infinite; }

  /* ================= MINIMAL ================= */
  .minimal{
    display:flex; flex-direction:column; align-items:center; gap: 6px;
    padding: 18px 0 8px;
  }
  .minimal-time{
    font-family: 'Oswald', sans-serif;
    font-weight: 500;
    font-size: 58px;
    letter-spacing: 0.04em;
    color: var(--numeral);
    line-height: 1;
  }
  .minimal-time span.sec{ font-size: 22px; color: var(--numeral-dim); margin-left: 6px; vertical-align: super; }

  /* ================= shared bottom row ================= */
  .daterow{ display:flex; justify-content:center; align-items:center; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  .datebadge{ font-size: 11px; letter-spacing: 0.14em; color: var(--label); background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 4px; padding: 5px 10px; }
  .ampm{ font-size: 11px; letter-spacing: 0.14em; color: var(--amber); background: rgba(232,149,46,0.08); border: 1px solid rgba(232,149,46,0.25); border-radius: 4px; padding: 5px 10px; }

  .weatherrow{ display:flex; justify-content:center; margin-top: 10px; }
  .weatherbadge{
    font-size: 11px; letter-spacing: 0.06em; color: var(--label);
    background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 4px; padding: 6px 12px;
    display:flex; align-items:center; gap: 8px;
    max-width: 100%;
  }
  .weatherbadge .wloc{ color: var(--numeral-dim); }
  .weatherbadge .wtemp{ color: var(--numeral); font-weight: 600; }
  .weatherbadge .whum{ color: var(--amber); }
  .weatherbadge .wbtn{
    background: transparent; border: 1px solid rgba(255,255,255,0.12); color: var(--label);
    border-radius: 3px; padding: 2px 7px; font-family:'Space Mono',monospace; font-size: 10px; cursor: pointer;
  }
  .weatherbadge .wbtn:hover{ color: var(--numeral); border-color: rgba(255,255,255,0.24); }

  @media (max-width: 420px){
    .clock{ width: 92vw; padding: 22px 18px 20px; }
    .flip{ width: 40px; height: 64px; }
    .flip .half{ font-size: 38px; line-height: 64px; }
    .flip .top, .flip .leaf-front{ height:32px; }
    .flip .bottom, .flip .leaf-back{ height:32px; }
    .flip .bottom span, .flip .leaf-back span{ transform: translateY(-32px); }
    .colon{ height:64px; gap:8px; }
    .analog-face{ width: 180px; height: 180px; }
    .minimal-time{ font-size: 44px; }
  }
</style>

<div class="flipclock-root">
  <div class="desk">
    <div class="clock">
      <div class="brandrow">
        <span class="brand">Desk Clock · Study</span>
        <button class="modebtn" id="modeBtn" type="button" aria-label="12/24시간 전환">24H</button>
      </div>

      <div class="switcher" role="tablist" aria-label="시계 스타일 선택">
        <button type="button" class="active" data-view="flip">플립</button>
        <button type="button" data-view="analog">아날로그</button>
        <button type="button" data-view="led">LED</button>
        <button type="button" data-view="minimal">미니멀</button>
      </div>

      <!-- FLIP -->
      <div class="view active" id="view-flip">
        <div class="display" id="display"></div>
      </div>

      <!-- ANALOG -->
      <div class="view" id="view-analog">
        <svg class="analog-face" viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="96" fill="var(--face)" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
          <g id="ticks"></g>
          <line id="hourHand" class="analog-hand" x1="100" y1="100" x2="100" y2="58" stroke="var(--numeral)" stroke-width="5"/>
          <line id="minHand" class="analog-hand" x1="100" y1="100" x2="100" y2="34" stroke="var(--numeral)" stroke-width="3.5"/>
          <line id="secHand" class="analog-hand" x1="100" y1="112" x2="100" y2="26" stroke="var(--amber)" stroke-width="1.5"/>
          <circle class="analog-hub" cx="100" cy="100" r="4.5"/>
        </svg>
      </div>

      <!-- LED -->
      <div class="view" id="view-led">
        <div class="led-panel" id="ledPanel"></div>
      </div>

      <!-- MINIMAL -->
      <div class="view" id="view-minimal">
        <div class="minimal">
          <div class="minimal-time" id="minimalTime">00:00<span class="sec">00</span></div>
        </div>
      </div>

      <div class="daterow">
        <span class="datebadge" id="dateBadge">-</span>
        <span class="ampm" id="ampmBadge" style="display:none;">AM</span>
      </div>

      <div class="weatherrow">
        <div class="weatherbadge" id="weatherBadge">
          <span id="weatherText">위치 정보로 현재 날씨 표시</span>
          <button type="button" class="wbtn" id="weatherBtn">위치 허용</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  const display = document.getElementById('display');
  const dateBadge = document.getElementById('dateBadge');
  const ampmBadge = document.getElementById('ampmBadge');
  const modeBtn = document.getElementById('modeBtn');
  const switcher = document.querySelector('.switcher');
  const views = { flip: document.getElementById('view-flip'), analog: document.getElementById('view-analog'), led: document.getElementById('view-led'), minimal: document.getElementById('view-minimal') };

  let is24 = true;
  let currentView = 'flip';

  /* ---------- FLIP setup ---------- */
  const flipDigits = {};
  function makeFlip(id){
    const wrap = document.createElement('div');
    wrap.className = 'flip';
    wrap.innerHTML = `
      <div class="half top"><span>0</span></div>
      <div class="half bottom"><span>0</span></div>
      <div class="half leaf-front"><span>0</span></div>
      <div class="half leaf-back"><span>0</span></div>`;
    flipDigits[id] = { el: wrap, value: null };
    return wrap;
  }
  function flipGroup(prefix){
    const g = document.createElement('div');
    g.className = 'group';
    g.appendChild(makeFlip(prefix + '0'));
    g.appendChild(makeFlip(prefix + '1'));
    return g;
  }
  function colonDots(cls){
    const c = document.createElement('div');
    c.className = cls || 'colon';
    c.innerHTML = '<i></i><i></i>';
    return c;
  }
  display.appendChild(flipGroup('h'));
  display.appendChild(colonDots());
  display.appendChild(flipGroup('m'));
  display.appendChild(colonDots());
  display.appendChild(flipGroup('s'));

  function setFlipDigit(id, val){
    const d = flipDigits[id];
    if (d.value === val) return;
    const wasFirst = d.value === null;
    d.value = val;
    const el = d.el;
    const topSpan = el.querySelector('.top span');
    const bottomSpan = el.querySelector('.bottom span');
    const frontSpan = el.querySelector('.leaf-front span');
    const backSpan = el.querySelector('.leaf-back span');
    if (wasFirst){
      topSpan.textContent = val; bottomSpan.textContent = val;
      frontSpan.textContent = val; backSpan.textContent = val;
      return;
    }
    const prevTop = topSpan.textContent;
    frontSpan.textContent = prevTop;
    backSpan.textContent = val;
    topSpan.textContent = val;
    el.classList.remove('flipping');
    void el.offsetWidth;
    el.classList.add('flipping');
    window.setTimeout(() => { bottomSpan.textContent = val; }, 300);
    window.setTimeout(() => { el.classList.remove('flipping'); }, 620);
  }

  /* ---------- ANALOG setup ---------- */
  const ticksG = document.getElementById('ticks');
  for (let i = 0; i < 60; i++){
    const angle = (i / 60) * 360;
    const major = i % 5 === 0;
    const r1 = major ? 82 : 88;
    const r2 = 94;
    const rad = (angle - 90) * Math.PI / 180;
    const x1 = 100 + r1 * Math.cos(rad), y1 = 100 + r1 * Math.sin(rad);
    const x2 = 100 + r2 * Math.cos(rad), y2 = 100 + r2 * Math.sin(rad);
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1', x1); line.setAttribute('y1', y1);
    line.setAttribute('x2', x2); line.setAttribute('y2', y2);
    line.setAttribute('class', 'analog-tick' + (major ? ' major' : ''));
    ticksG.appendChild(line);
  }
  const hourHand = document.getElementById('hourHand');
  const minHand = document.getElementById('minHand');
  const secHand = document.getElementById('secHand');

  /* ---------- LED setup ---------- */
  const SEG_MAP = {
    '0':'abcdef','1':'bc','2':'abged','3':'abgcd','4':'fgbc',
    '5':'afgcd','6':'afgecd','7':'abc','8':'abcdefg','9':'abcdfg'
  };
  const ledPanel = document.getElementById('ledPanel');
  const ledDigits = {};
  function makeSegDigit(id){
    const d = document.createElement('div');
    d.className = 'seg-digit';
    'abcdefg'.split('').forEach(seg => {
      const s = document.createElement('div');
      s.className = 'seg seg-' + seg;
      d.appendChild(s);
      ledDigits[id + seg] = s;
    });
    return d;
  }
  function ledGroup(prefix){
    const g = document.createElement('div');
    g.style.display = 'flex';
    g.appendChild(makeSegDigit(prefix + '0'));
    g.appendChild(makeSegDigit(prefix + '1'));
    return g;
  }
  ledPanel.appendChild(ledGroup('h'));
  ledPanel.appendChild(colonDots('led-colon'));
  ledPanel.appendChild(ledGroup('m'));
  ledPanel.appendChild(colonDots('led-colon'));
  ledPanel.appendChild(ledGroup('s'));

  function setLedDigit(id, val){
    const lit = SEG_MAP[val] || '';
    'abcdefg'.split('').forEach(seg => {
      const el = ledDigits[id + seg];
      if (!el) return;
      el.classList.toggle('on', lit.indexOf(seg) !== -1);
    });
  }

  /* ---------- MINIMAL setup ---------- */
  const minimalTime = document.getElementById('minimalTime');

  function pad(n){ return n.toString().padStart(2, '0'); }

  function tick(){
    const now = new Date();
    let h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();
    const ampm = h >= 12 ? 'PM' : 'AM';
    let h24forAnalog = h;

    if (!is24){
      ampmBadge.style.display = 'inline-block';
      ampmBadge.textContent = ampm;
      h = h % 12; if (h === 0) h = 12;
    } else {
      ampmBadge.style.display = 'none';
    }

    const hh = pad(h), mm = pad(m), ss = pad(s);

    if (currentView === 'flip'){
      setFlipDigit('h0', hh[0]); setFlipDigit('h1', hh[1]);
      setFlipDigit('m0', mm[0]); setFlipDigit('m1', mm[1]);
      setFlipDigit('s0', ss[0]); setFlipDigit('s1', ss[1]);
    } else if (currentView === 'led'){
      setLedDigit('h0', hh[0]); setLedDigit('h1', hh[1]);
      setLedDigit('m0', mm[0]); setLedDigit('m1', mm[1]);
      setLedDigit('s0', ss[0]); setLedDigit('s1', ss[1]);
    } else if (currentView === 'minimal'){
      minimalTime.innerHTML = `${hh}:${mm}<span class="sec">${ss}</span>`;
    } else if (currentView === 'analog'){
      const secDeg = s * 6;
      const minDeg = m * 6 + s * 0.1;
      const hourDeg = (h24forAnalog % 12) * 30 + m * 0.5;
      secHand.style.transform = `rotate(${secDeg}deg)`;
      minHand.style.transform = `rotate(${minDeg}deg)`;
      hourHand.style.transform = `rotate(${hourDeg}deg)`;
    }

    const days = ['일','월','화','수','목','금','토'];
    dateBadge.textContent = `${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())} (${days[now.getDay()]})`;
  }

  modeBtn.addEventListener('click', () => {
    is24 = !is24;
    modeBtn.textContent = is24 ? '24H' : '12H';
    for (const k in flipDigits) flipDigits[k].value = null;
    tick();
  });

  switcher.addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-view]');
    if (!btn) return;
    currentView = btn.dataset.view;
    switcher.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
    Object.keys(views).forEach(k => views[k].classList.toggle('active', k === currentView));
    modeBtn.hidden = (currentView === 'analog');
    if (currentView === 'flip') for (const k in flipDigits) flipDigits[k].value = null;
    tick();
  });

  /* ---------- WEATHER (geolocation) ---------- */
  const weatherText = document.getElementById('weatherText');
  const weatherBtn = document.getElementById('weatherBtn');

  async function loadWeather(lat, lon){
    weatherText.textContent = '날씨 불러오는 중…';
    try {
      const [wRes, gRes] = await Promise.all([
        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m&timezone=auto`),
        fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=ko`).catch(() => null)
      ]);

      if (!wRes.ok) throw new Error('weather fetch failed');
      const wData = await wRes.json();
      const temp = Math.round(wData.current.temperature_2m);
      const hum = Math.round(wData.current.relative_humidity_2m);

      let place = '';
      if (gRes && gRes.ok){
        const gData = await gRes.json();
        place = gData.city || gData.locality || gData.principalSubdivision || '';
      }

      weatherText.innerHTML =
        (place ? `<span class="wloc">${place}</span> · ` : '') +
        `<span class="wtemp">${temp}°C</span> · <span class="whum">습도 ${hum}%</span>`;
      weatherBtn.hidden = true;
    } catch (err){
      weatherText.textContent = '날씨 정보를 불러올 수 없습니다';
      weatherBtn.hidden = false;
      weatherBtn.textContent = '다시 시도';
    }
  }

  let weatherWatchStarted = false;
  function requestWeather(){
    if (!('geolocation' in navigator)){
      weatherText.textContent = '이 브라우저는 위치 조회를 지원하지 않습니다';
      weatherBtn.hidden = true;
      return;
    }
    weatherText.textContent = '위치 확인 중…';
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        loadWeather(pos.coords.latitude, pos.coords.longitude);
        if (!weatherWatchStarted){
          weatherWatchStarted = true;
          setInterval(() => loadWeather(pos.coords.latitude, pos.coords.longitude), 10 * 60 * 1000);
        }
      },
      (err) => {
        weatherText.textContent = '위치 권한이 거부되었습니다';
        weatherBtn.hidden = false;
        weatherBtn.textContent = '위치 허용';
      },
      { timeout: 10000, maximumAge: 5 * 60 * 1000 }
    );
  }

  weatherBtn.addEventListener('click', requestWeather);

  tick();
  setInterval(tick, 1000);
})();
</script>
