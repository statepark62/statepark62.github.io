<style>
  /* 기본값(앰버). 실제 값은 스크립트가 선택된 테마로 덮어씁니다. */
  :root{
    color-scheme: dark;
    --font-display: 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
    --font-mono: 'Courier New', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;

    --page:#0e0d0b; --bg1:#2a2622; --bg2:#0e0d0b;
    --case:#201e1c; --case-edge:#3a3632; --case-edge2:#14120f;
    --face:#141311; --face-hi:#1a1916; --face-lo:#100f0d;
    --numeral:#ede8de; --numeral-dim:#b7af9f; --label:#d6cfc0;
    --accent:#e8952e; --accent-dim:rgba(232,149,46,.14); --accent-bd:rgba(232,149,46,.38);
    --accent-glow:rgba(232,149,46,.55); --on-accent:#1c1408;
    --crease:rgba(0,0,0,.6); --crease-hi:rgba(255,255,255,.05);
    --btn-bg:rgba(255,255,255,.035); --btn-bd:rgba(255,255,255,.09); --btn-bd-hover:rgba(255,255,255,.2);
    --panel-bg:rgba(0,0,0,.3); --track:rgba(255,255,255,.12); --input-bg:rgba(255,255,255,.05);
    --overlay:rgba(8,7,6,.88); --dial1:#1d1c19; --dial2:#0d0c0a; --shadow:rgba(0,0,0,.55);
  }

  * { box-sizing: border-box; }

  html, body{ margin: 0; padding: 0; background: var(--page); }

  .sr-only{
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  .flipclock-root{
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 18%, var(--bg1) 0%, var(--bg2) 76%);
    font-family: var(--font-mono);
    color: var(--numeral);
    padding: clamp(16px, 3vmin, 48px);
    overflow: auto;
  }

  .desk{ perspective: 1400px; }

  .clock{
    --flip-w: clamp(40px, min(30vmin, 13vw, 18vh), 420px);
    --analog: clamp(220px, min(56vh, 78vw), 780px);
    position: relative;
    background: linear-gradient(160deg, var(--case-edge) 0%, var(--case) 12%, var(--case) 88%, var(--case-edge2) 100%);
    border-radius: clamp(14px, 2.4vmin, 30px);
    padding: clamp(18px, 3.4vmin, 52px) clamp(20px, 4.4vmin, 68px) clamp(16px, 3vmin, 48px);
    width: fit-content;
    max-width: 96vw;
    box-shadow:
      0 0 0 1px var(--btn-bd),
      0 2px 0 var(--crease-hi) inset,
      0 -6px 12px rgba(0,0,0,0.22) inset,
      0 30px 60px var(--shadow),
      0 8px 14px var(--shadow);
    transform: rotateX(4deg);
    transform-style: preserve-3d;
  }

  .clock::after{
    content:'';
    position:absolute;
    left: 50%; bottom: -26px;
    width: 78%; height: 26px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, var(--shadow) 0%, rgba(0,0,0,0) 72%);
  }

  .brandrow{
    display:flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    justify-content: space-between;
    align-items: center;
    margin-bottom: clamp(10px, 1.8vmin, 22px);
    padding: 0 2px;
  }
  .brand{
    display: inline-flex; align-items: center; gap: .7em;
    font-size: clamp(13px, 2.1vmin, 24px);
    letter-spacing: 0.18em;
    color: var(--label);
  }
  .brand::before{
    content:''; width: .5em; height: .5em; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 .9em .1em var(--accent-glow);
  }
  .modebtn{
    font-family: var(--font-mono);
    font-size: clamp(12px, 1.8vmin, 20px);
    letter-spacing: 0.1em;
    color: var(--label);
    background: var(--btn-bg);
    border: 1px solid var(--btn-bd);
    border-radius: 6px;
    padding: clamp(4px,0.7vmin,8px) clamp(8px,1.2vmin,14px);
    cursor: pointer;
    text-transform: uppercase;
    transition: color .2s, border-color .2s, background-color .2s;
  }
  .modebtn:hover{ color: var(--numeral); border-color: var(--btn-bd-hover); }
  .modebtn:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
  .modebtn[hidden]{ display:none; }

  .headerbtns{ display:flex; flex-wrap: wrap; justify-content: flex-end; align-items:center; gap: clamp(6px, 1vmin, 12px); }

  .iconbtn{
    display:flex; align-items:center; justify-content:center;
    width: clamp(28px, 3.6vmin, 42px); height: clamp(28px, 3.6vmin, 42px);
    background: var(--btn-bg);
    border: 1px solid var(--btn-bd);
    border-radius: 6px;
    color: var(--label);
    cursor: pointer;
    padding: 0;
    transition: color .2s, border-color .2s, background-color .2s;
  }
  .iconbtn[hidden]{ display:none; }
  .iconbtn svg{
    width: clamp(14px, 1.9vmin, 20px); height: clamp(14px, 1.9vmin, 20px);
    stroke: currentColor; fill: none;
    stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round;
  }
  .iconbtn:hover{ color: var(--numeral); border-color: var(--btn-bd-hover); }
  .iconbtn:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
  .iconbtn.active{ color: var(--accent); border-color: var(--accent-bd); background: var(--accent-dim); }

  #soundBtn .icon-off{ display:none; }
  #soundBtn.muted .icon-on{ display:none; }
  #soundBtn.muted .icon-off{ display:block; }

  .volume-slider{
    -webkit-appearance: none;
    appearance: none;
    width: clamp(48px, 7vmin, 100px);
    height: clamp(3px, 0.5vmin, 5px);
    border-radius: 3px;
    background: var(--track);
    outline: none;
    cursor: pointer;
    margin: 0 clamp(2px, 0.5vmin, 6px);
  }
  .volume-slider::-webkit-slider-thumb{
    -webkit-appearance: none;
    appearance: none;
    width: clamp(12px, 1.7vmin, 18px);
    height: clamp(12px, 1.7vmin, 18px);
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--case-edge2);
    cursor: pointer;
  }
  .volume-slider::-moz-range-thumb{
    width: clamp(12px, 1.7vmin, 18px);
    height: clamp(12px, 1.7vmin, 18px);
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--case-edge2);
    cursor: pointer;
  }
  .volume-slider::-moz-range-track{
    height: clamp(3px, 0.5vmin, 5px);
    border-radius: 3px;
    background: var(--track);
  }
  .volume-slider:focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; }

  /* ---- 패널(알람 / 테마) ---- */
  .alarm-panel[hidden], .theme-panel[hidden]{ display: none; }
  .alarm-panel{
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: clamp(8px, 1.2vmin, 14px);
    background: var(--panel-bg);
    border: 1px solid var(--btn-bd);
    border-radius: 10px;
    padding: clamp(8px, 1.3vmin, 16px);
    margin-bottom: clamp(10px, 1.8vmin, 20px);
  }
  .alarm-time-input{
    font-family: var(--font-mono);
    font-size: clamp(13px, 1.9vmin, 20px);
    color: var(--numeral);
    background: var(--input-bg);
    border: 1px solid var(--btn-bd);
    border-radius: 6px;
    padding: clamp(4px,0.7vmin,8px) clamp(6px,1vmin,10px);
  }
  .alarm-set-btn, .alarm-off-btn{
    font-family: var(--font-mono);
    font-size: clamp(11px, 1.6vmin, 16px);
    letter-spacing: 0.04em;
    color: var(--on-accent);
    background: var(--accent);
    border: none;
    border-radius: 6px;
    padding: clamp(6px,1vmin,10px) clamp(10px,1.6vmin,16px);
    cursor: pointer;
  }
  .alarm-off-btn{
    color: var(--label);
    background: var(--btn-bg);
    border: 1px solid var(--btn-bd);
  }
  .alarm-off-btn[hidden]{ display:none; }
  .alarm-set-btn:hover{ filter: brightness(1.08); }
  .alarm-off-btn:hover{ color: var(--numeral); border-color: var(--btn-bd-hover); }
  .alarm-set-btn:focus-visible, .alarm-off-btn:focus-visible, .alarm-time-input:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
  .alarm-status{
    font-size: clamp(11px, 1.5vmin, 15px);
    color: var(--label);
    letter-spacing: 0.03em;
  }

  .theme-panel{
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: clamp(6px, 1.2vmin, 14px);
    background: var(--panel-bg);
    border: 1px solid var(--btn-bd);
    border-radius: 10px;
    padding: clamp(8px, 1.3vmin, 16px);
    margin-bottom: clamp(10px, 1.8vmin, 20px);
  }
  .swatch{
    background: none; border: 0; padding: 6px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: clamp(6px,1vmin,10px);
    color: var(--label); font-family: var(--font-mono);
    font-size: clamp(11px, 1.5vmin, 15px); letter-spacing: .06em;
    border-radius: 10px;
  }
  .swatch:hover{ color: var(--numeral); }
  .swatch:focus-visible{ outline: 2px solid var(--accent); outline-offset: 2px; }
  .swatch[aria-pressed="true"]{ color: var(--accent); }
  .sw-prev{
    display: flex; align-items: center; justify-content: center; gap: 5px;
    width: clamp(66px, 9vmin, 96px); height: clamp(40px, 5.6vmin, 58px);
    border-radius: 9px; background: var(--p-case); border: 1px solid var(--p-edge);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 3px 8px rgba(0,0,0,.3);
  }
  .sw-prev i{
    position: relative; display: flex; align-items: center; justify-content: center;
    width: 25%; height: 62%; border-radius: 3px; background: var(--p-face); color: var(--p-num);
    font: 700 clamp(10px,1.7vmin,17px)/1 var(--font-display); font-style: normal;
  }
  .sw-prev i::after{ content:''; position:absolute; left:0; right:0; top:50%; height:1px; background: rgba(0,0,0,.45); }
  .sw-prev b{ width: 6px; height: 6px; border-radius: 50%; background: var(--p-acc); box-shadow: 0 0 6px var(--p-acc); }
  .swatch[aria-pressed="true"] .sw-prev{ outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 알람 울림 창: .clock 밖(body 직속)이라 화면 전체를 덮음 */
  .alarm-ringing[hidden]{ display: none; }
  .alarm-ringing{
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--overlay);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    font-family: var(--font-mono);
    color: var(--numeral);
  }
  .ringing-box{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(10px, 2vmin, 22px);
    padding: clamp(28px, 5vmin, 60px) clamp(24px, 6vmin, 70px);
    background: linear-gradient(160deg, var(--case-edge) 0%, var(--case) 14%, var(--case) 86%, var(--case-edge2) 100%);
    border-radius: clamp(16px, 2.4vmin, 30px);
    box-shadow: 0 0 0 1px var(--btn-bd), 0 30px 70px var(--shadow);
    text-align: center;
  }
  .ringing-bell{
    width: clamp(48px, 8vmin, 96px); height: clamp(48px, 8vmin, 96px);
    stroke: var(--accent); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
    animation: ring-shake 0.6s ease-in-out infinite;
  }
  @keyframes ring-shake{
    0%, 100% { transform: rotate(0deg); }
    20% { transform: rotate(-14deg); }
    40% { transform: rotate(11deg); }
    60% { transform: rotate(-8deg); }
    80% { transform: rotate(5deg); }
  }
  @media (prefers-reduced-motion: reduce){ .ringing-bell{ animation: none; } }
  .ringing-time{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(36px, 7vmin, 90px);
    color: var(--numeral);
  }
  .ringing-actions{ display:flex; gap: clamp(8px,1.6vmin,16px); flex-wrap: wrap; justify-content:center; }
  .ringing-actions button{
    font-family: var(--font-mono);
    font-size: clamp(12px, 1.7vmin, 17px);
    letter-spacing: 0.04em;
    border-radius: 8px;
    padding: clamp(10px,1.6vmin,16px) clamp(16px,2.4vmin,24px);
    cursor: pointer;
    border: 1px solid var(--btn-bd);
    background: var(--btn-bg);
    color: var(--numeral);
  }
  .ringing-actions button:focus-visible{ outline: 3px solid var(--numeral); outline-offset: 3px; }
  #stopAlarmBtn{
    background: var(--accent);
    border-color: var(--accent);
    color: var(--on-accent);
    font-weight: 700;
  }
  #stopAlarmBtn:hover{ filter: brightness(1.08); }
  #snoozeBtn:hover{ border-color: var(--btn-bd-hover); }

  /* ================= FLIP ================= */
  .display{ display:flex; align-items:center; justify-content:center; gap: calc(var(--flip-w) * 0.15); flex-shrink: 0; }
  .display[hidden]{ display:none; }
  .group{ display:flex; gap: calc(var(--flip-w) * 0.09); flex-shrink: 0; }
  .colon{ display:flex; flex-direction:column; justify-content:center; gap: calc(var(--flip-w) * 0.22); padding: 0 1px; height: calc(var(--flip-w) * 84 / 54); flex-shrink: 0; }
  .colon i{ width: calc(var(--flip-w) * 0.11); height: calc(var(--flip-w) * 0.11); border-radius:50%; background: var(--accent); box-shadow: 0 0 9px 1px var(--accent-glow); animation: blink 2s steps(1,end) infinite; }
  @media (prefers-reduced-motion: reduce){ .colon i{ animation:none; } }
  @keyframes blink{ 0%,49%{opacity:1;} 50%,100%{opacity:0.2;} }

  .flip{
    position: relative;
    width: var(--flip-w);
    aspect-ratio: 54 / 84;
    flex-shrink: 0;
    perspective: 300px;
    box-shadow: 0 3px 7px var(--shadow), 0 0 0 1px var(--btn-bd);
    border-radius: calc(var(--flip-w) * 0.11);
  }
  .flip-inner{
    position: relative;
    width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform 380ms cubic-bezier(.45,.05,.55,.95);
  }
  .flip.flipping .flip-inner{ transform: rotateX(-180deg); }
  .face{
    position: absolute; inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: calc(var(--flip-w) * 0.11);
    /* 위쪽 절반은 밝게, 아래쪽 절반은 어둡게 → 실제 플립 카드의 입체감 */
    background: linear-gradient(to bottom, var(--face-hi) 0%, var(--face-hi) 50%, var(--face-lo) 50%, var(--face-lo) 100%);
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  /* 가운데 접힘선 */
  .face::after{
    content: '';
    position: absolute; left: 0; right: 0; top: 50%;
    height: max(2px, calc(var(--flip-w) * 0.02));
    transform: translateY(-50%);
    background: var(--crease);
    box-shadow: 0 1px 0 var(--crease-hi);
    pointer-events: none;
  }
  .face span{
    color: var(--numeral);
    font-family: var(--font-display);
    font-weight: 700;
    font-size: calc(var(--flip-w) * 0.96);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .face-front{ transform: rotateX(0deg); z-index: 2; }
  .face-back{ transform: rotateX(180deg); }

  /* ================= ANALOG ================= */
  .analogwrap{ display:flex; align-items:center; justify-content:center; }
  .analogwrap[hidden]{ display:none; }
  .analog{
    display:block;
    width: var(--analog);
    height: var(--analog);
    filter: drop-shadow(0 10px 14px var(--shadow));
  }
  .analog .hand{ filter: drop-shadow(0 3px 3px var(--shadow)); }
  .analog .s-edge{ stop-color: var(--case-edge); }
  .analog .s-case{ stop-color: var(--case); }
  .analog .s-edge2{ stop-color: var(--case-edge2); }
  .analog .s-d1{ stop-color: var(--dial1); }
  .analog .s-d2{ stop-color: var(--dial2); }
  .analog .a-face{ stroke: var(--crease); }
  .analog .a-ring{ fill: none; stroke: var(--btn-bd); }
  .analog .t-big{ stroke: var(--numeral); }
  .analog .t-small{ stroke: var(--numeral-dim); }
  .analog .t-12{ stroke: var(--accent); }
  .analog .a-num{ fill: var(--numeral); }
  .analog .a-brand{ fill: var(--numeral-dim); }
  .analog .h-main{ stroke: var(--numeral); }
  .analog .h-sec{ stroke: var(--accent); }
  .analog .fill-acc{ fill: var(--accent); }
  .analog .fill-on{ fill: var(--on-accent); }

  /* ================= shared bottom row ================= */
  .daterow{ display:flex; justify-content:center; align-items:center; gap: clamp(8px,1.4vmin,18px); margin-top: clamp(12px, 2.2vmin, 28px); flex-wrap: wrap; }
  .datebadge{ font-size: clamp(12px, 1.9vmin, 22px); letter-spacing: 0.12em; color: var(--label); background: var(--btn-bg); border: 1px solid var(--btn-bd); border-radius: 6px; padding: clamp(4px,0.8vmin,9px) clamp(8px,1.4vmin,16px); }
  .ampm{ font-size: clamp(12px, 1.9vmin, 22px); letter-spacing: 0.12em; color: var(--accent); background: var(--accent-dim); border: 1px solid var(--accent-bd); border-radius: 6px; padding: clamp(4px,0.8vmin,9px) clamp(8px,1.4vmin,16px); }
  .ampm[hidden]{ display:none; }
  .hintbadge{
    font-family: var(--font-mono);
    font-size: clamp(11px, 1.6vmin, 18px);
    color: var(--on-accent); background: var(--accent);
    border: 0; border-radius: 6px; cursor: pointer;
    padding: clamp(4px,0.8vmin,9px) clamp(8px,1.4vmin,16px);
  }
  .hintbadge[hidden]{ display:none; }
  .hintbadge:focus-visible{ outline: 2px solid var(--numeral); outline-offset: 2px; }

  /* 테마 이름 알림 */
  .toast{
    position: fixed; left: 50%; bottom: clamp(16px, 4vmin, 40px); z-index: 60;
    transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
    background: var(--case); color: var(--numeral); border: 1px solid var(--btn-bd-hover);
    border-radius: 999px; padding: .55em 1.3em;
    font: 600 clamp(13px, 1.9vmin, 20px)/1.2 var(--font-mono); letter-spacing: .08em;
    box-shadow: 0 10px 30px var(--shadow);
    transition: opacity .25s, transform .25s;
  }
  .toast.show{ opacity: 1; transform: translate(-50%, 0); }

  .row-break{ display: none; }

  @media (max-width: 420px){
    .display{ max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  }

  /* Portrait / tall screens: wrap HH:MM and :SS onto two rows */
  @media (max-aspect-ratio: 1/1){
    .clock{
      --flip-w: clamp(40px, min(30vw, 12vh, 34vmin), 440px);
      --analog: clamp(220px, min(52vh, 82vw), 780px);
    }
    .display{
      flex-wrap: wrap;
      width: calc(var(--flip-w) * 4.85);
      row-gap: calc(var(--flip-w) * 0.32);
    }
    .row-break{ display: block; flex-basis: 100%; height: 0; }
  }
</style>
</head>

<script>
(function(){
  'use strict';
  const $ = (id) => document.getElementById(id);
  const display = $('display');
  const dateBadge = $('dateBadge');
  const ampmBadge = $('ampmBadge');
  const modeBtn = $('modeBtn');
  const viewBtn = $('viewBtn');
  const BASE_TITLE = '탁상시계';
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function pad(n){ return n.toString().padStart(2, '0'); }

  /* ================= 테마 정의 (색은 모두 여기서 관리) ================= */
  const DARK = {
    page:'#0e0d0b', bg1:'#2a2622', bg2:'#0e0d0b',
    case:'#201e1c', caseEdge:'#3a3632', caseEdge2:'#14120f',
    face:'#141311', faceHi:'#1a1916', faceLo:'#100f0d',
    numeral:'#ede8de', numeralDim:'#b7af9f', label:'#d6cfc0',
    accent:'#e8952e', accentDim:'rgba(232,149,46,.14)', accentBd:'rgba(232,149,46,.38)',
    accentGlow:'rgba(232,149,46,.55)', onAccent:'#1c1408',
    crease:'rgba(0,0,0,.6)', creaseHi:'rgba(255,255,255,.05)',
    btnBg:'rgba(255,255,255,.035)', btnBd:'rgba(255,255,255,.09)', btnBdHover:'rgba(255,255,255,.2)',
    panelBg:'rgba(0,0,0,.3)', track:'rgba(255,255,255,.12)', inputBg:'rgba(255,255,255,.05)',
    overlay:'rgba(8,7,6,.88)', dial1:'#1d1c19', dial2:'#0d0c0a', shadow:'rgba(0,0,0,.55)'
  };
  const THEMES = [
    { id:'amber', name:'앰버', scheme:'dark', v: DARK },
    { id:'midnight', name:'미드나잇', scheme:'dark', v: Object.assign({}, DARK, {
      page:'#060a13', bg1:'#17233f', bg2:'#060a13',
      case:'#101a2e', caseEdge:'#243759', caseEdge2:'#0a1222',
      face:'#0a1322', faceHi:'#101c32', faceLo:'#07101d',
      numeral:'#e9f2ff', numeralDim:'#8da5c9', label:'#b7c9e6',
      accent:'#4cc9f0', accentDim:'rgba(76,201,240,.14)', accentBd:'rgba(76,201,240,.4)',
      accentGlow:'rgba(76,201,240,.5)', onAccent:'#021018',
      creaseHi:'rgba(150,190,255,.06)',
      btnBg:'rgba(140,180,255,.05)', btnBd:'rgba(150,190,255,.14)', btnBdHover:'rgba(150,190,255,.34)',
      panelBg:'rgba(2,6,16,.4)', track:'rgba(150,190,255,.16)', inputBg:'rgba(150,190,255,.07)',
      overlay:'rgba(3,7,16,.9)', dial1:'#111d34', dial2:'#070e1b'
    })},
    { id:'graphite', name:'그래파이트', scheme:'dark', v: Object.assign({}, DARK, {
      page:'#0a0a0b', bg1:'#262628', bg2:'#0a0a0b',
      case:'#1d1d1f', caseEdge:'#3b3b3f', caseEdge2:'#0f0f11',
      face:'#111113', faceHi:'#18181b', faceLo:'#0d0d0f',
      numeral:'#f5f5f7', numeralDim:'#a1a1a8', label:'#d2d2d7',
      accent:'#ff5a4f', accentDim:'rgba(255,90,79,.14)', accentBd:'rgba(255,90,79,.4)',
      accentGlow:'rgba(255,90,79,.5)', onAccent:'#1c0604',
      overlay:'rgba(6,6,7,.9)', dial1:'#19191b', dial2:'#0c0c0e'
    })},
    { id:'forest', name:'포레스트', scheme:'dark', v: Object.assign({}, DARK, {
      page:'#06100b', bg1:'#163026', bg2:'#06100b',
      case:'#11201a', caseEdge:'#2a4638', caseEdge2:'#09130e',
      face:'#0c1712', faceHi:'#13231b', faceLo:'#08110d',
      numeral:'#ebf4ee', numeralDim:'#91ab9a', label:'#bcd3c4',
      accent:'#d8b45a', accentDim:'rgba(216,180,90,.14)', accentBd:'rgba(216,180,90,.4)',
      accentGlow:'rgba(216,180,90,.45)', onAccent:'#181203',
      creaseHi:'rgba(180,230,200,.05)',
      btnBg:'rgba(180,230,200,.04)', btnBd:'rgba(180,230,200,.12)', btnBdHover:'rgba(180,230,200,.3)',
      panelBg:'rgba(2,10,6,.4)', track:'rgba(180,230,200,.14)', inputBg:'rgba(180,230,200,.06)',
      overlay:'rgba(3,9,6,.9)', dial1:'#12211a', dial2:'#08110d'
    })},
    { id:'rose', name:'로즈', scheme:'dark', v: Object.assign({}, DARK, {
      page:'#120a0e', bg1:'#321c26', bg2:'#120a0e',
      case:'#25151b', caseEdge:'#4b2c38', caseEdge2:'#170b10',
      face:'#1a0f14', faceHi:'#231319', faceLo:'#140a0f',
      numeral:'#fbeff1', numeralDim:'#c49ca6', label:'#e7c8ce',
      accent:'#f2a7a2', accentDim:'rgba(242,167,162,.14)', accentBd:'rgba(242,167,162,.4)',
      accentGlow:'rgba(242,167,162,.45)', onAccent:'#2a0d12',
      creaseHi:'rgba(255,200,210,.05)',
      btnBg:'rgba(255,200,210,.045)', btnBd:'rgba(255,200,210,.12)', btnBdHover:'rgba(255,200,210,.3)',
      panelBg:'rgba(18,4,10,.4)', track:'rgba(255,200,210,.14)', inputBg:'rgba(255,200,210,.06)',
      overlay:'rgba(14,6,9,.9)', dial1:'#211219', dial2:'#10080c'
    })},
    { id:'ivory', name:'아이보리', scheme:'light', v: {
      page:'#d6cfc1', bg1:'#f6f2ea', bg2:'#d2cabb',
      case:'#efe9dc', caseEdge:'#fcfaf5', caseEdge2:'#cfc6b3',
      face:'#fffdf8', faceHi:'#ffffff', faceLo:'#f0ebe0',
      numeral:'#26231f', numeralDim:'#6b6458', label:'#4a443a',
      accent:'#b04128', accentDim:'rgba(176,65,40,.12)', accentBd:'rgba(176,65,40,.4)',
      accentGlow:'rgba(176,65,40,.35)', onAccent:'#ffffff',
      crease:'rgba(0,0,0,.2)', creaseHi:'rgba(255,255,255,.85)',
      btnBg:'rgba(0,0,0,.035)', btnBd:'rgba(0,0,0,.12)', btnBdHover:'rgba(0,0,0,.3)',
      panelBg:'rgba(0,0,0,.05)', track:'rgba(0,0,0,.14)', inputBg:'rgba(255,255,255,.75)',
      overlay:'rgba(238,233,222,.9)', dial1:'#fffdf8', dial2:'#ebe5d8', shadow:'rgba(60,45,20,.3)'
    }},
    { id:'cloud', name:'클라우드', scheme:'light', v: {
      page:'#cdd5e0', bg1:'#f4f7fb', bg2:'#cbd4e1',
      case:'#e8edf4', caseEdge:'#f9fbfe', caseEdge2:'#c5cfdd',
      face:'#ffffff', faceHi:'#ffffff', faceLo:'#eef2f8',
      numeral:'#1b2433', numeralDim:'#5c6a80', label:'#3d4a5f',
      accent:'#2559d1', accentDim:'rgba(37,89,209,.1)', accentBd:'rgba(37,89,209,.4)',
      accentGlow:'rgba(37,89,209,.35)', onAccent:'#ffffff',
      crease:'rgba(20,35,60,.2)', creaseHi:'rgba(255,255,255,.9)',
      btnBg:'rgba(20,40,80,.04)', btnBd:'rgba(20,40,80,.13)', btnBdHover:'rgba(20,40,80,.32)',
      panelBg:'rgba(20,40,80,.05)', track:'rgba(20,40,80,.14)', inputBg:'rgba(255,255,255,.8)',
      overlay:'rgba(232,237,245,.9)', dial1:'#ffffff', dial2:'#e9eef6', shadow:'rgba(30,45,80,.28)'
    }}
  ];

  /* ---------- 설정 저장/복원 ---------- */
  const KEY = 'tabletopClock.v1';
  const st = { is24:true, sound:false, volume:55, alarmOn:false, alarmH:null, alarmM:null, view:'flip', wake:false, theme:'amber' };
  function load(){
    try{
      const s = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (s && typeof s === 'object'){ for (const k in st){ if (k in s) st[k] = s[k]; } }
    }catch(e){}
    st.is24 = st.is24 !== false;
    st.sound = !!st.sound;
    st.wake = !!st.wake;
    const v = Number(st.volume);
    st.volume = isFinite(v) ? Math.max(0, Math.min(100, v)) : 55;
    st.view = (st.view === 'analog') ? 'analog' : 'flip';
    if (!THEMES.some(t => t.id === st.theme)) st.theme = 'amber';
    const h = Number(st.alarmH), m = Number(st.alarmM);
    if (st.alarmOn && Number.isInteger(h) && h >= 0 && h < 24 && Number.isInteger(m) && m >= 0 && m < 60){
      st.alarmH = h; st.alarmM = m;
    } else {
      st.alarmOn = false; st.alarmH = null; st.alarmM = null;
    }
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
  load();

  /* ---------- 테마 적용 / 선택 UI ---------- */
  const themePanel = $('themePanel');
  const themeBtn = $('themeBtn');
  const toast = $('toast');
  let toastTimer = null;
  function showToast(text){
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
  }
  function applyTheme(id, announce){
    const t = THEMES.find(x => x.id === id) || THEMES[0];
    const root = document.documentElement;
    for (const k in t.v){
      root.style.setProperty('--' + k.replace(/[A-Z]/g, m => '-' + m.toLowerCase()), t.v[k]);
    }
    root.style.colorScheme = t.scheme;
    root.setAttribute('data-theme', t.id);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', t.v.page);
    st.theme = t.id;
    themePanel.querySelectorAll('.swatch').forEach(b => {
      b.setAttribute('aria-pressed', String(b.dataset.theme === t.id));
    });
    if (announce) showToast('테마: ' + t.name);
  }
  THEMES.forEach(t => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'swatch';
    b.dataset.theme = t.id;
    b.setAttribute('aria-pressed', 'false');
    b.setAttribute('aria-label', t.name + ' 테마');
    b.innerHTML =
      `<span class="sw-prev" style="--p-case:${t.v.case};--p-edge:${t.v.caseEdge};--p-face:${t.v.face};--p-num:${t.v.numeral};--p-acc:${t.v.accent}">`
      + '<i>1</i><b></b><i>2</i></span>'
      + `<span>${t.name}</span>`;
    b.addEventListener('click', () => { applyTheme(t.id, false); save(); });
    themePanel.appendChild(b);
  });
  themeBtn.addEventListener('click', () => {
    const willShow = themePanel.hidden;
    themePanel.hidden = !willShow;
    themeBtn.setAttribute('aria-expanded', String(willShow));
    themeBtn.classList.toggle('active', willShow);
  });
  function cycleTheme(step){
    const i = THEMES.findIndex(t => t.id === st.theme);
    const next = THEMES[(i + step + THEMES.length) % THEMES.length];
    applyTheme(next.id, true);
    save();
  }
  applyTheme(st.theme, false);

  let is24 = st.is24;
  let soundOn = st.sound;
  let volume = st.volume / 100;
  let view = st.view;

  /* ---------- FLIP setup ---------- */
  const flipDigits = {};
  function makeFlip(id){
    const wrap = document.createElement('div');
    wrap.className = 'flip';
    wrap.innerHTML = `
      <div class="flip-inner">
        <div class="face face-front"><span>0</span></div>
        <div class="face face-back"><span>0</span></div>
      </div>`;
    flipDigits[id] = { el: wrap, value: null, animating: false };
    return wrap;
  }
  function flipGroup(prefix){
    const g = document.createElement('div');
    g.className = 'group';
    g.appendChild(makeFlip(prefix + '0'));
    g.appendChild(makeFlip(prefix + '1'));
    return g;
  }
  function colonDots(cls){
    const c = document.createElement('div');
    c.className = cls || 'colon';
    c.innerHTML = '<i></i><i></i>';
    return c;
  }
  function rowBreak(){
    const b = document.createElement('div');
    b.className = 'row-break';
    b.setAttribute('aria-hidden', 'true');
    return b;
  }
  display.appendChild(flipGroup('h'));
  display.appendChild(colonDots());
  display.appendChild(flipGroup('m'));
  display.appendChild(rowBreak());
  display.appendChild(colonDots());
  display.appendChild(flipGroup('s'));

  function resetFlips(){ for (const k in flipDigits) flipDigits[k].value = null; }

  function updateFlipDigits(pairs){
    const toAnimate = [];

    pairs.forEach(([id, val]) => {
      const d = flipDigits[id];
      if (d.value === val) return;
      const wasFirst = d.value === null;
      d.value = val;
      const el = d.el;
      const inner = el.querySelector('.flip-inner');
      const frontSpan = el.querySelector('.face-front span');
      const backSpan = el.querySelector('.face-back span');

      if (wasFirst){
        frontSpan.textContent = val;
        backSpan.textContent = val;
        return;
      }

      if (d.animating){
        inner.style.transition = 'none';
        inner.style.transform = '';
        frontSpan.textContent = backSpan.textContent;
        el.classList.remove('flipping');
        void inner.offsetWidth;
        inner.style.transition = '';
        d.animating = false;
      }

      backSpan.textContent = val;
      toAnimate.push({ id, d, el, inner, frontSpan, val });
    });

    if (toAnimate.length === 0) return;

    toAnimate.forEach(item => { void item.el.offsetWidth; });

    toAnimate.forEach(item => {
      item.d.animating = true;
      item.el.classList.add('flipping');

      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        item.inner.removeEventListener('transitionend', onEnd);
        item.frontSpan.textContent = item.val;
        item.el.classList.remove('flipping');
        item.inner.style.transition = 'none';
        item.inner.style.transform = '';
        void item.inner.offsetWidth;
        item.inner.style.transition = '';
        item.d.animating = false;
      };
      const onEnd = (e) => {
        if (e.target !== item.inner) return;
        finish();
      };
      item.inner.addEventListener('transitionend', onEnd);
      window.setTimeout(finish, 700);
    });
  }

  /* ---------- ANALOG (색은 CSS 변수 → 테마 따라 자동 변경) ---------- */
  const analogSvg = $('analog');
  let hHand, mHand, sHand;
  (function buildAnalog(){
    let s = '';
    s += '<defs>'
      + '<linearGradient id="aBezel" x1="0" y1="0" x2="0" y2="1">'
      + '<stop class="s-edge" offset="0"/><stop class="s-case" offset="0.12"/>'
      + '<stop class="s-case" offset="0.88"/><stop class="s-edge2" offset="1"/></linearGradient>'
      + '<radialGradient id="aFace" cx="50%" cy="42%" r="62%">'
      + '<stop class="s-d1" offset="0"/><stop class="s-d2" offset="1"/></radialGradient>'
      + '</defs>';
    s += '<circle cx="200" cy="200" r="197" fill="url(#aBezel)"/>';
    s += '<circle class="a-ring" cx="200" cy="200" r="196" stroke-width="1.5"/>';
    s += '<circle class="a-face" cx="200" cy="200" r="183" fill="url(#aFace)" stroke-width="3"/>';
    for (let i = 0; i < 60; i++){
      const big = i % 5 === 0;
      const y2 = big ? 50 : 38;
      const cls = i === 0 ? 't-12' : (big ? 't-big' : 't-small');
      s += `<line class="${cls}" x1="200" y1="26" x2="200" y2="${y2}" stroke-width="${big ? 5 : 2}" stroke-linecap="round" transform="rotate(${i * 6} 200 200)"/>`;
    }
    for (let n = 1; n <= 12; n++){
      const a = n * Math.PI / 6;
      const x = 200 + 118 * Math.sin(a);
      const y = 200 - 118 * Math.cos(a);
      s += `<text class="a-num" x="${x.toFixed(2)}" y="${y.toFixed(2)}" text-anchor="middle" dominant-baseline="central" `
         + `font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="40">${n}</text>`;
    }
    s += '<text class="a-brand" x="200" y="272" text-anchor="middle" font-family="\'Courier New\',monospace" font-size="15" letter-spacing="4">탁상시계</text>';
    s += '<g class="hand" id="aHour"><line class="h-main" x1="200" y1="216" x2="200" y2="128" stroke-width="13" stroke-linecap="round"/></g>';
    s += '<g class="hand" id="aMin"><line class="h-main" x1="200" y1="222" x2="200" y2="70" stroke-width="9" stroke-linecap="round"/></g>';
    s += '<g class="hand" id="aSec"><line class="h-sec" x1="200" y1="242" x2="200" y2="38" stroke-width="3.5" stroke-linecap="round"/><circle class="fill-acc" cx="200" cy="236" r="7"/></g>';
    s += '<circle class="fill-acc" cx="200" cy="200" r="12"/><circle class="fill-on" cx="200" cy="200" r="4.5"/>';
    analogSvg.innerHTML = s;
    hHand = $('aHour'); mHand = $('aMin'); sHand = $('aSec');
  })();

  function updateAnalog(){
    const n = new Date();
    let sec = n.getSeconds() + n.getMilliseconds() / 1000;
    if (reduceMotion) sec = Math.floor(sec);
    const min = n.getMinutes() + sec / 60;
    const hr = (n.getHours() % 12) + min / 60;
    hHand.setAttribute('transform', `rotate(${(hr * 30).toFixed(3)} 200 200)`);
    mHand.setAttribute('transform', `rotate(${(min * 6).toFixed(3)} 200 200)`);
    sHand.setAttribute('transform', `rotate(${(sec * 6).toFixed(3)} 200 200)`);
  }
  let raf = 0;
  function frame(){ updateAnalog(); raf = requestAnimationFrame(frame); }
  function startRaf(){ if (!raf) raf = requestAnimationFrame(frame); }
  function stopRaf(){ if (raf){ cancelAnimationFrame(raf); raf = 0; } }

  function applyView(){
    const analog = view === 'analog';
    $('display').hidden = analog;
    $('analogWrap').hidden = !analog;
    modeBtn.hidden = analog;
    viewBtn.textContent = analog ? '아날로그' : '플립';
    viewBtn.setAttribute('aria-label', analog
      ? '현재 아날로그 시계. 누르면 플립 시계로 전환'
      : '현재 플립 시계. 누르면 아날로그 시계로 전환');
    if (analog){ updateAnalog(); startRaf(); }
    else { stopRaf(); resetFlips(); }
  }
  viewBtn.addEventListener('click', () => {
    view = (view === 'flip') ? 'analog' : 'flip';
    st.view = view; save();
    applyView();
    tick(false);
  });

  /* ---------- SOUND (tick + alarm) ---------- */
  let audioCtx = null;
  function ensureAudio(){
    if (!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended'){ audioCtx.resume().catch(() => {}); }
    return audioCtx;
  }
  function audioReady(){ return !!audioCtx && audioCtx.state === 'running'; }

  ['pointerdown', 'keydown', 'touchstart'].forEach(ev => {
    window.addEventListener(ev, () => { ensureAudio(); }, { passive: true });
  });

  function playTick(){
    if (!soundOn || volume <= 0 || !audioReady()) return;
    const ctx = audioCtx;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.value = 1500;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.3 * volume, ctx.currentTime + 0.002);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.05);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.06);
  }

  const soundBtn = $('soundBtn');
  const volumeSlider = $('volumeSlider');
  volumeSlider.value = String(Math.round(volume * 100));
  function renderSoundBtn(){
    soundBtn.classList.toggle('muted', !soundOn);
    soundBtn.classList.toggle('active', soundOn);
    soundBtn.setAttribute('aria-pressed', String(soundOn));
  }
  renderSoundBtn();
  soundBtn.addEventListener('click', () => {
    ensureAudio();
    soundOn = !soundOn;
    st.sound = soundOn; save();
    renderSoundBtn();
    if (soundOn) playTick();
  });

  volumeSlider.addEventListener('input', () => {
    volume = Number(volumeSlider.value) / 100;
    st.volume = Math.round(volume * 100);
    if (!soundOn){
      ensureAudio();
      soundOn = true;
      st.sound = true;
      renderSoundBtn();
    }
    save();
  });
  volumeSlider.addEventListener('change', () => { playTick(); });

  const audioHint = $('audioHint');
  audioHint.addEventListener('click', () => { ensureAudio(); updateAudioHint(); });
  function updateAudioHint(){
    audioHint.hidden = !((st.alarmOn || soundOn) && !audioReady());
  }

  /* ---------- 화면 꺼짐 방지 (Wake Lock) ---------- */
  const wakeBtn = $('wakeBtn');
  const wakeSupported = !!(navigator.wakeLock && navigator.wakeLock.request);
  let wl = null;
  function requestWake(){
    if (!wakeSupported || !st.wake || document.visibilityState !== 'visible') return;
    navigator.wakeLock.request('screen').then(l => {
      wl = l;
      l.addEventListener('release', () => { if (wl === l) wl = null; });
    }).catch(() => {});
  }
  function releaseWake(){
    if (wl){ try{ wl.release(); }catch(e){} wl = null; }
  }
  function renderWakeBtn(){
    wakeBtn.classList.toggle('active', st.wake);
    wakeBtn.setAttribute('aria-pressed', String(st.wake));
    wakeBtn.title = st.wake ? '화면 꺼짐 방지: 켜짐' : '화면 꺼짐 방지: 꺼짐';
  }
  if (!wakeSupported){ wakeBtn.hidden = true; }
  renderWakeBtn();
  wakeBtn.addEventListener('click', () => {
    st.wake = !st.wake; save();
    renderWakeBtn();
    if (st.wake) requestWake(); else releaseWake();
  });

  /* ---------- ALARM ---------- */
  const alarmBtn = $('alarmBtn');
  const alarmPanel = $('alarmPanel');
  const alarmTimeInput = $('alarmTimeInput');
  const alarmSetBtn = $('alarmSetBtn');
  const alarmOffBtn = $('alarmOffBtn');
  const alarmStatus = $('alarmStatus');
  const alarmRinging = $('alarmRinging');
  const ringingTime = $('ringingTime');
  const snoozeBtn = $('snoozeBtn');
  const stopAlarmBtn = $('stopAlarmBtn');

  let isRinging = false;
  let snoozeUntil = null;
  let ringingSoundTimer = null;
  let titleTimer = null;
  let nextAlarm = null;

  function computeNext(from){
    const d = new Date(from);
    d.setHours(st.alarmH, st.alarmM, 0, 0);
    if (d.getTime() + 60000 <= from) d.setDate(d.getDate() + 1);
    return d.getTime();
  }
  function renderAlarmUi(){
    alarmBtn.classList.toggle('active', st.alarmOn);
    alarmOffBtn.hidden = !st.alarmOn;
    if (st.alarmOn){
      alarmTimeInput.value = `${pad(st.alarmH)}:${pad(st.alarmM)}`;
      alarmStatus.textContent = `매일 ${pad(st.alarmH)}:${pad(st.alarmM)}에 알람이 울립니다`;
    } else {
      alarmStatus.textContent = '알람이 꺼져 있습니다';
    }
  }
  if (st.alarmOn){ nextAlarm = computeNext(Date.now()); }
  renderAlarmUi();

  alarmBtn.addEventListener('click', () => {
    const willShow = alarmPanel.hidden;
    alarmPanel.hidden = !willShow;
    alarmBtn.setAttribute('aria-expanded', String(willShow));
  });

  alarmSetBtn.addEventListener('click', () => {
    ensureAudio();
    const val = alarmTimeInput.value;
    if (!val){
      alarmStatus.textContent = '시간을 먼저 선택해주세요';
      return;
    }
    const [hh, mm] = val.split(':').map(Number);
    st.alarmH = hh; st.alarmM = mm; st.alarmOn = true;
    snoozeUntil = null;
    nextAlarm = computeNext(Date.now());
    save();
    renderAlarmUi();
    updateAudioHint();
  });

  alarmOffBtn.addEventListener('click', () => {
    st.alarmOn = false; st.alarmH = null; st.alarmM = null;
    nextAlarm = null; snoozeUntil = null;
    save();
    renderAlarmUi();
    updateAudioHint();
  });

  function playAlarmBeep(){
    if (!audioReady()) return;
    const ctx = audioCtx;
    const alarmVolume = Math.max(volume, 0.5);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.55 * alarmVolume, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.38);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.4);
  }

  function startRinging(label){
    isRinging = true;
    ringingTime.textContent = label;
    alarmRinging.hidden = false;
    ensureAudio();
    playAlarmBeep();
    ringingSoundTimer = setInterval(playAlarmBeep, 650);
    let on = false;
    titleTimer = setInterval(() => { on = !on; document.title = on ? `⏰ ${label} 알람` : BASE_TITLE; }, 800);
    stopAlarmBtn.focus();
  }

  function stopRinging(){
    isRinging = false;
    alarmRinging.hidden = true;
    if (ringingSoundTimer){ clearInterval(ringingSoundTimer); ringingSoundTimer = null; }
    if (titleTimer){ clearInterval(titleTimer); titleTimer = null; }
    document.title = BASE_TITLE;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }

  stopAlarmBtn.addEventListener('click', stopRinging);
  snoozeBtn.addEventListener('click', () => {
    stopRinging();
    snoozeUntil = Date.now() + 5 * 60 * 1000;
    alarmStatus.textContent = '5분 후 다시 알림이 울립니다';
  });

  /* 단축키: Esc = 알람 중지, T = 다음 테마(Shift+T = 이전 테마) */
  window.addEventListener('keydown', (e) => {
    if (isRinging){
      if (e.key === 'Escape'){ e.preventDefault(); stopRinging(); }
      return;
    }
    const tag = (e.target && e.target.tagName) || '';
    if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 't' || e.key === 'T'){ e.preventDefault(); cycleTheme(e.shiftKey ? -1 : 1); }
  });

  function checkAlarm(nowMs, h24, m){
    if (isRinging) return;
    if (snoozeUntil !== null){
      if (nowMs >= snoozeUntil){
        snoozeUntil = null;
        renderAlarmUi();
        startRinging(`${pad(h24)}:${pad(m)}`);
      }
      return;
    }
    if (!st.alarmOn || nextAlarm === null) return;
    if (nowMs >= nextAlarm){
      const late = nowMs - nextAlarm;
      nextAlarm = computeNext(nowMs + 60000);
      if (late <= 30 * 60000){
        startRinging(`${pad(st.alarmH)}:${pad(st.alarmM)}`);
      }
    }
  }

  /* ---------- TICK ---------- */
  const DAYS = ['일','월','화','수','목','금','토'];
  let lastMinKey = '';
  function koTime(h, m){
    const ap = h < 12 ? '오전' : '오후';
    let hh = h % 12; if (hh === 0) hh = 12;
    return `${ap} ${hh}시 ${m}분`;
  }

  function tick(fromTimer){
    const now = new Date();
    const nowMs = now.getTime();
    let h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();
    const ampm = h >= 12 ? 'PM' : 'AM';
    const h24 = h;
    const analog = view === 'analog';

    if (analog || !is24){
      ampmBadge.hidden = false;
      ampmBadge.textContent = ampm;
    } else {
      ampmBadge.hidden = true;
    }

    if (!analog){
      if (!is24){ h = h % 12; if (h === 0) h = 12; }
      const hh = pad(h), mm = pad(m), ss = pad(s);
      const hTens = (!is24 && hh[0] === '0') ? '' : hh[0];
      updateFlipDigits([
        ['h0', hTens], ['h1', hh[1]],
        ['m0', mm[0]], ['m1', mm[1]],
        ['s0', ss[0]], ['s1', ss[1]]
      ]);
    } else {
      updateAnalog();
    }

    dateBadge.textContent = `${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())} (${DAYS[now.getDay()]})`;

    const key = `${h24}:${m}`;
    if (key !== lastMinKey){
      lastMinKey = key;
      $('srTime').textContent = koTime(h24, m);
    }

    if (fromTimer) playTick();
    checkAlarm(nowMs, h24, m);
    updateAudioHint();
  }

  modeBtn.addEventListener('click', () => {
    is24 = !is24;
    st.is24 = is24; save();
    modeBtn.textContent = is24 ? '24H' : '12H';
    resetFlips();
    tick(false);
  });

  /* ---------- 초 경계에 맞춰 갱신 ---------- */
  let timer = null;
  function schedule(){
    clearTimeout(timer);
    const wait = 1000 - (Date.now() % 1000) + 15;
    timer = setTimeout(() => { tick(true); schedule(); }, wait);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible'){
      tick(false); schedule(); requestWake();
      if (view === 'analog') startRaf();
    }
  });

  /* ---------- 시작 ---------- */
  modeBtn.textContent = is24 ? '24H' : '12H';
  applyView();
  tick(false);
  schedule();
  requestWake();
})();
</script>
</body>
</html>
