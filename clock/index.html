<style>
  :root{
    --font-display: 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
    --font-mono: 'Courier New', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;

    --case: #201e1c;
    --case-edge: #3a3632;
    --case-edge-2: #14120f;
    --face: #141311;
    --face-shadow: #050503;
    --numeral: #ede8de;
    --numeral-dim: #b7af9f;
    --amber: #e8952e;
    --amber-dim: rgba(232,149,46,0.14);
    --label: #d6cfc0;
    --crease: rgba(0,0,0,0.55);
  }

  * { box-sizing: border-box; }

  /* [수정 2] 기본 여백 제거 → 가장자리 흰 테두리·불필요한 스크롤 제거 */
  html, body{ margin: 0; padding: 0; background: #0e0d0b; }

  .sr-only{
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  .flipclock-root{
    width: 100%;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(ellipse at 50% 20%, #2a2622 0%, #0e0d0b 75%);
    font-family: var(--font-mono);
    padding: clamp(16px, 3vmin, 48px);
    overflow: auto;
  }

  .desk{ perspective: 1400px; }

  .clock{
    --flip-w: clamp(40px, min(30vmin, 13vw, 18vh), 420px);
    --analog: clamp(220px, min(56vh, 78vw), 780px);
    position: relative;
    background: linear-gradient(160deg, var(--case-edge) 0%, var(--case) 12%, var(--case) 88%, var(--case-edge-2) 100%);
    border-radius: clamp(14px, 2.4vmin, 30px);
    padding: clamp(18px, 3.4vmin, 52px) clamp(20px, 4.4vmin, 68px) clamp(16px, 3vmin, 48px);
    width: fit-content;
    max-width: 96vw;
    box-shadow:
      0 2px 0 rgba(255,255,255,0.04) inset,
      0 -6px 12px rgba(0,0,0,0.4) inset,
      0 30px 60px rgba(0,0,0,0.55),
      0 8px 14px rgba(0,0,0,0.4);
    transform: rotateX(4deg);
    transform-style: preserve-3d;
  }

  .clock::after{
    content:'';
    position:absolute;
    left: 50%; bottom: -26px;
    width: 78%; height: 26px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 72%);
  }

  .brandrow{
    display:flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    justify-content: space-between;
    align-items: center;
    margin-bottom: clamp(10px, 1.8vmin, 22px);
    padding: 0 2px;
  }
  .brand{
    font-size: clamp(13px, 2.1vmin, 24px);
    letter-spacing: 0.18em;
    color: var(--label);
    text-transform: uppercase;
  }
  .modebtn{
    font-family: var(--font-mono);
    font-size: clamp(12px, 1.8vmin, 20px);
    letter-spacing: 0.1em;
    color: var(--label);
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 4px;
    padding: clamp(4px,0.7vmin,8px) clamp(8px,1.2vmin,14px);
    cursor: pointer;
    text-transform: uppercase;
  }
  .modebtn:hover{ color: var(--numeral); border-color: rgba(255,255,255,0.18); }
  .modebtn:focus-visible{ outline: 2px solid var(--amber); outline-offset: 2px; }
  .modebtn[hidden]{ display:none; }

  .headerbtns{ display:flex; flex-wrap: wrap; justify-content: flex-end; align-items:center; gap: clamp(6px, 1vmin, 12px); }

  .iconbtn{
    display:flex; align-items:center; justify-content:center;
    width: clamp(28px, 3.6vmin, 42px); height: clamp(28px, 3.6vmin, 42px);
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 4px;
    color: var(--label);
    cursor: pointer;
    padding: 0;
  }
  .iconbtn[hidden]{ display:none; }
  .iconbtn svg{
    width: clamp(14px, 1.9vmin, 20px); height: clamp(14px, 1.9vmin, 20px);
    stroke: currentColor; fill: none;
    stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round;
  }
  .iconbtn:hover{ color: var(--numeral); border-color: rgba(255,255,255,0.18); }
  .iconbtn:focus-visible{ outline: 2px solid var(--amber); outline-offset: 2px; }
  .iconbtn.active{ color: var(--amber); border-color: rgba(232,149,46,0.35); background: var(--amber-dim); }

  #soundBtn .icon-off{ display:none; }
  #soundBtn.muted .icon-on{ display:none; }
  #soundBtn.muted .icon-off{ display:block; }

  .volume-slider{
    -webkit-appearance: none;
    appearance: none;
    width: clamp(48px, 7vmin, 100px);
    height: clamp(3px, 0.5vmin, 5px);
    border-radius: 3px;
    background: rgba(255,255,255,0.12);
    outline: none;
    cursor: pointer;
    margin: 0 clamp(2px, 0.5vmin, 6px);
  }
  .volume-slider::-webkit-slider-thumb{
    -webkit-appearance: none;
    appearance: none;
    width: clamp(12px, 1.7vmin, 18px);
    height: clamp(12px, 1.7vmin, 18px);
    border-radius: 50%;
    background: var(--amber);
    border: 2px solid #17140f;
    cursor: pointer;
  }
  .volume-slider::-moz-range-thumb{
    width: clamp(12px, 1.7vmin, 18px);
    height: clamp(12px, 1.7vmin, 18px);
    border-radius: 50%;
    background: var(--amber);
    border: 2px solid #17140f;
    cursor: pointer;
  }
  .volume-slider::-moz-range-track{
    height: clamp(3px, 0.5vmin, 5px);
    border-radius: 3px;
    background: rgba(255,255,255,0.12);
  }
  .volume-slider:focus-visible{ outline: 2px solid var(--amber); outline-offset: 3px; }

  .alarm-panel[hidden]{ display: none; }
  .alarm-panel{
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: clamp(8px, 1.2vmin, 14px);
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 8px;
    padding: clamp(8px, 1.3vmin, 16px);
    margin-bottom: clamp(10px, 1.8vmin, 20px);
  }
  .alarm-time-input{
    font-family: var(--font-mono);
    font-size: clamp(13px, 1.9vmin, 20px);
    color: var(--numeral);
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 4px;
    padding: clamp(4px,0.7vmin,8px) clamp(6px,1vmin,10px);
    color-scheme: dark;
  }
  .alarm-set-btn, .alarm-off-btn{
    font-family: var(--font-mono);
    font-size: clamp(11px, 1.6vmin, 16px);
    letter-spacing: 0.04em;
    color: var(--case);
    background: var(--amber);
    border: none;
    border-radius: 4px;
    padding: clamp(6px,1vmin,10px) clamp(10px,1.6vmin,16px);
    cursor: pointer;
  }
  .alarm-off-btn{
    color: var(--label);
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
  }
  .alarm-off-btn[hidden]{ display:none; }
  .alarm-set-btn:hover{ filter: brightness(1.08); }
  .alarm-off-btn:hover{ color: var(--numeral); border-color: rgba(255,255,255,0.2); }
  .alarm-status{
    font-size: clamp(11px, 1.5vmin, 15px);
    color: var(--label);
    letter-spacing: 0.03em;
  }

  /* [수정 3] 울림 창은 .clock 밖(body 직속)에 있으므로 position:fixed가 화면 전체 기준으로 동작 */
  .alarm-ringing[hidden]{ display: none; }
  .alarm-ringing{
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(8,7,6,0.88);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
    font-family: var(--font-mono);
  }
  .ringing-box{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(10px, 2vmin, 22px);
    padding: clamp(28px, 5vmin, 60px) clamp(24px, 6vmin, 70px);
    background: linear-gradient(160deg, var(--case-edge) 0%, var(--case) 14%, var(--case) 86%, var(--case-edge-2) 100%);
    border-radius: clamp(16px, 2.4vmin, 30px);
    box-shadow: 0 30px 70px rgba(0,0,0,0.6);
    text-align: center;
  }
  .ringing-bell{
    width: clamp(48px, 8vmin, 96px); height: clamp(48px, 8vmin, 96px);
    stroke: var(--amber); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round;
    animation: ring-shake 0.6s ease-in-out infinite;
  }
  @keyframes ring-shake{
    0%, 100% { transform: rotate(0deg); }
    20% { transform: rotate(-14deg); }
    40% { transform: rotate(11deg); }
    60% { transform: rotate(-8deg); }
    80% { transform: rotate(5deg); }
  }
  @media (prefers-reduced-motion: reduce){ .ringing-bell{ animation: none; } }
  .ringing-time{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: clamp(36px, 7vmin, 90px);
    color: var(--numeral);
  }
  .ringing-actions{ display:flex; gap: clamp(8px,1.6vmin,16px); flex-wrap: wrap; justify-content:center; }
  .ringing-actions button{
    font-family: var(--font-mono);
    font-size: clamp(12px, 1.7vmin, 17px);
    letter-spacing: 0.04em;
    border-radius: 6px;
    padding: clamp(10px,1.6vmin,16px) clamp(16px,2.4vmin,24px);
    cursor: pointer;
    border: 1px solid rgba(255,255,255,0.12);
    background: rgba(255,255,255,0.05);
    color: var(--numeral);
  }
  .ringing-actions button:focus-visible{ outline: 3px solid var(--numeral); outline-offset: 3px; }
  #stopAlarmBtn{
    background: var(--amber);
    border-color: var(--amber);
    color: #1c1408;
    font-weight: 700;
  }
  #stopAlarmBtn:hover{ filter: brightness(1.08); }
  #snoozeBtn:hover{ color: var(--numeral); border-color: rgba(255,255,255,0.24); }

  /* ================= FLIP ================= */
  .display{ display:flex; align-items:center; justify-content:center; gap: calc(var(--flip-w) * 0.15); flex-shrink: 0; }
  .display[hidden]{ display:none; }
  .group{ display:flex; gap: calc(var(--flip-w) * 0.09); flex-shrink: 0; }
  .colon{ display:flex; flex-direction:column; justify-content:center; gap: calc(var(--flip-w) * 0.22); padding: 0 1px; height: calc(var(--flip-w) * 84 / 54); flex-shrink: 0; }
  .colon i{ width: calc(var(--flip-w) * 0.11); height: calc(var(--flip-w) * 0.11); border-radius:50%; background: var(--amber); box-shadow: 0 0 7px 1px rgba(232,149,46,0.55); animation: blink 2s steps(1,end) infinite; }
  @media (prefers-reduced-motion: reduce){ .colon i{ animation:none; } }
  @keyframes blink{ 0%,49%{opacity:1;} 50%,100%{opacity:0.18;} }

  .flip{
    position: relative;
    width: var(--flip-w);
    aspect-ratio: 54 / 84;
    flex-shrink: 0;
    perspective: 300px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.02);
    border-radius: calc(var(--flip-w) * 0.11);
  }
  .flip-inner{
    position: relative;
    width: 100%; height: 100%;
    transform-style: preserve-3d;
    transition: transform 380ms cubic-bezier(.45,.05,.55,.95);
  }
  .flip.flipping .flip-inner{ transform: rotateX(-180deg); }
  .face{
    position: absolute; inset: 0;
    backface-visibility: hidden;
    border-radius: calc(var(--flip-w) * 0.11);
    background: var(--face);
    display: flex; align-items: center; justify-content: center;
  }
  .face span{
    color: var(--numeral);
    font-family: var(--font-display);
    font-weight: 700;
    font-size: calc(var(--flip-w) * 0.96);
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .face-front{ transform: rotateX(0deg); z-index: 2; }
  .face-back{ transform: rotateX(180deg); }

  /* ================= ANALOG ================= */
  .analogwrap{ display:flex; align-items:center; justify-content:center; }
  .analogwrap[hidden]{ display:none; }
  .analog{
    display:block;
    width: var(--analog);
    height: var(--analog);
    filter: drop-shadow(0 10px 14px rgba(0,0,0,0.5));
  }
  .analog .hand{ filter: drop-shadow(0 3px 3px rgba(0,0,0,0.55)); }

  /* ================= shared bottom row ================= */
  .daterow{ display:flex; justify-content:center; align-items:center; gap: clamp(8px,1.4vmin,18px); margin-top: clamp(12px, 2.2vmin, 28px); flex-wrap: wrap; }
  .datebadge{ font-size: clamp(12px, 1.9vmin, 22px); letter-spacing: 0.12em; color: var(--label); background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); border-radius: 4px; padding: clamp(4px,0.8vmin,9px) clamp(8px,1.4vmin,16px); }
  .ampm{ font-size: clamp(12px, 1.9vmin, 22px); letter-spacing: 0.12em; color: var(--amber); background: rgba(232,149,46,0.08); border: 1px solid rgba(232,149,46,0.25); border-radius: 4px; padding: clamp(4px,0.8vmin,9px) clamp(8px,1.4vmin,16px); }
  .ampm[hidden]{ display:none; }
  .hintbadge{
    font-family: var(--font-mono);
    font-size: clamp(11px, 1.6vmin, 18px);
    color: #1c1408; background: var(--amber);
    border: 0; border-radius: 4px; cursor: pointer;
    padding: clamp(4px,0.8vmin,9px) clamp(8px,1.4vmin,16px);
  }
  .hintbadge[hidden]{ display:none; }
  .hintbadge:focus-visible{ outline: 2px solid var(--numeral); outline-offset: 2px; }

  .row-break{ display: none; }

  @media (max-width: 420px){
    .display{ max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  }

  /* Portrait / tall screens: wrap HH:MM and :SS onto two rows */
  @media (max-aspect-ratio: 1/1){
    .clock{
      --flip-w: clamp(40px, min(30vw, 12vh, 34vmin), 440px);
      --analog: clamp(220px, min(52vh, 82vw), 780px);
    }
    .display{
      flex-wrap: wrap;
      width: calc(var(--flip-w) * 4.85);
      row-gap: calc(var(--flip-w) * 0.32);
    }
    .row-break{ display: block; flex-basis: 100%; height: 0; }
  }
</style>
</head>
<body>

<div class="flipclock-root">
  <div class="desk">
    <div class="clock">
      <div class="brandrow">
        <span class="brand">탁상시계</span>
        <div class="headerbtns">
          <button class="iconbtn" id="soundBtn" type="button" aria-label="시계 소리 켜기/끄기" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-on">
              <path d="M4 9v6h4l5 5V4L8 9H4z"/>
              <path d="M16 8.5c1.2 1 1.2 6 0 7"/>
              <path d="M18.5 6.5c2 2 2 9 0 11"/>
            </svg>
            <svg viewBox="0 0 24 24" aria-hidden="true" class="icon-off">
              <path d="M4 9v6h4l5 5V4L8 9H4z"/>
              <path d="M16 9l5 6"/>
              <path d="M21 9l-5 6"/>
            </svg>
          </button>
          <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="55" aria-label="소리 크기" />
          <button class="iconbtn" id="alarmBtn" type="button" aria-label="알람 설정" aria-pressed="false" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 8a6 6 0 1 0-12 0c0 5-2 6-2 6h16s-2-1-2-6"/>
              <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
            </svg>
          </button>
          <button class="iconbtn" id="wakeBtn" type="button" aria-label="화면 꺼짐 방지" aria-pressed="false" title="화면 꺼짐 방지">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="4" width="18" height="12" rx="2"/>
              <path d="M8 20h8M12 16v4"/>
            </svg>
          </button>
          <button class="modebtn" id="viewBtn" type="button">플립</button>
          <button class="modebtn" id="modeBtn" type="button" aria-label="12/24시간 전환">24H</button>
        </div>
      </div>

      <div class="alarm-panel" id="alarmPanel" hidden>
        <input type="time" id="alarmTimeInput" class="alarm-time-input" aria-label="알람 시각" />
        <button type="button" class="alarm-set-btn" id="alarmSetBtn">알람 설정</button>
        <button type="button" class="alarm-off-btn" id="alarmOffBtn" hidden>알람 끄기</button>
        <span class="alarm-status" id="alarmStatus" role="status">알람이 꺼져 있습니다</span>
      </div>

      <span class="sr-only" id="srTime" role="timer" aria-live="off"></span>

      <div class="display" id="display" aria-hidden="true"></div>

      <div class="analogwrap" id="analogWrap" hidden>
        <svg class="analog" id="analog" viewBox="0 0 400 400" aria-hidden="true"></svg>
      </div>

      <div class="daterow">
        <span class="datebadge" id="dateBadge">-</span>
        <span class="ampm" id="ampmBadge" hidden>AM</span>
        <button type="button" class="hintbadge" id="audioHint" hidden>알람음을 켜려면 화면을 한 번 클릭하세요</button>
      </div>
    </div>
  </div>
</div>

<!-- [수정 3] 알람 울림 창: .clock 밖(body 직속)에 둠 -->
<div class="alarm-ringing" id="alarmRinging" role="alertdialog" aria-modal="true" aria-labelledby="ringingTime" hidden>
  <div class="ringing-box">
    <svg viewBox="0 0 24 24" class="ringing-bell" aria-hidden="true">
      <path d="M18 8a6 6 0 1 0-12 0c0 5-2 6-2 6h16s-2-1-2-6"/>
      <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
    </svg>
    <div class="ringing-time" id="ringingTime">00:00</div>
    <div class="ringing-actions">
      <button type="button" id="snoozeBtn">5분 후 다시 알림</button>
      <button type="button" id="stopAlarmBtn">알람 중지</button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';
  const $ = (id) => document.getElementById(id);
  const display = $('display');
  const dateBadge = $('dateBadge');
  const ampmBadge = $('ampmBadge');
  const modeBtn = $('modeBtn');
  const viewBtn = $('viewBtn');
  const BASE_TITLE = '탁상시계';
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function pad(n){ return n.toString().padStart(2, '0'); }

  /* ---------- [수정 4] 설정 저장/복원 ---------- */
  const KEY = 'tabletopClock.v1';
  const st = { is24:true, sound:false, volume:55, alarmOn:false, alarmH:null, alarmM:null, view:'flip', wake:false };
  function load(){
    try{
      const s = JSON.parse(localStorage.getItem(KEY) || 'null');
      if (s && typeof s === 'object'){ for (const k in st){ if (k in s) st[k] = s[k]; } }
    }catch(e){}
    st.is24 = st.is24 !== false;
    st.sound = !!st.sound;
    st.wake = !!st.wake;
    const v = Number(st.volume);
    st.volume = isFinite(v) ? Math.max(0, Math.min(100, v)) : 55;
    st.view = (st.view === 'analog') ? 'analog' : 'flip';
    const h = Number(st.alarmH), m = Number(st.alarmM);
    if (st.alarmOn && Number.isInteger(h) && h >= 0 && h < 24 && Number.isInteger(m) && m >= 0 && m < 60){
      st.alarmH = h; st.alarmM = m;
    } else {
      st.alarmOn = false; st.alarmH = null; st.alarmM = null;
    }
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} }
  load();

  let is24 = st.is24;
  let soundOn = st.sound;
  let volume = st.volume / 100;
  let view = st.view;

  /* ---------- FLIP setup ---------- */
  const flipDigits = {};
  function makeFlip(id){
    const wrap = document.createElement('div');
    wrap.className = 'flip';
    wrap.innerHTML = `
      <div class="flip-inner">
        <div class="face face-front"><span>0</span></div>
        <div class="face face-back"><span>0</span></div>
      </div>`;
    flipDigits[id] = { el: wrap, value: null, animating: false };
    return wrap;
  }
  function flipGroup(prefix){
    const g = document.createElement('div');
    g.className = 'group';
    g.appendChild(makeFlip(prefix + '0'));
    g.appendChild(makeFlip(prefix + '1'));
    return g;
  }
  function colonDots(cls){
    const c = document.createElement('div');
    c.className = cls || 'colon';
    c.innerHTML = '<i></i><i></i>';
    return c;
  }
  function rowBreak(){
    const b = document.createElement('div');
    b.className = 'row-break';
    b.setAttribute('aria-hidden', 'true');
    return b;
  }
  display.appendChild(flipGroup('h'));
  display.appendChild(colonDots());
  display.appendChild(flipGroup('m'));
  display.appendChild(rowBreak());
  display.appendChild(colonDots());
  display.appendChild(flipGroup('s'));

  function resetFlips(){ for (const k in flipDigits) flipDigits[k].value = null; }

  function updateFlipDigits(pairs){
    const toAnimate = [];

    pairs.forEach(([id, val]) => {
      const d = flipDigits[id];
      if (d.value === val) return;
      const wasFirst = d.value === null;
      d.value = val;
      const el = d.el;
      const inner = el.querySelector('.flip-inner');
      const frontSpan = el.querySelector('.face-front span');
      const backSpan = el.querySelector('.face-back span');

      if (wasFirst){
        frontSpan.textContent = val;
        backSpan.textContent = val;
        return;
      }

      if (d.animating){
        inner.style.transition = 'none';
        inner.style.transform = '';
        frontSpan.textContent = backSpan.textContent;
        el.classList.remove('flipping');
        void inner.offsetWidth;
        inner.style.transition = '';
        d.animating = false;
      }

      backSpan.textContent = val;
      toAnimate.push({ id, d, el, inner, frontSpan, val });
    });

    if (toAnimate.length === 0) return;

    toAnimate.forEach(item => { void item.el.offsetWidth; });

    toAnimate.forEach(item => {
      item.d.animating = true;
      item.el.classList.add('flipping');

      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        item.inner.removeEventListener('transitionend', onEnd);
        item.frontSpan.textContent = item.val;
        item.el.classList.remove('flipping');
        item.inner.style.transition = 'none';
        item.inner.style.transform = '';
        void item.inner.offsetWidth;
        item.inner.style.transition = '';
        item.d.animating = false;
      };
      const onEnd = (e) => {
        if (e.target !== item.inner) return;
        finish();
      };
      item.inner.addEventListener('transitionend', onEnd);
      window.setTimeout(finish, 700);
    });
  }

  /* ---------- ANALOG ---------- */
  const analogSvg = $('analog');
  let hHand, mHand, sHand;
  (function buildAnalog(){
    let s = '';
    s += '<defs>'
      + '<linearGradient id="aBezel" x1="0" y1="0" x2="0" y2="1">'
      + '<stop offset="0" stop-color="#3a3632"/><stop offset="0.12" stop-color="#201e1c"/>'
      + '<stop offset="0.88" stop-color="#201e1c"/><stop offset="1" stop-color="#14120f"/></linearGradient>'
      + '<radialGradient id="aFace" cx="50%" cy="42%" r="62%">'
      + '<stop offset="0" stop-color="#1d1c19"/><stop offset="1" stop-color="#0d0c0a"/></radialGradient>'
      + '</defs>';
    s += '<circle cx="200" cy="200" r="197" fill="url(#aBezel)"/>';
    s += '<circle cx="200" cy="200" r="183" fill="url(#aFace)" stroke="rgba(0,0,0,0.6)" stroke-width="3"/>';
    for (let i = 0; i < 60; i++){
      const big = i % 5 === 0;
      const y2 = big ? 50 : 38;
      const col = i === 0 ? '#e8952e' : (big ? '#ede8de' : '#b7af9f');
      s += `<line x1="200" y1="26" x2="200" y2="${y2}" stroke="${col}" stroke-width="${big ? 5 : 2}" stroke-linecap="round" transform="rotate(${i * 6} 200 200)"/>`;
    }
    for (let n = 1; n <= 12; n++){
      const a = n * Math.PI / 6;
      const x = 200 + 118 * Math.sin(a);
      const y = 200 - 118 * Math.cos(a);
      s += `<text x="${x.toFixed(2)}" y="${y.toFixed(2)}" text-anchor="middle" dominant-baseline="central" `
         + `font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-weight="700" font-size="40" fill="#ede8de">${n}</text>`;
    }
    s += '<text x="200" y="272" text-anchor="middle" font-family="\'Courier New\',monospace" font-size="15" letter-spacing="4" fill="#b7af9f">탁상시계</text>';
    s += '<g class="hand" id="aHour"><line x1="200" y1="216" x2="200" y2="128" stroke="#ede8de" stroke-width="13" stroke-linecap="round"/></g>';
    s += '<g class="hand" id="aMin"><line x1="200" y1="222" x2="200" y2="70" stroke="#ede8de" stroke-width="9" stroke-linecap="round"/></g>';
    s += '<g class="hand" id="aSec"><line x1="200" y1="242" x2="200" y2="38" stroke="#e8952e" stroke-width="3.5" stroke-linecap="round"/><circle cx="200" cy="236" r="7" fill="#e8952e"/></g>';
    s += '<circle cx="200" cy="200" r="12" fill="#e8952e"/><circle cx="200" cy="200" r="4.5" fill="#1c1408"/>';
    analogSvg.innerHTML = s;
    hHand = $('aHour'); mHand = $('aMin'); sHand = $('aSec');
  })();

  function updateAnalog(){
    const n = new Date();
    let sec = n.getSeconds() + n.getMilliseconds() / 1000;
    if (reduceMotion) sec = Math.floor(sec);
    const min = n.getMinutes() + sec / 60;
    const hr = (n.getHours() % 12) + min / 60;
    hHand.setAttribute('transform', `rotate(${(hr * 30).toFixed(3)} 200 200)`);
    mHand.setAttribute('transform', `rotate(${(min * 6).toFixed(3)} 200 200)`);
    sHand.setAttribute('transform', `rotate(${(sec * 6).toFixed(3)} 200 200)`);
  }
  let raf = 0;
  function frame(){ updateAnalog(); raf = requestAnimationFrame(frame); }
  function startRaf(){ if (!raf) raf = requestAnimationFrame(frame); }
  function stopRaf(){ if (raf){ cancelAnimationFrame(raf); raf = 0; } }

  function applyView(){
    const analog = view === 'analog';
    $('display').hidden = analog;
    $('analogWrap').hidden = !analog;
    modeBtn.hidden = analog;
    viewBtn.textContent = analog ? '아날로그' : '플립';
    viewBtn.setAttribute('aria-label', analog
      ? '현재 아날로그 시계. 누르면 플립 시계로 전환'
      : '현재 플립 시계. 누르면 아날로그 시계로 전환');
    if (analog){ updateAnalog(); startRaf(); }
    else { stopRaf(); resetFlips(); }
  }
  viewBtn.addEventListener('click', () => {
    view = (view === 'flip') ? 'analog' : 'flip';
    st.view = view; save();
    applyView();
    tick(false);
  });

  /* ---------- SOUND (tick + alarm) ---------- */
  let audioCtx = null;
  function ensureAudio(){
    if (!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === 'suspended'){ audioCtx.resume().catch(() => {}); }
    return audioCtx;
  }
  function audioReady(){ return !!audioCtx && audioCtx.state === 'running'; }

  // 새로고침 후에는 브라우저 정책상 첫 클릭/키 입력이 있어야 소리가 납니다.
  ['pointerdown', 'keydown', 'touchstart'].forEach(ev => {
    window.addEventListener(ev, () => { ensureAudio(); }, { passive: true });
  });

  function playTick(){
    if (!soundOn || volume <= 0 || !audioReady()) return;
    const ctx = audioCtx;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.value = 1500;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.3 * volume, ctx.currentTime + 0.002);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.05);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.06);
  }

  const soundBtn = $('soundBtn');
  const volumeSlider = $('volumeSlider');
  volumeSlider.value = String(Math.round(volume * 100));
  function renderSoundBtn(){
    soundBtn.classList.toggle('muted', !soundOn);
    soundBtn.classList.toggle('active', soundOn);
    soundBtn.setAttribute('aria-pressed', String(soundOn));
  }
  renderSoundBtn();
  soundBtn.addEventListener('click', () => {
    ensureAudio();
    soundOn = !soundOn;
    st.sound = soundOn; save();
    renderSoundBtn();
    if (soundOn) playTick();
  });

  volumeSlider.addEventListener('input', () => {
    volume = Number(volumeSlider.value) / 100;
    st.volume = Math.round(volume * 100);
    if (!soundOn){
      ensureAudio();
      soundOn = true;
      st.sound = true;
      renderSoundBtn();
    }
    save();
  });
  volumeSlider.addEventListener('change', () => { playTick(); });

  const audioHint = $('audioHint');
  audioHint.addEventListener('click', () => { ensureAudio(); updateAudioHint(); });
  function updateAudioHint(){
    audioHint.hidden = !((st.alarmOn || soundOn) && !audioReady());
  }

  /* ---------- [수정 6] 화면 꺼짐 방지 (Wake Lock) ---------- */
  const wakeBtn = $('wakeBtn');
  const wakeSupported = !!(navigator.wakeLock && navigator.wakeLock.request);
  let wl = null;
  function requestWake(){
    if (!wakeSupported || !st.wake || document.visibilityState !== 'visible') return;
    navigator.wakeLock.request('screen').then(l => {
      wl = l;
      l.addEventListener('release', () => { if (wl === l) wl = null; });
    }).catch(() => {});
  }
  function releaseWake(){
    if (wl){ try{ wl.release(); }catch(e){} wl = null; }
  }
  function renderWakeBtn(){
    wakeBtn.classList.toggle('active', st.wake);
    wakeBtn.setAttribute('aria-pressed', String(st.wake));
    wakeBtn.title = st.wake ? '화면 꺼짐 방지: 켜짐' : '화면 꺼짐 방지: 꺼짐';
  }
  if (!wakeSupported){ wakeBtn.hidden = true; }
  renderWakeBtn();
  wakeBtn.addEventListener('click', () => {
    st.wake = !st.wake; save();
    renderWakeBtn();
    if (st.wake) requestWake(); else releaseWake();
  });

  /* ---------- ALARM ---------- */
  const alarmBtn = $('alarmBtn');
  const alarmPanel = $('alarmPanel');
  const alarmTimeInput = $('alarmTimeInput');
  const alarmSetBtn = $('alarmSetBtn');
  const alarmOffBtn = $('alarmOffBtn');
  const alarmStatus = $('alarmStatus');
  const alarmRinging = $('alarmRinging');
  const ringingTime = $('ringingTime');
  const snoozeBtn = $('snoozeBtn');
  const stopAlarmBtn = $('stopAlarmBtn');

  let isRinging = false;
  let snoozeUntil = null;
  let ringingSoundTimer = null;
  let titleTimer = null;
  let nextAlarm = null;   // 다음 알람 시각(ms)

  /* [수정 6] "시·분이 같은가"가 아니라 "예정 시각이 지났는가"로 판정 → 타이머가 늦어져도 놓치지 않음 */
  function computeNext(from){
    const d = new Date(from);
    d.setHours(st.alarmH, st.alarmM, 0, 0);
    if (d.getTime() + 60000 <= from) d.setDate(d.getDate() + 1);
    return d.getTime();
  }
  function renderAlarmUi(){
    alarmBtn.classList.toggle('active', st.alarmOn);
    alarmOffBtn.hidden = !st.alarmOn;
    if (st.alarmOn){
      alarmTimeInput.value = `${pad(st.alarmH)}:${pad(st.alarmM)}`;
      alarmStatus.textContent = `매일 ${pad(st.alarmH)}:${pad(st.alarmM)}에 알람이 울립니다`;
    } else {
      alarmStatus.textContent = '알람이 꺼져 있습니다';
    }
  }
  if (st.alarmOn){ nextAlarm = computeNext(Date.now()); }
  renderAlarmUi();

  alarmBtn.addEventListener('click', () => {
    const willShow = alarmPanel.hidden;
    alarmPanel.hidden = !willShow;
    alarmBtn.setAttribute('aria-expanded', String(willShow));
  });

  alarmSetBtn.addEventListener('click', () => {
    ensureAudio();
    const val = alarmTimeInput.value;
    if (!val){
      alarmStatus.textContent = '시간을 먼저 선택해주세요';
      return;
    }
    const [hh, mm] = val.split(':').map(Number);
    st.alarmH = hh; st.alarmM = mm; st.alarmOn = true;
    snoozeUntil = null;
    nextAlarm = computeNext(Date.now());
    save();
    renderAlarmUi();
    updateAudioHint();
  });

  alarmOffBtn.addEventListener('click', () => {
    st.alarmOn = false; st.alarmH = null; st.alarmM = null;
    nextAlarm = null; snoozeUntil = null;
    save();
    renderAlarmUi();
    updateAudioHint();
  });

  function playAlarmBeep(){
    if (!audioReady()) return;
    const ctx = audioCtx;
    const alarmVolume = Math.max(volume, 0.5);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.55 * alarmVolume, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.38);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.4);
  }

  function startRinging(label){
    isRinging = true;
    ringingTime.textContent = label;
    alarmRinging.hidden = false;
    ensureAudio();
    playAlarmBeep();
    ringingSoundTimer = setInterval(playAlarmBeep, 650);
    // 소리가 잠겨 있어도 탭 제목이 깜박여 알아챌 수 있게 함
    let on = false;
    titleTimer = setInterval(() => { on = !on; document.title = on ? `⏰ ${label} 알람` : BASE_TITLE; }, 800);
    stopAlarmBtn.focus();   // 키보드로 바로 끌 수 있게 포커스 이동
  }

  function stopRinging(){
    isRinging = false;
    alarmRinging.hidden = true;
    if (ringingSoundTimer){ clearInterval(ringingSoundTimer); ringingSoundTimer = null; }
    if (titleTimer){ clearInterval(titleTimer); titleTimer = null; }
    document.title = BASE_TITLE;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  }

  stopAlarmBtn.addEventListener('click', stopRinging);
  snoozeBtn.addEventListener('click', () => {
    stopRinging();
    snoozeUntil = Date.now() + 5 * 60 * 1000;
    alarmStatus.textContent = '5분 후 다시 알림이 울립니다';
  });
  window.addEventListener('keydown', (e) => {
    if (isRinging && e.key === 'Escape'){ e.preventDefault(); stopRinging(); }
  });

  function checkAlarm(nowMs, h24, m){
    if (isRinging) return;
    if (snoozeUntil !== null){
      if (nowMs >= snoozeUntil){
        snoozeUntil = null;
        renderAlarmUi();
        startRinging(`${pad(h24)}:${pad(m)}`);
      }
      return;
    }
    if (!st.alarmOn || nextAlarm === null) return;
    if (nowMs >= nextAlarm){
      const late = nowMs - nextAlarm;
      nextAlarm = computeNext(nowMs + 60000);          // 다음 울릴 시각(내일 같은 시각)
      if (late <= 30 * 60000){                          // 30분 이내 지연이면 울림, 그보다 늦으면 건너뜀
        startRinging(`${pad(st.alarmH)}:${pad(st.alarmM)}`);
      }
    }
  }

  /* ---------- TICK ---------- */
  const DAYS = ['일','월','화','수','목','금','토'];
  let lastMinKey = '';
  function koTime(h, m){
    const ap = h < 12 ? '오전' : '오후';
    let hh = h % 12; if (hh === 0) hh = 12;
    return `${ap} ${hh}시 ${m}분`;
  }

  function tick(fromTimer){
    const now = new Date();
    const nowMs = now.getTime();
    let h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();
    const ampm = h >= 12 ? 'PM' : 'AM';
    const h24 = h;
    const analog = view === 'analog';

    if (analog || !is24){
      ampmBadge.hidden = false;
      ampmBadge.textContent = ampm;
    } else {
      ampmBadge.hidden = true;
    }

    if (!analog){
      if (!is24){ h = h % 12; if (h === 0) h = 12; }
      const hh = pad(h), mm = pad(m), ss = pad(s);
      // [수정 사소] 12시간제에서는 1~9시의 앞자리 0을 비워 "1:09"처럼 표시
      const hTens = (!is24 && hh[0] === '0') ? '' : hh[0];
      updateFlipDigits([
        ['h0', hTens], ['h1', hh[1]],
        ['m0', mm[0]], ['m1', mm[1]],
        ['s0', ss[0]], ['s1', ss[1]]
      ]);
    } else {
      updateAnalog();
    }

    dateBadge.textContent = `${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())} (${DAYS[now.getDay()]})`;

    const key = `${h24}:${m}`;
    if (key !== lastMinKey){
      lastMinKey = key;
      $('srTime').textContent = koTime(h24, m);
    }

    if (fromTimer) playTick();
    checkAlarm(nowMs, h24, m);
    updateAudioHint();
  }

  modeBtn.addEventListener('click', () => {
    is24 = !is24;
    st.is24 = is24; save();
    modeBtn.textContent = is24 ? '24H' : '12H';
    resetFlips();
    tick(false);
  });

  /* ---------- [수정 5] 초 경계에 맞춰 갱신 ---------- */
  let timer = null;
  function schedule(){
    clearTimeout(timer);
    const wait = 1000 - (Date.now() % 1000) + 15;   // 다음 초가 시작된 직후(+15ms)에 실행
    timer = setTimeout(() => { tick(true); schedule(); }, wait);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible'){
      tick(false); schedule(); requestWake();
      if (view === 'analog') startRaf();
    }
  });

  /* ---------- 시작 ---------- */
  modeBtn.textContent = is24 ? '24H' : '12H';
  applyView();
  tick(false);
  schedule();
  requestWake();
})();
</script>
</body>
</html>
