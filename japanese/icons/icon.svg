<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF8F2"/>
      <stop offset="100%" stop-color="#F3ECDD"/>
    </linearGradient>
  </defs>
  <!-- background rounded square -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- sun circle -->
  <circle cx="256" cy="196" r="72" fill="#C1416B" opacity="0.14"/>
  <!-- torii gate -->
  <g fill="#B23A48">
    <!-- left pillar -->
    <rect x="146" y="200" width="34" height="220" rx="6"/>
    <!-- right pillar -->
    <rect x="332" y="200" width="34" height="220" rx="6"/>
    <!-- pillar caps (kasagi outer beam, slightly curved look via wide bar) -->
    <rect x="104" y="150" width="304" height="34" rx="10"/>
    <rect x="118" y="150" width="276" height="14" rx="7" fill="#8F2C38"/>
    <!-- second beam (shimaki) -->
    <rect x="124" y="192" width="264" height="20" rx="8"/>
    <!-- nuki (horizontal tie beam) -->
    <rect x="160" y="270" width="192" height="18" rx="6" fill="#8F2C38"/>
  </g>
  <!-- ground line -->
  <rect x="140" y="420" width="232" height="12" rx="6" fill="#1c2b45" opacity="0.55"/>
</svg>
