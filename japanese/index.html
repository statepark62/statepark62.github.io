<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일본어 첫걸음 · 인포그래픽 허브</title>
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
<link rel="shortcut icon" href="icons/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="manifest" href="icons/site.webmanifest">
<meta name="theme-color" content="#FBF8F2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#26241F; --sub:#6b6558; --paper:#FBF8F2; --card:#ffffff; --line:#E7E1D3; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{ background:var(--paper); color:var(--ink); font-family:'Noto Sans KR', sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased; display:flex; flex-direction:column; height:100vh; }
  .jp{ font-family:'Noto Serif JP', serif; }

  header{ padding:20px 20px 0; text-align:center; }
  header h1{ margin:0; font-size:clamp(30px, 4.5vw, 50px); font-weight:900; }
  header .hero{ font-family:'Noto Serif JP', serif; font-size:18px; color:var(--sub); margin-top:4px; }

  nav.cattabs{ display:flex; justify-content:center; gap:8px; padding:14px 12px; overflow-x:auto; scrollbar-width:none; border-bottom:1px solid var(--line); flex:0 0 auto; }
  nav.cattabs::-webkit-scrollbar{display:none;}
  nav.cattabs button{ flex:0 0 auto; font-family:inherit; font-size:19px; font-weight:700; padding:9px 16px; border-radius:999px; border:1.5px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  nav.cattabs button.active{ background:var(--accent); border-color:var(--accent); color:#fff; }

  #topicbar{ padding:10px 14px; display:flex; justify-content:center; gap:8px; flex-wrap:wrap; overflow-y:auto; max-height:32vh; border-bottom:1px solid var(--line); flex:0 0 auto; background:#fff; }
  .topic-chip{ font-size:18px; padding:8px 13px; border-radius:10px; border:1px solid var(--line); background:var(--paper); cursor:pointer; display:flex; align-items:center; gap:6px; }
  .topic-chip.active{ border-color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, white); font-weight:700; }
  .topic-chip.disabled{ opacity:0.55; cursor:default; }
  .topic-chip .badge{ font-size:14px; background:#a99b78; color:#fff; padding:1px 6px; border-radius:999px; }

  #viewer{ flex:1 1 auto; position:relative; }
  #viewer iframe{ width:100%; height:100%; border:0; display:block; }
  #placeholder{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; color:var(--sub); font-size:20.5px; text-align:center; padding:20px; }
  #placeholder .big{ font-size:49.5px; }

  footer{ text-align:center; font-size:16px; color:var(--sub); padding:8px; border-top:1px solid var(--line); flex:0 0 auto; }
  footer a{ color:var(--sub); }
</style>
</head>
<body>

<header>
  <div class="hero jp">はじめての日本語</div>
  <h1>일본어 첫걸음 · 인포그래픽 모음</h1>
</header>

<nav class="cattabs" id="cattabs"></nav>
<div id="topicbar"></div>
<div id="viewer">
  <div id="placeholder">
    <div class="big">🇯🇵</div>
    <div>위에서 주제를 선택하면<br>여기에 자료가 표시됩니다.</div>
  </div>
  <iframe id="frame" style="display:none;"></iframe>
</div>

<footer>
  © 2026 StatePark · 일본어 첫걸음 시리즈 · <a href="https://cafe.naver.com/statepark62" target="_blank">질문·소통: 네이버 카페</a>
</footer>

<script>
const CATEGORIES = [
  { id:'basics', label:'기초·구조', accent:'#2A5CAA', topics:[
    { title:'일본어의 구성 및 구조', file:'basics-japanese-structure.html' },
    { title:'한국어·일본어 구조 비교', file:'basics-korean-japanese-structure.html' },
    { title:'한국어·일본어 차이', file:'basics-korean-japanese-differences.html' },
    { title:'히라가나 활용 단어 ①②', file:'hiragana50.html' },
    { title:'가타카나 활용 단어 ①②', file:'katakana50.html' },
  ]},
  { id:'grammar', label:'문법', accent:'#8B3A62', topics:[
    { title:'동사 활용 총정리', file:'grammar-verb-conjugation.html' },
    { title:'て형 만들기 — 원리편', file:'grammar-te-form-basics.html' },
    { title:'て형 만들기 — 활용편', file:'te-form-groups.html' },
    { title:'ます형 만들기 — 원리편', file:'grammar-masu-form-basics.html' },
    { title:'ます형 만들기 — 활용편', file:'grammar-masu-form-usage.html' },
    { title:'가능형 만들기 — 원리편', file:'grammar-potential-basics.html' },
    { title:'가능형 만들기 — 활용편', file:'grammar-potential-usage.html' },
    { title:'사역형 만들기 — 원리편', file:'grammar-causative-basics.html' },
    { title:'사역형 만들기 — 활용편', file:'grammar-causative-usage.html' },
    { title:'수동형 만들기 — 원리편', file:'grammar-passive-basics.html' },
    { title:'수동형 만들기 — 활용편', file:'grammar-passive-usage.html' },
    { title:'한·일 차이 — 사역형과 수동형', file:'grammar-kr-jp-causative-passive.html' },
    { title:'조사 총정리', file:'grammar-particles.html' },
    { title:'조건·가정 표현', file:'grammar-conditionals.html' },
    { title:'「~만·~뿐·오직」 한정 표현', file:'grammar-only-expressions.html' },
    { title:'대표적인 い형용사', file:'grammar-i-adjectives.html' },
    { title:'대표적인 な형용사', file:'grammar-na-adjectives.html' },
  ]},
  { id:'vocab', label:'어휘·표현', accent:'#3C8C7B', topics:[
    { title:'숫자 읽기', file:'vocab-numbers.html' },
    { title:'날짜·요일 읽기', file:'vocab-dates-weekdays.html' },
    { title:'시간 말하기', file:'vocab-telling-time.html' },
    { title:'시간대 표현', file:'vocab-time-expressions.html' },
    { title:'날씨 용어', file:'vocab-weather.html' },
    { title:'조리 용어', file:'vocab-cooking.html' },
    { title:'방향 말하기', file:'vocab-directions.html' },
    { title:'방향·지시대명사 (こそあど)', file:'vocab-directions-demonstratives.html' },
    { title:'주요 오노마토페 ①', file:'vocab-onomatopoeia-01.html' },
    { title:'주요 오노마토페 ②', file:'vocab-onomatopoeia-02.html' },
    { title:'のんびり vs ゆったり', file:'vocab-nonbiri-yuttari.html' },
    { title:'面倒を見る vs 世話をする', file:'vocab-mendou-vs-sewa.html' },
  ]},
  { id:'dialogue', label:'회화', accent:'#D9A441', topics:[
    { title:'입국 과정 대화', file:'dialogue-immigration.html' },
    { title:'교통수단 이용 대화 ①', file:'dialogue-transport-01.html' },
    { title:'교통수단 이용 대화 ②', file:'dialogue-transport-02.html' },
    { title:'식당에서의 대화 ①', file:'dialogue-restaurant-01.html' },
    { title:'식당에서의 대화 ②', file:'dialogue-restaurant-02.html' },
  ]},
  { id:'culture', label:'문화', accent:'#6A4C93', topics:[
    { title:'일본 스모', file:'culture-sumo.html' },
  ]},
];

const cattabs = document.getElementById('cattabs');
const topicbar = document.getElementById('topicbar');
const frame = document.getElementById('frame');
const placeholder = document.getElementById('placeholder');

let currentCat = CATEGORIES[0];

function renderCatTabs(){
  cattabs.innerHTML = '';
  CATEGORIES.forEach(cat=>{
    const btn = document.createElement('button');
    btn.textContent = cat.label;
    if(cat.id === currentCat.id) btn.classList.add('active');
    btn.style.setProperty('--accent', cat.accent);
    if(cat.id === currentCat.id){ btn.style.background = cat.accent; btn.style.borderColor = cat.accent; }
    btn.onclick = () => { currentCat = cat; renderCatTabs(); renderTopics(); };
    cattabs.appendChild(btn);
  });
}

function showTopic(topic){
  if(!topic.file){
    frame.style.display = 'none';
    placeholder.style.display = 'flex';
    placeholder.innerHTML = `<div class="big">🚧</div><div><b>${topic.title}</b><br>아직 준비 중이에요. 곧 채워질 예정입니다!</div>`;
    return;
  }
  placeholder.style.display = 'none';
  frame.style.display = 'block';
  frame.src = topic.file;
}

function renderTopics(){
  topicbar.innerHTML = '';
  currentCat.topics.forEach(topic=>{
    const chip = document.createElement('div');
    chip.className = 'topic-chip' + (topic.file ? '' : ' disabled');
    chip.innerHTML = `${topic.title}` + (topic.file ? '' : `<span class="badge">준비중</span>`);
    chip.onclick = () => {
      [...topicbar.children].forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      showTopic(topic);
    };
    topicbar.appendChild(chip);
  });
  // 카테고리 전환 시 첫 항목 자동 표시하지 않고 안내 문구 유지
  frame.style.display = 'none';
  placeholder.style.display = 'flex';
  placeholder.innerHTML = `<div class="big">🇯🇵</div><div>위에서 주제를 선택하면<br>여기에 자료가 표시됩니다.</div>`;
}

renderCatTabs();
renderTopics();
</script>

</body>
</html>
