<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일본어 첫걸음 · 인포그래픽 시리즈</title>

<!-- ============================================================
  일본어 인포그래픽 자동 목록 index (절충형)
  · 페이지가 열릴 때 GitHub API로 이 폴더의 이미지 목록을 읽어
    파일명 접두어(basics/grammar/vocab/dialogue/culture)로
    자동 분류해 카드를 만듭니다 → 이미지만 업로드해도 즉시 반영
  · 한글 제목: 같은 폴더의 titles.json에서 읽습니다.
    등록 안 된 파일은 파일명에서 만든 영문 제목으로 임시 표시되고,
    titles.json에 한 줄 추가하면 한글 제목으로 바뀝니다
  · 새 카테고리 추가: 아래 CATEGORIES에 한 줄 추가
  · 저장소가 바뀌면 OWNER/REPO/FOLDER만 수정
============================================================ -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Serif+JP:wght@500;700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

<style>
:root{
  --paper:   #FBF8F1;
  --paper-2: #F3EEE2;
  --ink:     #2E2A24;
  --ink-soft:#6E6659;
  --line:    #DDD5C4;

  /* 카테고리별 액센트: 일본 전통색(伝統色) */
  --ai:       #2A5674;
  --suou:     #9E3D3F;
  --wakatake: #5E8C61;
  --yamabuki: #C08A2D;
  --fuji:     #7A6DA0;
  --nezumi:   #7D7468;  /* 鼠 — 미분류 자료용 */
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Noto Serif KR',serif;
  line-height:1.7;
  background-image:repeating-linear-gradient(
    to bottom, transparent 0 31px, rgba(93,80,60,.045) 31px 32px);
}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px 96px}

header{
  padding:72px 0 40px;
  border-bottom:3px double var(--line);
  display:flex;align-items:flex-end;justify-content:space-between;
  gap:24px;flex-wrap:wrap;
}
.site-eyebrow{
  font-family:'JetBrains Mono',monospace;
  font-size:12px;letter-spacing:.22em;color:var(--ink-soft);
  text-transform:uppercase;margin-bottom:14px;
}
h1{
  font-family:'Noto Serif JP','Noto Serif KR',serif;
  font-weight:900;font-size:clamp(30px,4.5vw,44px);line-height:1.25;
}
h1 .kr{
  display:block;font-family:'Noto Serif KR',serif;
  font-weight:600;font-size:.48em;color:var(--ink-soft);
  margin-top:8px;letter-spacing:.06em;
}
.site-note{
  max-width:300px;font-size:14px;color:var(--ink-soft);
  border-left:2px solid var(--line);padding-left:16px;
}

nav{
  display:flex;gap:10px;flex-wrap:wrap;
  padding:18px 0;border-bottom:1px solid var(--line);
  font-family:'JetBrains Mono',monospace;font-size:12.5px;
}
nav a{
  text-decoration:none;color:var(--ink);
  border:1px solid var(--line);border-radius:999px;
  padding:5px 14px;background:#fff;
}
nav a b{font-weight:600}
nav a:hover{border-color:var(--ink-soft)}

section{margin-top:56px}
.sec-head{
  display:flex;align-items:baseline;gap:14px;
  border-bottom:2px solid var(--accent);padding-bottom:10px;margin-bottom:24px;
}
.sec-head .no{
  font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;
  color:var(--accent);letter-spacing:.12em;
}
.sec-head h2{
  font-family:'Noto Serif JP','Noto Serif KR',serif;
  font-weight:700;font-size:24px;
}
.sec-head .count{
  margin-left:auto;font-family:'JetBrains Mono',monospace;
  font-size:12px;color:var(--ink-soft);
}

.grid{
  display:grid;gap:22px;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
}
.card{
  display:flex;flex-direction:column;
  background:#fff;border:1px solid var(--line);
  border-top:4px solid var(--accent);
  text-decoration:none;color:inherit;
  transition:transform .18s ease, box-shadow .18s ease;
}
.card:hover{
  transform:translateY(-4px);
  box-shadow:0 10px 24px rgba(46,42,36,.12);
}
.card:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.thumb{
  height:150px;overflow:hidden;background:var(--paper-2);
  border-bottom:1px solid var(--line);
}
.thumb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.body{padding:14px 16px 16px}
.title{font-weight:700;font-size:15.5px;line-height:1.45}
.sub{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;color:var(--ink-soft);margin-top:6px;
}

/* 로딩·오류 안내 */
#status{
  margin-top:56px;padding:28px;border:1px dashed var(--line);
  background:#fff;font-size:14.5px;color:var(--ink-soft);text-align:center;
}
#status.error{color:var(--suou);border-color:var(--suou)}

footer{
  margin-top:72px;padding-top:24px;border-top:3px double var(--line);
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
  font-size:13px;color:var(--ink-soft);
}
footer a{color:inherit}

@media (prefers-reduced-motion:reduce){
  .card{transition:none}
  .card:hover{transform:none}
}
@media (max-width:560px){
  header{padding-top:48px}
  .site-note{border-left:none;padding-left:0;max-width:none}
}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <p class="site-eyebrow">Japanese for Beginners · Infographic Series</p>
      <h1>
        はじめての日本語
        <span class="kr">일본어 첫걸음 — 한 장으로 정리하는 인포그래픽</span>
      </h1>
    </div>
    <p class="site-note">
      기초 구조부터 문법·어휘·회화·문화까지, 주제별 인포그래픽 모음입니다.
      카드를 누르면 고해상도 원본이 열립니다.
    </p>
  </header>

  <nav id="nav" aria-label="카테고리 바로가기"></nav>

  <div id="status">자료 목록을 불러오는 중입니다…</div>
  <div id="sections"></div>

  <footer>
    <span>© 2026 StatePark · 일본어 첫걸음 시리즈</span>
    <span>
  statepark62.github.io/japanese
  &nbsp;·&nbsp;
  <a href="https://cafe.naver.com/statepark62" target="_blank" rel="noopener">질문·소통: 네이버 카페</a>
</span>
  </footer>

</div>

<script>
/* ═════════ 설정 ═════════ */
const OWNER  = 'statepark62';
const REPO   = 'statepark62.github.io';
const FOLDER = 'japanese';

/* 카테고리 정의: [접두어, 한자 표제, 한글 이름, 액센트 색] — 표시 순서대로 */
const CATEGORIES = [
  ['basics',   '基礎', '기초·구조', 'var(--ai)'],
  ['grammar',  '文法', '문법',      'var(--suou)'],
  ['vocab',    '語彙', '어휘·표현', 'var(--wakatake)'],
  ['dialogue', '会話', '회화',      'var(--yamabuki)'],
  ['culture',  '文化', '문화',      'var(--fuji)'],
];
/* 접두어가 위에 없는 파일이 오면 자동으로 '기타'로 모임 */
const ETC = ['etc', 'その他', '기타', 'var(--nezumi)'];

const IMG_EXT = /\.(png|jpe?g|webp|gif|svg)$/i;

/* ═════════ 실행 ═════════ */
(async function () {
  const status = document.getElementById('status');
  try {
    /* 1) 폴더의 파일 목록 (GitHub API) + 한글 제목표 동시 요청 */
    const [listRes, titleRes] = await Promise.all([
      fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${FOLDER}`),
      fetch('titles.json', { cache: 'no-store' })
    ]);
    if (!listRes.ok) throw new Error('GitHub API ' + listRes.status);

    const files  = await listRes.json();
    const titles = titleRes.ok ? await titleRes.json() : {};

    /* 2) 이미지 파일만 추리기 */
    const images = files
      .filter(f => f.type === 'file' && IMG_EXT.test(f.name))
      .map(f => f.name)
      .sort((a, b) => a.localeCompare(b));

    if (images.length === 0) {
      status.textContent = '아직 등록된 자료가 없습니다.';
      return;
    }

    /* 3) 접두어로 분류 */
    const buckets = new Map(CATEGORIES.map(c => [c[0], []]));
    buckets.set(ETC[0], []);
    for (const name of images) {
      const prefix = name.split('-')[0].toLowerCase();
      (buckets.get(prefix) ?? buckets.get(ETC[0])).push(name);
    }

    /* 4) 섹션·카드·목차 렌더링 */
    const nav = document.getElementById('nav');
    const root = document.getElementById('sections');
    const defs = buckets.get(ETC[0]).length ? [...CATEGORIES, ETC] : CATEGORIES;

    for (const [key, kanji, korean, color] of defs) {
      const items = buckets.get(key);
      if (!items || items.length === 0) continue;

      /* 목차 버튼 */
      const a = document.createElement('a');
      a.href = '#' + key;
      a.innerHTML = `<b>${korean}</b> ${items.length}`;
      nav.appendChild(a);

      /* 섹션 */
      const sec = document.createElement('section');
      sec.id = key;
      sec.style.setProperty('--accent', color);
      sec.innerHTML = `
        <div class="sec-head">
          <span class="no">${kanji}</span><h2>${korean}</h2>
          <span class="count">${items.length}편</span>
        </div>`;
      const grid = document.createElement('div');
      grid.className = 'grid';

      for (const name of items) {
        const title = titles[name] ?? fallbackTitle(name);
        const card = document.createElement('a');
        card.className = 'card';
        card.href = encodeURIComponent(name);
        const img = document.createElement('img');
        img.src = encodeURIComponent(name);
        img.alt = title;
        img.loading = 'lazy';
        const thumb = document.createElement('div');
        thumb.className = 'thumb';
        thumb.appendChild(img);
        const body = document.createElement('div');
        body.className = 'body';
        const t = document.createElement('p');
        t.className = 'title';
        t.textContent = title;
        const s = document.createElement('p');
        s.className = 'sub';
        s.textContent = key;
        body.append(t, s);
        card.append(thumb, body);
        grid.appendChild(card);
      }
      sec.appendChild(grid);
      root.appendChild(sec);
    }

    status.remove();
  } catch (err) {
    console.error(err);
    status.className = 'error';
    status.textContent =
      '자료 목록을 불러오지 못했습니다. 잠시 후 새로고침해 주세요. ' +
      '(문제가 계속되면 GitHub API 접속 제한이 원인일 수 있습니다)';
  }
})();

/* titles.json에 없는 파일용 임시 제목: 접두어 떼고 단어 첫 글자 대문자 */
function fallbackTitle(name) {
  return name
    .replace(IMG_EXT, '')
    .split('-')
    .slice(1)
    .map(w => w.charAt(0).toUpperCase() + w.slice(1))
    .join(' ') || name;
}
</script>
</body>
</html>
