  <p><b>동사</b>: 사전형 / ます형(정중체) / て형(연결형). <b>형용사</b>: 사전형 / です형(정중체) / て형(연결형) — [い] [な] 배지로 종류를 구분했어요.</p>
  <p>한글 발음은 실제 발음과 100% 같지 않으니, 가능하면 원어민 음성도 함께 들으며 연습해보세요.</p>

    <div class="vbmain">
      <span class="num">${it.n}</span>
      <span class="jpword jp">${it.jp}</span>${it.furi ? `<span class="furigana">(${it.furi})</span>` : ''}
      <span class="romaji">${it.romaji}</span>
      <span class="kr">${it.kr}</span>
      <span class="mean">${it.mean}</span>
    </div>
    <div class="conj-grid">
      <div class="conj-chip"><div class="clabel">ます형</div><div class="cjp jp">${it.ms.jp}</div><div class="cromaji">${it.ms.romaji}</div><div class="ckr">${it.ms.kr}</div></div>
      <div class="conj-chip"><div class="clabel">て형</div><div class="cjp jp">${it.te.jp}</div><div class="cromaji">${it.te.romaji}</div><div class="ckr">${it.te.kr}</div></div>
    </div>
  `;
  return c;
}
function makeVbcardAdj(it){
  const c = document.createElement('div');
  c.className = 'vbcard';
  c.innerHTML = `
    <div class="vbmain">
      <span class="num">${it.n}</span>
      <span class="postag">${it.type}</span>
      <span class="jpword jp">${it.jp}</span>${it.furi ? `<span class="furigana">(${it.furi})</span>` : ''}
      <span class="romaji">${it.romaji}</span>
      <span class="kr">${it.kr}</span>
      <span class="mean">${it.mean}</span>
    </div>
    <div class="conj-grid">
      <div class="conj-chip"><div class="clabel">です형</div><div class="cjp jp">${it.ds.jp}</div><div class="cromaji">${it.ds.romaji}</div><div class="ckr">${it.ds.kr}</div></div>
      <div class="conj-chip"><div class="clabel">て형</div><div class="cjp jp">${it.te.jp}</div><div class="cromaji">${it.te.romaji}</div><div class="ckr">${it.te.kr}</div></div>
    </div>
  `;
  return c;
}
function makeVcardNoun(it){
  const c = document.createElement('div');
  c.className = 'vcard';
  c.innerHTML = `
    <div class="num">${it.n}</div>
    <div><span class="jpword jp">${it.jp}</span>${it.furi ? `<span class="furigana">(${it.furi})</span>` : ''}</div>
    <div class="romaji">${it.romaji}</div>
    <div class="kr">${it.kr}</div>
    <div class="mean">${it.mean}</div>
  `;
  return c;
}

function buildSection(id, accent, title, note){
  const section = document.createElement('section');
  section.className = 'blk';
  section.id = id;
  section.style.setProperty('--accent', accent);
  const head = document.createElement('div');
  head.className = 'blk-head';
  head.innerHTML = `<span class="title">${title}</span>`;
  section.appendChild(head);
  if(note){
    const n = document.createElement('div');
    n.className = 'blk-note';
    n.textContent = note;
    section.appendChild(n);
  }
  main.appendChild(section);
  return section;
}

const verbSection = buildSection('verbs', '#D9A441', '동사 50');
const verbList = document.createElement('div');
verbList.className = 'vblist';
VERBS.forEach(it => verbList.appendChild(makeVbcardVerb(it)));
verbSection.appendChild(verbList);

const adjSection = buildSection('adjectives', '#B85C8A', '형용사 50 (い형용사 · な형용사)',
  '[い] い형용사, [な] な형용사예요. な형용사는 명사를 꾸밀 때 어미에 「な」를 붙여요.');
const adjList = document.createElement('div');
adjList.className = 'vblist';
ADJECTIVES.forEach(it => adjList.appendChild(makeVbcardAdj(it)));
adjSection.appendChild(adjList);

const nounSection = buildSection('nouns', '#3B6EA5', '명사 50');
const nounGrid = document.createElement('div');
nounGrid.className = 'grid';
NOUNS.forEach(it => nounGrid.appendChild(makeVcardNoun(it)));
nounSection.appendChild(nounGrid);
</script>
