<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>가타카나 50음 한눈에 보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#26241F;
    --sub:#6b6558;
    --paper:#FBF8F2;
    --card:#ffffff;
    --line:#E7E1D3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .kana{
    font-family:'Noto Serif JP', serif;
  }

  header{
    padding:44px 20px 28px;
    text-align:center;
    border-bottom:1px solid var(--line);
    background:
      radial-gradient(circle at 15% 20%, rgba(59,110,165,0.08), transparent 40%),
      radial-gradient(circle at 85% 30%, rgba(228,87,46,0.08), transparent 40%);
  }
  header h1{
    margin:0;
    font-size:clamp(26px,6vw,38px);
    font-weight:900;
    letter-spacing:-0.02em;
  }
  header .jp-hero{
    font-family:'Noto Serif JP', serif;
    font-size:clamp(15px,4vw,19px);
    color:var(--sub);
    margin-top:10px;
  }
  header p.desc{
    margin:14px auto 0;
    max-width:520px;
    color:var(--sub);
    font-size:14.5px;
  }

  nav.rownav{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(251,248,242,0.96);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
    padding:10px 12px;
    display:flex;
    justify-content:center;
    gap:8px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  nav.rownav::-webkit-scrollbar{display:none;}
  nav.rownav a{
    flex:0 0 auto;
    text-decoration:none;
    font-size:13px;
    font-weight:700;
    color:var(--ink);
    background:var(--card);
    border:1.5px solid var(--line);
    padding:7px 13px;
    border-radius:999px;
    white-space:nowrap;
  }

  main{max-width:960px;margin:0 auto;padding:6px 14px 60px;}

  section.gyou{
    margin-top:34px;
    scroll-margin-top:64px;
  }
  section.gyou .gyou-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    padding:0 2px 12px;
    border-bottom:3px solid var(--accent);
  }
  section.gyou .gyou-head .jp{
    font-family:'Noto Serif JP', serif;
    font-size:26px;
    font-weight:700;
    color:var(--accent);
  }
  section.gyou .gyou-head .ko{
    font-size:14px;
    color:var(--sub);
    font-weight:500;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:14px;
  }
  @media(min-width:520px){
    .grid{grid-template-columns:repeat(3,1fr);}
  }
  @media(min-width:760px){
    .grid{grid-template-columns:repeat(5,1fr);}
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-left:4px solid var(--accent);
    border-radius:10px;
    padding:12px 12px 13px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .card .top{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .card .char{
    font-family:'Noto Serif JP', serif;
    font-size:32px;
    font-weight:700;
    line-height:1;
  }
  .card .roma{
    font-size:12px;
    color:var(--sub);
    font-weight:500;
  }
  .card .word{
    font-size:12.5px;
    border-top:1px dashed var(--line);
    padding-top:8px;
    display:flex;
    align-items:flex-start;
    gap:8px;
  }
  .card .word:first-of-type{border-top:none;padding-top:0;}
  .card .word .icon{
    font-size:22px;
    line-height:1.3;
    flex:0 0 auto;
  }
  .card .word .word-text{
    flex:1 1 auto;
    min-width:0;
  }
  .card .word .jp{
    font-family:'Noto Serif JP', serif;
    font-weight:500;
    color:var(--ink);
  }
  .card .word .mean{
    color:var(--sub);
  }
  .card .word .mean::before{content:'(';}
  .card .word .mean::after{content:')';}
  .card.empty{
    visibility:hidden;
  }
  .card .word-only-note{
    font-size:12px;
    color:var(--sub);
    line-height:1.5;
    padding-top:4px;
  }

  footer{
    max-width:960px;
    margin:10px auto 50px;
    padding:22px 20px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
  }
  footer h2{
    font-size:16px;
    margin:0 0 12px;
  }
  footer ol{
    margin:0;
    padding-left:20px;
    font-size:13.5px;
    color:var(--sub);
  }
  footer li{margin-bottom:6px;}
  footer .tip{
    margin-top:14px;
    font-size:13px;
    background:#EAF1FB;
    border:1px solid #C9DBF2;
    border-radius:8px;
    padding:10px 12px;
    color:#3B5E85;
  }
</style>
</head>
<body>

<header>
  <div class="jp-hero">カタカナ 50音 の はじめのことば</div>
  <h1>가타카나 50음 한눈에 보기</h1>
  <p class="desc">가타카나는 외래어나 세련된 표현에 자주 쓰여요. 각 글자마다 자주 쓰는 단어 두 개와 뜻을 함께 정리했습니다.</p>
</header>

<nav class="rownav" id="rownav"></nav>

<main id="main"></main>

<footer>
  <h2>이렇게 익혀보세요</h2>
  <ol>
    <li>가타카나 한 글자(ア・イ・ウ・エ・オ 등)를 소리 내어 읽어요.</li>
    <li>그 글자로 시작하는 단어를 소리 내어 읽어요.</li>
    <li>뜻을 생각하며 한 번 더 말해봐요.</li>
    <li>그림 없이도 스스로 떠올려 말해보면 완성!</li>
  </ol>
  <div class="tip">💡 가타카나는 외래어 표기에 많이 쓰여요. 영어 발음과 비교하며 외우면 더 쉽게 익힐 수 있어요.</div>
</footer>

<script>
const ROWS = [
  { id:'a', accent:'#3B6EA5', jp:'ア行', ko:'아행',
    chars:[
      {ch:'ア', r:'a', w1:{jp:'アイス', mean:'아이스크림', icon:'🍦'}, w2:{jp:'アニメ', mean:'애니메이션', icon:'📺'}},
      {ch:'イ', r:'i', w1:{jp:'インターネット', mean:'인터넷', icon:'🌐'}, w2:{jp:'イタリア', mean:'이탈리아', icon:'🇮🇹'}},
      {ch:'ウ', r:'u', w1:{jp:'ウォーター', mean:'워터(물)', icon:'💧'}, w2:{jp:'ウインナー', mean:'소시지', icon:'🌭'}},
      {ch:'エ', r:'e', w1:{jp:'エレベーター', mean:'엘리베이터', icon:'🛗'}, w2:{jp:'エアコン', mean:'에어컨', icon:'❄️'}},
      {ch:'オ', r:'o', w1:{jp:'オレンジ', mean:'오렌지', icon:'🍊'}, w2:{jp:'オムレツ', mean:'오믈렛', icon:'🍳'}},
    ]},
  { id:'ka', accent:'#E4572E', jp:'カ行', ko:'카행',
    chars:[
      {ch:'カ', r:'ka', w1:{jp:'カメラ', mean:'카메라', icon:'📷'}, w2:{jp:'カレー', mean:'카레', icon:'🍛'}},
      {ch:'キ', r:'ki', w1:{jp:'キーボード', mean:'키보드', icon:'⌨️'}, w2:{jp:'キーホルダー', mean:'키홀더', icon:'🔑'}},
      {ch:'ク', r:'ku', w1:{jp:'クッキー', mean:'쿠키', icon:'🍪'}, w2:{jp:'クレヨン', mean:'크레용', icon:'🖍️'}},
      {ch:'ケ', r:'ke', w1:{jp:'ケーキ', mean:'케이크', icon:'🍰'}, w2:{jp:'ケチャップ', mean:'케첩', icon:'🍅'}},
      {ch:'コ', r:'ko', w1:{jp:'コーヒー', mean:'커피', icon:'☕'}, w2:{jp:'コアラ', mean:'코알라', icon:'🐻'}},
    ]},
  { id:'sa', accent:'#8A9A5B', jp:'サ行', ko:'사행',
    chars:[
      {ch:'サ', r:'sa', w1:{jp:'サラダ', mean:'샐러드', icon:'🥗'}, w2:{jp:'サングラス', mean:'선글라스', icon:'🕶️'}},
      {ch:'シ', r:'shi', w1:{jp:'シャツ', mean:'셔츠', icon:'👕'}, w2:{jp:'シャンプー', mean:'샴푸', icon:'🧴'}},
      {ch:'ス', r:'su', w1:{jp:'スポーツ', mean:'스포츠', icon:'⚽'}, w2:{jp:'スキー', mean:'스키', icon:'🎿'}},
      {ch:'セ', r:'se', w1:{jp:'セルフサービス', mean:'셀프서비스', icon:'🛎️'}, w2:{jp:'セーター', mean:'스웨터', icon:'🧶'}},
      {ch:'ソ', r:'so', w1:{jp:'ソフトクリーム', mean:'소프트아이스크림', icon:'🍦'}, w2:{jp:'ソファ', mean:'소파', icon:'🛋️'}},
    ]},
  { id:'ta', accent:'#3C8C7B', jp:'タ行', ko:'타행',
    chars:[
      {ch:'タ', r:'ta', w1:{jp:'タクシー', mean:'택시', icon:'🚕'}, w2:{jp:'タオル', mean:'수건', icon:'🛁'}},
      {ch:'チ', r:'chi', w1:{jp:'チーズ', mean:'치즈', icon:'🧀'}, w2:{jp:'チョコレート', mean:'초콜릿', icon:'🍫'}},
      {ch:'ツ', r:'tsu', w1:{jp:'ツアー', mean:'투어', icon:'✈️'}, w2:{jp:'ツナ', mean:'참치', icon:'🐟'}},
      {ch:'テ', r:'te', w1:{jp:'テレビ', mean:'텔레비전', icon:'📺'}, w2:{jp:'テーブル', mean:'테이블', icon:'🍽️'}},
      {ch:'ト', r:'to', w1:{jp:'トマト', mean:'토마토', icon:'🍅'}, w2:{jp:'トースト', mean:'토스트', icon:'🍞'}},
    ]},
  { id:'na', accent:'#6A5ACD', jp:'ナ行', ko:'나행',
    chars:[
      {ch:'ナ', r:'na', w1:{jp:'ナビ', mean:'내비게이션', icon:'🧭'}, w2:{jp:'ナイフ', mean:'나이프', icon:'🔪'}},
      {ch:'ニ', r:'ni', w1:{jp:'ニュース', mean:'뉴스', icon:'📰'}, w2:{jp:'ニット', mean:'니트', icon:'🧶'}},
      {ch:'ヌ', r:'nu', w1:{jp:'ヌードル', mean:'누들(면 요리)', icon:'🍜'}, w2:{jp:'ヌガー', mean:'누가(사탕류)', icon:'🍬'}},
      {ch:'ネ', r:'ne', w1:{jp:'ネイル', mean:'네일', icon:'💅'}, w2:{jp:'ネクタイ', mean:'넥타이', icon:'👔'}},
      {ch:'ノ', r:'no', w1:{jp:'ノート', mean:'노트', icon:'📓'}, w2:{jp:'ノック', mean:'노크', icon:'🚪'}},
    ]},
  { id:'ha', accent:'#B85C8A', jp:'ハ行', ko:'하행',
    chars:[
      {ch:'ハ', r:'ha', w1:{jp:'ハンバーガー', mean:'햄버거', icon:'🍔'}, w2:{jp:'ハム', mean:'햄', icon:'🍖'}},
      {ch:'ヒ', r:'hi', w1:{jp:'ヒーター', mean:'히터', icon:'🔥'}, w2:{jp:'ヒント', mean:'힌트', icon:'💡'}},
      {ch:'フ', r:'fu', w1:{jp:'ファックス', mean:'팩스', icon:'📠'}, w2:{jp:'ファイル', mean:'파일', icon:'📁'}},
      {ch:'ヘ', r:'he', w1:{jp:'ヘッドホン', mean:'헤드폰', icon:'🎧'}, w2:{jp:'ヘリコプター', mean:'헬리콥터', icon:'🚁'}},
      {ch:'ホ', r:'ho', w1:{jp:'ホテル', mean:'호텔', icon:'🏨'}, w2:{jp:'ホッチキス', mean:'스테이플러', icon:'📎'}},
    ]},
  { id:'ma', accent:'#C1666B', jp:'マ行', ko:'마행',
    chars:[
      {ch:'マ', r:'ma', w1:{jp:'マンガ', mean:'만화', icon:'📚'}, w2:{jp:'マイク', mean:'마이크', icon:'🎤'}},
      {ch:'ミ', r:'mi', w1:{jp:'ミルク', mean:'우유', icon:'🥛'}, w2:{jp:'ミラー', mean:'거울', icon:'🪞'}},
      {ch:'ム', r:'mu', w1:{jp:'ムービー', mean:'무비(영화)', icon:'🎬'}, w2:{jp:'ムード', mean:'분위기', icon:'🕯️'}},
      {ch:'メ', r:'me', w1:{jp:'メール', mean:'메일', icon:'📧'}, w2:{jp:'メニュー', mean:'메뉴', icon:'📋'}},
      {ch:'モ', r:'mo', w1:{jp:'モバイル', mean:'모바일(휴대폰)', icon:'📱'}, w2:{jp:'モデル', mean:'모델', icon:'💃'}},
    ]},
  { id:'ya', accent:'#4E7C59', jp:'ヤ行', ko:'야행',
    chars:[
      {ch:'ヤ', r:'ya', w1:{jp:'ヤード', mean:'야드(길이 단위)', icon:'📏'}, w2:{jp:'ヤクルト', mean:'야쿠르트', icon:'🥤'}},
      null,
      {ch:'ユ', r:'yu', w1:{jp:'ユニフォーム', mean:'유니폼', icon:'👕'}, w2:{jp:'ユーモア', mean:'유머', icon:'😄'}},
      null,
      {ch:'ヨ', r:'yo', w1:{jp:'ヨット', mean:'요트', icon:'⛵'}, w2:{jp:'ヨガ', mean:'요가', icon:'🧘'}},
    ]},
  { id:'ra', accent:'#D9A441', jp:'ラ行', ko:'라행',
    chars:[
      {ch:'ラ', r:'ra', w1:{jp:'ラジオ', mean:'라디오', icon:'📻'}, w2:{jp:'ラーメン', mean:'라면', icon:'🍜'}},
      {ch:'リ', r:'ri', w1:{jp:'リモコン', mean:'리모컨', icon:'🎛️'}, w2:{jp:'リボン', mean:'리본', icon:'🎀'}},
      {ch:'ル', r:'ru', w1:{jp:'ルール', mean:'규칙', icon:'📏'}, w2:{jp:'ルビー', mean:'루비', icon:'💎'}},
      {ch:'レ', r:'re', w1:{jp:'レストラン', mean:'레스토랑', icon:'🍽️'}, w2:{jp:'レモン', mean:'레몬', icon:'🍋'}},
      {ch:'ロ', r:'ro', w1:{jp:'ロケット', mean:'로켓', icon:'🚀'}, w2:{jp:'ロビー', mean:'로비', icon:'🛋️'}},
    ]},
  { id:'wa', accent:'#7A5230', jp:'ワ行', ko:'와행',
    chars:[
      {ch:'ワ', r:'wa', w1:{jp:'ワイン', mean:'와인', icon:'🍷'}, w2:{jp:'ワッフル', mean:'와플', icon:'🧇'}},
      null,
      null,
      null,
      {ch:'ヲ', r:'wo', note:'ヲ는 현대 가타카나에서 거의 쓰이지 않는 글자예요. 단어의 첫 글자로 등장하는 경우는 사실상 없어요.'},
    ]},
  { id:'n', accent:'#5B5A57', jp:'ン', ko:'받침 ン',
    chars:[
      {ch:'ン', r:'n', note:'ン은 단어의 첫 글자로는 쓰이지 않는 소리예요. 되물을 때 내는 소리 "ン？(응?)" 정도로만 쓰여요.'},
      null, null, null, null
    ]},
];

const nav = document.getElementById('rownav');
const main = document.getElementById('main');

ROWS.forEach(row=>{
  const a = document.createElement('a');
  a.href = '#'+row.id;
  a.textContent = row.jp;
  nav.appendChild(a);

  const section = document.createElement('section');
  section.className = 'gyou';
  section.id = row.id;
  section.style.setProperty('--accent', row.accent);

  const head = document.createElement('div');
  head.className = 'gyou-head';
  head.innerHTML = `<span class="jp">${row.jp}</span><span class="ko">${row.ko}</span>`;
  section.appendChild(head);

  const grid = document.createElement('div');
  grid.className = 'grid';

  row.chars.forEach(c=>{
    const card = document.createElement('div');
    if(!c){
      card.className = 'card empty';
      grid.appendChild(card);
      return;
    }
    card.className = 'card';
    if(!c.w1){
      card.innerHTML = `
        <div class="top">
          <span class="char">${c.ch}</span>
          <span class="roma">${c.r}</span>
        </div>
        <div class="word-only-note">${c.note}</div>
      `;
      grid.appendChild(card);
      return;
    }
    card.innerHTML = `
      <div class="top">
        <span class="char">${c.ch}</span>
        <span class="roma">${c.r}</span>
      </div>
      <div class="word">
        <span class="icon">${c.w1.icon}</span>
        <div class="word-text">
          <span class="jp">${c.w1.jp}</span> <span class="mean">${c.w1.mean}</span>
        </div>
      </div>
      <div class="word">
        <span class="icon">${c.w2.icon}</span>
        <div class="word-text">
          <span class="jp">${c.w2.jp}</span> <span class="mean">${c.w2.mean}</span>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });

  section.appendChild(grid);
  main.appendChild(section);
});
</script>

</body>
</html>
