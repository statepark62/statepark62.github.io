<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>히라가나 50음 한눈에 보기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#26241F;
    --sub:#6b6558;
    --paper:#FBF8F2;
    --card:#ffffff;
    --line:#E7E1D3;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR', sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .kana{
    font-family:'Noto Serif JP', serif;
  }

  /* Header */
  header{
    padding:44px 20px 28px;
    text-align:center;
    border-bottom:1px solid var(--line);
    background:
      radial-gradient(circle at 15% 20%, rgba(228,87,46,0.08), transparent 40%),
      radial-gradient(circle at 85% 30%, rgba(59,110,165,0.08), transparent 40%);
  }
  header h1{
    margin:0;
    font-size:clamp(26px,6vw,38px);
    font-weight:900;
    letter-spacing:-0.02em;
  }
  header .jp-hero{
    font-family:'Noto Serif JP', serif;
    font-size:clamp(15px,4vw,19px);
    color:var(--sub);
    margin-top:10px;
  }
  header p.desc{
    margin:14px auto 0;
    max-width:520px;
    color:var(--sub);
    font-size:14.5px;
  }

  /* Sticky quick nav */
  nav.rownav{
    position:sticky;
    top:0;
    z-index:20;
    background:rgba(251,248,242,0.96);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line);
    padding:10px 12px;
    display:flex;
    justify-content:center;
    gap:8px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  nav.rownav::-webkit-scrollbar{display:none;}
  nav.rownav a{
    flex:0 0 auto;
    text-decoration:none;
    font-size:13px;
    font-weight:700;
    color:var(--ink);
    background:var(--card);
    border:1.5px solid var(--line);
    padding:7px 13px;
    border-radius:999px;
    white-space:nowrap;
  }

  main{max-width:960px;margin:0 auto;padding:6px 14px 60px;}

  section.gyou{
    margin-top:34px;
    scroll-margin-top:64px;
  }
  section.gyou .gyou-head{
    display:flex;
    align-items:baseline;
    gap:10px;
    padding:0 2px 12px;
    border-bottom:3px solid var(--accent);
  }
  section.gyou .gyou-head .jp{
    font-family:'Noto Serif JP', serif;
    font-size:26px;
    font-weight:700;
    color:var(--accent);
  }
  section.gyou .gyou-head .ko{
    font-size:14px;
    color:var(--sub);
    font-weight:500;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    margin-top:14px;
  }
  @media(min-width:520px){
    .grid{grid-template-columns:repeat(3,1fr);}
  }
  @media(min-width:760px){
    .grid{grid-template-columns:repeat(5,1fr);}
  }

  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-left:4px solid var(--accent);
    border-radius:10px;
    padding:12px 12px 13px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .card .top{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .card .char{
    font-family:'Noto Serif JP', serif;
    font-size:32px;
    font-weight:700;
    line-height:1;
  }
  .card .roma{
    font-size:12px;
    color:var(--sub);
    font-weight:500;
  }
  .card .word{
    font-size:12.5px;
    border-top:1px dashed var(--line);
    padding-top:8px;
    display:flex;
    align-items:flex-start;
    gap:8px;
  }
  .card .word:first-of-type{border-top:none;padding-top:0;}
  .card .word .icon{
    font-size:22px;
    line-height:1.3;
    flex:0 0 auto;
  }
  .card .word .word-text{
    flex:1 1 auto;
    min-width:0;
  }
  .card .word .jp{
    font-family:'Noto Serif JP', serif;
    font-weight:500;
    color:var(--ink);
  }
  .card .word .mean{
    color:var(--sub);
  }
  .card.empty{
    visibility:hidden;
  }
  .card .note{
    font-size:10.5px;
    color:#a99b78;
    margin-top:-2px;
  }
  .card .word-only-note{
    font-size:12px;
    color:var(--sub);
    line-height:1.5;
    padding-top:4px;
  }

  footer{
    max-width:960px;
    margin:10px auto 50px;
    padding:22px 20px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:14px;
  }
  footer h2{
    font-size:16px;
    margin:0 0 12px;
  }
  footer ol{
    margin:0;
    padding-left:20px;
    font-size:13.5px;
    color:var(--sub);
  }
  footer li{margin-bottom:6px;}
  footer .tip{
    margin-top:14px;
    font-size:13px;
    background:#FFF6E9;
    border:1px solid #F0DEB8;
    border-radius:8px;
    padding:10px 12px;
    color:#7a6a3a;
  }
</style>
</head>
<body>

<header>
  <div class="jp-hero">ひらがな 50音 の はじめのことば</div>
  <h1>히라가나 50음 한눈에 보기</h1>
  <p class="desc">각 글자마다 예시 단어 두 개와 뜻을 함께 정리했습니다. 그림카드를 눈으로 훑듯, 소리 내어 읽으며 익혀보세요.</p>
</header>

<nav class="rownav" id="rownav"></nav>

<main id="main"></main>

<footer>
  <h2>이렇게 익혀보세요</h2>
  <ol>
    <li>히라가나 한 글자(あ・い・う・え・お 등)를 소리 내어 읽어요.</li>
    <li>그 글자로 시작하는 단어를 소리 내어 읽어요.</li>
    <li>뜻을 떠올리며 한 번 더 말해봐요.</li>
    <li>그림 없이도 스스로 떠올려 말해보면 완성!</li>
  </ol>
  <div class="tip">💡 매일 한두 행(行)씩만 반복해도 50음을 자연스럽게 외울 수 있어요.</div>
</footer>

<script>
const ROWS = [
  { id:'a', accent:'#E4572E', jp:'あ行', ko:'아행',
    chars:[
      {ch:'あ', r:'a', w1:{jp:'あさ', mean:'아침 (朝)', icon:'🌅'}, w2:{jp:'あめ', read:'아메', mean:'비', icon:'🌧️'}},
      {ch:'い', r:'i', w1:{jp:'いす', mean:'의자 (椅子)', icon:'🪑'}, w2:{jp:'いえ', read:'이에', mean:'집', icon:'🏠'}},
      {ch:'う', r:'u', w1:{jp:'うみ', mean:'바다 (海)', icon:'🌊'}, w2:{jp:'うえ', read:'우에', mean:'위', icon:'⬆️'}},
      {ch:'え', r:'e', w1:{jp:'えんぴつ', mean:'연필 (鉛筆)', icon:'✏️'}, w2:{jp:'えいが', read:'에이가', mean:'영화', icon:'🎬'}},
      {ch:'お', r:'o', w1:{jp:'おにぎり', mean:'주먹밥', icon:'🍙'}, w2:{jp:'おでん', read:'오뎅', mean:'오뎅', icon:'🍢'}},
    ]},
  { id:'ka', accent:'#D9A441', jp:'か行', ko:'카행',
    chars:[
      {ch:'か', r:'ka', w1:{jp:'かばん', mean:'가방', icon:'🎒'}, w2:{jp:'かさ', read:'카사', mean:'우산', icon:'☂️'}},
      {ch:'き', r:'ki', w1:{jp:'きのこ', mean:'버섯', icon:'🍄'}, w2:{jp:'きく', read:'키쿠', mean:'국화', icon:'🌼'}},
      {ch:'く', r:'ku', w1:{jp:'くつ', mean:'신발 (靴)', icon:'👟'}, w2:{jp:'くも', read:'쿠모', mean:'구름', icon:'☁️'}},
      {ch:'け', r:'ke', w1:{jp:'ケーキ', mean:'케이크', icon:'🍰'}, w2:{jp:'けしき', read:'케시키', mean:'경치', icon:'🏞️'}},
      {ch:'こ', r:'ko', w1:{jp:'こいぬ', mean:'강아지 (子犬)', icon:'🐶'}, w2:{jp:'こえ', read:'코에', mean:'목소리', icon:'🗣️'}},
    ]},
  { id:'sa', accent:'#8A9A5B', jp:'さ行', ko:'사행',
    chars:[
      {ch:'さ', r:'sa', w1:{jp:'さくら', mean:'벚꽃 (桜)', icon:'🌸'}, w2:{jp:'さかな', read:'사카나', mean:'물고기', icon:'🐟'}},
      {ch:'し', r:'shi', w1:{jp:'しんぶん', mean:'신문 (新聞)', icon:'📰'}, w2:{jp:'しお', read:'시오', mean:'소금', icon:'🧂'}},
      {ch:'す', r:'su', w1:{jp:'スイカ', mean:'수박', icon:'🍉'}, w2:{jp:'すし', read:'스시', mean:'초밥', icon:'🍣'}},
      {ch:'せ', r:'se', w1:{jp:'せんせい', mean:'선생님 (先生)', icon:'🧑‍🏫'}, w2:{jp:'せかい', read:'세카이', mean:'세계', icon:'🌍'}},
      {ch:'そ', r:'so', w1:{jp:'そば', mean:'메밀국수', icon:'🍜'}, w2:{jp:'そら', read:'소라', mean:'하늘', icon:'🌤️'}},
    ]},
  { id:'ta', accent:'#3C8C7B', jp:'た行', ko:'타행',
    chars:[
      {ch:'た', r:'ta', w1:{jp:'タコ', mean:'문어', icon:'🐙'}, w2:{jp:'たまご', read:'타마고', mean:'달걀', icon:'🥚'}},
      {ch:'ち', r:'chi', w1:{jp:'ちず', mean:'지도 (地図)', icon:'🗺️'}, w2:{jp:'ちず', read:'치즈', mean:'지도(같은 단어)', icon:'🗺️'}},
      {ch:'つ', r:'tsu', w1:{jp:'つみき', mean:'쌓기 나무 (積み木)', icon:'🧱'}, w2:{jp:'つき', read:'츠키', mean:'달', icon:'🌙'}},
      {ch:'て', r:'te', w1:{jp:'てぶくろ', mean:'장갑 (手袋)', icon:'🧤'}, w2:{jp:'てがみ', read:'테가미', mean:'편지', icon:'✉️'}},
      {ch:'と', r:'to', w1:{jp:'とり', mean:'새 (鳥)', icon:'🐦'}, w2:{jp:'とけい', read:'토케이', mean:'시계', icon:'⏰'}},
    ]},
  { id:'na', accent:'#3B6EA5', jp:'な行', ko:'나행',
    chars:[
      {ch:'な', r:'na', w1:{jp:'なす', mean:'가지 (茄子)', icon:'🍆'}, w2:{jp:'なつ', read:'나츠', mean:'여름', icon:'☀️'}},
      {ch:'に', r:'ni', w1:{jp:'にんじん', mean:'당근 (人参)', icon:'🥕'}, w2:{jp:'にく', read:'니쿠', mean:'고기', icon:'🥩'}},
      {ch:'ぬ', r:'nu', w1:{jp:'ぬいぐるみ', mean:'봉제 인형', icon:'🧸'}, w2:{jp:'ぬの', read:'누노', mean:'천', icon:'🧵'}},
      {ch:'ね', r:'ne', w1:{jp:'ねこ', mean:'고양이 (猫)', icon:'🐱'}, w2:{jp:'ねこ', read:'네코', mean:'고양이(같은 단어)', icon:'🐱'}},
      {ch:'の', r:'no', w1:{jp:'のり', mean:'김 (海苔)', icon:'🍙'}, w2:{jp:'のみもの', read:'노미모노', mean:'음료', icon:'🥤'}},
    ]},
  { id:'ha', accent:'#6A5ACD', jp:'は行', ko:'하행',
    chars:[
      {ch:'は', r:'ha', w1:{jp:'はさみ', mean:'가위', icon:'✂️'}, w2:{jp:'はな', read:'하나', mean:'꽃', icon:'🌺'}},
      {ch:'ひ', r:'hi', w1:{jp:'ひまわり', mean:'해바라기', icon:'🌻'}, w2:{jp:'ひこうき', read:'히코-키', mean:'비행기', icon:'✈️'}},
      {ch:'ふ', r:'fu', w1:{jp:'ふうせん', mean:'풍선 (風船)', icon:'🎈'}, w2:{jp:'ふね', read:'후네', mean:'배', icon:'🚢'}},
      {ch:'へ', r:'he', w1:{jp:'へび', mean:'뱀 (蛇)', icon:'🐍'}, w2:{jp:'へや', read:'헤야', mean:'방', icon:'🚪'}},
      {ch:'ほ', r:'ho', w1:{jp:'ほんだな', mean:'책장 (本棚)', icon:'📚'}, w2:{jp:'ほん', read:'혼', mean:'책', icon:'📖'}},
    ]},
  { id:'ma', accent:'#B85C8A', jp:'ま行', ko:'마행',
    chars:[
      {ch:'ま', r:'ma', w1:{jp:'まつり', mean:'축제 (祭り)', icon:'🎏'}, w2:{jp:'まど', read:'마도', mean:'창문', icon:'🪟'}},
      {ch:'み', r:'mi', w1:{jp:'みかん', mean:'귤', icon:'🍊'}, w2:{jp:'みず', read:'미즈', mean:'물', icon:'💧'}},
      {ch:'む', r:'mu', w1:{jp:'むぎちゃ', mean:'보리차 (麦茶)', icon:'🍵'}, w2:{jp:'むし', read:'무시', mean:'벌레', icon:'🐛'}},
      {ch:'め', r:'me', w1:{jp:'めがみ', mean:'여신 (女神)', icon:'👸'}, w2:{jp:'めがね', read:'메가네', mean:'안경', icon:'👓'}},
      {ch:'も', r:'mo', w1:{jp:'もも', mean:'복숭아 (桃)', icon:'🍑'}, w2:{jp:'もり', read:'모리', mean:'숲', icon:'🌲'}},
    ]},
  { id:'ya', accent:'#C1666B', jp:'や行', ko:'야행',
    chars:[
      {ch:'や', r:'ya', w1:{jp:'やさい', mean:'채소 (野菜)', icon:'🥬'}, w2:{jp:'やま', read:'야마', mean:'산', icon:'⛰️'}},
      null,
      {ch:'ゆ', r:'yu', w1:{jp:'ゆきだるま', mean:'눈사람', icon:'⛄'}, w2:{jp:'ゆき', read:'유키', mean:'눈(雪)', icon:'❄️'}},
      null,
      {ch:'よ', r:'yo', w1:{jp:'ようふく', mean:'옷/양복 (洋服)', icon:'👔'}, w2:{jp:'よる', read:'요루', mean:'밤', icon:'🌃'}},
    ]},
  { id:'ra', accent:'#4E7C59', jp:'ら行', ko:'라행',
    chars:[
      {ch:'ら', r:'ra', w1:{jp:'ラーメン', mean:'라멘', icon:'🍥'}, w2:{jp:'らいおん', read:'라이온', mean:'사자', icon:'🦁'}},
      {ch:'り', r:'ri', w1:{jp:'じてんしゃ', mean:'자전거 (自転車)', icon:'🚲'}, w2:{jp:'りんご', read:'링고', mean:'사과', icon:'🍎'}},
      {ch:'る', r:'ru', w1:{jp:'るすばん', mean:'집 보기 (留守番)', icon:'🏠'}, w2:{jp:'るす', read:'루스', mean:'부재중', icon:'🚫'}},
      {ch:'れ', r:'re', w1:{jp:'レモン', mean:'레몬', icon:'🍋'}, w2:{jp:'れいぞうこ', read:'레이조-코', mean:'냉장고', icon:'🧊'}},
      {ch:'ろ', r:'ro', w1:{jp:'ろうそく', mean:'양초', icon:'🕯️'}, w2:{jp:'ろうそく', read:'로-소쿠', mean:'양초(같은 단어)', icon:'🕯️'}},
    ]},
  { id:'wa', accent:'#7A5230', jp:'わ行', ko:'와행',
    chars:[
      {ch:'わ', r:'wa', w1:{jp:'わたし', mean:'나 (私)', icon:'🙋'}, w2:{jp:'わに', read:'와니', mean:'악어', icon:'🐊'}},
      null,
      null,
      null,
      {ch:'を', r:'wo', note:'を는 단어의 첫 글자로는 거의 쓰이지 않고, 목적격 조사(~을/를)로만 사용돼요.'},
    ]},
  { id:'n', accent:'#5B5A57', jp:'ん', ko:'받침 ん',
    chars:[
      {ch:'ん', r:'n', w1:{jp:'んー', mean:'음~ (고민할 때)', icon:'🤔'}, w2:{jp:'ん？', read:'응?', mean:'응? / 음?', icon:'❓'}},
      null, null, null, null
    ]},
];

const nav = document.getElementById('rownav');
const main = document.getElementById('main');

ROWS.forEach(row=>{
  const a = document.createElement('a');
  a.href = '#'+row.id;
  a.textContent = row.jp;
  nav.appendChild(a);

  const section = document.createElement('section');
  section.className = 'gyou';
  section.id = row.id;
  section.style.setProperty('--accent', row.accent);

  const head = document.createElement('div');
  head.className = 'gyou-head';
  head.innerHTML = `<span class="jp">${row.jp}</span><span class="ko">${row.ko}</span>`;
  section.appendChild(head);

  const grid = document.createElement('div');
  grid.className = 'grid';

  row.chars.forEach(c=>{
    const card = document.createElement('div');
    if(!c){
      card.className = 'card empty';
      grid.appendChild(card);
      return;
    }
    card.className = 'card';
    if(!c.w1){
      card.innerHTML = `
        <div class="top">
          <span class="char">${c.ch}</span>
          <span class="roma">${c.r}</span>
        </div>
        <div class="word-only-note">${c.note}</div>
      `;
      grid.appendChild(card);
      return;
    }
    card.innerHTML = `
      <div class="top">
        <span class="char">${c.ch}</span>
        <span class="roma">${c.r}</span>
      </div>
      <div class="word">
        <span class="icon">${c.w1.icon}</span>
        <div class="word-text">
          <span class="jp">${c.w1.jp}</span> — <span class="mean">${c.w1.mean}</span>
        </div>
      </div>
      <div class="word">
        <span class="icon">${c.w2.icon}</span>
        <div class="word-text">
          <span class="jp">${c.w2.jp}</span><span class="note"> [${c.w2.read}]</span> — <span class="mean">${c.w2.mean}</span>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });

  section.appendChild(grid);
  main.appendChild(section);
});
</script>

</body>
</html>
