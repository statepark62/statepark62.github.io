<style>

  html,body{margin:0;padding:0;}
  body{ background:var(--paper); color:var(--ink); font-family:'Noto Sans KR', sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased; }
  .jp{ font-family:'Noto Serif JP', serif; }

  header{ padding:44px 20px 28px; text-align:center; border-bottom:1px solid var(--line);

  header p.desc{ margin:14px auto 0; max-width:560px; color:var(--sub); font-size:19px; }

  nav.rownav{ position:sticky; top:0; z-index:20; background:rgba(251,248,242,0.96); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line); padding:10px 12px; display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; }
  nav.rownav::-webkit-scrollbar{display:none;}
  nav.rownav a{ flex:0 0 auto; text-decoration:none; font-size:17px; font-weight:700; color:var(--ink);
    background:var(--card); border:1.5px solid var(--line); padding:7px 13px; border-radius:999px; white-space:nowrap; }

  main{max-width:1180px;margin:0 auto;padding:6px 14px 60px;}

  section.gyou{ margin-top:40px; scroll-margin-top:64px; }
  section.gyou .gyou-head{ display:flex; align-items:baseline; gap:10px; padding:0 2px 12px; border-bottom:3px solid var(--accent); }
  section.gyou .gyou-head .jptitle{ font-family:'Noto Serif JP', serif; font-size:31.5px; font-weight:700; color:var(--accent); }
  section.gyou .gyou-head .kotitle{ font-size:17px; color:var(--sub); font-weight:500; }

  .poster{ margin-top:26px; scroll-margin-top:64px; border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--card); }
  .poster .ptop{ display:flex; align-items:center; gap:12px; padding:14px 16px; background:color-mix(in srgb, var(--accent) 10%, white); border-bottom:1px solid var(--line); }
  .poster .badge{ width:44px; height:44px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center; justify-content:center;

  .poster .ptitle{ font-size:19px; font-weight:700; }
  .poster .pbody{ padding:14px 16px 16px; }

  @media(min-width:560px){ .wgrid{grid-template-columns:repeat(2,1fr);} }
  @media(min-width:760px){ .wgrid{grid-template-columns:repeat(4,1fr);} }

  .wcard{ background:var(--paper); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:9px; padding:10px 11px; }
  .wcard .wjp{ font-family:'Noto Serif JP', serif; font-weight:700; font-size:21.5px; }
  .wcard .wtop{ display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
  .wcard .wicon{ font-size:22px; }
  .wcard .wkanji{ font-size:14.5px; color:var(--sub); margin-left:3px; }
  .wcard .wromaji{ font-size:14.5px; color:#9c927a; font-style:italic; margin-top:2px; }
  .wcard .wkr{ font-size:17.5px; font-weight:700; color:var(--accent); margin-top:2px; }
  .wcard .wmean{ font-size:15px; color:var(--sub); margin-top:3px; }
  .wcard .wpos{ font-size:13px; color:#a99b78; font-weight:700; }

  .exlist{ margin-top:12px; display:flex; flex-direction:column; gap:7px; }
  .exlist .ex{ font-size:15.5px; background:#fff; border:1px dashed var(--line); border-radius:8px; padding:8px 10px; }
  .exlist .ex .exjp{ font-family:'Noto Serif JP', serif; font-weight:600; font-size:17.5px; }
  .exlist .ex .exromaji{ color:#9c927a; font-style:italic; font-size:14.5px; margin-top:2px; }
  .exlist .ex .exkr{ font-weight:700; color:var(--accent); font-size:15.5px; margin-top:2px; }
  .exlist .ex .exmean{ color:var(--sub); margin-top:2px; }

  .noteonly{ padding:16px; font-size:17px; color:var(--sub); line-height:1.6; }

  footer{ max-width:920px; margin:10px auto 50px; padding:22px 20px; background:var(--card); border:1px solid var(--line); border-radius:14px; }
  footer h2{ font-size:20.5px; margin:0 0 10px; }
  footer p{ font-size:17.5px; color:var(--sub); margin:0; }
</style>
</head>

<header>
  <div class="hero jp">ひらがな 50音 から始まることば</div>
  <h1>히라가나로 시작하는 단어 (50음 전체)</h1>
  <p class="desc">글자마다 자주 쓰는 단어 3~4개, 예문, 외우는 팁을 정리했습니다. <b style="color:#E4572E">굵은 색 글자</b>는 한글 발음, <i>이탤릭체</i>는 로마자(영어) 표기예요. 히라가나를 몰라도 소리 내어 읽을 수 있어요.</p>
</header>

<nav class="rownav" id="rownav"></nav>
<main id="main"></main>

<footer>
  <h2>일러두기</h2>
  <p>한글 발음은 실제 일본어 발음과 100% 같지 않아요. 가능하면 원어민 음성도 함께 들으며 연습해보세요. [명사]·[동사]·[형용사]·[な형]·[부사]·[인사말]은 품사를 나타냅니다.</p>
</footer>

const nav = document.getElementById('rownav');
const main = document.getElementById('main');

function wcardHtml(w){
  return `
    <div class="wcard">
      <div class="wtop"><span class="wicon">${w.icon||''}</span><span class="wjp jp">${w.jp}</span>${w.kanji ? `<span class="wkanji">(${w.kanji})</span>` : ''}</div>
      <div class="wromaji">${w.romaji}</div>
      <div class="wkr">${w.kr}</div>
      <div class="wmean"><span class="wpos">[${w.pos}]</span> ${w.mean}</div>
    </div>`;
}
function exHtml(e){
  return `
    <div class="ex">
      <div class="exjp jp">${e.jp}</div>
      <div class="exromaji">${e.romaji}</div>
      <div class="exkr">${e.kr}</div>
      <div class="exmean">${e.mean}</div>
    </div>`;
}

GYOU.forEach(g=>{
  let section = document.getElementById(g.id) ? null : document.createElement('section');
  if(section){
    section.className = 'gyou';
    section.id = g.id;
    section.style.setProperty('--accent', g.accent);
    if(g.jp){
      const a = document.createElement('a');
      a.href = '#'+g.id;
      a.textContent = g.jp;
      nav.appendChild(a);
      const head = document.createElement('div');
      head.className = 'gyou-head';
      head.innerHTML = `<span class="jptitle">${g.jp}</span><span class="kotitle">${g.ko}</span>`;
      section.appendChild(head);
    }
    main.appendChild(section);
  } else {
    section = document.getElementById(g.id);
  }
  section.style.setProperty('--accent', g.accent);

  g.chars.forEach(c=>{
    const poster = document.createElement('div');
    poster.className = 'poster';
    poster.style.setProperty('--accent', g.accent);

    if(c.note){
      poster.innerHTML = `
        <div class="ptop">
          <div class="badge jp">${c.ch}</div>
          <div class="ptitle">「${c.ch}」에 대하여</div>
        </div>
        <div class="noteonly">${c.note}</div>`;
      section.appendChild(poster);
      return;
    }

    const wordsHtml = c.words.map(wcardHtml).join('');
    const exHtmlStr = c.examples.map(exHtml).join('');
    poster.innerHTML = `
      <div class="ptop">
        <div class="badge jp">${c.ch}</div>
        <div class="ptitle">「${c.ch}」로 시작하는 단어</div>
      </div>
      <div class="pbody">
        <div class="wgrid">${wordsHtml}</div>
        <div class="exlist">${exHtmlStr}</div>
        <div class="tip">💡 ${c.tip}</div>
      </div>`;
    section.appendChild(poster);
  });
});
</script>
