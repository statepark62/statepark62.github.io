<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일본어 동사 변형 규칙</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#26241F; --sub:#6b6558; --paper:#FBF8F2; --card:#ffffff; --line:#E7E1D3; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--paper); color:var(--ink); font-family:'Noto Sans KR', sans-serif; line-height:1.5; -webkit-font-smoothing:antialiased; }
  .jp{ font-family:'Noto Serif JP', serif; }

  header{ padding:44px 20px 28px; text-align:center; border-bottom:1px solid var(--line);
    background: radial-gradient(circle at 15% 20%, rgba(217,164,65,0.08), transparent 40%), radial-gradient(circle at 85% 30%, rgba(59,110,165,0.08), transparent 40%); }
  header h1{ margin:0; font-size:clamp(26.5px, 6vw, 38px); font-weight:900; letter-spacing:-0.02em; }
  header .hero{ font-family:'Noto Serif JP', serif; font-size:clamp(18.5px, 4vw, 23.5px); color:var(--sub); margin-top:10px; }
  header p.desc{ margin:14px auto 0; max-width:560px; color:var(--sub); font-size:19px; }

  nav.rownav{ position:sticky; top:0; z-index:20; background:rgba(251,248,242,0.96); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--line); padding:10px 12px; display:flex; gap:8px; overflow-x:auto; scrollbar-width:none; }
  nav.rownav::-webkit-scrollbar{display:none;}
  nav.rownav a{ flex:0 0 auto; text-decoration:none; font-size:16px; font-weight:700; color:var(--ink);
    background:var(--card); border:1.5px solid var(--line); padding:7px 12px; border-radius:999px; white-space:nowrap; }

  main{max-width:1180px;margin:0 auto;padding:6px 14px 60px;}

  section.blk{ margin-top:34px; scroll-margin-top:64px; }
  section.blk .blk-head{ display:flex; align-items:baseline; gap:10px; padding:0 2px 12px; border-bottom:3px solid var(--accent); flex-wrap:wrap; }
  section.blk .blk-head .title{ font-size:22px; font-weight:700; color:var(--accent); }
  section.blk .blk-note{ font-size:16px; color:var(--sub); margin-top:10px; background:#FFF6E9; border:1px solid #F0DEB8; border-radius:8px; padding:9px 11px; }
  section.blk .blk-warn{ font-size:16px; color:#7a3a3a; margin-top:10px; background:#FDECEF; border:1px solid #F3C9D2; border-radius:8px; padding:9px 11px; }

  .vblist{ display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .vbcard{ background:var(--card); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:10px; padding:12px 13px; }
  .vbcard .vbmain{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .vbcard .jpword{ font-family:'Noto Serif JP', serif; font-size:23.5px; font-weight:700; }
  .vbcard .furigana{ font-family:'Noto Serif JP', serif; font-size:15px; color:var(--sub); }
  .vbcard .romaji{ font-size:14.5px; color:#9c927a; font-style:italic; }
  .vbcard .kr{ font-size:19px; font-weight:700; color:var(--accent); }
  .vbcard .mean{ font-size:15.5px; color:var(--sub); margin-left:auto; }
  .vbcard .exflag{ font-size:13.5px; background:#7a3a3a; color:#fff; padding:2px 7px; border-radius:999px; font-weight:700; }
  .conj-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:6px; margin-top:9px; }
  @media(min-width:640px){ .conj-grid{grid-template-columns:repeat(4,1fr);} }
  .conj-chip{ background:var(--paper); border:1px dashed var(--line); border-radius:7px; padding:6px 8px; font-size:14.5px; }
  .conj-chip .clabel{ font-size:12.5px; color:#a99b78; font-weight:700; }
  .conj-chip .cjp{ font-family:'Noto Serif JP', serif; font-weight:600; font-size:16px; }
  .conj-chip .cromaji{ color:#9c927a; font-style:italic; font-size:13px; }
  .conj-chip .ckr{ color:var(--accent); font-weight:700; font-size:13.5px; }

  .rule-grid{ display:grid; grid-template-columns:1fr; gap:10px; margin-top:14px; }
  @media(min-width:640px){ .rule-grid{grid-template-columns:repeat(3,1fr);} }
  .rule-card{ background:var(--card); border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:10px; padding:13px 14px; }
  .rule-card h3{ margin:0 0 8px; font-size:18.5px; }
  .rule-card ul{ margin:0; padding-left:18px; font-size:16px; color:var(--sub); }
  .rule-card li{ margin-bottom:6px; }
  .rule-card .rjp{ font-family:'Noto Serif JP', serif; font-weight:600; color:var(--ink); }

  footer{ max-width:960px; margin:10px auto 50px; padding:22px 20px; background:var(--card); border:1px solid var(--line); border-radius:14px; }
  footer h2{ font-size:20.5px; margin:0 0 10px; }
  footer p{ font-size:17.5px; color:var(--sub); margin:0 0 8px; }
</style>
</head>
<body>

<header>
  <div class="hero jp">日本語動詞の活用ルール</div>
  <h1>일본어 동사 변형 규칙</h1>
  <p class="desc"><b style="color:#D9A441">굵은 색 글자</b>가 한글 발음, <i>이탤릭체</i>가 로마자(영어) 표기예요. 양이 많으니 천천히 소리 내어 읽으며 따라와보세요.</p>
</header>

<nav class="rownav" id="rownav"></nav>
<main id="main"></main>

<footer>
  <h2>일러두기</h2>
  <p>부정형(ない)=~하지 않다, 공손체(ます)=~합니다, 연용형=명사화·연결형, て형=~하고/해서. 한글 발음은 실제 발음과 100% 같지 않으니 원어민 음성과 함께 연습해보세요.</p>
</footer>

const nav = document.getElementById('rownav');
const main = document.getElementById('main');

function makeVbcard(it, accent){
  const c = document.createElement('div');
  c.className = 'vbcard';
  const chips = it.conj.map(cj => `
    <div class="conj-chip">
      <div class="clabel">${cj.l}</div>
      <div class="cjp jp">${cj.jp}</div>
      <div class="cromaji">${cj.romaji}</div>
      <div class="ckr">${cj.kr}</div>
    </div>`).join('');
  c.innerHTML = `
    <div class="vbmain">
      <span class="jpword jp">${it.jp}</span>${it.furi ? `<span class="furigana">(${it.furi})</span>` : ''}
      <span class="romaji">${it.romaji}</span>
      <span class="kr">${it.kr}</span>
      ${it.flag ? `<span class="exflag">${it.flag}</span>` : ''}
      <span class="mean">${it.mean}</span>
    </div>
    <div class="conj-grid">${chips}</div>
  `;
  return c;
}

VERB_SECTIONS.forEach(sec=>{
  const a = document.createElement('a');
  a.href = '#'+sec.id;
  a.textContent = sec.title.split(')')[0].replace(/[^0-9가-힣]/g,'') + '그룹';
  nav.appendChild(a);

  const section = document.createElement('section');
  section.className = 'blk';
  section.id = sec.id;
  section.style.setProperty('--accent', sec.accent);

  const head = document.createElement('div');
  head.className = 'blk-head';
  head.innerHTML = `<span class="title">${sec.title}</span>`;
  section.appendChild(head);

  if(sec.note){
    const note = document.createElement('div');
    note.className = sec.id === 'exception' ? 'blk-warn' : 'blk-note';
    note.textContent = sec.note;
    section.appendChild(note);
  }

  const list = document.createElement('div');
  list.className = 'vblist';
  sec.items.forEach(it=> list.appendChild(makeVbcard(it, sec.accent)));
  section.appendChild(list);

  main.appendChild(section);
});

        <ul>
          <li><b>1그룹</b>: 끝 글자를 '이(i)단'으로 바꾸고 <span class="rjp">ます</span>를 붙여요.</li>
          <li><b>2그룹</b>: <span class="rjp">る</span> 빼고 <span class="rjp">ます</span>를 붙여요.</li>
        </ul>
      </div>
      <div class="rule-card">
        <h3>③ て형(연결형) 만들기 (1그룹 전용 리듬)</h3>
        <ul>
          <li><span class="rjp">う, つ, る</span> → <span class="rjp">って</span></li>
          <li><span class="rjp">む, ぶ, ぬ</span> → <span class="rjp">んで</span></li>
          <li><span class="rjp">く</span> → <span class="rjp">いて</span> ／ <span class="rjp">ぐ</span> → <span class="rjp">いで</span></li>
          <li><span class="rjp">す</span> → <span class="rjp">して</span></li>
          <li>특별 예외: <span class="rjp">行く</span>(가다)는 <span class="rjp">行って</span>(잇테)</li>
        </ul>
      </div>
    </div>
  `;
  main.appendChild(section);
})();

// 5) 예외 1그룹 섹션 렌더링 (formula 다음 순서)
(function(sec){
  const a = document.createElement('a');
  a.href = '#'+sec.id;
  a.textContent = '예외1그룹';
  nav.appendChild(a);

  const section = document.createElement('section');
  section.className = 'blk';
  section.id = sec.id;
  section.style.setProperty('--accent', sec.accent);

  const head = document.createElement('div');
  head.className = 'blk-head';
  head.innerHTML = `<span class="title">${sec.title}</span>`;
  section.appendChild(head);

  const note = document.createElement('div');
  note.className = 'blk-warn';
  note.textContent = sec.note;
  section.appendChild(note);

  const list = document.createElement('div');
  list.className = 'vblist';
  sec.items.forEach(it=> list.appendChild(makeVbcard(it, sec.accent)));
  section.appendChild(list);

  main.appendChild(section);
})(EXCEPTION_SECTION);
</script>
