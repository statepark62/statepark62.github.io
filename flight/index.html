<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한일 항공권 검색</title>
<link rel="icon" href="icon/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1457b8">
<style>
 *{box-sizing:border-box}
 body{margin:0;font-family:system-ui,"Noto Sans KR",sans-serif;font-size:18.5px;background:#f2f5f9;color:#1c2733;text-align:center;line-height:1.55}
 main{max-width:1180px;margin:0 auto;padding:20px 14px}
 h2{font-size:28px;margin:26px 0 6px}
 h3{font-size:21px;margin:14px 0 4px;color:#1457b8}
 h1{font-size:clamp(30px,6vw,50px);margin:10px 0}
 .sub{font-size:19.5px;color:#556}
 .box,.card{background:#fff;border-radius:14px;padding:18px;margin:14px 0;box-shadow:0 2px 8px #0001}
 .row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
 label{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1 1 220px}
 input,select,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #bcc6d2;text-align:center;text-align-last:center}
 input:not([type=checkbox]),select{width:100%;background:#fff}
 button{background:#1457b8;color:#fff;border:0;cursor:pointer;margin:6px}
 button:disabled{opacity:.5}
 button.light{background:#e4ebf5;color:#1457b8}
 .price{font-size:28px;font-weight:700}
 a{color:#1457b8;margin:0 8px;display:inline-block}
 details{font-size:17px}
 .pair{display:flex;align-items:flex-start;overflow:hidden;padding:2px}
 .pair>.card{flex:0 0 100%;min-width:0;transition:flex-basis .45s,transform .45s,margin .45s}
 .pair>.side{flex:1 1 0;min-width:0;opacity:0;transform:translateX(40px);transition:opacity .45s,transform .45s;max-height:0;overflow:hidden}
 .pair.open>.card{flex-basis:42%;transform:scale(.96);margin-right:14px;border:3px solid #1457b8}
 .pair.open>.side{opacity:1;transform:none;max-height:75vh;overflow-y:auto;padding:0 4px}
 @media (max-width:760px){
  .pair{flex-direction:column;align-items:stretch}
  .pair>.card,.pair.open>.card{flex:none;margin-right:0}
  .pair>.side{flex:none}
 }
 @media (prefers-reduced-motion:reduce){.pair>*{transition:none!important}}
 .card{position:relative}
 input.pick{position:absolute;top:14px;left:14px;width:26px;height:26px;margin:0;padding:0;cursor:pointer;accent-color:#1457b8}
 .card.picked{background:#eaf2ff;box-shadow:0 0 0 3px #1457b8 inset}
 #bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#fff;border-top:3px solid #1457b8;box-shadow:0 -4px 14px #0002;padding:10px 14px;max-height:45vh;overflow-y:auto}
 #bar[hidden]{display:none}
 .summary{font-weight:700;color:#1457b8;white-space:pre-line}
 .note{font-size:16px;color:#667}
</style>
</head>
<body>
<main>
 <h1>✈️ 한일 항공권 검색</h1>
 <p class="sub">Google 항공편 결과를 공항별·항공사별·출발시각순으로 보여줍니다 (원화)</p>

 <form class="box" id="form">
  <div class="row">
   <label>출발지<select id="from"></select></label>
   <label>도착지<select id="to"></select></label>
  </div>
  <p><button type="button" class="light" id="swap">⇄ 출발·도착 바꾸기</button></p>
  <div class="row">
   <label>가는 날<input type="date" id="date" required></label>
   <label>오는 날 (비우면 편도)<input type="date" id="back"></label>
   <label>성인 인원<select id="adults"><option>1</option><option>2</option><option>3</option><option>4</option></select></label>
  </div>
  <p><label style="display:inline"><input type="checkbox" id="nonstop" checked> 직항만 보기</label></p>
  <p><label style="display:inline"><input type="checkbox" id="auto" checked> 왕복일 때 최저가 편의 귀국편 자동 조회 (검색 1회 추가)</label></p>
  <button id="go">검색</button>
 </form>

 <details class="box">
  <summary>설정 (처음 한 번)</summary>
  <p><label>Apps Script 웹 앱 URL<input type="url" id="api" placeholder="https://script.google.com/macros/s/…/exec"></label></p>
  <p><label>비밀번호<input type="password" id="pw"></label></p>
 </details>

 <button type="button" class="light" id="clear" hidden>🗑 검색 결과·시트 기록 삭제</button>
 <div id="status" aria-live="polite"></div>
 <div id="left"></div>
 <div id="links"></div>
 <div id="list"></div>
</main>
<div id="bar" hidden aria-live="polite">
 <div id="barText" class="summary"></div>
 <div class="note">조회 시점 가격입니다. 예약 전에 판매처에서 가격과 발권 조건을 확인하세요.</div>
 <button type="button" id="share">📋 복사·공유</button><button type="button" id="save">💾 시트 저장</button><button type="button" id="barClose" class="light">✕ 닫기</button>
 <div id="barMsg"></div>
</div>
<script>
// ▼ 따옴표 안에 Apps Script 웹 앱 URL(/exec로 끝남)을 붙여넣으세요. 비밀번호는 넣지 마세요.
const API_URL = "https://script.google.com/macros/s/AKfycbzLi-kKSZAh2fVn2jlNMqckUcWhK3ys2vYnTVvkj_bEmYnvlXjPKM93HeqPym4MwnR7/exec";

const AIRPORTS = {
 "한국": [["ICN,GMP,PUS,TAE,CJJ,CJU","한국 전체"],["ICN,GMP","서울 전체(인천+김포)"],["ICN","인천"],["GMP","김포"],["PUS","부산"],["TAE","대구"],["CJJ","청주"],["CJU","제주"]],
 "일본": [["NRT,HND","도쿄 전체(나리타+하네다)"],["NRT","도쿄 나리타"],["HND","도쿄 하네다"],["KIX","오사카 간사이"],["NGO","나고야"],["FUK","후쿠오카"],["CTS","삿포로"],["OKA","오키나와"],["SDJ","센다이"],["KIJ","니가타"],["KMQ","고마쓰"],["OKJ","오카야마"],["HIJ","히로시마"],["TAK","다카마쓰"],["MYJ","마쓰야마"],["KMJ","구마모토"],["OIT","오이타"],["KOJ","가고시마"]]
};
const $ = id => document.getElementById(id);
function el(tag, text, cls){ const e = document.createElement(tag); if(text) e.textContent = text; if(cls) e.className = cls; return e; }

for (const id of ["from","to"]) for (const [country, items] of Object.entries(AIRPORTS)) {
 const g = el("optgroup"); g.label = country;
 for (const [v, n] of items) g.append(new Option(v.split(",").length > 2 ? n : n + " (" + v + ")", v));
 $(id).append(g);
}
$("from").value = AIRPORTS["한국"][0][0]; $("to").value = "KIX";

function store(k, v){ try { if (v === undefined) return localStorage.getItem(k) || ""; localStorage.setItem(k, v); } catch(e) { return ""; } }
for (const id of ["api","pw"]) { $(id).value = store(id); $(id).onchange = () => store(id, $(id).value.trim()); }

// 코드에 URL이 있으면 그것을 쓰고 입력칸은 숨김
if (API_URL) { $("api").value = API_URL; $("api").closest("p").hidden = true; }

// 자동 조회 선택은 기억해 둠
if (store("auto") === "off") $("auto").checked = false;
$("auto").onchange = () => store("auto", $("auto").checked ? "on" : "off");

const now = new Date();
const today = new Date(now - now.getTimezoneOffset()*60000).toISOString().slice(0,10);
$("date").min = $("back").min = today;
$("date").onchange = () => { $("back").min = $("date").value || today; };
$("swap").onclick = () => { [$("from").value, $("to").value] = [$("to").value, $("from").value]; };

let query = null;
$("form").onsubmit = e => {
 e.preventDefault();
 query = { from:$("from").value, to:$("to").value, date:$("date").value, back:$("back").value,
           adults:$("adults").value, nonstop:$("nonstop").checked, autoReturn:$("auto").checked };
 if (query.from.split(",").some(c => query.to.split(",").includes(c))) return say("출발지와 도착지가 같습니다.");
 if (query.back && query.back < query.date) return say("오는 날이 가는 날보다 빠릅니다.");
 showLinks(query);
 run(query);
};
// 화면 결과와 시트 기록을 삭제. 위의 검색 조건은 그대로 둠
function clearResults(){ setSelection(null); opened = null; say(""); $("links").replaceChildren(); $("list").replaceChildren(); $("clear").hidden = true; }
$("clear").onclick = async () => {
 if (!confirm("구글 시트의 모든 검색 기록이 삭제됩니다. 삭제할까요?")) return;
 const url = $("api").value.trim();
 if (!url || !$("pw").value) return say("아래 '설정'에 URL과 비밀번호를 먼저 입력하세요.");
 $("clear").disabled = $("go").disabled = true;
 say("삭제 중…");
 try {
  const res = await fetch(url, { method:"POST", headers:{"Content-Type":"text/plain"},
                                 body: JSON.stringify({ action:"clear", password:$("pw").value.trim() }) });
  const data = await res.json();
  if (typeof data.cleared !== "number") return say("삭제 실패: " + (data.error || "알 수 없는 응답"));
  clearResults();
  say(`화면 결과와 시트 기록 ${data.cleared}행을 삭제했습니다.`);
 } catch (err) { say("삭제 확인 실패: 시트를 열어 확인하세요."); }
 finally { $("clear").disabled = $("go").disabled = false; }
};
let opened = null; // 지금 펼쳐진 귀국편
function say(t){ $("status").textContent = t; }

async function request(body){
 const url = $("api").value.trim();
 if (!url || !$("pw").value) return { error:"아래 '설정'에 URL과 비밀번호를 먼저 입력하세요." };
 try {
  const res = await fetch(url, { method:"POST", headers:{"Content-Type":"text/plain"},
                                 body: JSON.stringify({ ...body, password:$("pw").value.trim() }) });
  const data = await res.json();
  if (typeof data.left === "number") $("left").textContent = `이번 달 남은 검색 횟수: ${data.left}회`;
  return data;
 } catch (err) { return { error:"연결 실패: URL과 배포 설정을 확인하세요." }; }
}
const saveNote = d => d.saveError ? " · 시트 저장 실패: " + d.saveError
                    : (d.savedGen !== undefined && d.flights.length ? " · 시트 기록됨" : "");

async function run(q){
 say("검색 중…"); setSelection(null); $("clear").hidden = true; opened = null; $("list").replaceChildren(); $("go").disabled = true;
 const data = await request(q);
 if (data.error) say("오류: " + data.error);
 else { show(data); $("status").textContent += saveNote(data); }
 $("go").disabled = false; $("clear").hidden = false;
}

function makeCard(f){
 const card = el("div", "", "card");
 card.append(el("div", f.price ? f.price.toLocaleString("ko-KR") + "원" : "가격 정보 없음", "price"));
 card.append(el("div", query.back ? "1인당 왕복 요금" : "1인당 편도 요금"));
 for (const l of f.legs) card.append(el("div", `${l.airline} ${l.no} · ${l.from} ${l.dep.slice(5)} → ${l.to} ${l.arr.slice(5)}`));
 card.append(el("div", `총 ${Math.floor(f.minutes/60)}시간 ${f.minutes%60}분 · ${f.legs.length === 1 ? "직항" : "경유 " + (f.legs.length-1) + "회"}`));
 return card;
}
const byRoute = (x,y) => x.legs[0].from.localeCompare(y.legs[0].from)
                      || x.legs[0].airline.localeCompare(y.legs[0].airline, "ko")
                      || x.legs[0].dep.localeCompare(y.legs[0].dep);

// 화면 아래 '선택한 일정' 막대
let selection = null;
function setSelection(sel){
 selection = sel;
 $("bar").hidden = !sel;
 $("barMsg").textContent = "";
 $("save").disabled = false;
 document.body.style.paddingBottom = sel ? "260px" : "";
 if (sel) $("barText").textContent = `선택: ${flightName(sel.go)} → ${flightName(sel.ret)} · 1인당 왕복 ${won(sel.ret.price)}`;
}
const won = p => p ? p.toLocaleString("ko-KR") + "원" : "가격 정보 없음";
function itinerary(s){
 const part = (title, f) => `${title}  ${f.legs[0].dep.slice(5,10)}\n` + f.legs.map(l =>
  `  ${l.airline} ${l.no}\n  ${l.from} ${l.dep.slice(11)} → ${l.to} ${l.arr.slice(11)}` + (l.arr.slice(0,10) !== l.dep.slice(0,10) ? ` (${l.arr.slice(5,10)})` : "")).join("\n");
 return [`✈️ 항공 일정 (성인 ${s.adults}명)`, part("가는 편", s.go), part("오는 편", s.ret),
         `1인당 왕복 ${won(s.ret.price)}`, `${s.q.date.slice(0,4)}년 일정 · 가격 조회 ${s.time}`, "※ 예약 전에 가격과 발권 조건을 확인하세요."].join("\n");
}
$("share").onclick = async () => {
 if (!selection) return;
 const text = itinerary(selection);
 // 휴대폰은 공유창, PC는 복사
 if (navigator.share && window.matchMedia && matchMedia("(pointer: coarse)").matches) {
  try { await navigator.share({ title:"항공 일정", text }); return; }
  catch (err) { if (err.name === "AbortError") return; }
 }
 try { await navigator.clipboard.writeText(text); $("barMsg").textContent = "복사했습니다. 원하는 곳에 붙여넣으세요."; }
 catch (err) { window.prompt("아래 내용을 복사하세요", text); }
};
$("save").onclick = async () => {
 const s = selection;
 if (!s) return;
 $("save").disabled = true;
 $("barMsg").textContent = "저장 중…";
 const data = await request({ action:"choose", go:s.go, ret:s.ret, adults:s.adults, time:s.time });
 if (selection !== s) return;
 if (typeof data.saved === "number") $("barMsg").textContent = `「최종선택」 탭에 ${data.saved}번으로 저장했습니다.`;
 else { $("barMsg").textContent = "저장 실패: " + (data.error || "알 수 없는 응답"); $("save").disabled = false; }
};

// 막대만 닫음 (체크한 선택은 그대로)
$("barClose").onclick = () => { $("bar").hidden = true; document.body.style.paddingBottom = ""; };

// 카드 왼쪽 위의 선택 체크박스
function addPick(card, label){
 const c = el("input", "", "pick");
 c.type = "checkbox";
 c.setAttribute("aria-label", label);
 c.onchange = () => { card.classList.toggle("picked", c.checked); };
 card.prepend(c);
 return c;
}
const flightName = f => f.legs.map(l => `${l.airline} ${l.no}`).join(", ");

// 펼친 귀국편을 접고 원래 모양으로
function closeReturn(){
 setSelection(null);
 if (!opened) return;
 opened.button.textContent = "이 편으로 귀국편 보기";
 opened.go.remove();
 opened.card.classList.remove("picked");
 opened.pair.replaceWith(opened.card);
 opened = null;
}

// 선택한 카드를 왼쪽으로 줄이고, 오른쪽에 귀국편을 같은 카드 모양으로 표시
async function openReturn(f, card, button){
 const same = opened && opened.card === card;
 closeReturn();
 if (same) return;
 const pair = el("div", "", "pair"), side = el("div", "", "side");
 card.replaceWith(pair);
 pair.append(card, side);
 button.textContent = "✕ 귀국편 닫기";
 const go = addPick(card, "가는 편 선택");
 const mine = opened = { pair, card, button, go };
 const note = el("p", "귀국편 검색 중…");
 side.append(note);
 void pair.offsetWidth; // 시작 모양을 확정해야 움직임이 보임
 pair.classList.add("open");
 const data = await request({ ...query, token:f.token });
 if (opened !== mine) return; // 그 사이 닫았거나 새로 검색함
 if (data.error) { note.textContent = "오류: " + data.error; return; }
 const returns = [...data.flights].sort(byRoute);
 note.textContent = (returns.length ? `귀국편 ${returns.length}건 · ${query.back}` : "귀국편이 없습니다.") + saveNote(data);
 const picks = [];
 let chosen = null;
 // 가는 편과 귀국편을 모두 체크하면 아래에 선택한 일정 막대를 표시
 const update = () => setSelection(go.checked && chosen
  ? { go:f, ret:chosen, q:query, adults:query.adults, time:data.time } : null);
 go.addEventListener("change", update);
 for (const r of returns) {
  const box = makeCard(r), c = addPick(box, "귀국편 선택 " + flightName(r));
  picks.push(c);
  c.addEventListener("change", () => {
   // 귀국편은 한 곳만 선택
   if (c.checked) for (const o of picks) if (o !== c) { o.checked = false; o.parentElement.classList.remove("picked"); }
   chosen = c.checked ? r : null;
   update();
  });
  side.append(box);
 }
 update();
}

function show(data){
 const flights = data.flights;
 const stage = query.back ? "가는 편 " : "";
 say(flights.length ? `${stage}${flights.length}건 · ${data.time} 조회${data.cached ? " (저장된 결과)" : ""}` : "검색 결과가 없습니다.");
 // 출발공항 → 항공사(가나다순) → 출발시각 순으로 묶기
 const names = Object.fromEntries(Object.values(AIRPORTS).flat().filter(([v]) => !v.includes(",")));
 const ordered = [...flights].sort(byRoute);
 const lowest = list => { const p = list.map(f => f.price).filter(Boolean); return p.length ? ` · 최저 ${Math.min(...p).toLocaleString("ko-KR")}원` : ""; };
 let airport = "", airline = "";
 for (const f of ordered) {
  const from = f.legs[0].from, name = f.legs[0].airline;
  if (from !== airport) {
   airport = from; airline = "";
   const same = ordered.filter(g => g.legs[0].from === from);
   $("list").append(el("h2", `${names[from] || from} 출발 · ${same.length}건${lowest(same)}`));
  }
  if (name !== airline) {
   airline = name;
   const same = ordered.filter(g => g.legs[0].from === from && g.legs[0].airline === name);
   $("list").append(el("h3", `${name} · ${same.length}건${lowest(same)}`));
  }
  const card = makeCard(f);
  if (query.back && f.token) {
   const b = el("button", "이 편으로 귀국편 보기");
   b.type = "button";
   b.onclick = () => openReturn(f, card, b);
   card.append(b);
  }
  $("list").append(card);
 }
 if (data.url && data.url.startsWith("https://")) $("list").append(link("Google 항공편에서 확인", data.url));
}

function link(text, href){ const a = el("a", text); a.href = href; a.target = "_blank"; a.rel = "noopener"; return a; }
function showLinks(q){
 const a = q.from.split(",")[0], b = q.to.split(",")[0];
 const d = s => s.replaceAll("-","");
 const sky = `https://www.skyscanner.co.kr/transport/flights/${a.toLowerCase()}/${b.toLowerCase()}/${d(q.date).slice(2)}/` + (q.back ? d(q.back).slice(2) + "/" : "") + `?adultsv2=${q.adults}`;
 const naver = `https://flight.naver.com/flights/international/${a}-${b}-${d(q.date)}` + (q.back ? `/${b}-${a}-${d(q.back)}` : "") + `?adult=${q.adults}&fareType=Y`;
 const note = el("p", "비교 확인 (첫 번째 공항 기준): ");
 note.append(link("스카이스캐너", sky), link("네이버 항공권", naver));
 $("links").replaceChildren(note);
}
</script>
</body>
</html>
