<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전국 축제 캘린더</title>
<meta name="description" content="앞으로 6개월 동안 전국에서 열리는 축제를 월별·지역별로 찾아보세요.">
<meta name="theme-color" content="#256049">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
  :root {
    --paper: #f4f6f3;
    --surface: #ffffff;
    --ink: #14211b;
    --text2: #34443c;
    --muted: #5b6b63;
    --line: #d8dfda;
    --line-soft: #e6ebe7;
    --jade: #256049;
    --jade-deep: #1b4a38;
    --jade-tint: #e8f0eb;
    --lantern: #cf3a1f;
    --lantern-tint: #fcebe6;
    --display: "Hahmlet", "Noto Serif KR", "Yu Mincho", "Hiragino Mincho ProN", "Songti SC", "Noto Serif CJK SC", "SimSun", serif;
    --text: "Pretendard Variable", Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Hiragino Sans", "Yu Gothic UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: var(--text); font-size: 18.5px; line-height: 1.65; color: var(--ink); background: var(--paper); overflow-wrap: break-word; }
  html[lang="ko"] body { word-break: keep-all; }
  :focus-visible { outline: 3px solid var(--lantern); outline-offset: 2px; }
  button { font-family: inherit; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
  .ribbon { height: 6px; background: repeating-linear-gradient(90deg, #2457a6 0 36px, #cf3a1f 36px 72px, #e0a22a 72px 108px, #ffffff 108px 144px, #14211b 144px 180px); }

  /* 머리글 */
  .top { position: relative; text-align: center; padding: 40px 20px 0; }
  .lantern svg { width: 46px; height: auto; display: inline-block; }
  h1 { font-family: var(--display); font-weight: 800; font-size: clamp(34px, 6.4vw, 50px); line-height: 1.18; letter-spacing: -.02em; margin-top: 10px; }
  .tagline { font-size: 19.5px; font-weight: 500; color: var(--text2); margin-top: 12px; }
  .metaline { font-size: 16px; color: var(--muted); margin-top: 4px; }
  .langs { display: inline-flex; gap: 2px; margin-top: 22px; padding: 4px; background: #e6ebe7; border-radius: 999px; }
  .langs button { font-size: 15.5px; font-weight: 500; padding: 7px 17px; min-height: 40px; background: transparent; color: var(--text2); border: 0; border-radius: 999px; cursor: pointer; }
  .langs button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  @media (min-width: 1000px) { .langs { position: absolute; top: 26px; right: 20px; margin-top: 0; } }

  /* 6개월 분포 띠 */
  .strip { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; margin-top: 30px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .seg { position: relative; display: flex; flex-direction: column; align-items: center; min-width: 0; padding: 14px 8px 12px; background: transparent; border: 0; border-right: 1px solid var(--line-soft); color: inherit; cursor: pointer; }
  .seg:last-child { border-right: 0; }
  .seg .mname { font-family: var(--display); font-weight: 700; font-size: 21px; line-height: 1.2; }
  .seg .mcount { font-size: 14.5px; color: var(--muted); line-height: 1.3; margin: 2px 0 10px; }
  .seg .bars { display: flex; align-items: flex-end; gap: 1px; width: 100%; height: 64px; }
  .seg .bar { display: block; flex: 1 1 0; min-width: 0; border-radius: 1px 1px 0 0; opacity: .6; }
  .seg .pad { display: block; flex-basis: 0; }
  .seg[aria-selected="true"] { background: var(--jade-tint); }
  .seg[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--jade); }
  .seg[aria-selected="true"] .mname { color: var(--jade); }
  .seg[aria-selected="true"] .bar { opacity: 1; }
  .intro .bar { transform-origin: bottom; animation: grow .7s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i) * 3ms); }
  @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @media (prefers-reduced-motion: reduce) { .intro .bar { animation: none; } }
  .cap { text-align: center; font-size: 15px; color: var(--muted); margin-top: 10px; }

  /* 검색·지역 */
  .filters { margin-top: 28px; text-align: center; }
  .searchbox { position: relative; width: min(100%, 520px); margin: 0 auto; }
  .searchbox svg { position: absolute; left: 20px; top: 50%; width: 20px; height: 20px; margin-top: -10px; color: var(--muted); pointer-events: none; }
  #q { width: 100%; height: 52px; font: inherit; font-size: 17.5px; padding: 0 48px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); text-align: center; }
  #q::placeholder { color: #7d8b84; }
  #q:focus-visible { outline: none; border-color: var(--jade); box-shadow: 0 0 0 4px rgba(37, 96, 73, .18); }
  .regions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
  .rchip { font-size: 15.5px; font-weight: 500; line-height: 1.4; padding: 7px 15px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--text2); cursor: pointer; }
  .rchip[aria-pressed="true"] { background: var(--jade); border-color: var(--jade); color: #fff; }
  .rchip .n { margin-left: 6px; font-size: 13.5px; opacity: .7; }
  .linkbtn { font-size: 15.5px; margin-top: 10px; background: none; border: 0; color: var(--jade); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 6px 10px; }

  /* 지역 선택: 지도 + 도시 배지 */
  .layout { margin-top: 40px; }
  .mobsel { margin-top: 16px; text-align: center; }
  .mapbtn { display: inline-flex; align-items: center; gap: 8px; }
  .mapbtn svg { width: 18px; height: 18px; flex: none; }
  .mappanel { display: none; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 16px 16px; text-align: center; }
  .ptitle { font-size: 21px; font-weight: 700; line-height: 1.3; margin-bottom: 8px; }
  .mapbox .kmap { display: block; width: 100%; height: auto; max-width: 400px; margin: 0 auto; }
  .kmap text { font-family: var(--text); pointer-events: none; text-anchor: middle; }
  .rg { cursor: pointer; outline: none; }
  .rg .shape { stroke: #fff; stroke-width: 1.2; stroke-linejoin: round; }
  .rg:focus-visible .shape, .rg:focus-visible .badge { stroke: var(--lantern); stroke-width: 2.6; }
  .rg .lbl { font-size: 12.5px; font-weight: 700; fill: var(--ink); }
  .rg .cnt { font-size: 11px; fill: var(--text2); }
  .rg.sel .lbl, .rg.sel .cnt { fill: #fff; }
  .rg.city .lbl { font-size: 10px; }
  .rg.city .cnt { font-size: 9px; }
  .rg .badge { stroke: var(--jade-deep); stroke-width: 1.2; }
  @media (hover: hover) {
    .rg:hover .shape { stroke: var(--jade-deep); stroke-width: 1.8; }
    .rg.city:hover .badge { stroke-width: 2.2; }
  }
  .rg .hit { fill: transparent; stroke: none; }
  .rg .leader { stroke: var(--jade-deep); stroke-width: 1; opacity: .55; pointer-events: none; }
  .rg .dot { fill: var(--jade-deep); pointer-events: none; }
  .legend { display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 13.5px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 22px; height: 10px; border-radius: 2px; }
  .legend span:first-child { margin-right: 4px; }
  .legend span:last-child { margin-left: 4px; }
  .selrow { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; margin-top: 12px; }
  .selchip { display: inline-flex; align-items: center; gap: 6px; font-size: 14.5px; font-weight: 500; line-height: 1.4; padding: 4px 10px 4px 13px; border: 1px solid var(--jade); border-radius: 999px; background: var(--jade-tint); color: var(--jade-deep); cursor: pointer; }
  .selchip .x { font-size: 17px; line-height: 1; }
  details.listsel { margin-top: 10px; text-align: center; }
  details.listsel summary { display: inline-block; font-size: 15px; color: var(--muted); cursor: pointer; padding: 6px 10px; text-decoration: underline; text-underline-offset: 3px; list-style: none; }
  details.listsel summary::-webkit-details-marker { display: none; }
  details.listsel .regions { margin-top: 8px; }
  dialog.sheet { width: min(560px, 100%); max-height: 92vh; margin: auto auto 0; border-radius: 16px 16px 0 0; }
  dialog.sheet::backdrop { background: rgba(14, 26, 20, .55); }
  .sheet-head { position: sticky; top: 0; z-index: 2; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding: 14px 16px 6px; background: var(--surface); }
  .sheet-head .btn { justify-self: end; min-height: 40px; padding: 8px 18px; }
  .sheet-title { font-size: 21px; font-weight: 700; text-align: center; }
  .sheet-body { padding: 4px 16px 26px; text-align: center; }
  @media (min-width: 1000px) {
    .layout { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 32px; align-items: start; }
    .mappanel { display: block; position: sticky; top: 16px; }
    .mobsel { display: none; }
  }

  /* 목록 */
  #list { min-width: 0; }
  #listTitle { font-family: var(--display); font-weight: 700; font-size: 28px; line-height: 1.3; letter-spacing: -.01em; text-align: center; margin-bottom: 24px; }
  #listTitle .hc { font-family: var(--text); font-weight: 500; font-size: 17px; letter-spacing: 0; color: var(--muted); margin-left: 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 22px; }
  .card { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; overflow: hidden; }
  .card::before { content: ""; display: block; height: 4px; background: var(--jade); }
  .card.live::before { background: var(--lantern); }
  .card:hover { border-color: var(--jade); }
  .chead { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 20px 0; }
  .cdate { font-family: var(--display); font-weight: 700; font-size: 19px; line-height: 1.3; color: var(--jade); letter-spacing: -.01em; }
  .card.live .cdate, .dhead.live .cdate { color: var(--lantern); }
  .flag { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 700; line-height: 1.5; color: var(--lantern); background: var(--lantern-tint); border-radius: 999px; padding: 1px 11px; }
  .flag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--lantern); }
  .cbody { display: flex; flex-direction: column; gap: 8px; flex: 1; padding: 12px 22px 22px; text-align: center; }
  .cname { font-size: 21px; font-weight: 700; line-height: 1.38; letter-spacing: -.01em; }
  .cloc { font-size: 15.5px; color: var(--muted); }
  .csum { font-size: 16.5px; line-height: 1.65; color: var(--text2); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: auto; padding-top: 6px; }
  .tag { font-size: 14.5px; font-weight: 500; line-height: 1.45; color: var(--jade-deep); background: var(--jade-tint); border-radius: 999px; padding: 3px 12px; max-width: 100%; }
  .more { text-align: center; margin-top: 28px; }
  .status, .empty { text-align: center; color: var(--muted); padding: 40px 10px; font-size: 18px; }
  .btn { display: inline-block; font-size: 16.5px; font-weight: 500; line-height: 1.3; padding: 12px 20px; min-height: 46px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink); cursor: pointer; text-decoration: none; }
  .btn:hover { border-color: var(--jade); }
  .btn.primary { background: var(--jade); border-color: var(--jade); color: #fff; }

  .foot { margin-top: 56px; padding: 24px 20px 44px; border-top: 1px solid var(--line); text-align: center; color: var(--muted); font-size: 14.5px; line-height: 1.7; }

  /* 상세 */
  dialog { border: 0; padding: 0; background: var(--surface); color: var(--ink); width: min(720px, calc(100vw - 20px)); max-height: calc(100vh - 24px); border-radius: 14px; overflow: auto; margin: auto; }
  dialog::backdrop { background: rgba(14, 26, 20, .62); }
  .dlg-bar { position: sticky; top: 0; height: 0; z-index: 5; text-align: right; }
  .dlg-close { position: relative; top: 14px; right: 14px; width: 44px; height: 44px; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); color: var(--ink); font-size: 26px; line-height: 1; cursor: pointer; }
  .dhead { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 28px 72px 0; border-top: 6px solid var(--jade); text-align: center; }
  .dhead.live { border-top-color: var(--lantern); }
  .dhead .cdate { font-size: 21px; }
  .dbody { padding: 12px 30px 34px; }
  .dname { font-size: 28px; font-weight: 700; line-height: 1.35; letter-spacing: -.015em; text-align: center; }
  .dloc { text-align: center; font-size: 18px; margin-top: 8px; }
  .dsub { text-align: center; color: var(--muted); font-size: 15.5px; margin-top: 2px; }
  .notice { background: var(--jade-tint); border-radius: 8px; text-align: center; font-size: 15px; padding: 9px 14px; margin-top: 18px; }
  .dsec { margin-top: 28px; }
  .dsec h3 { font-size: 21px; font-weight: 700; text-align: center; margin-bottom: 12px; }
  .ov { white-space: pre-line; font-size: 18.5px; line-height: 1.85; text-align: left; color: var(--text2); }
  .dsec .tags { margin-top: 0; padding-top: 0; }
  .dsec .tag { font-size: 16px; padding: 5px 14px; }
  .map { height: 280px; margin-top: 28px; border: 1px solid var(--line); border-radius: 10px; }
  .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 26px; }

  @media (max-width: 640px) {
    .wrap { padding: 0 14px; }
    .top { padding-top: 32px; }
    .seg { padding: 12px 2px 10px; }
    .seg .mname { font-size: 17px; }
    .seg .mcount { font-size: 12.5px; margin-bottom: 8px; }
    .seg .bars { height: 48px; }
    .grid { grid-template-columns: 1fr; }
    #listTitle { font-size: 25px; }
    .dhead { padding: 26px 62px 0; }
    .dbody { padding: 12px 18px 28px; }
    .dname { font-size: 25px; }
  }
</style>
</head>
<body>
<div class="ribbon" aria-hidden="true"></div>

<header class="top wrap">
  <div class="lantern" aria-hidden="true">
    <svg viewBox="0 0 64 84" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f4a261"/><stop offset=".55" stop-color="#e76f51"/><stop offset="1" stop-color="#cf3a1f"/>
        </linearGradient>
      </defs>
      <line x1="32" y1="1" x2="32" y2="12" stroke="#14211b" stroke-width="2" stroke-linecap="round"/>
      <path d="M22 14 Q32 8 42 14 L40 20 Q32 16 24 20 Z" fill="#14211b"/>
      <path d="M13 20 C13 16 51 16 51 20 C60 32 60 52 51 62 C51 66 13 66 13 62 C4 52 4 32 13 20 Z" fill="url(#lg)"/>
      <ellipse cx="32" cy="20" rx="19" ry="4" fill="none" stroke="#e0a22a" stroke-width="2"/>
      <ellipse cx="32" cy="62" rx="19" ry="4" fill="none" stroke="#e0a22a" stroke-width="2"/>
      <path d="M32 18 C27 32 27 50 32 64" stroke="#8c1f0e" stroke-opacity=".45" stroke-width="1.5" fill="none"/>
      <path d="M22 19 C14 32 14 50 22 63 M42 19 C50 32 50 50 42 63" stroke="#8c1f0e" stroke-opacity=".35" stroke-width="1.2" fill="none"/>
      <g stroke="#e0a22a" stroke-width="2" stroke-linecap="round">
        <line x1="26" y1="67" x2="26" y2="80"/><line x1="30" y1="68" x2="30" y2="83"/>
        <line x1="34" y1="68" x2="34" y2="83"/><line x1="38" y1="67" x2="38" y2="80"/>
      </g>
    </svg>
  </div>
  <h1 id="title">전국 축제 캘린더</h1>
  <p id="tagline" class="tagline"></p>
  <p id="metaline" class="metaline"></p>
  <div id="langs" class="langs" role="group" aria-label="Language"></div>
</header>

<main class="wrap">
  <noscript><p class="status">이 페이지는 JavaScript가 필요합니다. / This page requires JavaScript.</p></noscript>
  <div id="status" class="status" role="status" aria-live="polite"></div>

  <section id="stripSection" hidden>
    <div id="strip" class="strip" role="tablist"></div>
    <p id="stripCap" class="cap"></p>
  </section>

  <section id="filters" class="filters" hidden>
    <div class="searchbox">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      <input id="q" type="search" autocomplete="off">
    </div>
    <div class="mobsel">
      <button id="mapOpen" class="btn mapbtn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span id="mapOpenLabel"></span>
      </button>
      <div class="selrow" data-sel hidden></div>
    </div>
  </section>

  <div class="layout">
  <aside id="mapPanel" class="mappanel" hidden>
    <h3 id="ptitle" class="ptitle"></h3>
    <div id="panelMap" class="mapbox"></div>
    <div class="selrow" data-sel hidden></div>
    <details class="listsel"><summary class="lsum"></summary><div id="panelChips" class="regions"></div></details>
  </aside>

  <section id="list" role="tabpanel" hidden>
    <h2 id="listTitle"></h2>
    <div id="grid" class="grid"></div>
    <p id="empty" class="empty" hidden></p>
    <div class="more"><button id="more" class="btn" type="button" hidden></button></div>
  </section>
  </div>
</main>

<footer id="foot" class="foot wrap"></footer>

<dialog id="dlg" aria-labelledby="dlgName">
  <div class="dlg-bar"><button id="dlgClose" class="dlg-close" type="button" aria-label="Close">&times;</button></div>
  <div id="dlgBody"></div>
</dialog>

<dialog id="mapSheet" class="sheet" aria-labelledby="sheetTitle">
  <div class="sheet-head"><span></span><h3 id="sheetTitle" class="sheet-title"></h3><button id="sheetDone" class="btn primary" type="button"></button></div>
  <div class="sheet-body">
    <div id="sheetMap" class="mapbox"></div>
    <div class="selrow" data-sel hidden></div>
    <details class="listsel"><summary class="lsum"></summary><div id="sheetChips" class="regions"></div></details>
  </div>
</dialog>

<script>
(function () {
  'use strict';

  var DATA_URLS = ['data/festivals.json', 'https://statepark62.github.io/festival/data/festivals.json'];

          g.append(sv('circle', { 'class': 'dot', cx: ax, cy: ay, r: 2 }));
        }
        g.append(sv('circle', { 'class': 'badge', cx: bx, cy: by, r: 15 }));
        g.append(sv('circle', { 'class': 'hit', cx: bx, cy: by, r: 19 }));
        g.append(sv('text', { 'class': 'lbl', x: bx, y: by - 1.5 }));
        g.append(sv('text', { 'class': 'cnt', x: bx, y: by + 9 }));
      } else {
        g.append(sv('text', { 'class': 'lbl', x: r[4], y: r[5] }));
        g.append(sv('text', { 'class': 'cnt', x: r[4], y: r[5] + 13 }));
      }
      g.addEventListener('click', function () { toggleRegion(ko); });
      g.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleRegion(ko); }
      });
      svg.append(g);
    });
    return svg;
  }
  function buildLegend() {
    var t = tx();
    return h('div', { class: 'legend', 'aria-hidden': 'true' },
      h('span', { text: t.legendLess }),
      SCALE.map(function (c) { return h('i', { style: 'background:' + c }); }),
      h('span', { text: t.legendMore }));
  }
  function buildChips(box) {
    box.textContent = '';
    var active = {};
    state.festivals.forEach(function (f) { if (f.end >= state.today && f.sido) active[f.sido] = true; });
    ORDER.forEach(function (code) {
      var ko = KO[code];
      if (!active[ko]) return;
      var b = h('button', { type: 'button', class: 'rchip', 'data-ko': ko, 'aria-pressed': 'false' }, h('span', { class: 't' }), h('span', { class: 'n' }));
      b.addEventListener('click', function () { toggleRegion(ko); });
      box.append(b);
    });
  }
  function buildRegionUI() {
    var t = tx();
    [['panelMap', 'panelChips'], ['sheetMap', 'sheetChips']].forEach(function (ids) {
      var box = $(ids[0]);
      box.textContent = '';
      var svg = buildMap();
      svg.setAttribute('aria-label', t.mapLabel);
      box.append(svg, buildLegend());
      buildChips($(ids[1]));
    });
    $('ptitle').textContent = t.regionTitle;
    $('sheetTitle').textContent = t.regionTitle;
    $('sheetDone').textContent = t.done;
    Array.prototype.forEach.call(document.querySelectorAll('.lsum'), function (e) { e.textContent = t.listSel; });
  }

  function renderSelected() {
    var t = tx();
    Array.prototype.forEach.call(document.querySelectorAll('[data-sel]'), function (row) {
      row.textContent = '';
      row.hidden = state.regions.size === 0;
      state.regions.forEach(function (ko) {
        var name = sidoLabel(ko);
        row.append(h('button', { type: 'button', class: 'selchip', 'aria-label': t.removeRegion(name), onclick: function () { toggleRegion(ko); } },
          name, h('span', { class: 'x', 'aria-hidden': 'true', text: '×' })));
      });
      row.append(h('button', { type: 'button', class: 'linkbtn', text: t.clearRegions, onclick: function () { state.regions.clear(); filtersChanged(); } }));
    });
  }

  function updateRegionUI() {
    if (!state.ready) return;
    var t = tx(), counts = regionCounts(), max = 1, short = SHORT[state.lang];
    Object.keys(counts).forEach(function (k) { if (counts[k] > max) max = counts[k]; });
    Array.prototype.forEach.call(document.querySelectorAll('.rg'), function (g) {
      var ko = g.getAttribute('data-ko'), code = g.getAttribute('data-code');
      var n = counts[ko] || 0, sel = state.regions.has(ko);
      var tip = sidoLabel(ko) + ': ' + t.count(n);
      g.classList.toggle('sel', sel);
      g.setAttribute('aria-pressed', sel ? 'true' : 'false');
      g.setAttribute('aria-label', tip);
      g.querySelector('title').textContent = tip;
      g.querySelector('.lbl').textContent = short[code];
      g.querySelector('.cnt').textContent = String(n);
      var fill = sel ? SELECTED : scaleColor(n, max);
      Array.prototype.forEach.call(g.querySelectorAll('.shape, .badge'), function (e) { e.style.fill = fill; });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.rchip'), function (b) {
      var ko = b.getAttribute('data-ko');
      b.setAttribute('aria-pressed', state.regions.has(ko) ? 'true' : 'false');
      b.querySelector('.t').textContent = sidoLabel(ko);
      b.querySelector('.n').textContent = String(counts[ko] || 0);
    });
    renderSelected();
    $('mapOpenLabel').textContent = state.regions.size ? t.mapOpenN(state.regions.size) : t.mapOpen;
  }

  function openSheet() {
    var sh = $('mapSheet');
    if (typeof sh.showModal === 'function') sh.showModal(); else sh.setAttribute('open', '');
    document.body.style.overflow = 'hidden';
  }
  function closeSheet() {
    var sh = $('mapSheet');
    if (typeof sh.close === 'function') { if (sh.open) sh.close(); } else sh.removeAttribute('open');
    document.body.style.overflow = '';
  }

  /* ---------- 목록 ---------- */
  function renderList() {
    var t = tx(), mo = state.months[state.month];
    var list = currentList();
    var title = $('listTitle');
    title.textContent = '';
    title.append(t.monthTitle(headingMonth(mo)), h('span', { class: 'hc', text: t.count(list.length) }));
    $('list').setAttribute('aria-labelledby', 'seg' + state.month);
    var grid = $('grid');
    grid.textContent = '';
    list.slice(0, state.limit).forEach(function (f) { grid.append(card(f)); });
    $('empty').hidden = list.length > 0;
    $('empty').textContent = t.empty;
    var remain = list.length - state.limit;
    var more = $('more');
    more.hidden = remain <= 0;
    if (remain > 0) more.textContent = t.more(remain);
  }

  function card(f) {
    var x = L(f, state.lang), t = tx();
    var live = f.start <= state.today && f.end >= state.today;
    var summary = (x.overview || '').replace(/\s+/g, ' ').slice(0, 220);
    var loc = [x.sido, x.sigungu].filter(Boolean).join(' ');
    var el = h('article', { class: 'card' + (live ? ' live' : ''), role: 'button', tabindex: '0', 'aria-haspopup': 'dialog' },
      h('div', { class: 'chead' }, h('span', { class: 'cdate', text: rangeText(f.start, f.end) }), live ? h('span', { class: 'flag', text: t.ongoing }) : null),
      h('div', { class: 'cbody' },
        h('h3', { class: 'cname', text: x.name }),
        loc ? h('p', { class: 'cloc', text: loc }) : null,
        summary ? h('p', { class: 'csum', text: summary }) : null,
        x.activities.length ? h('div', { class: 'tags' }, x.activities.slice(0, 2).map(function (a) { return h('span', { class: 'tag', text: a }); })) : null));
    el.addEventListener('click', function () { openDetail(f); });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDetail(f); }
    });
    return el;
  }

  /* ---------- 상세 ---------- */
  function safeUrl(u) { return /^https?:\/\//i.test(String(u || '')) ? u : ''; }
  function firstPhone(s) {
    var m = String(s || '').match(/\+?\d[\d\-\s()]{6,}\d/);
    return m ? m[0].trim() : '';
  }

  function openDetail(f) {
    var t = tx(), x = L(f, state.lang);
    var live = f.start <= state.today && f.end >= state.today;
    var coords = validCoord(f);
    var loc = [x.sido, x.sigungu].filter(Boolean).join(' ');
    var q = encodeURIComponent(f.name);
    var gmap = coords
      ? 'https://www.google.com/maps/search/?api=1&query=' + f.lat + ',' + f.lng
      : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(f.address || f.name);
    var links = [h('a', { class: 'btn', href: gmap, target: '_blank', rel: 'noopener', text: t.google })];
    links.push(h('a', { class: 'btn', href: 'https://map.naver.com/p/search/' + q, target: '_blank', rel: 'noopener', text: t.naver }));
    if (coords) links.push(h('a', { class: 'btn', href: 'https://map.kakao.com/link/map/' + q + ',' + f.lat + ',' + f.lng, target: '_blank', rel: 'noopener', text: t.kakao }));
    var home = safeUrl(f.homepage);
    if (home) links.unshift(h('a', { class: 'btn primary', href: home, target: '_blank', rel: 'noopener', text: t.homepage }));
    var phone = firstPhone(f.tel);
    if (phone) links.push(h('a', { class: 'btn', href: 'tel:' + phone.replace(/[^\d+]/g, ''), text: t.call + ' ' + phone }));

    var body = $('dlgBody');
    body.textContent = '';
    body.append(
      h('div', { class: 'dhead' + (live ? ' live' : '') }, h('span', { class: 'cdate', text: rangeText(f.start, f.end) }), live ? h('span', { class: 'flag', text: t.ongoing }) : null),
      h('div', { class: 'dbody' },
        h('h2', { class: 'dname', id: 'dlgName', text: x.name }),
        loc ? h('p', { class: 'dloc', text: loc }) : null,
        x.place ? h('p', { class: 'dsub', text: x.place }) : null,
        f.address ? h('p', { class: 'dsub', text: t.address + ': ' + f.address }) : null,
        (state.lang !== 'ko' && !x.translated) ? h('p', { class: 'notice', text: t.untranslated }) : null,
        x.overview ? h('div', { class: 'dsec' }, h('h3', { text: t.overview }), h('p', { class: 'ov', text: x.overview })) : null,
        x.activities.length ? h('div', { class: 'dsec' }, h('h3', { text: t.activities }),
          h('div', { class: 'tags' }, x.activities.map(function (a) { return h('span', { class: 'tag', text: a }); }))) : null,
        coords ? h('div', { class: 'map', id: 'map', role: 'img', 'aria-label': x.name }) : null,
        h('div', { class: 'links' }, links)));

    $('dlgClose').setAttribute('aria-label', t.close);
    var dlg = $('dlg');
    if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
    document.body.style.overflow = 'hidden';
    dlg.scrollTop = 0;
    if (coords) initMap(f.lat, f.lng, x.name);
  }

  function closeDetail() {
    var dlg = $('dlg');
    if (typeof dlg.close === 'function') { if (dlg.open) dlg.close(); } else dlg.removeAttribute('open');
    onDialogClosed();
  }
  function onDialogClosed() {
    document.body.style.overflow = '';
    if (mapInstance) { mapInstance.remove(); mapInstance = null; }
  }

  function loadLeaflet() {
    if (window.L) return Promise.resolve();
    if (leafletPromise) return leafletPromise;
    leafletPromise = new Promise(function (resolve, reject) {
      document.head.append(h('link', { rel: 'stylesheet', href: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css' }));
      document.head.append(h('script', {
        src: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js',
        onload: function () { resolve(); },
        onerror: function () { leafletPromise = null; reject(new Error('leaflet')); }
      }));
    });
    return leafletPromise;
  }
  function initMap(lat, lng, name) {
    loadLeaflet().then(function () {
      var el = $('map');
      if (!el || !$('dlg').open) return;
      if (mapInstance) { mapInstance.remove(); mapInstance = null; }
      mapInstance = window.L.map(el, { scrollWheelZoom: false }).setView([lat, lng], 15);
      window.L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(mapInstance);
      var pop = document.createElement('div');
      pop.textContent = name;
      window.L.marker([lat, lng]).addTo(mapInstance).bindPopup(pop);
      setTimeout(function () { if (mapInstance) mapInstance.invalidateSize(); }, 120);
    }).catch(function () {
      var el = $('map');
      if (el) el.remove();
    });
  }

  /* ---------- 언어 ---------- */
  function initialLang() {
    try { var s = localStorage.getItem('festival_lang'); if (s && T[s]) return s; } catch (e) { /* 저장소 사용 불가 */ }
    var n = (navigator.language || 'ko').toLowerCase();
    if (n.indexOf('ko') === 0) return 'ko';
    if (n.indexOf('ja') === 0) return 'ja';
    if (n.indexOf('zh') === 0) return 'cn';
    return 'en';
  }
  function setLang(code) {
    state.lang = code;
    try { localStorage.setItem('festival_lang', code); } catch (e) { /* 무시 */ }
    applyLang();
  }
  function applyLang() {
    var t = tx();
    document.documentElement.lang = langCfg().html;
    document.title = t.title;
    $('title').textContent = t.title;
    $('tagline').textContent = t.tagline;
    $('q').placeholder = t.search;
    $('q').setAttribute('aria-label', t.search);
    $('foot').textContent = t.source;
    Array.prototype.forEach.call($('langs').children, function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-code') === state.lang ? 'true' : 'false');
    });
    if (!state.ready) { $('metaline').textContent = ''; return; }
    $('metaline').textContent = t.meta(state.festivals.filter(function (f) { return f.end >= state.today; }).length, state.generatedAt);
    $('stripCap').textContent = t.stripCap;
    buildRegionUI();
    renderStrip(false);
    renderList();
    updateRegionUI();
  }

  /* ---------- 데이터 ---------- */
  function fetchData() {
    var i = 0;
    function next(lastErr) {
      if (i >= DATA_URLS.length) return Promise.reject(lastErr || new Error('no source'));
      var url = DATA_URLS[i++];
      return fetch(url).then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      }).then(function (d) {
        if (!d || !Array.isArray(d.festivals)) throw new Error('bad format');
        return d;
      }).catch(next);
    }
    return next();
  }

  function prepare(d) {
    state.generatedAt = d.generatedAt || '';
    state.festivals = d.festivals.filter(function (f) { return f && f.name && /^\d{4}-\d{2}-\d{2}$/.test(f.start || ''); }).map(function (f) {
      f.end = /^\d{4}-\d{2}-\d{2}$/.test(f.end || '') ? f.end : f.start;
      f.activities = Array.isArray(f.activities) ? f.activities : [];
      var names = [f.name, f.sido, f.sigungu];
      Object.keys(f.i18n || {}).forEach(function (lg) {
        var t = f.i18n[lg] || {};
        names.push(t.name, t.sido, t.sigungu);
        if (t.sido && f.sido && state.sidoMap[lg] && !state.sidoMap[lg][f.sido]) state.sidoMap[lg][f.sido] = t.sido;
      });
      f._search = names.filter(Boolean).join(' ').toLowerCase();
      return f;
    });
  }

  function setStatus(msg, withRetry) {
    var el = $('status');
    el.textContent = '';
    el.hidden = !msg;
    if (msg) el.append(msg);
    if (msg && withRetry) {
      el.append(document.createElement('br'));
      el.append(h('button', { class: 'btn', type: 'button', text: tx().retry, onclick: boot }));
    }
  }

  /* ---------- 날짜가 바뀌었을 때: 오늘 기준으로 월 범위와 마감된 축제를 다시 계산 ---------- */
  function recomputeWindow(keep) {
    state.today = isoLocal(new Date());
    state.windowEnd = addMonthsISO(state.today, 6);
    state.months = buildMonths();
    var idx = 0;
    if (keep) state.months.forEach(function (mo, i) { if (mo.y === keep.y && mo.m === keep.m) idx = i; });
    state.month = idx;
    state.limit = PAGE_SIZE;
  }
  function currentMonthKey() {
    var mo = state.months[state.month];
    return mo ? { y: mo.y, m: mo.m } : null;
  }
  function boot() {
    setStatus(tx().loading, false);
    fetchData().then(function (d) {
      prepare(d);
      state.months = buildMonths();
      state.month = 0;
      state.ready = true;
      setStatus('', false);
      $('stripSection').hidden = false;
      $('filters').hidden = false;
      $('list').hidden = false;
      $('mapPanel').hidden = false;
      applyLang();
      renderStrip(true);
    }).catch(function () {
      setStatus(tx().error, true);
    });
  }

  function start() {
    state.today = isoLocal(new Date());
    state.windowEnd = addMonthsISO(state.today, 6);
    state.lang = initialLang();

    var langs = $('langs');
    LANGS.forEach(function (l) {
      langs.append(h('button', { type: 'button', 'data-code': l.code, lang: l.html, text: l.label, 'aria-pressed': 'false', onclick: function () { setLang(l.code); } }));
    });
    $('q').addEventListener('input', function (e) {
      var v = e.target.value.trim().toLowerCase();
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () { state.q = v; filtersChanged(); }, 150);
    });
    $('mapOpen').addEventListener('click', openSheet);
    $('sheetDone').addEventListener('click', closeSheet);
    $('mapSheet').addEventListener('click', function (e) { if (e.target === $('mapSheet')) closeSheet(); });
    $('mapSheet').addEventListener('close', function () { document.body.style.overflow = ''; });
    if (window.matchMedia) {
      var wide = window.matchMedia('(min-width: 1000px)');
      var onWide = function (e) { if (e.matches) closeSheet(); };
      if (wide.addEventListener) wide.addEventListener('change', onWide); else if (wide.addListener) wide.addListener(onWide);
    }
    // 탭을 켜 둔 채 날짜가 바뀌면, 다시 볼 때 오늘 기준으로 목록을 새로 계산
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState !== 'visible' || !state.ready) return;
      if (isoLocal(new Date()) === state.today) return;
      recomputeWindow(currentMonthKey());
      applyLang();
    });
    $('more').addEventListener('click', function () { state.limit += PAGE_SIZE; renderList(); });
    $('dlgClose').addEventListener('click', closeDetail);
    $('dlg').addEventListener('click', function (e) { if (e.target === $('dlg')) closeDetail(); });
    $('dlg').addEventListener('close', onDialogClosed);

    applyLang();
    boot();
  }

  start();
})();
</script>
</body>
</html>
