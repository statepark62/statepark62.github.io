<style>
  :root {
    --paper: #f3f5f1;
    --ink: #1d2b25;
    --muted: #53635b;
    --line: #c9d4cc;
    --jade: #2d6a4f;
    --lantern: #cf3a1f;
    --gold: #e2a72e;
    --display: "Black Han Sans", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;

  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { font-family: var(--text); font-size: 18.5px; line-height: 1.65; color: var(--ink); background: var(--paper); }
  :focus-visible { outline: 3px solid var(--lantern); outline-offset: 2px; }
  button { font-family: inherit; }

  /* 일본어·중국어는 현수막 글꼴 대신 굵은 고딕으로 */
  html[lang="ja"] .display, html[lang="zh-CN"] .display { font-family: var(--text); font-weight: 900; }

  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
  .ribbon { height: 8px; background: repeating-linear-gradient(90deg, #2457a6 0 48px, #cf3a1f 48px 96px, #e2a72e 96px 144px, #ffffff 144px 192px, #1d2b25 192px 240px); }

  /* 머리글 */
  .top { text-align: center; padding: 34px 20px 4px; }
  .lantern svg { width: 54px; height: auto; display: inline-block; }
  h1.display { font-family: var(--display); font-weight: 400; font-size: clamp(34px, 7vw, 50px); line-height: 1.2; margin-top: 8px; }
  .tagline { font-size: 19.5px; margin-top: 10px; }
  .metaline { font-size: 16.5px; color: var(--muted); margin-top: 2px; }
  .langs { display: inline-flex; margin-top: 20px; border: 2px solid var(--ink); border-radius: 4px; overflow: hidden; }
  .langs button { font-size: 16.5px; padding: 9px 16px; min-height: 44px; background: transparent; color: var(--ink); border: 0; border-right: 2px solid var(--ink); cursor: pointer; }
  .langs button:last-child { border-right: 0; }
  .langs button[aria-pressed="true"] { background: var(--ink); color: #fff; }

  /* 6개월 분포 띠 */
  .strip { display: flex; gap: 6px; margin-top: 26px; }
  .seg { flex: 1 1 0; min-width: 0; color: inherit; background: transparent; border: 2px solid transparent; border-radius: 4px; padding: 8px 4px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
  .seg .mname { font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1.15; }
  html[lang="ja"] .seg .mname, html[lang="zh-CN"] .seg .mname { font-family: var(--text); font-weight: 900; }
  .seg .myear { font-size: 12.5px; color: var(--muted); line-height: 1.2; }
  .seg .mcount { font-size: 15px; color: var(--muted); margin-bottom: 6px; line-height: 1.3; }
  .seg .bars { display: flex; align-items: flex-end; gap: 1px; width: 100%; height: 72px; }
  .seg .bar { display: block; flex: 1 1 0; min-width: 0; border-radius: 1px 1px 0 0; opacity: .55; }
  .seg[aria-selected="true"] { background: #fff; border-color: var(--jade); }
  .seg[aria-selected="true"] .bar { opacity: 1; }
  .seg[aria-selected="true"] .mname { color: var(--jade); }
  .intro .bar { transform-origin: bottom; animation: grow .7s cubic-bezier(.2,.7,.2,1) both; animation-delay: calc(var(--i) * 3ms); }
  @keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
  @media (prefers-reduced-motion: reduce) { .intro .bar { animation: none; } }
  .cap { text-align: center; font-size: 15.5px; color: var(--muted); margin-top: 8px; }

  /* 검색·지역 */
  .filters { margin-top: 26px; text-align: center; }
  #q { width: min(100%, 520px); font: inherit; font-size: 18px; padding: 12px 16px; border: 2px solid var(--ink); border-radius: 4px; background: #fff; color: var(--ink); text-align: center; }
  .regions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .rchip { font-size: 16.5px; padding: 7px 14px; border: 1.5px solid #8ea196; border-radius: 3px; background: #fff; color: var(--ink); cursor: pointer; }
  .rchip[aria-pressed="true"] { background: var(--jade); border-color: var(--jade); color: #fff; }
  .rchip .n { margin-left: 6px; font-size: 14px; opacity: .75; }
  .linkbtn { font-size: 16px; margin-top: 10px; background: none; border: 0; color: var(--jade); text-decoration: underline; cursor: pointer; padding: 6px 10px; }

  /* 목록 */
  #list { margin-top: 34px; }
  #listTitle { font-family: var(--display); font-weight: 400; font-size: 28px; text-align: center; line-height: 1.3; margin-bottom: 22px; }
  html[lang="ja"] #listTitle, html[lang="zh-CN"] #listTitle { font-family: var(--text); font-weight: 900; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 20px; }
  .card { display: flex; flex-direction: column; background: #fff; border: 1px solid var(--line); border-radius: 4px; cursor: pointer; overflow: hidden; }
  .card:hover { border-color: var(--jade); }
  .band { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 10px; padding: 11px 14px; background: var(--jade); color: #fff; font-family: var(--display); font-weight: 400; font-size: 20px; line-height: 1.25; text-align: center; }
  html[lang="ja"] .band, html[lang="zh-CN"] .band { font-family: var(--text); font-weight: 900; }
  .card.live .band, .dlg-band.live { background: var(--lantern); }
  .flag { font-family: var(--text); font-weight: 700; font-size: 14px; border: 1.5px solid #fff; border-radius: 3px; padding: 0 7px; line-height: 1.5; }
  .cbody { padding: 18px 18px 20px; text-align: center; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .cname { font-size: 21px; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
  .cloc { font-size: 16px; color: var(--muted); }
  .csum { font-size: 17px; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .tags { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: auto; padding-top: 6px; }
  .tag { font-size: 15px; line-height: 1.4; color: var(--jade); border: 1px solid var(--jade); border-radius: 3px; padding: 2px 9px; max-width: 100%; overflow-wrap: anywhere; }
  .more { text-align: center; margin-top: 26px; }
  .status, .empty { text-align: center; color: var(--muted); padding: 34px 10px; font-size: 18px; }
  .btn { font-size: 17px; padding: 11px 18px; min-height: 44px; border: 2px solid var(--ink); border-radius: 4px; background: #fff; color: var(--ink); cursor: pointer; text-decoration: none; display: inline-block; line-height: 1.3; }
  .btn.primary { background: var(--jade); border-color: var(--jade); color: #fff; }

  .foot { margin-top: 56px; padding: 22px 20px 40px; border-top: 1px solid var(--line); text-align: center; color: var(--muted); font-size: 15.5px; }

  /* 상세 */
  dialog { border: 0; padding: 0; background: #fff; color: var(--ink); width: min(720px, calc(100vw - 20px)); max-height: calc(100vh - 24px); border-radius: 4px; overflow: auto; margin: auto; }
  dialog::backdrop { background: rgba(18, 30, 24, .66); }
  .dlg-bar { position: sticky; top: 0; height: 0; z-index: 5; text-align: right; }
  .dlg-close { position: relative; top: 10px; right: 10px; width: 44px; height: 44px; border: 2px solid var(--ink); border-radius: 4px; background: #fff; color: var(--ink); font-size: 26px; line-height: 1; cursor: pointer; }
  .dlg-band { font-size: 22px; padding: 18px 64px; }
  .dbody { padding: 26px 28px 32px; }
  .dname { font-size: 28px; font-weight: 700; line-height: 1.35; text-align: center; overflow-wrap: anywhere; }
  .dloc { text-align: center; color: var(--ink); font-size: 18px; margin-top: 8px; }
  .dsub { text-align: center; color: var(--muted); font-size: 16px; margin-top: 2px; overflow-wrap: anywhere; }
  .notice { background: #eaf0eb; border: 1px solid var(--line); border-radius: 3px; text-align: center; font-size: 15.5px; padding: 8px 12px; margin-top: 18px; }
  .dsec { margin-top: 26px; }
  .dsec h3 { font-size: 21px; text-align: center; margin-bottom: 12px; }
  .ov { white-space: pre-line; font-size: 18.5px; line-height: 1.85; text-align: left; overflow-wrap: anywhere; }
  .dsec .tags { margin-top: 0; padding-top: 0; }
  .dsec .tag { font-size: 16.5px; padding: 4px 12px; }
  .map { height: 280px; margin-top: 26px; border: 1px solid var(--line); border-radius: 3px; }
  .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 24px; }

  @media (max-width: 640px) {
    .wrap { padding: 0 14px; }
    .seg .mname { font-size: 18px; }
    .seg .mcount { font-size: 13px; }
    .seg .myear { font-size: 11px; }
    .seg .bars { height: 56px; }
    .strip { gap: 3px; }
    .dbody { padding: 22px 18px 28px; }
    .dname { font-size: 25px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>
</head>

  function h(tag, props) {
    var el = document.createElement(tag);
    if (props) {
      Object.keys(props).forEach(function (k) {
        var v = props[k];
        if (v === null || v === undefined || v === false) return;
        if (k === 'class') el.className = v;
        else if (k === 'text') el.textContent = v;
        else if (k === 'style') el.style.cssText = v;

  function isoLocal(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseISO(s) { var p = s.split('-'); return { y: +p[0], m: +p[1], d: +p[2] }; }
  function utcDay(s) { var p = parseISO(s); return Date.UTC(p.y, p.m - 1, p.d) / 864e5; }
  function dayOffset(s) { return utcDay(s) - utcDay(state.today); }
  function daysIn(y, m) { return new Date(y, m, 0).getDate(); }
  function dateObj(s) { var p = parseISO(s); return new Date(p.y, p.m - 1, p.d); }
  function addMonthsISO(s, n) {
    var p = parseISO(s);
    var first = new Date(Date.UTC(p.y, p.m - 1 + n, 1));
    var y = first.getUTCFullYear(), m = first.getUTCMonth() + 1;
    return y + '-' + pad(m) + '-' + pad(Math.min(p.d, daysIn(y, m)));
  }
  function fmtDate(s) {
    var opt = { month: 'short', day: 'numeric' };
    if (parseISO(s).y !== parseISO(state.today).y) opt.year = 'numeric';
    return new Intl.DateTimeFormat(langCfg().loc, opt).format(dateObj(s));
  }
  function rangeText(a, b) { return a === b ? fmtDate(a) : fmtDate(a) + ' – ' + fmtDate(b); }
  function monthName(y, m) { return new Intl.DateTimeFormat(langCfg().loc, { month: 'short' }).format(new Date(y, m - 1, 1)); }

  function buildMonths() {
    var t = parseISO(state.today), e = parseISO(state.windowEnd);
    var arr = [], y = t.y, m = t.m;
    while (y * 12 + m <= e.y * 12 + e.m) {
      var first = y + '-' + pad(m) + '-01';
      var last = y + '-' + pad(m) + '-' + pad(daysIn(y, m));
      arr.push({
        y: y, m: m, first: first, last: last,
        from: (y === t.y && m === t.m) ? state.today : first,
        to: (y === e.y && m === e.m) ? state.windowEnd : last
      });
      m++; if (m > 12) { m = 1; y++; }
    }
    return arr;
  }

  /* ---------- 현지어 값 (번역이 없으면 한국어로 대체) ---------- */
  function L(f, lang) {
    var t = lang === 'ko' ? null : (f.i18n && f.i18n[lang]);
    return {
      translated: !!t,
      name: (t && t.name) || f.name,
      sido: (t && t.sido) || f.sido,
      sigungu: (t && t.sigungu) || f.sigungu,
      place: (t && t.place) || f.place,
      overview: (t && t.overview) || f.overview,
      activities: (t && t.activities && t.activities.length) ? t.activities : (f.activities || [])
    };
  }
  function sidoLabel(ko) { return state.lang === 'ko' ? ko : (state.sidoMap[state.lang][ko] || ko); }

  function validCoord(f) {
    var la = f.lat, ln = f.lng;
    return typeof la === 'number' && typeof ln === 'number' && la >= 33 && la <= 39 && ln >= 124 && ln <= 132;
  }

  /* ---------- 필터 ---------- */
  function matches(f) {
    if (f.end < state.today) return false;
    if (state.regions.size && !state.regions.has(f.sido)) return false;
    if (state.q && f._search.indexOf(state.q) < 0) return false;
    return true;
  }
  function overlaps(f, mo) { return f.start <= mo.to && f.end >= mo.from; }
  function currentList() {
    var mo = state.months[state.month];
    return state.festivals.filter(function (f) { return matches(f) && overlaps(f, mo); })
      .sort(function (a, b) { return a.start < b.start ? -1 : a.start > b.start ? 1 : (a.name < b.name ? -1 : a.name > b.name ? 1 : 0); });
  }

  /* ---------- 6개월 분포 띠 ---------- */
  function barColor(t) {
    var a = [226, 167, 46], b = [207, 58, 31];
    var c = a.map(function (v, i) { return Math.round(v + (b[i] - v) * t); });
    return 'rgb(' + c.join(',') + ')';
  }
  function renderStrip(intro) {
    var strip = $('strip');
    strip.textContent = '';
    strip.className = 'strip' + (intro ? ' intro' : '');
    strip.setAttribute('aria-label', tx().stripLabel);

    var total = dayOffset(state.windowEnd) + 1;
    var counts = new Array(total).fill(0);
    var monthCounts = state.months.map(function () { return 0; });
    state.festivals.forEach(function (f) {
      if (!matches(f)) return;
      state.months.forEach(function (mo, i) { if (overlaps(f, mo)) monthCounts[i]++; });
      var s = Math.max(dayOffset(f.start), 0), e = Math.min(dayOffset(f.end), total - 1);
      for (var d = s; d <= e; d++) counts[d]++;
    });
    var max = 1;
    counts.forEach(function (c) { if (c > max) max = c; });

    state.segEls = [];
    state.months.forEach(function (mo, i) {
      var bars = h('div', { class: 'bars', 'aria-hidden': 'true' });
      var from = dayOffset(mo.from), to = dayOffset(mo.to);
      for (var d = from; d <= to; d++) {
        var c = counts[d] || 0;
        var pct = c === 0 ? 3 : 12 + 88 * c / max;
        var iso = new Date(dateObj(state.today).getTime());
        iso.setDate(iso.getDate() + d);
        bars.append(h('span', {
          class: 'bar', style: '--i:' + d + ';height:' + pct + '%;background:' + (c === 0 ? 'var(--line)' : barColor(c / max)),
          title: fmtDate(isoLocal(iso)) + ': ' + c
        }));
      }
      var showYear = i === 0 || mo.m === 1;
      var seg = h('button', {
        type: 'button', class: 'seg', role: 'tab', id: 'seg' + i,
        'aria-selected': i === state.month ? 'true' : 'false', 'aria-controls': 'list',
        onclick: function () { selectMonth(i); }
      },
        h('span', { class: 'mname', text: monthName(mo.y, mo.m) }),
        h('span', { class: 'myear', text: showYear ? String(mo.y) : '\u00a0' }),
        h('span', { class: 'mcount', text: String(monthCounts[i]) }),
        bars);
      strip.append(seg);
      state.segEls.push(seg);
    });
  }
  function selectMonth(i) {
    state.month = i; state.limit = PAGE_SIZE;
    state.segEls.forEach(function (el, j) { el.setAttribute('aria-selected', j === i ? 'true' : 'false'); });
    renderList();
  }

  /* ---------- 지역 칩 ---------- */
  function renderRegions() {
    var box = $('regions');
    box.textContent = '';
    var counts = {};
    state.festivals.forEach(function (f) { if (f.end >= state.today && f.sido) counts[f.sido] = (counts[f.sido] || 0) + 1; });
    Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a] || a.localeCompare(b, 'ko'); }).forEach(function (ko) {
      var b = h('button', { type: 'button', class: 'rchip', 'aria-pressed': state.regions.has(ko) ? 'true' : 'false' },
        sidoLabel(ko), h('span', { class: 'n', text: String(counts[ko]) }));
      b.addEventListener('click', function () {
        if (state.regions.has(ko)) state.regions.delete(ko); else state.regions.add(ko);
        b.setAttribute('aria-pressed', state.regions.has(ko) ? 'true' : 'false');
        filtersChanged();
      });
      box.append(b);
    });
    $('clearRegions').hidden = state.regions.size === 0;
  }
  function filtersChanged() {
    state.limit = PAGE_SIZE;
    $('clearRegions').hidden = state.regions.size === 0;
    renderStrip(false);
    renderList();
  }

  /* ---------- 목록 ---------- */
  function renderList() {
    var t = tx(), mo = state.months[state.month];
    var list = currentList();
    $('listTitle').textContent = t.monthList(monthName(mo.y, mo.m), list.length);
    $('list').setAttribute('aria-labelledby', 'seg' + state.month);
    var grid = $('grid');
    grid.textContent = '';
    list.slice(0, state.limit).forEach(function (f) { grid.append(card(f)); });
    $('empty').hidden = list.length > 0;
    $('empty').textContent = t.empty;
    var remain = list.length - state.limit;
    var more = $('more');
    more.hidden = remain <= 0;
    if (remain > 0) more.textContent = t.more(remain);
  }

  function card(f) {
    var x = L(f, state.lang), t = tx();
    var live = f.start <= state.today && f.end >= state.today;
    var summary = (x.overview || '').replace(/\s+/g, ' ').slice(0, 220);
    var loc = [x.sido, x.sigungu].filter(Boolean).join(' ');
    var el = h('article', { class: 'card' + (live ? ' live' : ''), role: 'button', tabindex: '0', 'aria-haspopup': 'dialog' },
      h('div', { class: 'band' }, h('span', { text: rangeText(f.start, f.end) }), live ? h('span', { class: 'flag', text: t.ongoing }) : null),
      h('div', { class: 'cbody' },
        h('h3', { class: 'cname', text: x.name }),
        loc ? h('p', { class: 'cloc', text: loc }) : null,
        summary ? h('p', { class: 'csum', text: summary }) : null,
        x.activities.length ? h('div', { class: 'tags' }, x.activities.slice(0, 3).map(function (a) { return h('span', { class: 'tag', text: a }); })) : null));
    el.addEventListener('click', function () { openDetail(f); });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDetail(f); }
    });
    return el;
  }

  /* ---------- 상세 ---------- */
  function safeUrl(u) { return /^https?:\/\//i.test(String(u || '')) ? u : ''; }
  function firstPhone(s) {
    var m = String(s || '').match(/\+?\d[\d\-\s()]{6,}\d/);
    return m ? m[0].trim() : '';
  }

  function openDetail(f) {
    var t = tx(), x = L(f, state.lang);
    var live = f.start <= state.today && f.end >= state.today;
    var coords = validCoord(f);
    var loc = [x.sido, x.sigungu].filter(Boolean).join(' ');
    var q = encodeURIComponent(f.name);
    var gmap = coords
      ? 'https://www.google.com/maps/search/?api=1&query=' + f.lat + ',' + f.lng
      : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(f.address || f.name);
    var links = [h('a', { class: 'btn', href: gmap, target: '_blank', rel: 'noopener', text: t.google })];
    links.push(h('a', { class: 'btn', href: 'https://map.naver.com/p/search/' + q, target: '_blank', rel: 'noopener', text: t.naver }));
    if (coords) links.push(h('a', { class: 'btn', href: 'https://map.kakao.com/link/map/' + q + ',' + f.lat + ',' + f.lng, target: '_blank', rel: 'noopener', text: t.kakao }));
    var home = safeUrl(f.homepage);
    if (home) links.unshift(h('a', { class: 'btn primary', href: home, target: '_blank', rel: 'noopener', text: t.homepage }));
    var phone = firstPhone(f.tel);
    if (phone) links.push(h('a', { class: 'btn', href: 'tel:' + phone.replace(/[^\d+]/g, ''), text: t.call + ' ' + phone }));

    var body = $('dlgBody');
    body.textContent = '';
    body.append(
      h('div', { class: 'band dlg-band' + (live ? ' live' : '') }, h('span', { text: rangeText(f.start, f.end) }), live ? h('span', { class: 'flag', text: t.ongoing }) : null),
      h('div', { class: 'dbody' },
        h('h2', { class: 'dname', id: 'dlgName', text: x.name }),
        loc ? h('p', { class: 'dloc', text: loc }) : null,
        x.place ? h('p', { class: 'dsub', text: x.place }) : null,
        f.address ? h('p', { class: 'dsub', text: t.address + ': ' + f.address }) : null,
        (state.lang !== 'ko' && !x.translated) ? h('p', { class: 'notice', text: t.untranslated }) : null,
        x.overview ? h('div', { class: 'dsec' }, h('h3', { text: t.overview }), h('p', { class: 'ov', text: x.overview })) : null,
        x.activities.length ? h('div', { class: 'dsec' }, h('h3', { text: t.activities }),
          h('div', { class: 'tags' }, x.activities.map(function (a) { return h('span', { class: 'tag', text: a }); }))) : null,
        coords ? h('div', { class: 'map', id: 'map', role: 'img', 'aria-label': x.name }) : null,
        h('div', { class: 'links' }, links)));

    $('dlgClose').setAttribute('aria-label', t.close);
    var dlg = $('dlg');
    if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
    document.body.style.overflow = 'hidden';
    dlg.scrollTop = 0;
    if (coords) initMap(f.lat, f.lng, x.name);
  }

  function closeDetail() {
    var dlg = $('dlg');
    if (typeof dlg.close === 'function') { if (dlg.open) dlg.close(); } else dlg.removeAttribute('open');
    onDialogClosed();
  }
  function onDialogClosed() {
    document.body.style.overflow = '';
    if (mapInstance) { mapInstance.remove(); mapInstance = null; }
  }

  function loadLeaflet() {
    if (window.L) return Promise.resolve();
    if (leafletPromise) return leafletPromise;
    leafletPromise = new Promise(function (resolve, reject) {
      document.head.append(h('link', { rel: 'stylesheet', href: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css' }));
      document.head.append(h('script', {
        src: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js',
        onload: function () { resolve(); },
        onerror: function () { leafletPromise = null; reject(new Error('leaflet')); }
      }));
    });
    return leafletPromise;
  }
  function initMap(lat, lng, name) {
    loadLeaflet().then(function () {
      var el = $('map');
      if (!el || !$('dlg').open) return;
      if (mapInstance) { mapInstance.remove(); mapInstance = null; }
      mapInstance = window.L.map(el, { scrollWheelZoom: false }).setView([lat, lng], 15);
      window.L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(mapInstance);
      var pop = document.createElement('div');
      pop.textContent = name;
      window.L.marker([lat, lng]).addTo(mapInstance).bindPopup(pop);
      setTimeout(function () { if (mapInstance) mapInstance.invalidateSize(); }, 120);
    }).catch(function () {
      var el = $('map');
      if (el) el.remove();
    });
  }

  /* ---------- 언어 ---------- */
  function initialLang() {
    try { var s = localStorage.getItem('festival_lang'); if (s && T[s]) return s; } catch (e) { /* 저장소 사용 불가 */ }
    var n = (navigator.language || 'ko').toLowerCase();
    if (n.indexOf('ko') === 0) return 'ko';
    if (n.indexOf('ja') === 0) return 'ja';
    if (n.indexOf('zh') === 0) return 'cn';
    return 'en';
  }
  function setLang(code) {
    state.lang = code;
    try { localStorage.setItem('festival_lang', code); } catch (e) { /* 무시 */ }
    applyLang();
  }
  function applyLang() {
    var t = tx();
    document.documentElement.lang = langCfg().html;
    document.title = t.title;
    $('title').textContent = t.title;
    $('tagline').textContent = t.tagline;
    $('q').placeholder = t.search;
    $('q').setAttribute('aria-label', t.search);
    $('clearRegions').textContent = t.clearRegions;
    $('foot').textContent = t.source;
    Array.prototype.forEach.call($('langs').children, function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-code') === state.lang ? 'true' : 'false');
    });
    if (!state.ready) { $('metaline').textContent = ''; return; }
    $('metaline').textContent = t.meta(state.festivals.filter(function (f) { return f.end >= state.today; }).length, state.generatedAt);
    $('stripCap').textContent = t.stripCap;
    renderRegions();
    renderStrip(false);
    renderList();
  }

  /* ---------- 데이터 ---------- */
  function fetchData() {
    var i = 0;
    function next(lastErr) {
      if (i >= DATA_URLS.length) return Promise.reject(lastErr || new Error('no source'));
      var url = DATA_URLS[i++];
      return fetch(url).then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      }).then(function (d) {
        if (!d || !Array.isArray(d.festivals)) throw new Error('bad format');
        return d;
      }).catch(next);
    }
    return next();
  }

  function prepare(d) {
    state.generatedAt = d.generatedAt || '';
    state.festivals = d.festivals.filter(function (f) { return f && f.name && /^\d{4}-\d{2}-\d{2}$/.test(f.start || ''); }).map(function (f) {
      f.end = /^\d{4}-\d{2}-\d{2}$/.test(f.end || '') ? f.end : f.start;
      f.activities = Array.isArray(f.activities) ? f.activities : [];
      var names = [f.name, f.sido, f.sigungu];
      Object.keys(f.i18n || {}).forEach(function (lg) {
        var t = f.i18n[lg] || {};
        names.push(t.name, t.sido, t.sigungu);
        if (t.sido && f.sido && state.sidoMap[lg] && !state.sidoMap[lg][f.sido]) state.sidoMap[lg][f.sido] = t.sido;
      });
      f._search = names.filter(Boolean).join(' ').toLowerCase();
      return f;
    });
  }

  function setStatus(msg, withRetry) {
    var el = $('status');
    el.textContent = '';
    el.hidden = !msg;
    if (msg) el.append(msg);
    if (msg && withRetry) {
      el.append(document.createElement('br'));
      el.append(h('button', { class: 'btn', type: 'button', text: tx().retry, onclick: boot }));
    }
  }

  function boot() {
    setStatus(tx().loading, false);
    fetchData().then(function (d) {
      prepare(d);
      state.months = buildMonths();
      state.month = 0;
      state.ready = true;
      setStatus('', false);
      $('stripSection').hidden = false;
      $('filters').hidden = false;
      $('list').hidden = false;
      applyLang();
      renderStrip(true);
    }).catch(function () {
      setStatus(tx().error, true);
    });
  }

  function start() {
    state.today = isoLocal(new Date());
    state.windowEnd = addMonthsISO(state.today, 6);
    state.lang = initialLang();

    var langs = $('langs');
    LANGS.forEach(function (l) {
      langs.append(h('button', { type: 'button', 'data-code': l.code, lang: l.html, text: l.label, 'aria-pressed': 'false', onclick: function () { setLang(l.code); } }));
    });
    $('q').addEventListener('input', function (e) {
      var v = e.target.value.trim().toLowerCase();
      clearTimeout(searchTimer);
      searchTimer = setTimeout(function () { state.q = v; filtersChanged(); }, 150);
    });
    $('clearRegions').addEventListener('click', function () {
      state.regions.clear();
      Array.prototype.forEach.call($('regions').children, function (b) { b.setAttribute('aria-pressed', 'false'); });
      filtersChanged();
    });
    $('more').addEventListener('click', function () { state.limit += PAGE_SIZE; renderList(); });
    $('dlgClose').addEventListener('click', closeDetail);
    $('dlg').addEventListener('click', function (e) { if (e.target === $('dlg')) closeDetail(); });
    $('dlg').addEventListener('close', onDialogClosed);

    applyLang();
    boot();
  }

  start();
})();
</script>
</body>
</html>
