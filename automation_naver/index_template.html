<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天声人語로 배우는 일본어 — 전체 목록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;800&family=Noto+Serif+KR:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F6F2E9; --ink:#26221C; --ink-soft:#6E6558;
    --shu:#BE3A34; --ai:#33547A; --line:#DCD3C2; --card:#FCFAF4;
    --ja:'Shippori Mincho','Noto Serif KR',serif;
    --ko:'Noto Serif KR',serif;
    --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--ko);line-height:1.75;
    background-image:radial-gradient(rgba(38,34,28,0.035) 1px, transparent 1px);
    background-size:22px 22px;
  }
  a{color:inherit;text-decoration:none}
  a:focus-visible{outline:2px solid var(--shu);outline-offset:3px}
  .frame{max-width:1400px;margin:0 auto;padding:56px 24px 64px}

  header{display:flex;align-items:center;gap:18px;margin-bottom:8px}
  .seal{
    width:56px;height:56px;border:2.5px solid var(--shu);color:var(--shu);
    display:grid;place-items:center;font-family:var(--ja);font-weight:800;
    font-size:17px;line-height:1.15;writing-mode:vertical-rl;letter-spacing:2px;
    border-radius:4px;flex:none;
  }
  h1{font-family:var(--ja);font-weight:800;font-size:clamp(26px,5vw,36px);letter-spacing:4px}
  .sub{font-size:14px;color:var(--ink-soft);margin-bottom:34px}


  /* 월 넘김 */
  .js .cal-month{display:none}
  .js .cal-month.on{display:block}
  .js .cal-month h2{display:none}
  .pager{display:flex;align-items:center;justify-content:center;gap:14px;margin:0 0 18px}
  .pager button{
    font-family:var(--ja);font-size:16px;font-weight:700;padding:8px 16px;
    background:var(--card);color:var(--ink);border:1.5px solid var(--ink);
    border-radius:4px;cursor:pointer;
  }
  .pager button:disabled{opacity:.3;cursor:default}
  .pager select{
    font-family:var(--ja);font-size:19px;font-weight:700;padding:7px 10px;
    background:var(--card);color:var(--ink);border:1.5px solid var(--ink);border-radius:4px;
  }
  .cal-month{margin-bottom:40px}
  .cal-month h2{
    font-family:var(--ja);font-weight:700;font-size:19px;letter-spacing:1px;
    margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--ink);
  }
  .cal-weekdays{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px}
  .cal-weekdays .wd{
    font-family:var(--mono);font-size:16.5px;color:var(--ink-soft);
    text-align:center;padding:4px 0;
  }
  .cal-weekdays .wd:first-child{color:var(--shu)}

  .cal-grid{
    display:grid;grid-template-columns:repeat(7,1fr);gap:1px;
    background:var(--line);border:1px solid var(--line);
  }
  .day{
    background:var(--paper);min-height:90px;padding:9px 9px 12px;
    display:flex;flex-direction:column;gap:4px;
    min-width:0;
  }
  .day.pad{background:transparent}
  .day .num{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
  a.day.has{transition:background .15s}
  a.day.has{background:var(--card)}
  a.day.has:hover{background:#F0E6D2}
  a.day.has .num{color:var(--shu);font-weight:700}
  .day .ttl-ja{
    font-family:var(--ja);font-weight:600;font-size:17px;line-height:1.55;
    color:var(--ink);
    overflow-wrap:break-word;word-break:break-word;
  }
  .day .ttl-ja rt{font-size:.55em;color:var(--ink-soft);font-weight:500}
  .day .ttl-ko{
    font-size:14px;line-height:1.3;color:var(--ink-soft);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
    overflow-wrap:break-word;word-break:break-word;
  }

  footer{margin-top:40px;font-size:13px;color:var(--ink-soft);line-height:1.9;
    border-top:1px solid var(--line);padding-top:16px}
  footer a{color:var(--ai);text-decoration:underline}

  @media (max-width:560px){
    .cal-month h2{font-size:17px}
    .cal-weekdays{display:none}
    .cal-grid{
      display:flex;flex-direction:column;gap:10px;
      background:transparent;border:none;
    }
    .day.pad{display:none}
    .day:not(.has){display:none}
    a.day.has{
      display:grid;grid-template-columns:38px 1fr;gap:2px 14px;
      min-height:0;padding:14px 12px;border-radius:8px;
      order:var(--mo);
    }
    a.day.has .num{
      grid-row:1 / 3;font-size:16px;font-weight:700;
      display:flex;align-items:flex-start;padding-top:2px;
    }
    .day .ttl-ja{
      font-size:21.5px;line-height:1.7;
      display:block;-webkit-line-clamp:unset;overflow:visible;
    }
    .day .ttl-ja rt{font-size:.5em}
    .day .ttl-ko{
      font-size:18.5px;
      display:block;-webkit-line-clamp:unset;overflow:visible;
    }
  }
</style>
  <link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="tj-apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="tj-icon-192.png">
</head>
<body>
<div class="frame">
  <header>
    <div class="seal" aria-hidden="true">天声<br>人語</div>
    <h1>天声人語で学ぶ日本語</h1>
  </header>
  <div style="text-align: right; margin: 15px 0;">
      <button onclick="location.reload()" style="padding: 8px 16px; background-color: var(--shu); color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600;">새로고침 ↻</button>
    </div>
  <p class="sub">아사히신문 칼럼으로 매일 배우는 일본어</p>

  <div class="pager" id="pager" style="display:none">
    <button id="prev" type="button">◀ 이전 달</button>
    <select id="msel" aria-label="월 선택"></select>
    <button id="next" type="button">다음 달 ▶</button>
  </div>
  <div class="cal-wrap">
<!--CALENDAR-->
  </div>

  <footer>
    <p class="visit" id="visitline" style="display:none">지금까지 <span id="vcount" style="color:var(--shu);font-weight:700">0</span>명이 함께 공부했습니다.</p>
    <p>매일 아침 자동 발행됩니다. 요약·예문·해설은 학습 목적으로 새로 작성한 것이며, 원문 저작권은 아사히신문사에 있습니다.</p>
    <p><a href="https://cafe.naver.com/statepark62" target="_blank" rel="noopener">네이버 카페 「여행하며 일본어 공부하기」</a></p>
  </footer>
</div>
<script>
(function(){
  var secs=[].slice.call(document.querySelectorAll('.cal-month'));
  if(!secs.length)return;
  document.documentElement.classList.add('js');
  var sel=document.getElementById('msel'),prev=document.getElementById('prev'),next=document.getElementById('next');
  secs.forEach(function(s,i){var o=document.createElement('option');o.value=i;o.textContent=s.getAttribute('data-label');sel.appendChild(o);});
  var cur=0; // secs는 최신순: 0이 가장 최근 달
  var h=(location.hash||'').replace('#','');
  secs.forEach(function(s,i){if(s.id==='m-'+h)cur=i;});
  function show(i){
    cur=Math.max(0,Math.min(secs.length-1,i));
    secs.forEach(function(s,k){s.classList.toggle('on',k===cur);});
    sel.value=cur;
    prev.disabled=(cur>=secs.length-1);  // 더 오래된 달 없음
    next.disabled=(cur<=0);              // 더 최근 달 없음
    try{history.replaceState(null,'','#'+secs[cur].id.slice(2));}catch(e){}
  }
  prev.onclick=function(){show(cur+1);};
  next.onclick=function(){show(cur-1);};
  sel.onchange=function(){show(parseInt(sel.value,10));};
  document.getElementById('pager').style.display='';
  show(cur);
})();
</script>
<script>
(function(){
  var GAS_URL = "https://script.google.com/macros/s/AKfycbzzsK1vQDlffHyzt6se264eGravJdfOik-kYtEOrFuN7inaXw2CKg2ryXSAP8MLSFehxA/exec";   // ← Apps Script 배포 URL(/exec)로 교체
  if (GAS_URL.indexOf("https") !== 0) return;               // 미설정 시 표시 안 함
  var uid = localStorage.getItem("tj_uid");
  if (!uid) {
    uid = (self.crypto && crypto.randomUUID) ? crypto.randomUUID()
          : Date.now() + "-" + Math.random().toString(36).slice(2);
    localStorage.setItem("tj_uid", uid);
  }
  fetch(GAS_URL + "?uid=" + encodeURIComponent(uid))
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d && d.unique) {
        document.getElementById("vcount").textContent = Number(d.unique).toLocaleString();
        document.getElementById("visitline").style.display = "";
      }
    })
    .catch(function(){});
})();
</script>
</body>
</html>
