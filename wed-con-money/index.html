<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>경조사비 입력</title>

  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2d6cdf">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="경조사비">

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 16px;
      color: #222;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      max-width: 480px;
      margin: 0 auto 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    h1 {
      font-size: 18px;
      margin: 0 0 16px;
      text-align: center;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .tab {
      flex: 1;
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      cursor: pointer;
      background: #fafafa;
      font-weight: 600;
    }
    .tab.active.gyeong { background: #fff3cd; border-color: #e6c200; }
    .tab.active.bu { background: #e2e3e5; border-color: #888; }
    label {
      display: block;
      font-size: 13px;
      color: #555;
      margin: 12px 0 4px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      height: 42px;
      -webkit-appearance: none;
      appearance: none;
    }
    input[type="date"] { line-height: 20px; }
    button.submit {
      width: 100%;
      padding: 13px;
      margin-top: 20px;
      background: #2d6cdf;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    button.submit:disabled { background: #9db6e8; }
    .msg {
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
      min-height: 18px;
    }
    .msg.ok { color: #1a7f37; }
    .msg.err { color: #c0392b; }

    .toggle-btn {
      display: block;
      width: 100%;
      max-width: 480px;
      margin: 0 auto 8px;
      padding: 10px;
      background: #fff;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      color: #333;
      cursor: pointer;
    }
    .recent {
      max-width: 480px;
      margin: 0 auto;
      display: none;
    }
    .year-filter {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }
    .year-filter select { flex: 1; }
    .year-filter button {
      padding: 0 16px;
      border: none;
      border-radius: 8px;
      background: #444;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }
    .recent-summary { font-size: 12px; color: #888; margin: 0 4px 8px; }
    .recent-item {
      background: #fff;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 6px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .recent-item .name { flex: 1; text-align: left; }
    .recent-item .date { flex: 1; text-align: center; color: #999; font-size: 12px; }
    .recent-item .amount { flex: 1; text-align: right; }
    .empty { text-align: center; color: #999; font-size: 13px; padding: 12px; }
    ol.setup-steps { font-size: 13px; color: #444; padding-left: 20px; line-height: 1.9; margin: 12px 0; }
    ol.setup-steps a { color: #2d6cdf; font-weight: 600; }
    .setup-note { font-size: 13px; color: #666; line-height: 1.6; margin: 0; }
    .settings-link {
      display: block;
      text-align: center;
      font-size: 12px;
      color: #999;
      margin: 16px auto 0;
      max-width: 480px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card" id="setupCard" style="display:none;">
    <h1>처음 사용 설정</h1>
    <p class="setup-note">이 앱은 사용자마다 <b>자기 소유의 구글 시트</b>에 연결해서 씁니다. 아래 순서대로 한 번만 준비하면 됩니다.</p>
    <ol class="setup-steps">
      <li><a href="https://docs.google.com/spreadsheets/d/1IbxYNgLS6OUKbDlHQh1_dEpLwgjJUDoaY-olM2gilSw/copy" target="_blank">이 링크</a>를 눌러 내 구글 드라이브에 시트 사본 만들기</li>
      <li>사본 시트에서 <b>확장 프로그램 → Apps Script</b> 열기</li>
      <li><b>배포 → 새 배포</b> (유형: 웹 앱 / 실행 계정: 나 / 액세스: 전체)</li>
      <li>배포 후 나오는 주소(<code>.../exec</code>)를 아래에 붙여넣기</li>
    </ol>
    <label>내 API 주소</label>
    <input type="text" id="apiUrlInput" placeholder="https://script.google.com/macros/s/xxx/exec">
    <button class="submit" onclick="saveApiUrl()">저장하고 시작하기</button>
    <div class="msg" id="setupMsg"></div>
  </div>

  <div class="card" id="mainCard" style="display:none;">
    <h1>경조사비 입력</h1>

    <div class="tabs">
      <div class="tab active gyeong" id="tabGyeong" onclick="selectSheet('축의금')">축의금</div>
      <div class="tab bu" id="tabBu" onclick="selectSheet('부의금')">부의금</div>
    </div>

    <label>이름</label>
    <input type="text" id="name" placeholder="예: 홍길동교수">

    <label>상황</label>
    <input type="text" id="situation" list="situationList" placeholder="예: 자혼 / 부친상">
    <datalist id="situationList"></datalist>

    <label>금액</label>
    <input type="number" id="amount" placeholder="예: 100000" inputmode="numeric">

    <label>날짜</label>
    <input type="date" id="date">

    <label>비고</label>
    <input type="text" id="note" placeholder="예: 리베라호텔 (선택)">

    <button class="submit" id="submitBtn" onclick="submitEntry()">저장</button>
    <div class="msg" id="msg"></div>
  </div>

  <button class="toggle-btn" id="toggleBtn" onclick="toggleRecent()" style="display:none;">최근 입력 내역 보기</button>

  <div class="recent" id="recentSection">
    <div class="year-filter">
      <select id="yearSelect"></select>
      <button onclick="loadEntries()">조회</button>
    </div>
    <div class="recent-summary" id="recentSummary"></div>
    <div id="recentList"></div>
  </div>

  <div class="settings-link" id="settingsLink" onclick="changeApiUrl()" style="display:none;">⚙ 연결된 API 주소 변경</div>

  <script>
    var STORAGE_KEY = 'gyeongjosabi_api_url';
    var API_URL = localStorage.getItem(STORAGE_KEY) || '';

    function initScreen() {
      var hasUrl = !!API_URL;
      document.getElementById('setupCard').style.display = hasUrl ? 'none' : 'block';
      document.getElementById('mainCard').style.display = hasUrl ? 'block' : 'none';
      document.getElementById('toggleBtn').style.display = hasUrl ? 'block' : 'none';
      document.getElementById('settingsLink').style.display = hasUrl ? 'block' : 'none';
    }

    function saveApiUrl() {
      var val = document.getElementById('apiUrlInput').value.trim();
      var msg = document.getElementById('setupMsg');
      if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(val)) {
        msg.textContent = "올바른 Apps Script 웹앱 주소가 아닙니다 ('.../exec'로 끝나야 합니다).";
        msg.className = 'msg err';
        return;
      }
      localStorage.setItem(STORAGE_KEY, val);
      API_URL = val;
      msg.textContent = '';
      initScreen();
    }

    function changeApiUrl() {
      if (!confirm('연결된 API 주소를 지우고 다시 설정할까요?')) return;
      localStorage.removeItem(STORAGE_KEY);
      API_URL = '';
      initScreen();
    }

    var currentSheet = '축의금';
    var recentOpen = false;
    var situationOptions = {
      '축의금': ['자혼', '여혼', '본인'],
      '부의금': ['부친상', '모친상', '장인상', '장모상', '빙부상', '빙모상', '시부상', '시모상', '부인상', '남편상', '본인상', '조부상', '조모상', '동생상']
    };

    function selectSheet(sheet) {
      currentSheet = sheet;
      document.getElementById('tabGyeong').classList.toggle('active', sheet === '축의금');
      document.getElementById('tabBu').classList.toggle('active', sheet === '부의금');
      var list = document.getElementById('situationList');
      list.innerHTML = '';
      situationOptions[sheet].forEach(function (opt) {
        var o = document.createElement('option');
        o.value = opt;
        list.appendChild(o);
      });
      if (recentOpen) {
        recentOpen = false;
        document.getElementById('recentSection').style.display = 'none';
        document.getElementById('toggleBtn').textContent = '최근 입력 내역 보기';
      }
    }

    function toggleRecent() {
      recentOpen = !recentOpen;
      var section = document.getElementById('recentSection');
      var btn = document.getElementById('toggleBtn');
      if (recentOpen) {
        section.style.display = 'block';
        btn.textContent = '최근 입력 내역 닫기';
        loadYears();
        loadEntries();
      } else {
        section.style.display = 'none';
        btn.textContent = '최근 입력 내역 보기';
      }
    }

    function loadYears() {
      fetch(API_URL + '?action=years&sheet=' + encodeURIComponent(currentSheet))
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (!res.success) throw new Error(res.error);
          var sel = document.getElementById('yearSelect');
          sel.innerHTML = '';
          var optRecent = document.createElement('option');
          optRecent.value = 'recent';
          optRecent.textContent = '최근 5건';
          sel.appendChild(optRecent);

          var optAll = document.createElement('option');
          optAll.value = 'all';
          optAll.textContent = '전체';
          sel.appendChild(optAll);

          res.years.forEach(function (y) {
            var o = document.createElement('option');
            o.value = y;
            o.textContent = y + '년';
            sel.appendChild(o);
          });
        })
        .catch(function (err) { console.error(err); });
    }

    function loadEntries() {
      var sel = document.getElementById('yearSelect');
      var value = sel.value || 'recent';
      var listEl = document.getElementById('recentList');
      listEl.innerHTML = '<div class="empty">불러오는 중...</div>';

      fetch(API_URL + '?action=entries&sheet=' + encodeURIComponent(currentSheet) + '&year=' + encodeURIComponent(value))
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (!res.success) throw new Error(res.error);
          var label = value === 'recent' ? '최근 ' + res.items.length + '건'
                     : value === 'all' ? '전체 ' + res.items.length + '건'
                     : value + '년 ' + res.items.length + '건';
          renderEntries(res.items, label);
        })
        .catch(function (err) {
          listEl.innerHTML = '<div class="empty">오류: ' + err.message + '</div>';
        });
    }

    function renderEntries(items, summaryText) {
      var listEl = document.getElementById('recentList');
      var summaryEl = document.getElementById('recentSummary');
      summaryEl.textContent = summaryText;

      if (!items.length) {
        listEl.innerHTML = '<div class="empty">해당 항목이 없습니다.</div>';
        return;
      }
      listEl.innerHTML = '';
      items.forEach(function (it) {
        var div = document.createElement('div');
        div.className = 'recent-item';
        var amountText = it.amount ? Number(it.amount).toLocaleString() + '원' : '';
        div.innerHTML =
          '<span class="name">' + it.name + (it.situation ? ' (' + it.situation + ')' : '') + '</span>' +
          '<span class="date">' + (it.date || '') + '</span>' +
          '<span class="amount">' + amountText + '</span>';
        listEl.appendChild(div);
      });
    }

    function submitEntry() {
      var name = document.getElementById('name').value.trim();
      var situation = document.getElementById('situation').value.trim();
      var amount = document.getElementById('amount').value;
      var date = document.getElementById('date').value;
      var note = document.getElementById('note').value.trim();
      var msg = document.getElementById('msg');
      var btn = document.getElementById('submitBtn');

      if (!name || !amount) {
        msg.textContent = '이름과 금액은 필수입니다.';
        msg.className = 'msg err';
        return;
      }

      btn.disabled = true;
      msg.textContent = '저장 중...';
      msg.className = 'msg';

      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'add',
          sheetName: currentSheet,
          name: name,
          situation: situation,
          amount: amount,
          date: date,
          note: note
        })
      })
        .then(function (r) { return r.json(); })
        .then(function (res) {
          if (!res.success) throw new Error(res.error);
          msg.textContent = '저장되었습니다.';
          msg.className = 'msg ok';
          btn.disabled = false;
          document.getElementById('name').value = '';
          document.getElementById('situation').value = '';
          document.getElementById('amount').value = '';
          document.getElementById('note').value = '';
          if (recentOpen) {
            loadYears();
            loadEntries();
          }
        })
        .catch(function (err) {
          msg.textContent = '오류: ' + err.message;
          msg.className = 'msg err';
          btn.disabled = false;
        });
    }

    selectSheet('축의금');
    initScreen();
  </script>
</body>
</html>
