<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>클래식 음악 찾기</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='18' fill='%233D1B24'/%3E%3Cpath d='M68 20v42.5c0 7.5-6.5 13.5-14.5 13.5S39 70 39 62.5 45.5 49 53.5 49c2.9 0 5.6.8 7.9 2.1V29.5L45 33v34.5c0 7.5-6.5 13.5-14.5 13.5S16 75 16 67.5 22.5 54 30.5 54c2.9 0 5.6.8 7.9 2.1V26l29.6-6z' fill='%23B08D4F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --wine:#3D1B24;
    --wine-deep:#2A1119;
    --parchment:#F1E9D8;
    --parchment-soft:#E8DDC6;
    --gold:#B08D4F;
    --ink:#231C17;
    --sage:#6E7A5E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--parchment);
    color:var(--ink);
    font-family:'EB Garamond', serif;
    min-height:100vh;
  }
  .staff-header{
    background:var(--wine);
    color:var(--parchment);
    padding:48px 24px 40px;
    position:relative;
    overflow:hidden;
  }
  .staff-lines{
    position:absolute;
    top:0; left:0; right:0; bottom:0;
    background-image:repeating-linear-gradient(
      to bottom,
      transparent 0px, transparent 27px,
      rgba(241,233,216,0.08) 27px, rgba(241,233,216,0.08) 28px
    );
    pointer-events:none;
  }
  .header-inner{position:relative; max-width:900px; margin:0 auto; text-align:center;}
  .eyebrow{
    font-family:'EB Garamond', serif;
    font-style:italic;
    letter-spacing:0.15em;
    text-transform:uppercase;
    font-size:13px;
    color:var(--gold);
    margin-bottom:10px;
  }
  h1{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:44px;
    margin:0 0 8px;
    letter-spacing:0.01em;
  }
  .subtitle{
    font-size:17px;
    color:var(--parchment-soft);
    font-style:italic;
    margin:0;
  }

  .controls{
    max-width:900px;
    margin:-24px auto 0;
    padding:0 24px;
    position:relative;
    z-index:2;
  }
  .tabbar{
    display:flex;
    gap:2px;
    background:var(--gold);
    border-radius:10px;
    padding:2px;
    box-shadow:0 8px 24px rgba(42,17,25,0.25);
  }
  .tab{
    flex:1;
    text-align:center;
    padding:14px 8px;
    background:var(--parchment);
    border:none;
    font-family:'EB Garamond', serif;
    font-size:16px;
    letter-spacing:0.03em;
    cursor:pointer;
    color:var(--wine-deep);
    transition:background .15s ease, color .15s ease;
  }
  .tab:first-child{border-radius:8px 0 0 8px;}
  .tab:last-child{border-radius:0 8px 8px 0;}
  .tab.active{
    background:var(--wine);
    color:var(--parchment);
    font-weight:600;
  }

  .filter-row{
    max-width:900px;
    margin:20px auto 0;
    padding:0 24px;
    display:flex;
    flex-wrap:wrap;
    gap:8px;
  }
  .chip{
    padding:7px 16px;
    border-radius:999px;
    border:1px solid var(--wine);
    background:transparent;
    color:var(--wine);
    font-family:'EB Garamond', serif;
    font-size:15px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .chip.selected{
    background:var(--wine);
    color:var(--parchment);
  }

  .search-row{
    max-width:900px;
    margin:16px auto 0;
    padding:0 24px;
  }
  .search-row input{
    width:100%;
    padding:12px 16px;
    font-family:'EB Garamond', serif;
    font-size:16px;
    border:1px solid var(--gold);
    border-radius:8px;
    background:#fff;
    color:var(--ink);
  }
  .search-row input:focus{
    outline:2px solid var(--sage);
    outline-offset:1px;
  }

  main{
    max-width:900px;
    margin:0 auto;
    padding:28px 24px 80px;
  }
  .era-label{
    font-family:'Cormorant Garamond', serif;
    font-size:22px;
    font-weight:600;
    color:var(--wine);
    margin:28px 0 12px;
    padding-bottom:6px;
    border-bottom:1.5px solid var(--gold);
  }
  .era-label:first-child{margin-top:0;}

  .piece-list{
    display:flex;
    flex-direction:column;
  }
  .piece{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px 4px;
    border-bottom:1px dotted rgba(35,28,23,0.25);
    cursor:pointer;
    background:transparent;
    border-left:none; border-right:none; border-top:none;
    text-align:left;
    width:100%;
    font-family:'EB Garamond', serif;
    transition:background .15s ease;
  }
  .piece:hover{background:var(--parchment-soft);}
  .piece-info{display:flex; flex-direction:column; gap:2px;}
  .piece-title{font-size:18px; color:var(--ink);}
  .piece-meta{font-size:14px; color:var(--sage); font-style:italic;}
  .play-icon{
    flex-shrink:0;
    width:34px; height:34px;
    border-radius:50%;
    background:var(--wine);
    color:var(--parchment);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
  }

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--sage);
    font-style:italic;
    font-size:17px;
  }

  .player-wrap{
    max-width:900px;
    margin:0 auto;
    padding:0 24px 8px;
  }
  .player-inner{
    background:var(--wine);
    border-radius:12px;
    padding:16px;
    box-shadow:0 8px 24px rgba(42,17,25,0.25);
  }
  .player-label{
    color:var(--parchment);
    font-family:'Cormorant Garamond', serif;
    font-size:18px;
    font-weight:600;
    margin-bottom:6px;
    padding-left:2px;
  }
  .player-info{
    display:flex;
    flex-direction:column;
    gap:3px;
    margin-bottom:10px;
    padding-left:2px;
  }
  .player-info p{
    margin:0;
    font-size:14px;
    line-height:1.5;
    color:var(--parchment-soft);
  }
  .player-info .info-tag{
    color:var(--gold);
    font-style:italic;
    margin-right:6px;
  }
  .player-frame{
    position:relative;
    width:100%;
    padding-top:56.25%;
    border-radius:8px;
    overflow:hidden;
    background:#000;
  }
  .player-frame iframe{
    position:absolute;
    top:0; left:0;
    width:100%; height:100%;
    border:0;
  }
  .player-fallback{
    margin-top:10px;
    padding-left:2px;
    font-size:14px;
    color:var(--parchment-soft);
    font-style:italic;
  }
  .player-fallback a{
    color:var(--gold);
    font-style:normal;
    text-decoration:underline;
  }

  footer{
    text-align:center;
    padding:24px;
    color:var(--sage);
    font-size:13px;
    font-style:italic;
  }

  @media (max-width:600px){
    h1{font-size:32px;}
    .tab{font-size:14px; padding:12px 4px;}
    .piece-title{font-size:16px;}
  }
</style>
</head>
<body>

<div class="staff-header">
  <div class="staff-lines"></div>
  <div class="header-inner">
    <div class="eyebrow">Listen · Discover · Enjoy</div>
    <h1>클래식 음악 찾기</h1>
    <p class="subtitle">국가·시대·장르로 골라 듣고, 클릭 한 번에 유튜브로</p>
  </div>
</div>

<div class="controls">
  <div class="tabbar" role="tablist">
    <button class="tab active" data-mode="era">시대별</button>
    <button class="tab" data-mode="country">국가별</button>
    <button class="tab" data-mode="genre">장르별</button>
  </div>
</div>

<div class="filter-row" id="filterRow"></div>

<div class="search-row">
  <input type="text" id="searchBox" placeholder="작곡가나 곡명으로 직접 검색... (예: 쇼팽, 교향곡)">
</div>

<main id="mainArea"></main>

<div class="player-wrap" id="playerWrap" style="display:none;">
  <div class="player-inner">
    <div class="player-label" id="playerLabel"></div>
    <div class="player-info">
      <p><span class="info-tag">작곡가</span><span id="playerComposerInfo"></span></p>
      <p><span class="info-tag">이 곡은</span><span id="playerPieceInfo"></span></p>
    </div>
    <div class="player-frame">
      <iframe id="playerFrame" src="" title="유튜브 재생" frameborder="0"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen></iframe>
    </div>
    <div class="player-fallback">
      재생이 보이지 않나요? <a id="fallbackLink" href="#" target="_blank" rel="noopener">이 창에서 바로 열어 듣기 →</a>
    </div>
  </div>
</div>

<footer>곡을 클릭하면 아래에 유튜브 검색 결과가 바로 재생됩니다.</footer>

<script>
const pieces = [
  {title:"골드베르크 변주곡", composer:"바흐", era:"바로크", country:"독일", genre:"독주곡", id:"Cwas_7H5KUs", desc:"불면증에 시달리던 후원자를 위해 썼다고 전해지는 곡으로, 하나의 아리아를 30가지 방식으로 변주해 나가는 건반음악의 대표작입니다."},
  {title:"브란덴부르크 협주곡 3번", composer:"바흐", era:"바로크", country:"독일", genre:"협주곡", id:"QLj_gMBqHX8", desc:"브란덴부르크 후작에게 헌정한 여섯 곡의 협주곡 중 하나로, 현악 파트가 서로 대화하듯 주고받는 합주협주곡 형식을 보여줍니다."},
  {title:"무반주 첼로 모음곡 1번 - 프렐류드", composer:"바흐", era:"바로크", country:"독일", genre:"독주곡", id:"1prweT95Mo0", desc:"첼로 한 대만으로 화성과 선율을 동시에 그려내는 곡으로, 오늘날 첼로 레퍼토리 중 가장 널리 연주되는 작품입니다."},
  {title:"사계 - 봄", composer:"비발디", era:"바로크", country:"이탈리아", genre:"협주곡", id:"qm8FVsKrPHo", desc:"각 계절을 묘사한 소네트(시)를 바탕으로 새소리, 시냇물, 폭풍 등을 바이올린으로 그려낸 표제음악의 초기 예시입니다."},
  {title:"메시아 - 할렐루야", composer:"헨델", era:"바로크", country:"영국", genre:"성악·합창곡", id:"usfiAsWR4qU", desc:"예수의 생애를 다룬 오라토리오 '메시아'의 2부를 마무리하는 합창곡으로, 초연 이후 청중이 기립하는 관습이 생긴 곡으로 유명합니다."},
  {title:"수상음악", composer:"헨델", era:"바로크", country:"영국", genre:"관현악곡", id:"EVAB2z1RPu4", desc:"영국 왕 조지 1세가 템스강에서 뱃놀이를 할 때 배 위에서 연주되었다고 전해지는 관현악 모음곡입니다."},
  {title:"교향곡 94번 '놀람'", composer:"하이든", era:"고전주의", country:"오스트리아", genre:"교향곡", id:"b9Umjnwvn4g", desc:"조용한 2악장 도중 갑작스러운 총주(포르티시모)로 졸던 청중을 깨웠다는 일화 때문에 '놀람'이라는 별명이 붙었습니다."},
  {title:"현악4중주 '황제'", composer:"하이든", era:"고전주의", country:"오스트리아", genre:"실내악", id:"qHTDkUOYKI4", desc:"2악장 주제가 오늘날 독일 국가로 쓰이는 선율이며, 원래는 오스트리아 황제를 위한 축가로 작곡되었습니다."},
  {title:"교향곡 40번", composer:"모차르트", era:"고전주의", country:"오스트리아", genre:"교향곡", id:"oDPLYE5PWW0", desc:"모차르트가 남긴 몇 안 되는 단조 교향곡 중 하나로, 시작부터 흐르는 불안한 선율이 특징입니다."},
  {title:"레퀴엠 - 라크리모사", composer:"모차르트", era:"고전주의", country:"오스트리아", genre:"성악·합창곡", id:"W_kSfXbmwS4", desc:"모차르트가 완성하지 못하고 세상을 떠난 진혼미사곡의 한 대목으로, 그의 마지막 작품으로 알려져 있습니다."},
  {title:"마술피리 - 밤의 여왕 아리아", composer:"모차르트", era:"고전주의", country:"오스트리아", genre:"오페라", id:"YuBeBjqKSGQ", desc:"오페라 '마술피리'에서 딸에게 복수를 명하는 밤의 여왕이 부르는 아리아로, 극도로 높은 음역의 콜로라투라 기교로 유명합니다."},
  {title:"교향곡 5번 '운명'", composer:"베토벤", era:"고전주의", country:"독일", genre:"교향곡", id:"P08rkJ5Ugf0", desc:"'따다다단' 네 음으로 시작하는 도입부가 '운명이 문을 두드리는 소리'로 널리 알려진 서양음악사의 대표작입니다."},
  {title:"바이올린 협주곡", composer:"베토벤", era:"고전주의", country:"독일", genre:"협주곡", id:"cokCgWPRZPg", desc:"베토벤이 남긴 유일한 바이올린 협주곡으로, 초연 당시엔 큰 반응을 얻지 못했지만 이후 이 장르의 대표작으로 자리잡았습니다."},
  {title:"교향곡 8번 '미완성'", composer:"슈베르트", era:"낭만주의", country:"오스트리아", genre:"교향곡", id:"3tisvEpblig", desc:"4악장 구성의 교향곡 중 2악장까지만 남기고 중단된 작품으로, 왜 완성하지 않았는지는 지금도 수수께끼로 남아 있습니다."},
  {title:"교향곡 4번", composer:"브람스", era:"낭만주의", country:"독일", genre:"교향곡", id:"lKllRGGWdfs", desc:"브람스가 남긴 마지막 교향곡으로, 옛 바로크 시대의 변주 형식(파사칼리아)을 마지막 악장에 되살린 것이 특징입니다."},
  {title:"녹턴 Op.9 No.2", composer:"쇼팽", era:"낭만주의", country:"폴란드", genre:"독주곡", id:"c2beUDDsgws", desc:"밤의 서정을 노래하는 '녹턴' 장르 중 가장 대중적으로 사랑받는 곡으로, 노래하듯 흐르는 선율이 특징입니다."},
  {title:"백조의 호수 - 정경(테마)", composer:"차이콥스키", era:"낭만주의", country:"러시아", genre:"관현악곡", id:"9cNQFB0TDfY", desc:"마법에 걸려 백조가 된 공주 오데트를 상징하는 주제 선율로, 발레 '백조의 호수' 전체를 관통하는 테마입니다."},
  {title:"교향곡 6번 '비창'", composer:"차이콥스키", era:"낭만주의", country:"러시아", genre:"교향곡", id:"OfbQLOCCpQE", desc:"차이콥스키가 초연 9일 후 세상을 떠나면서 그의 마지막 작품이 된 교향곡으로, 힘없이 사그라드는 4악장 결말이 이례적입니다."},
  {title:"전람회의 그림", composer:"무소륵스키", era:"낭만주의", country:"러시아", genre:"관현악곡", id:"Sq7Qd9PSmR0", desc:"먼저 세상을 떠난 화가 친구의 유작 전시회를 거닐며 그림 하나하나를 음악으로 옮긴 모음곡으로, 원곡은 피아노곡입니다."},
  {title:"신세계 교향곡 2악장 '라르고'", composer:"드보르자크", era:"낭만주의", country:"체코", genre:"교향곡", id:"ASlch7R1Zvo", desc:"미국 체류 시절 작곡한 교향곡의 2악장으로, 이 선율은 이후 '고향으로 가는 길'이라는 노래로도 편곡되어 널리 불렸습니다."},
  {title:"몰다우", composer:"스메타나", era:"낭만주의", country:"체코", genre:"관현악곡", id:"0-vZIoAGpqU", desc:"조국 보헤미아를 가로지르는 몰다우강의 흐름을 음악으로 묘사한 연작 교향시 '나의 조국' 중 가장 유명한 곡입니다."},

const eraOrder = ["바로크","고전주의","낭만주의","근현대"];
const countryOrder = ["독일","오스트리아","이탈리아","프랑스","영국","폴란드","러시아","체코","노르웨이","핀란드","미국"];
const genreOrder = ["교향곡","협주곡","오페라","실내악","독주곡","관현악곡","성악·합창곡"];

let mode = "era";
let selectedFilter = null;
let searchTerm = "";

function getGroups(){
  if(mode==="era") return eraOrder;
  if(mode==="country") return [...new Set(pieces.map(p=>p.country))].sort((a,b)=>countryOrder.indexOf(a)-countryOrder.indexOf(b));
  return genreOrder;
}

function renderFilters(){
  const row = document.getElementById('filterRow');
  const groups = getGroups();
  row.innerHTML = '';
  const allChip = document.createElement('button');
  allChip.className = 'chip' + (selectedFilter===null ? ' selected' : '');
  allChip.textContent = '전체';
  allChip.onclick = () => { selectedFilter = null; render(); };
  row.appendChild(allChip);
  groups.forEach(g=>{
    const chip = document.createElement('button');
    chip.className = 'chip' + (selectedFilter===g ? ' selected' : '');
    chip.textContent = g;
    chip.onclick = () => { selectedFilter = g; render(); };
    row.appendChild(chip);
  });
}

function keyFor(p){
  if(mode==="era") return p.era;
  if(mode==="country") return p.country;
  return p.genre;
}

function metaFor(p){
  if(mode==="era") return `${p.composer} · ${p.country}`;
  if(mode==="country") return `${p.composer} · ${p.era}`;
  return `${p.composer} · ${p.country} / ${p.era}`;
}

function render(){
  renderFilters();
  const main = document.getElementById('mainArea');
  main.innerHTML = '';

  let filtered = pieces.filter(p=>{
    if(selectedFilter && keyFor(p)!==selectedFilter) return false;
    if(searchTerm){
      const s = searchTerm.toLowerCase();
      return p.title.toLowerCase().includes(s) || p.composer.toLowerCase().includes(s);
    }
    return true;
  });

  if(filtered.length===0){
    main.innerHTML = '<div class="empty">검색 결과가 없습니다. 다른 키워드로 찾아보세요.</div>';
    return;
  }

  const order = mode==="era" ? eraOrder : (mode==="genre" ? genreOrder : countryOrder);
  const groupsPresent = [...new Set(filtered.map(keyFor))].sort((a,b)=>order.indexOf(a)-order.indexOf(b));

  groupsPresent.forEach(group=>{
    const label = document.createElement('div');
    label.className = 'era-label';
    label.textContent = group;
    main.appendChild(label);

    const list = document.createElement('div');
    list.className = 'piece-list';
    filtered.filter(p=>keyFor(p)===group).forEach(p=>{
      const btn = document.createElement('button');
      btn.className = 'piece';
      btn.innerHTML = `
        <div class="piece-info">
          <div class="piece-title">${p.composer} — ${p.title}</div>
          <div class="piece-meta">${metaFor(p)}</div>
        </div>
        <div class="play-icon">▶</div>
      `;
      btn.onclick = () => playPiece(p);
      list.appendChild(btn);
    });
    main.appendChild(list);
  });
}

function playPiece(p){
  const wrap = document.getElementById('playerWrap');
  const frame = document.getElementById('playerFrame');
  const label = document.getElementById('playerLabel');
  const fallback = document.getElementById('fallbackLink');
  const composerInfoEl = document.getElementById('playerComposerInfo');
  const pieceInfoEl = document.getElementById('playerPieceInfo');
  frame.src = 'https://www.youtube.com/embed/' + p.id + '?autoplay=1';
  fallback.href = 'https://www.youtube.com/watch?v=' + p.id;
  label.textContent = `${p.composer} — ${p.title}`;
  composerInfoEl.textContent = composerInfo[p.composer] || '';
  pieceInfoEl.textContent = p.desc || '';
  wrap.style.display = 'block';
  wrap.scrollIntoView({behavior:'smooth', block:'center'});
}

document.querySelectorAll('.tab').forEach(tab=>{
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    mode = tab.dataset.mode;
    selectedFilter = null;
    render();
  };
});

document.getElementById('searchBox').addEventListener('input', (e)=>{
  searchTerm = e.target.value.trim();
  render();
});

render();
</script>
