<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YouTube 일본어 스크립트</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#355c7d">
<style>
:root{--bg:#f6f2e8;--paper:#fffdf7;--ink:#263238;--blue:#355c7d;--brown:#8b6f47;--line:#d9d2c3}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Noto Sans JP",system-ui,sans-serif}
.wrap{max-width:1080px;margin:38px auto;padding:0 18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 8px 30px #0000000b}
h1{margin:0 0 6px;color:var(--blue);font-size:28px}.sub{margin:0 0 24px;color:#667}
label{font-weight:700;display:block;margin:14px 0 7px}
input,select,textarea{width:100%;border:1px solid #cfc8ba;border-radius:10px;background:#fff;padding:12px;font-size:15px}
.row{display:grid;grid-template-columns:1fr 180px;gap:12px}.buttons{display:flex;flex-wrap:wrap;gap:9px;margin:16px 0}
button{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--blue);color:#fff}
button:disabled{opacity:.55;cursor:wait}
button.secondary{background:#79674e} button.light{background:#e9e3d7;color:#334}
#status{padding:10px 12px;border-radius:9px;background:#eee9df;margin:10px 0;min-height:42px}
#errDetail{margin:-4px 0 10px;font-size:13px;color:#555;word-break:break-all}
#errDetail summary{cursor:pointer;color:var(--brown)}
.meta{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:14px;margin:12px 0}
textarea{height:420px;line-height:1.75;resize:vertical;font-family:"Noto Sans JP","Yu Gothic",sans-serif}
.settings{margin-top:25px;border-top:1px solid var(--line);padding-top:16px}
details summary{cursor:pointer;font-weight:700;color:var(--brown)}
small{color:#777}@media(max-width:700px){.row{grid-template-columns:1fr}.card{padding:18px}}
</style>
</head>
<body><main class="wrap"><section class="card">
<h1>YouTube 일본어 스크립트</h1>
<p class="sub">YouTube 주소를 넣고 일본어 자막을 읽기 좋은 텍스트로 가져옵니다.</p>
<label>YouTube URL</label>
<div class="row"><input id="url" placeholder="https://www.youtube.com/watch?v=..."><select id="lang"><option value="ja">일본어 (ja)</option><option value="en">영어 (en)</option><option value="ko">한국어 (ko)</option></select></div>
<div class="buttons"><button id="fetchBtn">스크립트 가져오기</button><button class="light" id="copyBtn">전체 복사</button><button class="light" id="txtBtn">TXT 저장</button><button class="secondary" id="sheetBtn">Google Sheets 저장</button></div>
<div id="status">준비되었습니다.</div>
<details id="errDetail" hidden><summary>오류 상세 보기</summary><div id="errText"></div></details>
<div class="meta"><b>제목</b><span id="title">-</span><b>채널</b><span id="channel">-</span><b>자막 종류</b><span id="source">-</span><b>줄 수</b><span id="count">-</span></div>
<label>정리된 스크립트</label><textarea id="script" placeholder="여기에 스크립트가 표시됩니다."></textarea>

<div class="settings"><details><summary>⚙ 최초 1회 설정</summary>
<label>자막 추출 API 주소</label><input id="api" placeholder="로컬: http://127.0.0.1:8000  /  Render: https://내-백엔드.onrender.com">
<label>Google Apps Script 웹앱 URL</label><input id="gas" placeholder="https://script.google.com/macros/s/.../exec">
<label>공유 토큰 (선택, Apps Script의 TOKEN과 같은 값)</label><input id="tok" placeholder="사용하지 않으면 비워 두세요">
<div class="buttons"><button class="light" id="saveCfg">설정 저장</button></div>
<small>주소와 토큰은 이 브라우저에만 저장됩니다. GitHub 저장소에는 계정 정보나 비밀키를 넣지 마세요.</small>
</details></div>
</section></main>
<script>
const $=id=>document.getElementById(id);
const setStatus=(s,err=false,detail='')=>{
  $('status').textContent=s; $('status').style.background=err?'#f9dddd':'#eee9df';
  const d=$('errDetail'); if(err&&detail){ $('errText').textContent=detail; d.hidden=false; d.open=false; } else d.hidden=true;
};
$('api').value=localStorage.getItem('yt_api')||'';
$('gas').value=localStorage.getItem('gas_url')||'';
$('tok').value=localStorage.getItem('gas_token')||'';
$('saveCfg').onclick=()=>{
  localStorage.setItem('yt_api',$('api').value.trim().replace(/\/$/,''));
  localStorage.setItem('gas_url',$('gas').value.trim());
  localStorage.setItem('gas_token',$('tok').value.trim());
  setStatus('설정을 저장했습니다.');
};

// 서버가 JSON이 아닌 응답(502 HTML 등)을 줘도 읽을 수 있는 오류 메시지로 바꿈
async function readJson(r){
  const t=await r.text();
  try{ return JSON.parse(t); }
  catch{ return {detail: r.ok ? '서버 응답을 해석할 수 없습니다.' : `서버 오류 (HTTP ${r.status}). 서버가 절전 상태에서 깨어나는 중이면 잠시 후 다시 시도하세요.`}; }
}

$('fetchBtn').onclick=async()=>{
  const api=$('api').value.trim().replace(/\/$/,''); const url=$('url').value.trim(); const lang=$('lang').value;
  if(!api) return setStatus('먼저 ⚙ 설정에서 자막 추출 API 주소를 입력하세요.',true);
  if(!url) return setStatus('YouTube 주소를 입력하세요.',true);
  const btn=$('fetchBtn'); btn.disabled=true;
  setStatus('자막을 가져오는 중입니다… (서버가 절전 중이면 1분 가까이 걸릴 수 있습니다)');
  const ctrl=new AbortController(); const timer=setTimeout(()=>ctrl.abort(),90000);
  try{
    const r=await fetch(api+'/transcript?url='+encodeURIComponent(url)+'&lang='+encodeURIComponent(lang),{signal:ctrl.signal});
    const d=await readJson(r);
    if(!r.ok){
      const full=String(d.detail||d.error||'가져오기에 실패했습니다.');
      const j=full.indexOf('. ');
      const first=(j>0&&j<200)?full.slice(0,j+1):full.slice(0,160);
      const e=new Error(first); e.full=full; throw e;
    }
    $('title').textContent=d.title||'-'; $('channel').textContent=d.channel||'-';
    $('source').textContent=d.source==='manual'?'수동 자막(정확)':d.source==='auto'?'자동 생성 자막(오류 가능)':'-';
    $('count').textContent=d.count??'-'; $('script').value=d.text||'';
    $('script').dataset.source=d.source||'';
    setStatus('완료되었습니다.');
  }catch(e){
    if(e.name==='AbortError') setStatus('오류: 90초 안에 응답이 없어 중단했습니다.',true);
    else if(e instanceof TypeError) setStatus('오류: 서버에 연결할 수 없습니다. API 주소와 서버 실행 여부를 확인하세요.',true,String(e.message));
    else setStatus('오류: '+e.message,true,e.full||'');
  }finally{ clearTimeout(timer); btn.disabled=false; }
};
$('copyBtn').onclick=async()=>{await navigator.clipboard.writeText($('script').value);setStatus('스크립트를 클립보드에 복사했습니다.');};
$('txtBtn').onclick=()=>{
 const blob=new Blob([$('script').value],{type:'text/plain;charset=utf-8'}); const a=document.createElement('a');
 a.href=URL.createObjectURL(blob); a.download=(($('title').textContent||'script').replace(/[\\/:*?"<>|]/g,'_'))+'.txt'; a.click(); URL.revokeObjectURL(a.href);
};
$('sheetBtn').onclick=async()=>{
 const gas=$('gas').value.trim(); if(!gas) return setStatus('먼저 Google Apps Script 웹앱 URL을 설정하세요.',true);
 const script=$('script').value; if(!script.trim()) return setStatus('먼저 스크립트를 가져오세요.',true);
 setStatus('Google Sheets로 보내는 중입니다…');
 const src=$('script').dataset.source; const language=$('lang').value+(src?' ('+src+')':'');
 const form=new URLSearchParams({video_url:$('url').value,title:$('title').textContent,channel:$('channel').textContent,language,script,token:$('tok').value.trim()});
 try{ await fetch(gas,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:form});
   setStatus(`Google Sheets로 전송했습니다(${script.length.toLocaleString()}자). 응답은 확인할 수 없으니 시트에서 확인해 주세요.`);}
 catch(e){setStatus('Sheets 전송 오류: '+e.message,true);}
};
</script></body></html>
