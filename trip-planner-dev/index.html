<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>여행 전광판</title>
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="여행 전광판">
<meta name="theme-color" content="#12172A">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  .pdf-hint{font-size:11px;color:var(--ink-soft);margin-top:10px;line-height:1.6;}
  :root{
    --navy:#12172A;
    --flap-bg:#0D1017;
    --flap-amber:#FFB238;
    --flap-amber-dim:#6b4d15;
    --paper:#FAF7F1;
    --panel:#FFFFFF;
    --ice:#E7EEF5;
    --line-blue:#3E6AA8;
    --coral:#E1572C;
    --ink:#1C2230;
    --ink-soft:#5B6474;
    --border:#DFE3EA;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans KR',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'Space Mono',monospace;}
  #app{max-width:1180px;margin:0 auto;padding:22px 18px 70px;}
  @media (max-width:480px){ #app{padding:18px 12px 60px;} }

  /* header */
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:20px;flex-wrap:wrap;}
  .trip-title{font-size:28px;font-weight:900;letter-spacing:-0.02em;margin:0 0 3px;}
  .trip-dates{font-size:16px;color:var(--ink-soft);}
  .trip-dates .mono{color:var(--line-blue);font-weight:700;}
  .btn{
    border:none;border-radius:10px;padding:11px 17px;font-size:15px;font-weight:700;
    cursor:pointer;font-family:inherit;transition:transform .08s ease, opacity .15s ease;
  }
  .btn:active{transform:scale(0.96);}
  .btn-primary{background:var(--coral);color:#fff;}
  .btn-ghost{background:var(--ice);color:var(--navy);}
  .btn-line{background:transparent;border:1.5px solid var(--border);color:var(--ink-soft);}
  .btn-sm{padding:7px 12px;font-size:14px;border-radius:8px;}
  .topbar-actions{display:flex;gap:9px;flex-wrap:wrap;}

  /* live board */
  .board{
    background:var(--flap-bg);
    border-radius:var(--radius);
    padding:26px 24px;
    margin-bottom:22px;
    position:relative;
    overflow:hidden;
    box-shadow:0 14px 30px -14px rgba(13,16,23,0.55);
  }
  .board::before{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px);
    pointer-events:none;
  }
  .board-clock{
    font-size:42px;font-weight:700;color:var(--flap-amber);letter-spacing:0.04em;
    display:flex;align-items:baseline;gap:10px;
  }
  @media (max-width:380px){ .board-clock{font-size:34px;} }
  .board-date{font-size:14px;color:#8b93a5;letter-spacing:0.08em;text-transform:uppercase;}
  .board-rows{margin-top:16px;display:flex;flex-direction:column;gap:12px;}
  .board-row{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  .board-tag{
    font-size:12px;font-weight:700;letter-spacing:0.12em;color:var(--flap-amber-dim);
    background:rgba(255,178,56,0.08);border:1px solid rgba(255,178,56,0.25);
    padding:3px 9px;border-radius:5px;min-width:50px;text-align:center;flex-shrink:0;
  }
  .board-row.now .board-tag{color:#0D1017;background:var(--flap-amber);border-color:var(--flap-amber);}
  .board-time{font-size:18px;color:#8b93a5;flex-shrink:0;min-width:92px;}
  .board-row.now .board-time{color:var(--flap-amber);}
  .board-activity{font-size:19px;font-weight:700;color:#EDEFF3;}
  .board-row.now .board-activity{color:#fff;font-size:22px;}
  .board-loc{font-size:14px;color:#7C8496;margin-left:6px;}
  .board-empty{color:#8b93a5;font-size:17px;line-height:1.6;margin-top:10px;}

  /* day tabs — 가로 스크롤 대신 줄바꿈으로 전부 표시 (폭이 좁아져도 잘리지 않음) */
  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .tab{
    flex-shrink:0;border:1.5px solid var(--border);background:var(--panel);
    border-radius:10px;padding:10px 16px;cursor:pointer;text-align:center;min-width:76px;
  }
  .tab .tab-d{font-size:13px;color:var(--ink-soft);}
  .tab .tab-n{font-size:18px;font-weight:700;font-family:'Space Mono',monospace;}
  .tab.active{background:var(--navy);border-color:var(--navy);}
  .tab.active .tab-d,.tab.active .tab-n{color:#fff;}
  .tab.today{border-color:var(--coral);}
  .tab.today .tab-n{color:var(--coral);}
  .tab.active.today .tab-n{color:var(--flap-amber);}

  /* timeline */
  .timeline{display:flex;flex-direction:column;gap:10px;}
  .block{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:14px 16px;display:flex;gap:14px;align-items:flex-start;
  }
  .block-time{font-family:'Space Mono',monospace;font-size:16px;font-weight:700;color:var(--line-blue);min-width:58px;padding-top:2px;}
  .block-body{flex:1;}
  .block-title{font-size:18px;font-weight:700;}
  .block-meta{font-size:14.5px;color:var(--ink-soft);margin-top:3px;}
  .block-note{font-size:14.5px;color:var(--ink-soft);margin-top:5px;line-height:1.55;white-space:pre-wrap;}
  .block-actions{display:flex;gap:6px;flex-shrink:0;align-self:center;}
  .icon-btn{
    border:none;background:var(--ice);border-radius:8px;width:34px;height:34px;
    cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;color:var(--ink-soft);
  }
  .empty-day{color:var(--ink-soft);font-size:16px;text-align:center;padding:30px 10px;border:1.5px dashed var(--border);border-radius:12px;}
  .add-block-btn{
    width:100%;padding:13px;border-radius:12px;border:1.5px dashed var(--line-blue);
    background:transparent;color:var(--line-blue);font-weight:700;font-size:15.5px;cursor:pointer;margin-top:10px;
  }

  /* forms / modal */
  .overlay{
    position:fixed;inset:0;background:rgba(18,23,42,0.55);display:flex;align-items:flex-end;
    justify-content:center;z-index:50;padding:0;
  }
  @media (min-width:640px){.overlay{align-items:center;padding:20px;}}
  .sheet{
    background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:24px;
    max-height:78vh;overflow-y:auto;overflow-x:hidden;box-sizing:border-box;
  }
  @media (min-width:640px){.sheet{border-radius:16px;max-height:85vh;}}
  .sheet.saving{opacity:.55;pointer-events:none;}
  .sheet h3{margin:0 0 16px;font-size:21px;}
  .field{margin-bottom:14px;min-width:0;}
  .field label{display:block;font-size:14px;color:var(--ink-soft);margin-bottom:6px;font-weight:700;}
  .field input,.field textarea{
    width:100%;max-width:100%;border:1.5px solid var(--border);border-radius:9px;padding:11px 13px;
    font-size:17px;font-family:inherit;background:var(--paper);box-sizing:border-box;
  }
  .field textarea{resize:none;min-height:60px;overflow-y:hidden;}
  .row2{display:flex;gap:10px;min-width:0;}
  .row2 .field{flex:1;min-width:0;}
  .sheet-actions{display:flex;gap:9px;margin-top:18px;}
  .sheet-actions .btn{flex:1;}

  .morning-list{display:flex;flex-direction:column;gap:9px;margin:16px 0;}
  .morning-item{display:flex;gap:10px;font-size:16px;padding:10px 12px;background:var(--ice);border-radius:9px;}
  .morning-item .mono{font-weight:700;color:var(--line-blue);min-width:52px;}

  .notif-banner{
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;
    background:var(--ice);border-radius:10px;padding:11px 14px;margin-bottom:16px;font-size:15px;color:var(--ink-soft);
  }
  .setup-empty{text-align:center;padding:56px 16px;}
  .setup-empty h2{font-size:24px;margin-bottom:8px;}
  .setup-empty p{color:var(--ink-soft);font-size:16px;margin-bottom:20px;line-height:1.6;}
  .toast{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    background:var(--navy);color:#fff;padding:11px 20px;border-radius:20px;font-size:15px;
    z-index:80;opacity:0;transition:opacity .25s ease;pointer-events:none;
  }
  .toast.show{opacity:1;}

  /* print export */
  .print-sheet{display:none;}
  @media print{
    body{background:#fff;}
    #app,.toast,.overlay{display:none !important;}
    .print-sheet{display:block;color:#111;font-family:'Noto Sans KR',sans-serif;}
    .print-sheet h1{font-size:20px;margin:0 0 2px;}
    .print-sheet .print-dates{font-size:12px;color:#555;margin-bottom:18px;}
    .print-day{margin-bottom:16px;page-break-inside:avoid;}
    .print-day h2{font-size:14px;border-bottom:1.5px solid #111;padding-bottom:4px;margin-bottom:6px;}
    .print-table{width:100%;border-collapse:collapse;font-size:12.5px;}
    .print-table td{vertical-align:top;padding:4px 6px;border-bottom:1px solid #ddd;}
    .print-time{width:80px;font-family:'Space Mono',monospace;font-weight:700;white-space:nowrap;}
    .print-item-title{font-weight:700;}
    .print-loc{font-weight:400;color:#555;}
    .print-note{font-size:11.5px;color:#555;margin-top:2px;white-space:pre-wrap;}
    .print-empty{color:#888;}
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="print-sheet" id="printSheet"></div>
<div class="toast" id="toast"></div>

<script>
/* ---- Google Sheets 연동 설정 ----
   1) https://console.cloud.google.com 에서 새 프로젝트 생성
   2) "API 및 서비스 > 라이브러리"에서 Google Sheets API, Google Drive API 사용 설정
   3) "OAuth 동의 화면" 설정 (외부/테스트 사용자에 본인 이메일 추가)
   4) "사용자 인증 정보 > OAuth 클라이언트 ID 만들기 > 웹 애플리케이션"
   5) "승인된 자바스크립트 원본"에 배포 주소 추가 (예: https://statepark62.github.io)
   6) 발급받은 클라이언트 ID를 아래에 붙여넣기 — 이 값은 공개되어도 안전합니다(비밀키 아님)
*/
const GOOGLE_CLIENT_ID = '736342204348-eq3c7urugs2i2117h3dqh7n6tdacb4t4.apps.googleusercontent.com';
// 실시간 공유 보기(로그인 없이 읽기 전용)를 위한 공개 API 키. Google Cloud Console > 사용자 인증 정보 > + 만들기 > API 키 에서 발급.
// 반드시 "API 제한"을 Google Sheets API로, "애플리케이션 제한"을 HTTP 리퍼러(예: https://statepark62.github.io/*)로 제한해서 사용하세요.
const GOOGLE_API_KEY = '__GOOGLE_API_KEY__';
const GOOGLE_ENABLED = GOOGLE_CLIENT_ID.indexOf('REPLACE_WITH') === -1;
const SPREADSHEET_TITLE = '지금여기_여행일정_데이터';
let tokenClient = null, googleAccessToken = null, googleSignedIn = false, spreadsheetId = null;
let memoryStore = {}; // window.storage와 구글 로그인 둘 다 없을 때의 임시(새로고침시 소실) 저장소
// Apps Script 웹 앱 주소(제작자 시트에 붙인 Gemini 중계). 배포 후 이 값을 실제 URL로 바꿔주세요.
// 구글에 연결(로그인)되어 있으면 이 주소로 요청하고, 키는 Apps Script의 스크립트 속성에만 보관됩니다.
const AI_GAS_URL = 'https://script.google.com/macros/s/AKfycbxypRrYn-dhO0WVlgKCo1oid28buaIOSHXLXATLSGtpoHJh8G5qXBL3jpCl8dd3k-Aj/exec';
// PDF 자동 인식은 개발자 전용 기능입니다. 주소 뒤에 ?dev=1 을 붙였을 때만 관련 버튼이 보입니다.
// 예: https://statepark62.github.io/trip-planner/?dev=1
function _devFlagPresent(){
  if(new URLSearchParams(location.search).get('dev')==='1') return true;
  // 구글 재연결 왕복 중에는 ?dev=1이 아직 주소창에 복원되기 전, 해시의 state 안에 실려있을 수 있음
  if(location.hash && location.hash.indexOf('state=')!==-1){
    try{
      const hp = new URLSearchParams(location.hash.slice(1));
      const st = hp.get('state') || '';
      if(new URLSearchParams(st).get('dev')==='1') return true;
    }catch(e){}
  }
  return false;
}
if(_devFlagPresent()){ try{ localStorage.setItem('trip_dev_mode','1'); }catch(e){} }
function isDevMode(){
  if(_devFlagPresent()) return true;
  try{ if(localStorage.getItem('trip_dev_mode')==='1') return true; }catch(e){}
  return false;
}

const $ = sel => document.querySelector(sel);
const app = $('#app');
const pad = n => String(n).padStart(2,'0');
const fmtDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const dayLabel = ['일','월','화','수','목','금','토'];

let state = {
  trips: [],        // [{id,title,startDate,endDate}]
  activeTripId: null,
  trip: null,        // full loaded trip object
  selectedDate: null,
  viewingPastTrip: false, // 사용자가 '지난 여행 목록'에서 직접 골라서 볼 때만 true
  shareMode: false,       // 읽기 전용 공유 보기 화면인지
  shareSpreadsheetId: null,
  shareError: null,
  notifPermission: (typeof Notification !== 'undefined') ? Notification.permission : 'unsupported',
  notifiedIds: new Set(),
  morningModal: null // date string if showing
};

/* ---- Google Sheets 저장소 ---- */
function loadScript(src){
  return new Promise((resolve,reject)=>{
    const s = document.createElement('script');
    s.src = src; s.onload = resolve; s.onerror = ()=>reject(new Error('load fail: '+src));
    document.head.appendChild(s);
  });
}
const GOOGLE_REDIRECT_URI = location.origin + location.pathname;
// 민감하지 않은 범위(drive.file)만 요청합니다: 이 앱이 만든 시트에만 접근하며, Sheets API도 이 범위로 동작합니다.
// 'spreadsheets'(민감 범위)를 쓰지 않아야 게시 후에도 "확인되지 않은 앱" 경고와 100명 제한이 없습니다.
const GOOGLE_SCOPE = 'https://www.googleapis.com/auth/drive.file';
function ls_get(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function isStandaloneApp(){
  try{
    return (window.navigator.standalone === true) || window.matchMedia('(display-mode: standalone)').matches;
  }catch(e){ return false; }
}
function ls_set(key,val){ try{ localStorage.setItem(key,val); }catch(e){} }
function ls_trySet(key,val){ try{ localStorage.setItem(key,val); return true; }catch(e){ return false; } }
let _lsAvailable = null;
function localStorageAvailable(){
  if(_lsAvailable!==null) return _lsAvailable;
  try{ const k='__lstest__'; localStorage.setItem(k,'1'); localStorage.removeItem(k); _lsAvailable = true; }
  catch(e){ _lsAvailable = false; }
  return _lsAvailable;
}
function buildGoogleAuthUrl(prompt){
  const params = new URLSearchParams({
    client_id: GOOGLE_CLIENT_ID,
    redirect_uri: GOOGLE_REDIRECT_URI,
    response_type: 'token',
    scope: GOOGLE_SCOPE,
    include_granted_scopes: 'true',
    state: location.search || ''
  });
  if(prompt) params.set('prompt', prompt);
  return 'https://accounts.google.com/o/oauth2/v2/auth?' + params.toString();
}

/* ---- Google 연결 진단/안내 (실패해도 조용히 초기 화면으로 돌아가지 않도록) ---- */
const L = (ko, en) => (typeof LANG !== 'undefined' && LANG !== 'ko') ? en : ko;   // 한국어/영어 두 가지만 지원하는 안내문
let pendingGoogleError = null;
function googleErrText(e){
  let m = (e && e.message) ? e.message : String(e);
  const i = m.indexOf('{');
  if(i > -1){ try{ const j = JSON.parse(m.slice(i)); if(j.error){ m = (j.error.status ? j.error.status+': ' : '') + (j.error.message || ''); } }catch(_){} }
  return m;
}
function googleErrHint(detail){
  const d = (detail||'').toLowerCase();
  if(d.indexOf('access_denied') > -1) return L('이 구글 계정이 앱의 테스트 사용자로 등록되지 않았거나, 권한 허용을 취소했을 수 있어요.', 'This Google account may not be registered as a test user, or access was declined.');
  if(d.indexOf('invalid_scope') > -1 || d.indexOf('scope') > -1 && d.indexOf('insufficient') > -1) return L('앱이 요청한 권한(스코프)과 OAuth 동의 화면 설정이 맞지 않는 것 같아요. 운영자 설정 확인이 필요해요.', 'The requested permissions do not match the OAuth consent screen settings.');
  if(d.indexOf('permission_denied') > -1 || d.indexOf('403') > -1 || d.indexOf('insufficient') > -1) return L('시트에 접근할 권한이 부족해요. 권한 화면에서 모든 항목을 허용했는지 확인해 주세요.', 'Not enough permission to access the sheet. Please allow all requested items on the consent screen.');
  if(d.indexOf('404') > -1 || d.indexOf('not found') > -1) return L('이전에 쓰던 시트를 찾지 못했어요.', 'The previous sheet could not be found.');
  if(d.indexOf('has not been used') > -1 || d.indexOf('accessnotconfigured') > -1) return L('Google Sheets/Drive API가 프로젝트에서 켜져 있지 않아요.', 'The Sheets/Drive API is not enabled for the project.');
  return '';
}
function openGoogleErrorModal(code, desc){
  const detail = (code ? code : '') + (desc ? (code ? ' — ' : '') + desc : '');
  const hint = googleErrHint(detail);
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `<div class="sheet">
    <h3>${L('Google 연결에 실패했어요', 'Google connection failed')}</h3>
    <p style="font-size:15px;color:var(--ink-soft);line-height:1.6;">${L('연결 중 문제가 생겨 이 기기의 저장 방식으로 돌아왔어요. 아래 내용을 알려주시면 원인을 찾을 수 있어요.', 'Something went wrong while connecting, so the app went back to local storage. Details below.')}</p>
    <div style="background:var(--ice);border-radius:10px;padding:12px 14px;margin:10px 0;font-size:14px;word-break:break-all;font-family:monospace;color:var(--ink);">${escapeHtml(detail || 'unknown')}</div>
    ${hint ? `<p style="font-size:15px;line-height:1.6;color:var(--coral);margin:6px 0;">💡 ${escapeHtml(hint)}</p>` : ''}
    <div class="sheet-actions">
      <button class="btn btn-line" id="ge_close">${L('닫기', 'Close')}</button>
      <button class="btn btn-primary" id="ge_retry">${L('다시 연결', 'Try again')}</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  document.getElementById('ge_close').onclick = ()=>overlay.remove();
  document.getElementById('ge_retry').onclick = ()=>{ overlay.remove(); connectGoogle(); };
}
function showConnectingOverlay(){
  const o = document.createElement('div');
  o.className = 'overlay';
  o.innerHTML = `<div class="sheet"><h3>${L('Google 시트에 연결하는 중…', 'Connecting to Google Sheets…')}</h3><p style="font-size:15px;color:var(--ink-soft);line-height:1.6;">${L('내 구글 시트를 준비하고 있어요. 잠시만 기다려 주세요.', 'Preparing your Google Sheet. Please wait.')}</p></div>`;
  document.body.appendChild(o);
  return o;
}

function connectGoogle(){
  if(!GOOGLE_ENABLED){ openGoogleSetupInfo(); return; }
  // 팝업 대신 페이지 자체가 구글로 이동했다 돌아오는 방식 — 팝업 차단의 영향을 받지 않음
  try{ sessionStorage.setItem('trip_interactive_connect','1'); }catch(e){}
  location.href = buildGoogleAuthUrl(null);
}
function consumeGoogleRedirectToken(){
  if(location.hash.indexOf('access_token=')===-1 && location.hash.indexOf('error=')===-1) return false;
  const params = new URLSearchParams(location.hash.slice(1));
  const token = params.get('access_token');
  const error = params.get('error');
  const errorDesc = params.get('error_description') || '';
  const restoredSearch = params.get('state') || location.search; // ?dev=1 등 원래 쿼리스트링 복원
  history.replaceState(null, '', location.pathname + restoredSearch);
  if(token){
    try{ sessionStorage.removeItem('trip_silent_ts'); }catch(e){}   // 재연결 성공 → 다음 새로고침에서도 정상적으로 다시 연결
    googleAccessToken = token;
    googleSignedIn = true;
    ls_set('trip_google_connected','1');
    return true;
  }
  if(error){
    console.log('Google 재연결 실패(정상 폴백):', error);
    // 조용한 재연결이 실패하면 '연결됨' 표시를 지워서 같은 시도를 되풀이(무한 로딩)하지 않게 함.
    // 이후에는 상단의 "Google 연결" 버튼으로 직접 연결하면 됩니다.
    try{ localStorage.removeItem('trip_google_connected'); }catch(e){}
    let interactive = false;
    try{ interactive = sessionStorage.getItem('trip_interactive_connect')==='1'; sessionStorage.removeItem('trip_interactive_connect'); }catch(e){}
    if(interactive) pendingGoogleError = { code: error, desc: errorDesc };   // 직접 누른 연결이 실패한 경우에만 안내(조용한 재연결 실패는 정상 폴백)
  }
  return false;
}
async function gApi(url, opts={}){
  const resp = await fetch(url, {
    ...opts,
    headers:{ 'Authorization':'Bearer '+googleAccessToken, 'Content-Type':'application/json', ...(opts.headers||{}) }
  });
  if(!resp.ok){ const t = await resp.text(); throw new Error('Google API 오류: '+t); }
  return resp.json();
}
async function ensureSpreadsheet(){
  const q = encodeURIComponent(`name='${SPREADSHEET_TITLE}' and mimeType='application/vnd.google-apps.spreadsheet' and trashed=false`);
  const list = await gApi(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,createdTime,modifiedTime)&orderBy=${encodeURIComponent('modifiedTime desc')}`);
  const files = list.files || [];
  let remembered = null;
  try{ remembered = localStorage.getItem('trip_sheet_id'); }catch(e){}
  if(files.length === 1){
    spreadsheetId = files[0].id;
  } else if(files.length > 1){
    // 같은 이름의 시트가 여러 개일 때: ① 이전에 쓰던 시트가 있으면 그것을, ② 없으면 일정 데이터가 들어 있는 가장 최근 시트를 씁니다.
    const prev = remembered && files.find(f=>f.id===remembered);
    if(prev){
      spreadsheetId = prev.id;
    } else {
      let chosen = null;
      for(const f of files.slice(0,5)){
        try{
          const r = await gApi(`https://sheets.googleapis.com/v4/spreadsheets/${f.id}/values/kv!A2:A3`);
          if(r.values && r.values.length){ chosen = f; break; }
        }catch(e){ console.error('sheet probe failed', f.id, e); }
      }
      spreadsheetId = (chosen || files[0]).id;
    }
  } else {
    const created = await gApi('https://sheets.googleapis.com/v4/spreadsheets', {
      method:'POST',
      body: JSON.stringify({properties:{title:SPREADSHEET_TITLE}, sheets:[{properties:{title:'kv'}}]})
    });
    spreadsheetId = created.spreadsheetId;
    await gApi(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/kv!A1:B1?valueInputOption=RAW`, {
      method:'PUT', body: JSON.stringify({values:[['key','value']]})
    });
    showToast(L('새 구글 시트를 만들었어요', 'Created a new Google Sheet'));
  }
  try{ localStorage.setItem('trip_sheet_id', spreadsheetId); }catch(e){}
}
async function sheetsReadAll(){
  const resp = await gApi(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/kv!A2:B100000`);
  const rows = resp.values || [];
  const map = {};
  rows.forEach(r=>{ if(r[0]!==undefined) map[r[0]] = r[1]; });
  return map;
}
async function sheetsGet(key){
  const map = await sheetsReadAll();
  return map[key]!==undefined ? JSON.parse(map[key]) : null;
}
async function sheetsSet(key, val){
  const resp = await gApi(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/kv!A2:A100000`);
  const rows = resp.values || [];
  const idx = rows.findIndex(r=>r[0]===key);
  const valueStr = JSON.stringify(val);
  if(idx===-1){
    await gApi(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/kv!A:B:append?valueInputOption=RAW`, {
      method:'POST', body: JSON.stringify({values:[[key,valueStr]]})
    });
  } else {
    const row = idx+2;
    await gApi(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/kv!B${row}?valueInputOption=RAW`, {
      method:'PUT', body: JSON.stringify({values:[[valueStr]]})
    });
  }
}
function sanitizeTabName(title, tripId){
  let name = (title||'여행').replace(/[\[\]\*\?\/\\:']/g,'').trim();
  if(!name) name = '여행';
  name = name.slice(0, 80);
  return `${name}_${tripId}`;
}
async function ensureTabForTrip(tripId, desiredName){
  const meta = await gApi(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}?fields=sheets.properties`);
  const found = (meta.sheets||[]).find(s=>s.properties.title.endsWith('_'+tripId));
  if(found){
    if(found.properties.title!==desiredName){
      await gApi(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}:batchUpdate`, {
        method:'POST', body: JSON.stringify({requests:[{updateSheetProperties:{properties:{sheetId:found.properties.sheetId, title:desiredName}, fields:'title'}}]})
      });
    }
    return desiredName;
  }
  await gApi(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}:batchUpdate`, {
    method:'POST', body: JSON.stringify({requests:[{addSheet:{properties:{title:desiredName}}}]})
  });
  return desiredName;
}
async function syncTripSheetTab(tripId, trip){
  try{
    const tabName = sanitizeTabName(trip.title, tripId);
    await ensureTabForTrip(tripId, tabName);
    const quoted = `'${tabName.replace(/'/g,"''")}'`;
    await gApi(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${encodeURIComponent(quoted)}!A1:Z100000:clear`, { method:'POST', body: JSON.stringify({}) });
    const dates = Object.keys(trip.days).sort();
    const rows = [['날짜','요일','시작시간','종료시간','할 일','장소','메모']];
    dates.forEach(d=>{
      const dt = new Date(d+'T00:00:00');
      const blocks = (trip.days[d]||[]).slice().sort((a,b)=>a.time.localeCompare(b.time));
      if(!blocks.length){
        rows.push([d, dayLabel[dt.getDay()]+'요일', '', '', '(일정 없음)', '', '']);
      } else {
        blocks.forEach(b=>{
          rows.push([d, dayLabel[dt.getDay()]+'요일', b.time, b.endTime||'', b.title, b.location||'', b.note||'']);
        });
      }
    });
    await gApi(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${encodeURIComponent(quoted)}!A1?valueInputOption=RAW`, {
      method:'PUT', body: JSON.stringify({values: rows})
    });
  }catch(e){ console.error('sheet tab sync failed', e); }
}
async function deleteTripSheetTab(tripId){
  try{
    const meta = await gApi(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}?fields=sheets.properties`);
    const found = (meta.sheets||[]).find(s=>s.properties.title.endsWith('_'+tripId));
    if(found){
      await gApi(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}:batchUpdate`, {
        method:'POST', body: JSON.stringify({requests:[{deleteSheet:{sheetId: found.properties.sheetId}}]})
      });
    }
  }catch(e){ console.error('delete tab failed', e); }
}
async function readPriorLocal(key){
  if(window.storage){ try{ const r = await window.storage.get(key,false); return r?JSON.parse(r.value):null; }catch(e){ return null; } }
  const local = ls_get('tripdata:'+key);
  if(local!==null) return JSON.parse(local);
  return memoryStore[key]!==undefined ? memoryStore[key] : null;
}
async function migrateAndReload(){
  // 처음 연결 시, 이 브라우저(또는 이 창)에 이미 있던 데이터를 한 번만 시트로 옮겨줍니다.
  try{
    const existing = await sheetsGet('trips-list');
    if(!existing || !existing.length){
      const localTrips = await readPriorLocal('trips-list');
      if(localTrips && localTrips.length){
        await sheetsSet('trips-list', localTrips);
        for(const t of localTrips){
          const tripData = await readPriorLocal('trip:'+t.id);
          if(tripData) await sheetsSet('trip:'+t.id, tripData);
        }
        const activeId = await readPriorLocal('active-trip');
        if(activeId) await sheetsSet('active-trip', activeId);
      }
    }
  }catch(e){ console.error('migration skipped', e); }
  await loadState();
}

async function safeGet(key, strict){
  try{
    if(googleSignedIn) return await sheetsGet(key);
    if(window.storage){ const r = await window.storage.get(key,false); return r ? JSON.parse(r.value) : null; }
    const local = ls_get('tripdata:'+key);
    if(local!==null) return JSON.parse(local);
    return memoryStore[key] !== undefined ? memoryStore[key] : null;
  }catch(e){ console.error(e); if(strict && googleSignedIn) throw e; return null; }
}
async function safeSet(key,val){
  try{
    if(googleSignedIn){
      await sheetsSet(key,val);
      if(key.indexOf('trip:')===0){
        const tripId = key.slice(5);
        if(val) await syncTripSheetTab(tripId, val);
        else await deleteTripSheetTab(tripId);
      }
      return;
    }
    if(window.storage){ await window.storage.set(key, JSON.stringify(val), false); return; }
    if(ls_trySet('tripdata:'+key, JSON.stringify(val))) return;
    memoryStore[key]=val;
  }catch(e){ console.error('storage set failed', e); showToast('저장 중 문제가 발생했어요'); }
}

function dateRange(start,end){
  const out=[]; let d=new Date(start+'T00:00:00'); const e=new Date(end+'T00:00:00');
  while(d<=e){ out.push(fmtDate(d)); d.setDate(d.getDate()+1); }
  return out;
}

async function loadState(){
  const strict = !!googleSignedIn;   // 구글 연결 중에는 읽기 실패를 '데이터 없음'으로 오해하지 않고 오류로 처리
  state.trips = (await safeGet('trips-list', strict)) || [];
  const active = await safeGet('active-trip', strict);
  let candidates = [];
  if(active) candidates.push(active);
  candidates = candidates.concat(state.trips.map(t=>t.id).filter(id=>id!==active));
  state.trip = null; state.activeTripId = null;
  let cleaned = false;
  for(const id of candidates){
    const data = await safeGet('trip:'+id, strict);
    if(data){
      state.activeTripId = id; state.trip = data; break;
    } else if(state.trips.find(t=>t.id===id)){
      state.trips = state.trips.filter(t=>t.id!==id);
      cleaned = true;
    }
  }
  if(cleaned){
    await safeSet('trips-list', state.trips);
  }
  if(state.activeTripId){
    await safeSet('active-trip', state.activeTripId);
  }
  if(state.trip){
    const todayStr = fmtDate(new Date());
    state.selectedDate = state.trip.days[todayStr] !== undefined ? todayStr : Object.keys(state.trip.days)[0];
  }
}

/* ---- 실시간 공유 보기 (읽기 전용, 로그인 불필요) ---- */
async function publicReadAllKv(spreadsheetId){
  const resp = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/kv!A2:B100000?key=${GOOGLE_API_KEY}`);
  if(!resp.ok){ const t = await resp.text(); throw new Error(t); }
  const data = await resp.json();
  const rows = data.values || [];
  const map = {};
  rows.forEach(r=>{ if(r[0]!==undefined) map[r[0]]=r[1]; });
  return map;
}
async function loadShareData(){
  try{
    const kv = await publicReadAllKv(state.shareSpreadsheetId);
    const activeId = kv['active-trip'] ? JSON.parse(kv['active-trip']) : null;
    state.trip = (activeId && kv['trip:'+activeId]) ? JSON.parse(kv['trip:'+activeId]) : null;
    if(state.trip){
      const todayStr = fmtDate(new Date());
      state.selectedDate = state.trip.days[todayStr]!==undefined ? todayStr : Object.keys(state.trip.days)[0];
    }
    state.shareError = null;
  }catch(e){
    console.error(e);
    state.shareError = '일정을 불러오지 못했어요. 공유 링크가 올바른지, API 키 설정이 되어 있는지 확인해주세요.';
  }
}

// 안전장치: 최근 60초 안에 조용한 재연결을 이미 시도했다면 다시 시도하지 않음(리디렉션 반복 방지)
function recentSilentAttempt_(){
  try{ return Date.now() - (Number(sessionStorage.getItem('trip_silent_ts'))||0) < 60000; }catch(e){ return false; }
}
async function init(){
  const shareId = new URLSearchParams(location.search).get('share');
  if(shareId){
    await initShareView(shareId);
    return;
  }
  const gotToken = consumeGoogleRedirectToken();
  if(gotToken){
    try{ sessionStorage.removeItem('trip_interactive_connect'); }catch(e){}
    const connectingOv = showConnectingOverlay();
    try{ await ensureSpreadsheet(); await sheetsReadAll(); await migrateAndReload(); }
    catch(e){
      console.error(e);
      googleSignedIn = false; googleAccessToken = null;
      try{ localStorage.removeItem('trip_google_connected'); }catch(_){}
      pendingGoogleError = { code: '', desc: googleErrText(e) };
      try{ await loadState(); }catch(_){}
    }
    finally{ connectingOv.remove(); }
  } else if(GOOGLE_ENABLED && ls_get('trip_google_connected')==='1' && !isStandaloneApp() && !recentSilentAttempt_()){
    try{ sessionStorage.setItem('trip_silent_ts', String(Date.now())); }catch(e){}
    // 이전에 연결한 적이 있으면: 페이지가 구글로 조용히 이동했다 바로 돌아옵니다(팝업 아님, 차단 안 됨)
    location.href = buildGoogleAuthUrl('none');
    return;
  } else {
    await loadState();
  }
  render();
  if(pendingGoogleError){ const pe = pendingGoogleError; pendingGoogleError = null; openGoogleErrorModal(pe.code, pe.desc); }
  checkMorningPopup();
  setInterval(tick, 1000);
  setInterval(checkUpcomingNotifications, 20000);
}

function currentActivityInfo(){
  if(!state.trip) return null;
  const now = new Date();
  const todayStr = fmtDate(now);
  const start = state.trip.startDate, end = state.trip.endDate;
  if(todayStr < start){
    const diff = Math.ceil((new Date(start+'T00:00:00') - new Date(todayStr+'T00:00:00'))/86400000);
    return {phase:'before', diff};
  }
  if(todayStr > end){
    return {phase:'after'};
  }
  const blocks = (state.trip.days[todayStr]||[]).slice().sort((a,b)=>a.time.localeCompare(b.time));
  if(!blocks.length) return {phase:'noplan', date:todayStr};
  const nowHM = pad(now.getHours())+':'+pad(now.getMinutes());
  let current=null, next=null;
  for(let i=0;i<blocks.length;i++){
    if(blocks[i].time<=nowHM){ current = blocks[i]; next = blocks[i+1]||null; }
  }
  if(!current){ // before first block today
    return {phase:'waiting', next: blocks[0]};
  }
  return {phase:'active', current, next};
}

function renderBoard(){
  const info = currentActivityInfo();
  const now = new Date();
  const clock = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  const dateStr = `${now.getFullYear()}.${pad(now.getMonth()+1)}.${pad(now.getDate())} (${dayLabel[now.getDay()]})`;

  let body = '';
  if(!info){
    body = `<div class="board-empty">여행을 먼저 만들어주세요.</div>`;
  } else if(info.phase==='before'){
    body = `<div class="board-empty">여행 시작까지 <span class="mono" style="color:var(--flap-amber)">D-${info.diff}</span> · ${state.trip.title}</div>`;
  } else if(info.phase==='after'){
    body = `<div class="board-empty">여행이 종료되었습니다. 좋은 기억 되셨길 바라요.</div>`;
  } else if(info.phase==='noplan'){
    body = `<div class="board-empty">오늘(${info.date}) 등록된 일정이 없어요. 아래에서 추가해보세요.</div>`;
  } else if(info.phase==='waiting'){
    body = `<div class="board-empty">여행 당일, 첫 일정 전이에요.</div>
      <div class="board-rows"><div class="board-row">
        <span class="board-tag">다음</span>
        <span class="board-time mono">${info.next.time}</span>
        <span class="board-activity">${escapeHtml(info.next.title)}${info.next.location?`<span class="board-loc">@ ${escapeHtml(info.next.location)}</span>`:''}</span>
      </div></div>`;
  } else if(info.phase==='active'){
    body = `<div class="board-rows">
      <div class="board-row now">
        <span class="board-tag">지금</span>
        <span class="board-time mono">${info.current.time}${info.current.endTime?'–'+info.current.endTime:''}</span>
        <span class="board-activity">${escapeHtml(info.current.title)}${info.current.location?`<span class="board-loc">@ ${escapeHtml(info.current.location)}</span>`:''}</span>
      </div>
      ${info.next?`<div class="board-row">
        <span class="board-tag">다음</span>
        <span class="board-time mono">${info.next.time}</span>
        <span class="board-activity">${escapeHtml(info.next.title)}${info.next.location?`<span class="board-loc">@ ${escapeHtml(info.next.location)}</span>`:''}</span>
      </div>`:`<div class="board-row"><span class="board-tag">다음</span><span class="board-activity" style="color:#7C8496">오늘 일정 끝</span></div>`}
    </div>`;
  }

  return `<div class="board">
    <div class="board-date">${dateStr}</div>
    <div class="board-clock mono">${clock}</div>
    ${body}
  </div>`;
}

function tick(){
  const clockEl = document.querySelector('.board-clock');
  if(clockEl){
    const now = new Date();
    clockEl.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  }
  // re-render board fully once a minute to update current/next
  if(new Date().getSeconds()===0) renderBoardOnly();
  checkMorningPopup();
}
function renderBoardOnly(){
  const old = document.querySelector('.board');
  if(old) old.outerHTML = renderBoard();
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function linkifyNote(s){
  const escaped = escapeHtml(s);
  return escaped.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener" style="color:var(--line-blue);text-decoration:underline;word-break:break-all;">$1</a>');
}

function renderTabs(){
  if(!state.trip) return '';
  const todayStr = fmtDate(new Date());
  const dates = Object.keys(state.trip.days).sort();
  return `<div class="tabs">${dates.map(d=>{
    const dt = new Date(d+'T00:00:00');
    const isToday = d===todayStr;
    const active = d===state.selectedDate;
    return `<div class="tab ${active?'active':''} ${isToday?'today':''}" data-date="${d}">
      <div class="tab-d">${dayLabel[dt.getDay()]}요일${isToday?' · 오늘':''}</div>
      <div class="tab-n mono">${pad(dt.getMonth()+1)}/${pad(dt.getDate())}</div>
    </div>`;
  }).join('')}</div>`;
}

function renderTimeline(){
  if(!state.trip || !state.selectedDate) return '';
  const blocks = (state.trip.days[state.selectedDate]||[]).slice().sort((a,b)=>a.time.localeCompare(b.time));
  const list = blocks.length ? blocks.map(b=>`
    <div class="block">
      <div class="block-time mono">${b.time}</div>
      <div class="block-body">
        <div class="block-title">${escapeHtml(b.title)}${b.location?` <span style="font-weight:400;color:var(--ink-soft);font-size:12px;">· ${escapeHtml(b.location)}</span>`:''}</div>
        ${b.endTime?`<div class="block-meta">~${b.endTime}</div>`:''}
        ${b.note?`<div class="block-note">${linkifyNote(b.note)}</div>`:''}
      </div>
      ${state.shareMode?'':`<div class="block-actions">
        <button class="icon-btn" data-edit="${b.id}" title="수정">✎</button>
        <button class="icon-btn" data-del="${b.id}" title="삭제">✕</button>
      </div>`}
    </div>
  `).join('') : `<div class="empty-day">이 날짜엔 아직 일정이 없어요.</div>`;

  return `<div class="timeline">${list}</div>
    ${state.shareMode?'':`<button class="add-block-btn" id="addBlockBtn">+ 일정 추가</button>`}`;
}

function renderNotifBanner(){

  const nt = $('#newTripBtn2'); if(nt) nt.onclick = ()=>openTripForm();
  const pi2 = $('#pdfImportBtn2'); if(pi2) pi2.onclick = ()=>triggerPdfPick('merge');
  const phi2 = $('#photoImportBtn2'); if(phi2) phi2.onclick = ()=>triggerPhotoPick('merge');
  const ex = $('#exportPdfBtn'); if(ex) ex.onclick = ()=>exportPdf();
  const rfb = $('#refreshBtn'); if(rfb) rfb.onclick = ()=>refreshData();
  const slb = $('#shareLinkBtn'); if(slb) slb.onclick = ()=>createShareLink();
  const dtb = $('#deleteTripBtn'); if(dtb) dtb.onclick = ()=>deleteCurrentTrip();
  const sw = $('#tripSwitch'); if(sw) sw.onchange = async e=>{
    const newId = e.target.value;
    let newTrip = await safeGet('trip:'+newId);
    if(!newTrip){
      state.trips = state.trips.filter(t=>t.id!==newId);
      await safeSet('trips-list', state.trips);
      showToast('데이터가 없는 여행이라 목록에서 정리했어요');
      if(state.trips.length){
        state.activeTripId = state.trips[0].id;
        state.trip = await safeGet('trip:'+state.activeTripId);
      } else {
        state.activeTripId = null; state.trip = null;
      }
    } else {
      state.activeTripId = newId;
      state.trip = newTrip;
      state.viewingPastTrip = true;
    }
    await safeSet('active-trip', state.activeTripId);
    if(state.trip){
      const todayStr = fmtDate(new Date());
      state.selectedDate = state.trip.days[todayStr]!==undefined ? todayStr : Object.keys(state.trip.days)[0];
    }
    render();
  };
  const en = $('#enableNotif'); if(en) en.onclick = requestNotifPermission;
  const gcb2 = $('#googleConnectBtn'); if(gcb2) gcb2.onclick = ()=>connectGoogle();
  document.querySelectorAll('.tab').forEach(el=>{
    el.onclick = ()=>{ state.selectedDate = el.dataset.date; render(); };
  });
  const addBtn = $('#addBlockBtn'); if(addBtn) addBtn.onclick = ()=>openBlockForm();
  document.querySelectorAll('[data-edit]').forEach(el=>{
    el.onclick = ()=>openBlockForm(el.dataset.edit);
  });
  document.querySelectorAll('[data-del]').forEach(el=>{
    el.onclick = ()=>deleteBlock(el.dataset.del);
  });
}

      <div class="field"><label>종료일</label><input id="f_end" type="date"></div>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-line" id="f_cancel">취소</button>
      <button class="btn btn-primary" id="f_save">만들기</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  $('#f_cancel').onclick = ()=>overlay.remove();
  overlay.onclick = e=>{ if(e.target===overlay) overlay.remove(); };
  $('#f_save').onclick = async ()=>{
    const title = $('#f_title').value.trim();
    const s = $('#f_start').value, e = $('#f_end').value;
    if(!title||!s||!e||s>e){ showToast('이름과 날짜를 올바르게 입력해주세요'); return; }
    const id = uid();
    const days = {}; dateRange(s,e).forEach(d=>days[d]=[]);
    const trip = {title,startDate:s,endDate:e,days,morningChecked:[]};
    state.trips.push({id,title,startDate:s,endDate:e});
    await safeSet('trips-list', state.trips);
    await safeSet('trip:'+id, trip);
    await safeSet('active-trip', id);
    state.activeTripId = id; state.trip = trip;
    const todayStr = fmtDate(new Date());
    state.selectedDate = days[todayStr]!==undefined ? todayStr : Object.keys(days)[0];
    overlay.remove();
    render();
    showToast('여행이 만들어졌어요');
  };
}

/* ---- block create/edit ---- */
function openBlockForm(blockId){
  const editing = blockId ? (state.trip.days[state.selectedDate]||[]).find(b=>b.id===blockId) : null;
  const overlay = document.createElement('div');
  overlay.className='overlay';
  overlay.innerHTML = `<div class="sheet">
    <h3>${editing?'일정 수정':'일정 추가'} · ${state.selectedDate}</h3>

      <div class="field"><label>시작 시간</label><input id="b_time" type="time" value="${editing?editing.time:''}"></div>

    </div>
    <div class="field"><label>할 일</label><input id="b_title" placeholder="예: 오타루 운하 산책" value="${editing?escapeHtml(editing.title):''}"></div>
    <div class="field"><label>장소(선택)</label><input id="b_loc" placeholder="예: 오타루" value="${editing&&editing.location?escapeHtml(editing.location):''}"></div>
    <div class="field">
      <label>메모(선택)</label>
      <textarea id="b_note" placeholder="준비물, 예약번호 등">${editing&&editing.note?escapeHtml(editing.note):''}</textarea>
    </div>
    <div class="sheet-actions">
      <button class="btn btn-line" id="b_cancel">취소</button>
      <button class="btn btn-primary" id="b_save">${editing?'저장':'추가'}</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  const noteEl = $('#b_note');
  const autoGrow = ()=>{ noteEl.style.height='auto'; noteEl.style.height=(noteEl.scrollHeight+2)+'px'; };
  autoGrow();
  noteEl.addEventListener('input', autoGrow);
  $('#b_cancel').onclick = ()=>overlay.remove();
  overlay.onclick = e=>{ if(e.target===overlay) overlay.remove(); };
  $('#b_save').onclick = async ()=>{
    const time = $('#b_time').value, title = $('#b_title').value.trim();
    if(!time||!title){ showToast('시간과 할 일을 입력해주세요'); return; }
    const sheetEl = overlay.querySelector('.sheet');
    sheetEl.classList.add('saving');
    $('#b_save').textContent = '저장 중…';
    $('#b_save').disabled = true;
    $('#b_cancel').disabled = true;
    const data = {
      id: editing?editing.id:uid(),
      time, endTime: $('#b_end').value||null,
      title, location: $('#b_loc').value.trim(), note: $('#b_note').value.trim()
    };
    const arr = state.trip.days[state.selectedDate]||[];
    if(editing){

    }

    await safeSet('trip:'+state.activeTripId, state.trip);
    overlay.remove();
    render();
  };
}

/* ---- morning check-in ---- */
async function checkMorningPopup(){
  if(!state.trip) return;
  const todayStr = fmtDate(new Date());
  if(todayStr < state.trip.startDate || todayStr > state.trip.endDate) return;
  const blocks = state.trip.days[todayStr]||[];
  if(!blocks.length) return;
  if((state.trip.morningChecked||[]).includes(todayStr)) return;
  if(document.getElementById('morningOverlay')) return; // already showing
  openMorningModal(todayStr, blocks);
}

function openMorningModal(dateStr, blocks){
  const overlay = document.createElement('div');
  overlay.id='morningOverlay';
  overlay.className='overlay';
  const sorted = blocks.slice().sort((a,b)=>a.time.localeCompare(b.time));
  overlay.innerHTML = `<div class="sheet">
    <h3>오늘의 일정 · ${dateStr}</h3>
    <div class="morning-list">${sorted.map(b=>`
      <div class="morning-item"><span class="mono">${b.time}</span><span>${escapeHtml(b.title)}${b.location?` · ${escapeHtml(b.location)}`:''}</span></div>
    `).join('')}</div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" id="m_edit">계획 수정하기</button>
      <button class="btn btn-primary" id="m_ok">이대로 진행할게요</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  const closeAndMark = async ()=>{
    state.trip.morningChecked = state.trip.morningChecked||[];
    if(!state.trip.morningChecked.includes(dateStr)) state.trip.morningChecked.push(dateStr);
    await safeSet('trip:'+state.activeTripId, state.trip);
    overlay.remove();
  };
  $('#m_ok').onclick = closeAndMark;
  $('#m_edit').onclick = async ()=>{
    await closeAndMark();
    state.selectedDate = dateStr;
    render();
    document.getElementById('addBlockBtn')?.scrollIntoView({behavior:'smooth', block:'center'});
  };
}

/* ---- notifications ---- */
async function requestNotifPermission(){
  if(typeof Notification==='undefined'){ showToast('이 브라우저는 알림을 지원하지 않아요'); return; }
  const perm = await Notification.requestPermission();
  state.notifPermission = perm;
  render();
  if(perm==='granted') showToast('알림이 켜졌어요. 이 탭을 열어두세요.');
}

function checkUpcomingNotifications(){
  if(!state.trip || state.notifPermission!=='granted') return;
  const todayStr = fmtDate(new Date());
  const blocks = state.trip.days[todayStr]||[];
  const now = new Date();
  blocks.forEach(b=>{
    if(state.notifiedIds.has(b.id)) return;
    const [h,m] = b.time.split(':').map(Number);
    const blockTime = new Date(now); blockTime.setHours(h,m,0,0);
    const diffMin = (blockTime - now)/60000;
    if(diffMin<=10 && diffMin>=0){
      new Notification('곧 시작할 일정', {body:`${b.time} ${b.title}${b.location?' · '+b.location:''}`});
      state.notifiedIds.add(b.id);
    }
  });
}

/* ---- PDF import ---- */
function ensurePdfJs(){
  return new Promise((resolve,reject)=>{
    if(window.pdfjsLib){ resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = ()=>{
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      resolve();
    };
    s.onerror = ()=>reject(new Error('pdf.js 로드 실패'));
    document.head.appendChild(s);
  });
}

function triggerPdfPick(mode){
  let input = document.getElementById('hiddenPdfInput');
  if(!input){
    input = document.createElement('input');
    input.type='file'; input.accept='application/pdf'; input.id='hiddenPdfInput'; input.style.display='none';
    document.body.appendChild(input);
  }
  input.value='';
  input.onchange = e=>{
    const file = e.target.files[0];
    if(file) handlePdfFile(file, mode);
  };
  input.click();
}

async function extractPdfText(file){
  await ensurePdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({data:buf}).promise;
  let text = '';
  const maxPages = Math.min(pdf.numPages, 25);
  for(let i=1;i<=maxPages;i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(it=>it.str).join(' ') + '\n';
  }
  return text.trim();
}

const EXTRACT_SYSTEM_PROMPT = (todayStr)=>`당신은 여행 일정표(텍스트 또는 이미지)에서 정보를 추출해 JSON으로만 응답하는 도구입니다.
설명, 인사말, 코드블록 표시(백틱) 없이 순수 JSON 객체 하나만 출력하세요.
스키마:
{"title": string, "startDate": "YYYY-MM-DD", "endDate": "YYYY-MM-DD",
 "items": [{"date":"YYYY-MM-DD","time":"HH:MM","endTime":"HH:MM 또는 null","title":string,"location":string,"note":string}]}
규칙:
- 연도가 원본에 없으면 오늘 날짜(${todayStr}) 기준 가장 가까운 미래 연도를 사용하세요.
- 시간이 명시되지 않은 항목은 하루 흐름상 자연스러운 시각을 24시간제로 추정해 채우세요.
- location, note 정보가 없으면 빈 문자열로 두세요.
- note 안에 서로 다른 정보(예: 교통편 안내, 준비물, 요금, 환승 방법 등)가 여러 개 섞여 있으면, 항목마다 줄바꿈(\\n)으로 구분해서 읽기 쉽게 정리하세요. 한 문장짜리 짧은 메모는 그대로 한 줄로 두세요.
- items는 날짜, 시간 순으로 정렬하세요.`;

const RETRYABLE_STATUS = new Set([408, 409, 429, 500, 502, 503, 504, 529]);
function sleep(ms){ return new Promise(r=>setTimeout(r, ms)); }

async function callGeminiForItinerary(parts, onRetry){
  const todayStr = fmtDate(new Date());
  const systemText = EXTRACT_SYSTEM_PROMPT(todayStr);
  const headers = {'Content-Type':'application/json'};
  const geminiBody = {
    systemInstruction: { parts: [{ text: systemText }] },
    contents: [{ role:'user', parts: Array.isArray(parts) ? parts : [{ text: parts }] }],
    generationConfig: { maxOutputTokens: 8192, responseMimeType: 'application/json' }
  };

  // Google에 연결된 상태에서만 사용: Apps Script가 (시트 소유자 확인 후) Gemini를 호출합니다.
  if(!(googleSignedIn && googleAccessToken)){
    throw new Error('PDF·사진 인식은 Google에 연결된 상태에서만 쓸 수 있어요. 상단의 "Google 연결"을 눌러 연결한 뒤 다시 시도해주세요.');
  }
  if(AI_GAS_URL.indexOf('REPLACE')!==-1){
    throw new Error('Apps Script 주소(AI_GAS_URL)가 설정되지 않았어요.');
  }
  const mode = 'gas';
  const endpoint = AI_GAS_URL;
  headers['Content-Type'] = 'text/plain;charset=utf-8'; // 사전요청(preflight) 없이 보내기 위함
  const body = JSON.stringify({ token: googleAccessToken, body: geminiBody });

  // 일시적 오류(429/5xx 등)는 몇 초 간격으로 최대 3번 자동 재시도합니다.
  const delays = [2000, 5000, 10000]; // 2초 → 5초 → 10초
  let lastErr = null;
  for(let attempt=0; attempt<=delays.length; attempt++){
    let resp, data, status, ok;
    try{
      resp = await fetch(endpoint, { method:'POST', headers, body });
      data = await resp.json().catch(()=>null);
    }catch(networkErr){
      lastErr = new Error('네트워크 오류: '+(networkErr.message||networkErr));
      if(attempt<delays.length){ if(onRetry) onRetry(attempt+1, delays.length+1); await sleep(delays[attempt]); continue; }
      throw lastErr;
    }
    if(mode==='gas'){
      // Apps Script 웹 앱은 HTTP 상태코드를 못 바꾸므로 본문의 error.code로 판단
      if(data==null){ status = 502; ok = false; }
      else if(data.error){ status = data.error.code || 500; ok = false; }
      else { status = 200; ok = resp.ok; }
    } else { status = resp.status; ok = resp.ok; }
    if(ok){
      return finishItineraryResponse(data);
    }
    const msg = (data && data.error && data.error.message) ? data.error.message
              : (mode==='gas' && data==null ? 'Apps Script 응답을 읽지 못했어요(배포 URL·권한을 확인해주세요)' : ('HTTP '+status));
    lastErr = new Error('API 오류: '+msg);
    if(RETRYABLE_STATUS.has(status) && attempt<delays.length){
      if(onRetry) onRetry(attempt+1, delays.length+1);
      await sleep(delays[attempt]);
      continue;
    }
    throw lastErr;
  }
  throw lastErr;
}

function finishItineraryResponse(data){
  const cand = (data && data.candidates && data.candidates[0]) || null;
  const textBlocks = (cand && cand.content && cand.content.parts)
    ? cand.content.parts.map(p=>p.text||'').join('\n') : '';
  const cleaned = textBlocks.replace(/```json|```/g,'').trim();
  let parsed;
  try{
    parsed = JSON.parse(cleaned);
  }catch(e){
    console.error('JSON 파싱 실패, 원본 응답:', textBlocks);
    const truncatedHint = (cand && cand.finishReason==='MAX_TOKENS') ? ' (응답이 길이 제한에 걸려 중간에 잘렸을 수 있어요)' : '';
    throw new Error('응답을 이해하지 못했어요'+truncatedHint);
  }
  if(!parsed.title || !parsed.startDate || !parsed.endDate || !Array.isArray(parsed.items)){
    throw new Error('형식이 올바르지 않습니다');
  }
  return parsed;
}

async function callAIExtract(text){
  const truncated = text.slice(0, 12000);
  return callGeminiForItinerary(`다음은 여행 일정표에서 추출한 텍스트입니다:\n\n${truncated}`, setPdfProgressRetryMsg);
}

async function readFileAsBase64(file){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(String(reader.result).split(',')[1]);
    reader.onerror = ()=> reject(new Error('파일을 읽지 못했어요'));
    reader.readAsDataURL(file);
  });
}

async function callAIExtractFromImage(file){
  const base64 = await readFileAsBase64(file);
  const mimeType = file.type || 'image/jpeg';
  return callGeminiForItinerary([
    { inlineData: { mimeType, data: base64 } },
    { text:'위 이미지는 여행 일정표(캡처·사진)입니다. 여기서 정보를 추출하세요.' }
  ], setPdfProgressRetryMsg);
}

async function handlePdfFile(file, mode){
  const overlay = openPdfProgressModal();
  try{
    const text = await extractPdfText(file);
    if(!text || text.length < 20){
      overlay.remove();
      openImportErrorModal('PDF에서 텍스트를 읽지 못했어요.', '스캔한 이미지 PDF일 가능성이 높아요. 이 경우 텍스트 레이어가 없어서 자동으로 읽을 수 없으니, 직접 입력해주세요.');
      return;
    }
    const parsed = await callAIExtract(text);
    if(!parsed.items || parsed.items.length===0){
      overlay.remove();
      openImportErrorModal(
        '세부 일정을 찾지 못했어요.',
        `날짜(${parsed.startDate} ~ ${parsed.endDate})는 인식했지만, 시간대별 개별 일정은 찾지 못했어요. 표나 이미지 형태의 일정표는 자동 인식이 어려울 수 있어요.\n\n실제로 읽힌 텍스트 일부:\n"${text.slice(0,400).replace(/\s+/g,' ')}"`
      );
      return;
    }
    overlay.remove();
    openImportPreview(parsed, mode);
  }catch(err){
    console.error(err);
    overlay.remove();
    openImportErrorModal('PDF 분석 중 오류가 발생했어요.', err.message || String(err));
  }
}

async function mergeIntoCurrentTrip(parsed){
  const trip = state.trip;
  const allDates = [trip.startDate, trip.endDate, ...parsed.items.map(i=>i.date)].sort();
  const newStart = allDates[0], newEnd = allDates[allDates.length-1];
  if(newStart!==trip.startDate || newEnd!==trip.endDate){
    dateRange(newStart,newEnd).forEach(d=>{ if(!trip.days[d]) trip.days[d]=[]; });
    trip.startDate = newStart; trip.endDate = newEnd;
  }
  parsed.items.forEach(it=>{
    if(!trip.days[it.date]) trip.days[it.date]=[];
    trip.days[it.date].push({id:uid(), time:it.time||'09:00', endTime:it.endTime||null, title:it.title||'일정', location:it.location||'', note:it.note||''});
  });
  await safeSet('trip:'+state.activeTripId, trip);
  const idx = state.trips.findIndex(t=>t.id===state.activeTripId);
  if(idx!==-1){
    state.trips[idx].startDate = trip.startDate; state.trips[idx].endDate = trip.endDate;
    await safeSet('trips-list', state.trips);
  }
}

// 중복 판단: 같은 날짜 + 같은 시작시간 + 같은 제목(공백·대소문자 무시)
function dupKey_(date, time, title){
  return [date, (time||'09:00'), String(title||'').replace(/\s+/g,' ').trim().toLowerCase()].join('|');
}
function splitDuplicates(items){
  const seen = new Set();
  const days = (state.trip && state.trip.days) || {};
  Object.keys(days).forEach(d=>(days[d]||[]).forEach(b=>seen.add(dupKey_(d, b.time, b.title))));
  const fresh = [], dup = [];
  items.forEach(it=>{
    const k = dupKey_(it.date, it.time, it.title||'일정');
    if(seen.has(k)) dup.push(it); else { seen.add(k); fresh.push(it); }
  });
  return {fresh, dup};
}

function openImportPreview(parsed, mode){
  const overlay = document.createElement('div');
  overlay.className='overlay';
  const dayCounts = {};
  parsed.items.forEach(it=>{ dayCounts[it.date]=(dayCounts[it.date]||0)+1; });
  const days = Object.keys(dayCounts).sort();

  if(mode==='merge' && state.trip){
    // 이미 있는 일정(같은 날짜·시작시간·제목)은 제외하고 새 일정만 추가
    const {fresh, dup} = splitDuplicates(parsed.items);
    const freshCounts = {};
    fresh.forEach(it=>{ freshCounts[it.date]=(freshCounts[it.date]||0)+1; });
    const freshDays = Object.keys(freshCounts).sort();
    const dupNote = dup.length ? `<p style="font-size:14px;color:var(--coral);margin:6px 0;">이미 있는 일정 ${dup.length}개는 중복이라 제외했어요.</p>` : '';
    if(fresh.length===0){
      overlay.innerHTML = `<div class="sheet">
        <h3>"${escapeHtml(state.trip.title)}"에 추가</h3>
        <p style="font-size:15px;color:var(--ink-soft);line-height:1.6;">불러온 일정 ${parsed.items.length}개가 모두 이미 들어 있어요. 추가할 새 일정이 없습니다.</p>
        <div class="sheet-actions"><button class="btn btn-primary" id="p_cancel">닫기</button></div>
      </div>`;
      document.body.appendChild(overlay);
      $('#p_cancel').onclick = ()=>overlay.remove();
      overlay.onclick = e=>{ if(e.target===overlay) overlay.remove(); };
      return;
    }
    overlay.innerHTML = `<div class="sheet">
      <h3>"${escapeHtml(state.trip.title)}"에 추가</h3>
      <div class="morning-list">${freshDays.map(d=>`<div class="morning-item"><span class="mono">${d}</span><span>일정 ${freshCounts[d]}개 추가</span></div>`).join('')}</div>
      ${dupNote}
      <p style="font-size:13px;color:var(--ink-soft);">새 일정 ${fresh.length}개가 현재 여행에 날짜·시간순으로 합쳐집니다.</p>
      <div class="sheet-actions">
        <button class="btn btn-line" id="p_cancel">취소</button>
        <button class="btn btn-primary" id="p_save">기존 여행에 추가</button>
      </div>
    </div>`;
    document.body.appendChild(overlay);
    $('#p_cancel').onclick = ()=>overlay.remove();
    overlay.onclick = e=>{ if(e.target===overlay) overlay.remove(); };
    $('#p_save').onclick = async ()=>{
      await mergeIntoCurrentTrip({...parsed, items: fresh});
      overlay.remove();
      const todayStr = fmtDate(new Date());
      if(state.trip.days[todayStr]!==undefined) state.selectedDate = todayStr;
      render();
      showToast(dup.length ? `새 일정 ${fresh.length}개를 추가했어요(중복 ${dup.length}개 제외)` : '일정이 추가됐어요');
    };
    return;
  }

  overlay.innerHTML = `<div class="sheet">
    <h3>가져온 일정 확인</h3>
    <div class="field"><label>여행 이름</label><input id="p_title" value="${escapeHtml(parsed.title)}"></div>
    <div class="row2">
      <div class="field"><label>시작일</label><input id="p_start" type="date" value="${parsed.startDate}"></div>
      <div class="field"><label>종료일</label><input id="p_end" type="date" value="${parsed.endDate}"></div>
    </div>
    <div class="morning-list">${days.map(d=>`<div class="morning-item"><span class="mono">${d}</span><span>일정 ${dayCounts[d]}개</span></div>`).join('')}</div>
    <p style="font-size:12px;color:var(--ink-soft);">총 ${parsed.items.length}개 일정을 불러왔어요. 저장 후에도 언제든 수정할 수 있어요.</p>
    <div class="sheet-actions">
      <button class="btn btn-line" id="p_cancel">취소</button>
      <button class="btn btn-primary" id="p_save">이 일정으로 만들기</button>
    </div>
  </div>`;
  document.body.appendChild(overlay);
  $('#p_cancel').onclick = ()=>overlay.remove();
  overlay.onclick = e=>{ if(e.target===overlay) overlay.remove(); };
  $('#p_save').onclick = async ()=>{
    const title = $('#p_title').value.trim() || parsed.title;
    let start = $('#p_start').value || parsed.startDate;
    let end = $('#p_end').value || parsed.endDate;
    const allDates = [start, end, ...parsed.items.map(i=>i.date)].sort();
    start = allDates[0]; end = allDates[allDates.length-1];
    const id = uid();
    const days = {}; dateRange(start,end).forEach(d=>days[d]=[]);
    parsed.items.forEach(it=>{
      if(!days[it.date]) days[it.date]=[];
      days[it.date].push({id:uid(), time:it.time||'09:00', endTime:it.endTime||null, title:it.title||'일정', location:it.location||'', note:it.note||''});
    });
    const trip = {title, startDate:start, endDate:end, days, morningChecked:[]};
    state.trips.push({id,title,startDate:start,endDate:end});
    await safeSet('trips-list', state.trips);
    await safeSet('trip:'+id, trip);
    await safeSet('active-trip', id);
    state.activeTripId = id; state.trip = trip;
    const todayStr = fmtDate(new Date());
    state.selectedDate = days[todayStr]!==undefined ? todayStr : Object.keys(days)[0];
    overlay.remove();
    render();
    showToast('PDF 일정을 불러왔어요');
  };
}

/* ---- PDF export (print to PDF) ---- */
function buildPrintable(){
  if(!state.trip) return;
  const t = state.trip;
  const dates = Object.keys(t.days).sort();
  const daysHtml = dates.map(d=>{
    const dt = new Date(d+'T00:00:00');
    const blocks = (t.days[d]||[]).slice().sort((a,b)=>a.time.localeCompare(b.time));
    const rows = blocks.length ? blocks.map(b=>`
      <tr>
        <td class="print-time">${b.time}${b.endTime?'–'+b.endTime:''}</td>
        <td>
          <div class="print-item-title">${escapeHtml(b.title)}${b.location?` <span class="print-loc">· ${escapeHtml(b.location)}</span>`:''}</div>
          ${b.note?`<div class="print-note">${linkifyNote(b.note)}</div>`:''}
        </td>
      </tr>`).join('') : `<tr><td colspan="2" class="print-empty">일정 없음</td></tr>`;
    return `<div class="print-day">
      <h2>${d} · ${dayLabel[dt.getDay()]}요일</h2>
      <table class="print-table">${rows}</table>
    </div>`;
  }).join('');
  document.getElementById('printSheet').innerHTML = `
    <h1>${escapeHtml(t.title)}</h1>
    <div class="print-dates">${t.startDate} ~ ${t.endDate} · 내보낸 시각 ${new Date().toLocaleString('ko-KR')}</div>
    ${daysHtml}
  `;
}

function exportPdf(){
  if(!state.trip){ showToast('내보낼 여행이 없어요'); return; }
  buildPrintable();
  const prevTitle = document.title;
  document.title = state.trip.title + ' 여행 일정';
  window.print();
  document.title = prevTitle;
}

      state.activeTripId = state.trips[0].id;
      state.trip = await safeGet('trip:'+state.activeTripId);
    } else {
      state.activeTripId = null; state.trip = null;
    }
    await safeSet('active-trip', state.activeTripId);
    if(state.trip){
      const todayStr = fmtDate(new Date());
      state.selectedDate = state.trip.days[todayStr]!==undefined ? todayStr : Object.keys(state.trip.days)[0];
    }
    overlay.remove();
    render();
    showToast('여행이 삭제됐어요');
  };
}

function triggerPhotoPick(mode){
  let input = document.getElementById('hiddenPhotoInput');
  if(!input){
    input = document.createElement('input');
    input.type='file'; input.accept='image/*'; input.id='hiddenPhotoInput'; input.style.display='none';
    document.body.appendChild(input);
  }
  input.value='';
  input.onchange = e=>{
    const file = e.target.files[0];
    if(file) handlePhotoFile(file, mode);
  };
  input.click();
}

async function handlePhotoFile(file, mode){
  const overlay = openPdfProgressModal();
  try{
    const parsed = await callAIExtractFromImage(file);
    overlay.remove();
    if(!parsed.items || parsed.items.length===0){
      openImportErrorModal('세부 일정을 찾지 못했어요.', `날짜(${parsed.startDate} ~ ${parsed.endDate})는 인식했지만, 시간대별 개별 일정은 찾지 못했어요. 더 선명한 사진으로 다시 시도해주세요.`);
      return;
    }
    openImportPreview(parsed, mode);
  }catch(err){
    console.error(err);
    overlay.remove();
    openImportErrorModal('사진 분석 중 오류가 발생했어요.', err.message || String(err));
  }
}

init();
</script>
