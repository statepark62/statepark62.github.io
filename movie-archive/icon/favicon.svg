  <!-- 상하단 필름 타공 구멍 -->
  <circle cx="180" cy="180" r="14" fill="#38bdf8"/>
  <circle cx="256" cy="180" r="14" fill="#38bdf8"/>
  <circle cx="332" cy="180" r="14" fill="#38bdf8"/>
  <circle cx="180" cy="332" r="14" fill="#38bdf8"/>
  <circle cx="256" cy="332" r="14" fill="#38bdf8"/>
  <circle cx="332" cy="332" r="14" fill="#38bdf8"/>
  <!-- 재생/영사 렌즈 빔 -->
