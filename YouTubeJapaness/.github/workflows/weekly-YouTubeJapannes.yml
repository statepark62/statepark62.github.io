name: Bite size Japanese - 주간 생활 표현 추출

on:
  schedule:
    # 매주 월요일 03:00 UTC (한국시간 정오 12:00)
    - cron: "0 3 * * 1"
  workflow_dispatch: {}   # 필요시 수동 실행 버튼으로도 실행 가능

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 파이프라인 실행 (등록된 소스 전체)
        env:
          BSJ_SHEET_ID: ${{ secrets.BSJ_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python run_saved_sources.py
