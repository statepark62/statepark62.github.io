<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字幕帖 — 유튜브에서 건진 생활 일본어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg: #14181f;
    --bg-soft: #1c212b;
    --paper: #f7f3e9;
    --paper-dim: #efe9d8;
    --ink: #1f2430;
    --ink-dim: #5a5f6e;
    --amber: #f2b705;
    --amber-dim: #b8890a;
    --indigo: #6b7bb0;
    --line: #322f26;
    --line-paper: #ddd4bc;
    --radius: 3px;
    --serif: "Shippori Mincho", serif;
    --mono: "IBM Plex Mono", monospace;
    --sans: "Pretendard", -apple-system, sans-serif;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }

  body{
    margin: 0;
    background: var(--bg);
    color: var(--paper);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  a{ color: inherit; }

  /* ---------- 상단 ---------- */
  header{
    max-width: 960px;
    margin: 0 auto;
    padding: 64px 24px 32px;
  }

  .eyebrow{
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--amber);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 18px;
  }

  .eyebrow::before{
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--amber);
    box-shadow: 0 0 0 3px rgba(242,183,5,0.18);
  }

  h1{
    font-family: var(--serif);
    font-weight: 800;
    font-size: clamp(32px, 5.4vw, 52px);
    line-height: 1.25;
    margin: 0 0 14px;
  }

  h1 em{
    font-style: normal;
    color: var(--amber);
  }

  .lede{
    font-size: 16px;
    line-height: 1.7;
    color: rgba(247,243,233,0.68);
    max-width: 46em;
    margin: 0;
  }

  /* ---------- 자막 히어로 ---------- */
  .screen{
    max-width: 960px;
    margin: 8px auto 56px;
    padding: 0 24px;
  }

  .screen-frame{
    position: relative;
    background: #05070b;
    border: 1px solid #2a2f3a;
    border-radius: 6px;
    padding: 46px 32px 40px;
    overflow: hidden;
  }

  .screen-frame::before{
    content: "";
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
    pointer-events: none;
  }

  .screen-topbar{
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: var(--mono);
    font-size: 11px;
    color: #6a7180;
    margin-bottom: 34px;
  }

  .rec-dot{
    width: 7px; height: 7px; border-radius: 50%;
    background: #e5484d;
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse{
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }

  .caption-line{
    min-height: 96px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 12px;
  }

  .caption-jp{
    font-family: var(--serif);
    font-size: clamp(22px, 3.6vw, 32px);
    font-weight: 500;
    color: var(--paper);
    min-height: 1.4em;
  }

  .caption-jp .cursor{
    display: inline-block;
    width: 2px;
    height: 0.9em;
    background: var(--amber);
    margin-left: 3px;
    vertical-align: -0.1em;
    animation: blink 1s step-end infinite;
  }

  @keyframes blink{ 50% { opacity: 0; } }

  .caption-ko{
    font-family: var(--mono);
    font-size: 14px;
    color: var(--amber-dim);
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  .caption-ko.show{ opacity: 1; color: var(--amber); }

  /* ---------- 검색/컨트롤 ---------- */
  .controls{
    max-width: 960px;
    margin: 0 auto 28px;
    padding: 0 24px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }

  .search-box{
    flex: 1 1 280px;
    display: flex;
    align-items: center;
    background: var(--bg-soft);
    border: 1px solid #2a2f3a;
    border-radius: var(--radius);
    padding: 12px 16px;
    gap: 10px;
  }

  .search-box input{
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--paper);
    font-family: var(--sans);
    font-size: 14px;
  }

  .search-box input::placeholder{ color: #5a6070; }

  .search-box svg{ flex-shrink: 0; opacity: 0.5; }

  .count-badge{
    font-family: var(--mono);
    font-size: 12px;
    color: #6a7180;
    white-space: nowrap;
    padding: 0 4px;
  }

  /* ---------- 카드 그리드 ---------- */
  main{
    max-width: 960px;
    margin: 0 auto;
    padding: 0 24px 96px;
  }

  .grid{
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }

  .card{
    background: var(--paper);
    color: var(--ink);
    border-radius: var(--radius);
    padding: 22px 22px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    border: 1px solid var(--line-paper);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .card:hover{
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.28);
  }

  .card-top{
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }

  .card-jp{
    font-family: var(--serif);
    font-size: 20px;
    font-weight: 600;
    line-height: 1.4;
  }

  .timecode{
    font-family: var(--mono);
    font-size: 10px;
    color: var(--amber-dim);
    background: rgba(242,183,5,0.12);
    border: 1px solid rgba(242,183,5,0.3);
    border-radius: 2px;
    padding: 3px 6px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  .card-ko{
    font-size: 14px;
    color: var(--ink-dim);
    line-height: 1.5;
  }

  .card-example{
    font-size: 12.5px;
    color: var(--ink-dim);
    border-top: 1px dashed var(--line-paper);
    padding-top: 10px;
    margin-top: 2px;
    line-height: 1.6;
  }

  .card-example b{
    font-weight: 600;
    color: var(--ink);
  }

  .card-nuance{
    font-size: 12px;
    color: var(--indigo);
    font-style: normal;
  }

  .card-source{
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-dim);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    width: fit-content;
  }

  .card-source:hover{ color: var(--amber-dim); }

  /* ---------- 빈 상태 / 에러 ---------- */
  .state-box{
    grid-column: 1 / -1;
    text-align: center;
    padding: 64px 24px;
    color: #6a7180;
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.8;
  }

  .state-box strong{
    display: block;
    font-family: var(--serif);
    font-size: 18px;
    color: var(--paper);
    margin-bottom: 10px;
    font-weight: 600;
  }

  footer{
    max-width: 960px;
    margin: 0 auto;
    padding: 0 24px 64px;
    font-family: var(--mono);
    font-size: 11px;
    color: #4a5060;
    border-top: 1px solid #22262f;
    padding-top: 20px;
  }

  @media (prefers-reduced-motion: reduce){
    .rec-dot, .caption-jp .cursor{ animation: none; }
  }
</style>
</head>
<body>

<header>
  <div class="eyebrow">on air · 자동 수집 중</div>
  <h1>영상 속 대사가,<br><em>내 한국어 노트</em>가 되기까지</h1>
  <p class="lede">유튜브 일본어 팟캐스트·드라마의 자동 자막에서, 교과서엔 안 나오는
  생활 회화 표현만 골라 모읍니다. 매주 자동으로 갱신되는 나만의 자막 아카이브.</p>
</header>

<div class="screen">
  <div class="screen-frame">
    <div class="screen-topbar">
      <span class="rec-dot"></span>
      <span id="topbar-label">REC · JA → KO</span>
    </div>
    <div class="caption-line">
      <div class="caption-jp" id="hero-jp"><span class="cursor"></span></div>
      <div class="caption-ko" id="hero-ko"></div>
    </div>
  </div>
</div>

<div class="controls">
  <div class="search-box">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="search" placeholder="표현, 뜻, 영상 제목으로 찾기…">
  </div>
  <div class="count-badge" id="count-badge">불러오는 중…</div>
</div>

<main>
  <div class="grid" id="grid">
    <div class="state-box">
      <strong>준비 중</strong>
      아직 시트 연결이 안 되어 있어요.<br>아래 CONFIG.SHEET_CSV_URL을 채워주세요.
    </div>
  </div>
</main>

<footer>
  YouTubeJapaness · 매주 자동 갱신 · 자동생성 자막 기반, 개인 학습용
</footer>

<script>
  /* ============================================================
     CONFIG — Google Sheets의 'expressions' 탭을
     파일 > 공유 > 웹에 게시(CSV)로 발행한 뒤, 그 URL을 여기 넣으세요.
     예: https://docs.google.com/spreadsheets/d/e/2PACX-xxxx/pub?gid=0&single=true&output=csv
     ============================================================ */
  const CONFIG = {
    SHEET_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vTKI9y3MHoMW8kXyzU__mCTQqPQJ6Lisy1nhmZCCQ3hmHAC7BdI7Fy6jVyS9eHS-EYb5lav7vZdu8-T/pub?gid=1099575050&single=true&output=csv" // ← 여기에 발행된 CSV URL을 붙여넣으세요
  };

  const HERO_SAMPLES = [
    { jp: "地味に助かる", ko: "은근히 도움 되네" },
    { jp: "それな", ko: "그니까(완전 공감)" },
    { jp: "なんか違くない?", ko: "뭔가 좀 아니지 않아?" },
  ];

  function typeHero(){
    const jpEl = document.getElementById("hero-jp");
    const koEl = document.getElementById("hero-ko");
    let i = 0;

    function cycle(){
      const sample = HERO_SAMPLES[i % HERO_SAMPLES.length];
      let charIdx = 0;
      koEl.classList.remove("show");
      koEl.textContent = "→ " + sample.ko;
      jpEl.innerHTML = '<span class="cursor"></span>';

      const typer = setInterval(() => {
        charIdx++;
        jpEl.innerHTML = sample.jp.slice(0, charIdx) + '<span class="cursor"></span>';
        if(charIdx >= sample.jp.length){
          clearInterval(typer);
          setTimeout(() => koEl.classList.add("show"), 250);
          setTimeout(() => { i++; cycle(); }, 3200);
        }
      }, 90);
    }
    cycle();
  }

  function escapeHtml(str){
    return (str || "").replace(/[&<>"']/g, s => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
    }[s]));
  }

  function renderCards(rows){
    const grid = document.getElementById("grid");
    const countBadge = document.getElementById("count-badge");

    if(!rows.length){
      grid.innerHTML = `<div class="state-box">
        <strong>아직 쌓인 표현이 없어요</strong>
        파이프라인을 한 번 실행하면 여기에 채워집니다.
      </div>`;
      countBadge.textContent = "0개";
      return;
    }

    countBadge.textContent = rows.length + "개 표현";

    grid.innerHTML = rows.map(r => {
      const source = r.video_title ? escapeHtml(r.video_title) : "출처 영상";
      const url = r.video_url || "#";
      return `
      <div class="card" data-search="${escapeHtml((r.expression||"") + " " + (r.meaning_ko||"") + " " + (r.video_title||"")).toLowerCase()}">
        <div class="card-top">
          <div class="card-jp">${escapeHtml(r.expression)}</div>
          <div class="timecode">${escapeHtml(r.date_added || "")}</div>
        </div>
        <div class="card-ko">${escapeHtml(r.meaning_ko)}</div>
        ${r.example_sentence ? `<div class="card-example"><b>예문 ·</b> ${escapeHtml(r.example_sentence)}</div>` : ""}
        ${r.nuance_note ? `<div class="card-nuance">${escapeHtml(r.nuance_note)}</div>` : ""}
        <a class="card-source" href="${escapeHtml(url)}" target="_blank" rel="noopener">▶ ${source}</a>
      </div>`;
    }).join("");
  }

  function attachSearch(rows){
    const input = document.getElementById("search");
    input.addEventListener("input", () => {
      const q = input.value.trim().toLowerCase();
      document.querySelectorAll(".card").forEach(card => {
        card.style.display = card.dataset.search.includes(q) ? "" : "none";
      });
    });
  }

  function loadData(){
    if(!CONFIG.SHEET_CSV_URL){
      document.getElementById("count-badge").textContent = "시트 미연결";
      return;
    }
    Papa.parse(CONFIG.SHEET_CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: (results) => {
        const rows = (results.data || []).filter(r => r.expression).reverse();
        renderCards(rows);
        attachSearch(rows);
      },
      error: () => {
        document.getElementById("grid").innerHTML = `<div class="state-box">
          <strong>불러오지 못했어요</strong>
          CSV 발행 URL이 올바른지 확인해주세요.
        </div>`;
        document.getElementById("count-badge").textContent = "오류";
      }
    });
  }

  typeHero();
  loadData();
</script>

</body>
</html>
