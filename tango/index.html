<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f3170">

<title>일본어 단어 놀이터</title>
<style>
:root{--cw:max(640px,50vw);--navy:#2f3170;--orange:#f39a3d;--green:#e4f1e6;--ink:#1f2340;--bg:#f6f4ef;--line:#d8d4c8;--ok:#d8f0dc;--ng:#fadbd8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:18px;line-height:1.6;text-align:center;padding-bottom:30px}
.wrap{max-width:max(900px,66.667vw);margin:0 auto;padding:18px 16px}
header h1{font-size:30px;margin:6px 0 0;font-weight:800}
header p{margin:2px 0 6px;color:#4a4f7a;font-size:16px}header p.srcline{font-size:14px;color:#7a7fa5;margin:0 0 8px}header p.subt{font-size:17px;font-weight:600;color:var(--navy);margin-bottom:2px}
.tabbar{position:sticky;top:0;z-index:20;display:flex;justify-content:center;background:#fff;border-bottom:2px solid var(--line);padding-top:env(safe-area-inset-top)}
.tabbar button{flex:1 1 0;max-width:calc(var(--cw) / 4);border:0;border-bottom:4px solid transparent;background:none;font:inherit;font-size:16px;font-weight:700;color:#7a7fa5;padding:8px 4px 6px;cursor:pointer}
.tabbar button span{display:block;width:max-content;margin:0 auto;font-size:24px;line-height:1.1}
.tabbar button.on{color:var(--navy);border-bottom-color:var(--orange)}
.tabbar button.on span{transform:scale(1.1)}
.bar{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 8px;margin:8px 0}
button.chip,select,label.chk{font:inherit;font-size:16px}
button.chip{border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:20px;padding:2px 14px;font-weight:700;cursor:pointer}
button.chip.on{background:var(--navy);color:#fff}
button.btn{font:inherit;font-size:16px;font-weight:700;border:2px solid var(--navy);border-radius:20px;padding:2px 14px;margin:3px;cursor:pointer;background:var(--navy);color:#fff}
button.btn.alt{background:#fff;color:var(--navy);border:2px solid var(--navy)}
button.btn.org{background:var(--orange);border-color:var(--orange)}
button.btn:disabled{opacity:.4}
select{border:2px solid var(--navy);border-radius:14px;padding:4px 10px;background:#fff;color:var(--ink);max-width:100%}
label.chk{display:inline-flex;align-items:center;gap:6px;padding:2px 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px 18px;margin:12px auto;max-width:100%}
.card.g{background:var(--green);border-color:#c9d4cb}
.big{font-size:46px;font-weight:800;line-height:1.3;word-break:keep-all}
.kj{font-size:22px;color:#5a5f86}
.mean{font-size:30px;font-weight:800;color:var(--navy)}
.pron{font-size:18px;color:#4a4f7a}
.jp{font-weight:700}
.sm{font-size:16px;color:#555a82}
.tag{display:inline-block;background:#e7e8f6;color:var(--navy);border-radius:12px;padding:0 12px;font-size:15px;font-weight:700;margin:2px}
.tip{background:#fff7e8;border:1px solid #f1d9a8;border-radius:14px;padding:8px 14px;margin-top:12px;font-size:16px;text-align:left}
.say{font-size:24px;font-weight:700;margin:6px 0 10px;word-break:keep-all}
.prog{font-size:15px;color:#6a6f96;margin:4px 0}
.hint,.ans{margin-top:10px}
.ans .jp{font-size:26px;color:var(--navy)}
.tw{overflow-x:auto}
table{border-collapse:collapse;margin:0 auto;width:100%}
th{background:var(--navy);color:#fff;padding:6px 8px;font-size:15px}
td{border:1px solid var(--line);padding:6px 8px;background:#fff;font-size:16px}
tr.kn td{background:var(--ok)}
/* puzzle */
.grid{display:grid;margin:14px auto;justify-content:center;gap:0}
.cell{width:var(--cs);height:var(--cs);position:relative}
.cell.b{background:var(--navy);border:1px solid #fff}
.cell.w{background:#fff;border:1.5px solid var(--navy)}
.cell input{width:100%;height:100%;border:0;background:transparent;text-align:center;font:inherit;font-size:calc(var(--cs) * .56);color:var(--ink);outline:none;padding:calc(var(--cs) * .12) 0 0;border-radius:0;caret-color:transparent}
.cell.hl{background:#fff3df}.cell.sel{background:#ffd9a0}
.cell.ok{background:var(--ok)}.cell.ng{background:var(--ng)}
.cell .n{position:absolute;top:1px;left:3px;font-size:calc(var(--cs) * .27);font-weight:700;color:var(--navy);line-height:1;pointer-events:none}
.cur{min-height:30px;font-weight:700;color:var(--navy);margin:6px 0}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:420px;margin:10px auto}
.pad button{font:inherit;font-size:21px;font-weight:700;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 0;cursor:pointer}
.pad button:active{background:#ffd9a0}
.pad button.sp{background:#eceef8;grid-column:span 2;font-size:17px}.pad button.small{font-size:15px;background:#fff7e8}.pad .cap{grid-column:1/-1;font-size:14px;color:#7a7fa5;text-align:left;margin-top:4px}
.clues{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:16px}
.clues .card{flex:1 1 280px;margin:0;padding:14px;text-align:center}
.clues h3{margin:0 0 6px;font-size:20px}
.clues ul{list-style:none;margin:0;padding:0;font-size:17px}
.msg{min-height:26px;font-weight:700;color:#1e6b3a}
.opts{background:#fff;border:1px solid var(--line);border-radius:18px;padding:8px 10px;margin:8px auto;max-width:100%}
.fade{animation:f .25s}@keyframes f{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}

/* 글자 쓰기 */
#tab-cards,#tab-puzzle,#tab-speak,#tab-write{max-width:var(--cw);margin:0 auto}
#tab-write{width:calc(100% - 32px)}
#tab-write .bar{margin:6px 0}
.wpanel{scroll-margin-top:84px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px 12px 10px;margin:10px auto;max-width:100%}
.winfo{font-size:19px;font-weight:700;color:var(--navy);margin-bottom:6px;min-height:30px}
.winfo small{font-weight:600;color:#7a7fa5;font-size:15px}
#wbox{position:relative;margin:0;flex:none;border:3px solid var(--navy);border-radius:10px;background:#fff;overflow:hidden;
  background-image:linear-gradient(to right,transparent calc(50% - 1px),#e8d3d3 calc(50% - 1px),#e8d3d3 calc(50% + 1px),transparent calc(50% + 1px)),linear-gradient(to bottom,transparent calc(50% - 1px),#e8d3d3 calc(50% - 1px),#e8d3d3 calc(50% + 1px),transparent calc(50% + 1px))}
#wbox .wg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;line-height:1;pointer-events:none;user-select:none;-webkit-user-select:none;font-family:'Klee One','UD Digital Kyokasho N-R','UD デジタル 教科書体 N-R','Hiragino Kaku Gothic ProN','Yu Gothic','Noto Sans JP','Noto Sans CJK JP','Meiryo',sans-serif}
#wg{color:#b9bbd0;z-index:1}
#wo{color:rgba(243,154,61,.6);z-index:3;display:none}
#wcv{position:absolute;inset:0;width:100%;height:100%;z-index:2;touch-action:none;cursor:crosshair}
.wrow{display:flex;justify-content:center;gap:6px;margin:6px 0}
button.wt{width:54px;height:54px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);font:inherit;font-size:23px;font-weight:700;line-height:1.05;padding:2px 0 0;cursor:pointer;position:relative}
button.wt small{display:block;font-size:11px;font-weight:600;color:#7a7fa5;line-height:1.2}
button.wt.done{background:var(--ok);border-color:#8fcf99}
button.wt.sel{border-color:var(--orange);box-shadow:0 0 0 3px #f39a3d55}
button.wt i{position:absolute;top:1px;right:5px;font-style:normal;font-size:11px;color:#3b8c4a}
.wsp{width:54px;height:54px}
.wmain{display:flex;justify-content:center;align-items:flex-start;gap:10px}
#wSide{display:none;flex-direction:column;gap:6px;flex:none}
#wSide.on{display:flex}
button.chip.org{background:var(--orange);border-color:var(--orange);color:#fff}
button.chip:disabled{opacity:.4;cursor:default}
.wnote{font-size:14px;color:#7a7fa5;margin:4px 0}
@media (max-width:420px){button.wt,.wsp{width:50px;height:50px;font-size:21px}.wrow{gap:3px}}

/* 획순 */
#wsv{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none;display:none}
#wsv.on{display:block}
#wsv .sp{fill:none;stroke-linecap:round;stroke-linejoin:round}
#wsv text{font-weight:700;fill:#f39a3d;font-family:Arial,sans-serif;text-anchor:middle}
.credit{text-align:center;font-size:12px;color:#9a9cb8;margin:26px 16px 70px}
.credit a{color:#7a7fa5}
/* 의견 보내기 */
#fbBack{position:fixed;inset:0;background:#0007;z-index:60;display:none;align-items:center;justify-content:center;padding:16px}
#fbBack.on{display:flex}
#fbBox{background:#fff;border-radius:20px;padding:18px 16px 14px;width:100%;max-width:460px;max-height:92vh;overflow:auto}
#fbBox h3{margin:0 0 4px;font-size:20px;color:var(--navy)}
#fbBox p{margin:2px 0 8px;font-size:14px;color:#7a7fa5}
#fbTxt{width:100%;min-height:120px;border:2px solid var(--navy);border-radius:14px;padding:10px;font:inherit;font-size:16px;resize:vertical;text-align:left;background:#fff;color:var(--ink)}
#fbCnt{font-size:12px;color:#9a9cb8;text-align:right;margin:2px 4px}
#fbMsg{min-height:22px;font-size:15px;font-weight:700;color:#3b8c4a}
</style></head><body>

 </div>
 <div id="wGrid"></div>

function can(grid, dirs, u, r, c, d){
  const dr = d === 'A' ? 0 : 1, dc = d === 'A' ? 1 : 0;
  if(grid.has((r-dr)+','+(c-dc)) || grid.has((r+dr*u.length)+','+(c+dc*u.length))) return [false, 0];
  let cross = 0;
  for(let i = 0; i < u.length; i++){
    const rr = r + dr*i, cc = c + dc*i, k = rr+','+cc;
    if(grid.has(k)){ if(grid.get(k) !== u[i] || dirs.get(k).has(d)) return [false, 0]; cross++; }
    else if(grid.has((rr+dc)+','+(cc+dr)) || grid.has((rr-dc)+','+(cc-dr))) return [false, 0];
  }

}

}
function place(w, grid, dirs, placed, maxn){
  const u = [...w.r]; let best = null;

    const [r0, c0] = k.split(',').map(Number);
    for(let i = 0; i < u.length; i++){
      if(u[i] !== ch0) continue;
      for(const d of ['A','D']){
        const r = d === 'A' ? r0 : r0 - i, c = d === 'A' ? c0 - i : c0;
        const [ok, cr] = can(grid, dirs, u, r, c, d);
        if(!ok || cr === 0) continue;
        const g2 = new Map(grid);
        u.forEach((x, j) => g2.set((d==='A' ? r : r+j) + ',' + (d==='A' ? c+j : c), x));
        const [a,b,c1,c2] = bbox(g2), h = b-a+1, wd = c2-c1+1;
        if(h > maxn || wd > maxn) continue;
        const sc = [cr, -(h*wd), -Math.abs(h-wd)];
        if(!best || sc[0] > best.sc[0] || (sc[0] === best.sc[0] && (sc[1] > best.sc[1] || (sc[1] === best.sc[1] && sc[2] > best.sc[2])))) best = {sc, r, c, d};
      }
    }
  }
  if(!best) return false;
  u.forEach((x, j) => { const k = (best.d==='A' ? best.r : best.r+j) + ',' + (best.d==='A' ? best.c+j : best.c); grid.set(k, x); if(!dirs.has(k)) dirs.set(k, new Set()); dirs.get(k).add(best.d); });

}
function build(order, o){
  const grid = new Map(), dirs = new Map(), placed = [];

  placed.push({w: w0, r: 0, c: 0, d: 'A'});
  let rest = order.slice(1), progress = true;
  while(progress){
    progress = false; const q = rest; rest = [];
    for(const w of q){
      if(placed.length >= o.cap){ rest.push(w); continue; }
      if(place(w, grid, dirs, placed, o.maxn)) progress = true; else rest.push(w);
    }
  }

}
function genPuzzle(pool, extra, o){
  const t0 = performance.now(); let best = null;
  for(let n = 0; n < 600 && performance.now() - t0 < 700; n++){
    const res = build(shuf(pool.slice()).concat(shuf(extra.slice())), o);
    if(res.placed.length < o.min) continue;
    const prim = res.placed.filter(p => p.w.pool).length;
    const [a,b,c1,c2] = bbox(res.grid), area = (b-a+1)*(c2-c1+1);
    const crosses = res.placed.reduce((s,p) => s + p.w.r.length, 0) - res.grid.size;
    const key = [Math.min(prim, o.cap), Math.min(res.placed.length, o.cap), crosses, -area];
    if(!best || cmp(key, best.key) > 0) best = {...res, key};
  }

}
function cmp(a, b){ for(let i = 0; i < a.length; i++){ if(a[i] !== b[i]) return a[i] - b[i]; } return 0; }

function newPuzzle(){

  const pool = [], extra = [];
  D.words.filter(okw).forEach(w => { if(seen.has(w.r)) return; seen.add(w.r); (inScope(w, sc) ? pool : extra).push(mk(w, inScope(w, sc))); });
  let note = '';
  if(pool.length < o.cap + 4){ note = pool.length < 4 ? '이 범위에는 퍼즐로 쓸 단어가 적어 다른 회차 단어를 많이 보충했어요.' : '이 범위의 단어가 적어 다른 회차 단어를 일부 보충했어요.'; }

  if(!res){ $('#pNote').textContent = '퍼즐을 만들지 못했어요. 옵션을 바꿔 다시 눌러 주세요.'; $('#gridBox').innerHTML = ''; return; }
  const [r0, r1, c0, c1] = bbox(res.grid), H = r1-r0+1, W = c1-c0+1;
  const grid = new Map([...res.grid].map(([k, v]) => { const [r,c] = k.split(',').map(Number); return [(r-r0)+','+(c-c0), v]; }));

function cellSize0(){ const w = Math.max(640, window.innerWidth * 0.5); return Math.max(26, Math.min(76, Math.floor((Math.min(window.innerWidth, w) - 36) / PZ.W))); }

function wordsAt(k){ return PZ.words.filter(w => w.cells.includes(k)); }

function pick(k, tog){

function svLayout(chars){
  if(chars.length === 1) return [{c: chars[0], tf: '', k: 1}];
  const s1 = 0.62, s2 = 0.38, A = KSV[chars[0]].b, B = KSV[chars[1]].b, gap = 5;
  const w1 = (A[2] - A[0]) * s1, w2 = (B[2] - B[0]) * s2, x0 = (109 - (w1 + gap + w2)) / 2;
  const h1 = (A[3] - A[1]) * s1, top1 = (109 - h1) / 2, bot = top1 + h1;
  return [
    {c: chars[0], tf: `translate(${(x0 - A[0] * s1).toFixed(2)} ${(top1 - A[1] * s1).toFixed(2)}) scale(${s1})`, k: s1},
    {c: chars[1], tf: `translate(${(x0 + w1 + gap - B[0] * s2).toFixed(2)} ${(bot - B[3] * s2).toFixed(2)}) scale(${s2})`, k: s2}];
}
function wSvChars(){ return [...wDisp(wPrac())].filter(c => KSV[c]); }
function wSvRender(){

  WS.total = chars.reduce((a, c) => a + KSV[c].p.length, 0);
  $('#wRe').disabled = WS.sv !== 'play'; $('#wSv').classList.toggle('on', WS.sv === 'play'); $('#wTr').classList.toggle('on', WS.sv === 'trace');
  if(WS.sv === 'off' || !chars.length){ svg.className.baseVal = ''; svg.innerHTML = ''; return; }
  svg.className.baseVal = 'on';
  let idx = 0, html = '';
  svLayout(chars).forEach(part => {
    const g = KSV[part.c];
    html += `<g transform="${part.tf}">`;
    g.p.forEach((d, i) => {
      const n = idx++, k = part.k, nx = g.n[i][0], ny = g.n[i][1];
      let st, lab = '';
      if(WS.sv === 'trace'){
        const cur = n === WS.ti, done = n < WS.ti;
        st = cur ? `stroke:#f39a3d;stroke-width:${5.5 / k}` : done ? `stroke:#2f3170;stroke-width:${4.2 / k}` : `stroke:#c9cbe0;stroke-width:${3 / k}`;
        if(cur){ const m = d.match(/^M\s*(-?[\d.]+)[ ,]+(-?[\d.]+)/); if(m) lab += `<circle cx="${m[1]}" cy="${m[2]}" r="${3.2 / k}" fill="#f39a3d"/>`; }
        lab += `<text x="${nx}" y="${ny}" style="font-size:${6.5 / k}px;${cur ? '' : 'fill:#b4b6cf'}">${n + 1}</text>`;
      } else {
        st = `stroke:#2f3170;stroke-width:${4.2 / k};opacity:0`;
        lab = `<text class="sn" data-i="${n}" x="${nx}" y="${ny}" style="font-size:${6.5 / k}px;opacity:0">${n + 1}</text>`;

  }
}

  }
  if(f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows;
}
function toObjs(rows){
  if(!rows.length) return [];
  const h = rows[0].map(s => s.trim());
  return rows.slice(1).filter(r => r.some(x => x.trim() !== '')).map(r => { const o = {}; h.forEach((k, i) => o[k] = (r[i] || '').trim()); return o; });
}
async function fetchTab(name){
  const url = `https://docs.google.com/spreadsheets/d/${encodeURIComponent(SID)}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}`;
  const res = await fetch(url, {cache: 'no-store'});
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const t = await res.text();
  if(/^\s*</.test(t)) throw new Error('공개되지 않은 시트이거나 탭 이름이 달라요');
  return toObjs(parseCSV(t));
}
const num = v => { const n = parseInt(v, 10); return isNaN(n) ? 0 : n; };
function buildFromSheet(W, Q, S){
  const words = W.map(r => ({
    k: r['단어'], r: r['읽기(퍼즐용)'] || (r['단어'] || '').replace(/\(な\)/g, '').split('/')[0], c: CATMAP[r['품사']],
    ko: r['뜻'], kj: r['한자'], pol: r['정중형'], pr: r['한글발음'], ex: r['예문'], xk: r['예문 뜻'], nt: r['메모'],
    s: num(r['4주 회차']), th: num(r['주제 회차']), lv: r['레벨'] || ''
  })).filter(w => w.k && w.ko && w.c && w.r);
  const qs = Q.map(r => ({
    p: POSMAP[r['품사']], r: r['라운드'] === '' ? -1 : num(r['라운드']), q: r['질문(한국어)'], h: r['힌트'],
    a: [r['정답 1'], r['정답 2'], r['정답 3']].filter(Boolean), k: ({'문법':'g','문화':'c'})[r['한마디 구분']] || '', t: r['한마디 내용']
  })).filter(q => q.p && q.q && q.a.length);
  const rounds = [], s4 = {}, th = {};
  S.forEach(r => {
    const n = num(r['번호']);
    if(r['종류'] === '라운드') rounds[n] = {t: r['이름'], g: r['설명']};
    else if(r['종류'] === '4주') s4[n] = r['이름'];
    else if(r['종류'] === '주제') th[n] = r['이름'];
  });
  for(let i = 0; i < rounds.length; i++) if(!rounds[i]) rounds[i] = {t: i + '라운드', g: ''};
  if(words.length < 10 || qs.length < 10) throw new Error('단어 또는 질문이 너무 적어요 (열 이름을 확인하세요)');
  return {words, qs, rounds, s4, th};
}
function srcMsg(t){ $('#src').textContent = t; }
function refreshAll(){
  CS.idx = 0; CS.flip = false;
  const ps = $('#pScope').value;

}
async function loadSheet(){
  if(!SID) { srcMsg('기본 단어 사용 중'); return; }
  try{
    const cached = store.get('nh_sheetcache', null);
    if(cached && cached.sid === SID && cached.data){ D = cached.data; srcMsg('저장된 시트 데이터 (' + cached.at + ') · 새로 확인하는 중'); refreshAll(); }
  }catch(e){}
  try{
    const [W, Q, S] = await Promise.all([fetchTab('단어'), fetchTab('질문'), fetchTab('설정')]);
    const nd = buildFromSheet(W, Q, S);
    D = nd; const at = new Date().toLocaleString('ko-KR', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'});
    store.set('nh_sheetcache', {sid: SID, at, data: nd});
    srcMsg('📗 구글시트에서 불러옴 (' + at + ') · 단어 ' + nd.words.length + ' · 질문 ' + nd.qs.length);
    refreshAll();
  }catch(e){
    const cached = store.get('nh_sheetcache', null);
    srcMsg((cached && cached.sid === SID ? '저장된 시트 데이터 사용 (' + cached.at + ')' : '기본 단어 사용 중') + ' · 시트를 읽지 못했어요: ' + e.message);
  }
}

$('#fbSend').onclick = async () => {
  const t = $('#fbTxt').value.trim(), m = $('#fbMsg');
  m.style.color = '#c0392b';
  if(t.length < 2){ m.textContent = '내용을 조금만 더 적어 주세요.'; return; }

  if(fbBusy) return;
  const last = +store.get('nh_fblast', 0);
  if(Date.now() - last < 30000){ m.textContent = '잠시 뒤에 다시 보내 주세요.'; return; }
  fbBusy = true; $('#fbSend').disabled = true;
  try{
    const tab = ($('.tabbar .on') || {dataset: {}}).dataset.tab || '';
    await fetch(LOG_URL, {method: 'POST', mode: 'no-cors', headers: {'Content-Type': 'text/plain'}, body: JSON.stringify({t: LOG_TOKEN, vid: VID, ev: 'feedback', cat: fbCat, msg: t, tab, dev: /Mobi|Android|iPhone|iPad/.test(navigator.userAgent) ? '모바일' : 'PC', ver: APP_VER})});
    store.set('nh_fblast', Date.now());
    $('#fbTxt').value = ''; $('#fbCnt').textContent = '0 / 500';
    m.style.color = '#3b8c4a'; m.textContent = '보내 주셔서 고마워요! 잘 읽어 볼게요.';

  fbBusy = false; $('#fbSend').disabled = false;
};
