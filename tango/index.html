<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f3170">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>일본어 단어 놀이터</title>
<style>
:root{--navy:#2f3170;--orange:#f39a3d;--green:#e4f1e6;--ink:#1f2340;--bg:#f6f4ef;--line:#d8d4c8;--ok:#d8f0dc;--ng:#fadbd8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:18px;line-height:1.6;text-align:center;padding-bottom:30px}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px}
header h1{font-size:30px;margin:6px 0 0;font-weight:800}
header p{margin:2px 0 6px;color:#4a4f7a;font-size:16px}header p.srcline{font-size:14px;color:#7a7fa5;margin:0 0 8px}header p.subt{font-size:17px;font-weight:600;color:var(--navy);margin-bottom:2px}
.tabbar{position:sticky;top:0;z-index:20;display:flex;background:#fff;border-bottom:2px solid var(--line);padding-top:env(safe-area-inset-top)}
.tabbar button{flex:1;border:0;border-bottom:4px solid transparent;background:none;font:inherit;font-size:16px;font-weight:700;color:#7a7fa5;padding:8px 4px 6px;cursor:pointer}
.tabbar button span{display:block;font-size:24px;line-height:1.1}
.tabbar button.on{color:var(--navy);border-bottom-color:var(--orange)}
.tabbar button.on span{transform:scale(1.1)}
.bar{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 8px;margin:8px 0}
button.chip,select,label.chk{font:inherit;font-size:16px}
button.chip{border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:20px;padding:2px 14px;font-weight:700;cursor:pointer}
button.chip.on{background:var(--navy);color:#fff}
button.btn{font:inherit;font-size:17px;font-weight:700;border:0;border-radius:24px;padding:9px 20px;margin:4px;cursor:pointer;background:var(--navy);color:#fff}
button.btn.alt{background:#fff;color:var(--navy);border:2px solid var(--navy)}
button.btn.org{background:var(--orange)}
button.btn:disabled{opacity:.4}
select{border:2px solid var(--navy);border-radius:14px;padding:4px 10px;background:#fff;color:var(--ink);max-width:100%}
label.chk{display:inline-flex;align-items:center;gap:6px;padding:2px 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:22px 18px;margin:12px auto;max-width:640px}
.card.g{background:var(--green);border-color:#c9d4cb}
.big{font-size:46px;font-weight:800;line-height:1.3;word-break:keep-all}
.kj{font-size:22px;color:#5a5f86}
.mean{font-size:30px;font-weight:800;color:var(--navy)}
.pron{font-size:18px;color:#4a4f7a}
.jp{font-weight:700}
.sm{font-size:16px;color:#555a82}
.tag{display:inline-block;background:#e7e8f6;color:var(--navy);border-radius:12px;padding:0 12px;font-size:15px;font-weight:700;margin:2px}
.tip{background:#fff7e8;border:1px solid #f1d9a8;border-radius:14px;padding:8px 14px;margin-top:12px;font-size:16px;text-align:left}
.say{font-size:24px;font-weight:700;margin:6px 0 10px;word-break:keep-all}
.prog{font-size:15px;color:#6a6f96;margin:4px 0}
.hint,.ans{margin-top:10px}
.ans .jp{font-size:26px;color:var(--navy)}
.tw{overflow-x:auto}
table{border-collapse:collapse;margin:0 auto;width:100%}
th{background:var(--navy);color:#fff;padding:6px 8px;font-size:15px}
td{border:1px solid var(--line);padding:6px 8px;background:#fff;font-size:16px}
tr.kn td{background:var(--ok)}
/* puzzle */
.grid{display:grid;margin:14px auto;justify-content:center;gap:0}
.cell{width:var(--cs);height:var(--cs);position:relative}
.cell.b{background:var(--navy);border:1px solid #fff}
.cell.w{background:#fff;border:1.5px solid var(--navy)}
.cell input{width:100%;height:100%;border:0;background:transparent;text-align:center;font:inherit;font-size:calc(var(--cs) * .56);color:var(--ink);outline:none;padding:calc(var(--cs) * .12) 0 0;border-radius:0;caret-color:transparent}
.cell.hl{background:#fff3df}.cell.sel{background:#ffd9a0}
.cell.ok{background:var(--ok)}.cell.ng{background:var(--ng)}
.cell .n{position:absolute;top:1px;left:3px;font-size:calc(var(--cs) * .27);font-weight:700;color:var(--navy);line-height:1;pointer-events:none}
.cur{min-height:30px;font-weight:700;color:var(--navy);margin:6px 0}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:420px;margin:10px auto}
.pad button{font:inherit;font-size:21px;font-weight:700;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 0;cursor:pointer}
.pad button:active{background:#ffd9a0}
.pad button.sp{background:#eceef8;grid-column:span 2;font-size:17px}.pad button.small{font-size:15px;background:#fff7e8}.pad .cap{grid-column:1/-1;font-size:14px;color:#7a7fa5;text-align:left;margin-top:4px}
.clues{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:16px}
.clues .card{flex:1 1 280px;margin:0;padding:14px;text-align:center}
.clues h3{margin:0 0 6px;font-size:20px}
.clues ul{list-style:none;margin:0;padding:0;font-size:17px}
.msg{min-height:26px;font-weight:700;color:#1e6b3a}
.opts{background:#fff;border:1px solid var(--line);border-radius:18px;padding:8px 10px;margin:8px auto;max-width:640px}
.fade{animation:f .25s}@keyframes f{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}
</style></head><body>
<nav class="tabbar">
 <button data-tab="cards" class="on"><span>🃏</span>단어 카드</button>
 <button data-tab="puzzle"><span>🧩</span>낱말퍼즐</button>
 <button data-tab="speak"><span>🗣️</span>말하기</button>
</nav>
<div class="wrap">
<header><h1>🧩 일본어 단어 놀이터</h1><p class="subt">카드로 익히고, 퍼즐로 풀고, 말로 써먹기</p><p id="stat"></p><p id="src" class="srcline"></p><p class="srcline"><a href="notice.html" style="color:#2f3170;font-weight:700">📣 안내문 · QR 코드</a></p></header>

<!-- 단어 카드 -->
<section id="tab-cards">
 <div class="bar" id="catbar"></div>
 <div class="bar"><select id="scope"></select>
  <label class="chk"><input type="checkbox" id="onlyUnknown"> 모르는 단어만</label></div>
 <div class="bar"><button class="chip on" data-mode="card">카드</button><button class="chip" data-mode="list">목록</button></div>
 <div id="cardArea"></div>
</section>

<!-- 낱말퍼즐 -->
<section id="tab-puzzle" hidden>
 <div class="opts">
  <div class="bar">
   <select id="pScope"></select>
   <select id="pSize"><option value="s">작게 (8단어)</option><option value="m" selected>보통 (12단어)</option><option value="l">크게 (16단어)</option></select>
  </div>
  <div class="bar">
   <label class="chk"><input type="checkbox" id="pSmall"> 작은 글자(ゃ·っ) 포함</label>
   <label class="chk"><input type="checkbox" id="pKata"> 가타카나 단어 포함</label>
   <label class="chk"><input type="checkbox" id="pPad"> 글자 키패드 사용</label>
  </div>
  <button class="btn org" id="pNew">새 퍼즐 만들기</button>
 </div>
 <div class="sm" id="pNote"></div>
 <div class="cur" id="cur"></div>
 <div id="gridBox"></div>
 <div class="msg" id="pMsg"></div>
 <div id="padBox"></div>
 <div class="bar">
  <button class="btn" id="pCheck">정답 확인</button>
  <button class="btn alt" id="pHint">글자 힌트</button>
  <button class="btn alt" id="pReveal">정답 보기</button>
  <button class="btn alt" id="pClear">다시 하기</button>
 </div>
 <div class="clues"><div class="card"><h3>가로</h3><ul id="clA"></ul></div><div class="card"><h3>세로</h3><ul id="clD"></ul></div></div>
</section>

<!-- 말하기 -->
<section id="tab-speak" hidden>
 <div class="bar" id="posbar"></div>
 <div class="bar"><select id="rsel"></select>
  <label class="chk"><input type="checkbox" id="onlyNew" checked> 안 푼 문제만</label></div>
 <div id="speakArea"></div>
</section>
</div>



<script>
let D = {"words":[{"k":"やめる","r":"やめる","c":"v","ko":"그만두다","kj":"止める/辞める","pol":"やめます","pr":"야메마스","ex":"バイトを やめます。","xk":"아르바이트를 그만둬요.","nt":"止める는 '멈추다', 辞める는 직장·학교를 '그만두다'입니다.","s":8,"th":6},{"k":"あける","r":"あける","c":"v","ko":"열다","kj":"開ける","pol":"あけます","pr":"아케마스","ex":"まどを あけます。","xk":"창문을 열어요.","nt":"","s":8,"th":6},{"k":"みる","r":"みる","c":"v","ko":"보다","kj":"見る","pol":"みます","pr":"미마스","ex":"えいがを みます。","xk":"영화를 봐요.","nt":"","s":8,"th":6},{"k":"いる","r":"いる","c":"v","ko":"(사람·동물이) 있다","kj":"","pol":"います","pr":"이마스","ex":"いえに ねこが います。","xk":"집에 고양이가 있어요.","nt":"사물은 「ある」, 사람·동물은 「いる」입니다.","s":5,"th":1},{"k":"おきる","r":"おきる","c":"v","ko":"잠에서 깨다, 일어나다","kj":"起きる","pol":"おきます","pr":"오키마스","ex":"あした はやく おきます。","xk":"내일 일찍 일어나요.","nt":"","s":8,"th":6},{"k":"はじめる","r":"はじめる","c":"v","ko":"시작하다","kj":"始める","pol":"はじめます","pr":"하지메마스","ex":"べんきょうを はじめます。","xk":"공부를 시작해요.","nt":"","s":8,"th":6},{"k":"ねる","r":"ねる","c":"v","ko":"자다","kj":"寝る","pol":"ねます","pr":"네마스","ex":"はやく ねます。","xk":"일찍 자요.","nt":"","s":8,"th":6},{"k":"くれる","r":"くれる","c":"v","ko":"(남이 나에게) 주다","kj":"","pol":"くれます","pr":"쿠레마스","ex":"ともだちが メールを くれます。","xk":"친구가 메일을 보내 줘요.","nt":"'내 쪽으로' 주는 동작입니다. 내가 남에게 줄 때는 「あげる」를 씁니다.","s":8,"th":6},{"k":"わすれる","r":"わすれる","c":"v","ko":"잊어버리다","kj":"忘れる","pol":"わすれます","pr":"와스레마스","ex":"なまえを わすれました。","xk":"이름을 잊어버렸어요.","nt":"","s":8,"th":6},{"k":"できる","r":"できる","c":"v","ko":"가능하다, 할 수 있다","kj":"出来る","pol":"できます","pr":"데키마스","ex":"にほんごが できます。","xk":"일본어를 할 수 있어요.","nt":"조사는 「を」가 아니라 「が」입니다.","s":8,"th":6},{"k":"べんきょう","r":"べんきょう","c":"v","ko":"공부","kj":"勉強","pol":"べんきょうします","pr":"벤쿄우시마스","ex":"にほんごを べんきょうします。","xk":"일본어를 공부해요.","nt":"명사 + する = 동사","s":8,"th":6},{"k":"うんどう","r":"うんどう","c":"v","ko":"운동","kj":"運動","pol":"うんどうします","pr":"운도우시마스","ex":"きょう うんどうします。","xk":"오늘 운동해요.","nt":"원표의 「うんどいします」는 오타입니다.","s":8,"th":6},{"k":"デート","r":"デート","c":"v","ko":"데이트","kj":"","pol":"デートします","pr":"데-토시마스","ex":"かのじょと デートします。","xk":"여자친구와 데이트해요.","nt":"","s":8,"th":7},{"k":"バイト","r":"バイト" function can(grid, dirs, u, r, c, d){
  const dr = d === 'A' ? 0 : 1, dc = d === 'A' ? 1 : 0;
  if(grid.has((r-dr)+','+(c-dc)) || grid.has((r+dr*u.length)+','+(c+dc*u.length))) return [false, 0];
  let cross = 0;
  for(let i = 0; i < u.length; i++){
    const rr = r + dr*i, cc = c + dc*i, k = rr+','+cc;
    if(grid.has(k)){ if(grid.get(k) !== u[i] || dirs.get(k).has(d)) return [false, 0]; cross++; }
    else if(grid.has((rr+dc)+','+(cc+dr)) || grid.has((rr-dc)+','+(cc-dr))) return [false, 0];
  }
  return [true, cross];
}
function bbox(grid){
  let r0=1e9,r1=-1e9,c0=1e9,c1=-1e9;
  for(const k of grid.keys()){ const [r,c] = k.split(',').map(Number); r0=Math.min(r0,r); r1=Math.max(r1,r); c0=Math.min(c0,c); c1=Math.max(c1,c); }
  return [r0,r1,c0,c1];
}
function place(w, grid, dirs, placed, maxn){
  const u = [...w.r]; let best = null;
  for(const [k, ch0] of grid){
    const [r0, c0] = k.split(',').map(Number);
    for(let i = 0; i < u.length; i++){
      if(u[i] !== ch0) continue;
      for(const d of ['A','D']){
        const r = d === 'A' ? r0 : r0 - i, c = d === 'A' ? c0 - i : c0;
        const [ok, cr] = can(grid, dirs, u, r, c, d);
        if(!ok || cr === 0) continue;
        const g2 = new Map(grid);
        u.forEach((x, j) => g2.set((d==='A' ? r : r+j) + ',' + (d==='A' ? c+j : c), x));
        const [a,b,c1,c2] = bbox(g2), h = b-a+1, wd = c2-c1+1;
        if(h > maxn || wd > maxn) continue;
        const sc = [cr, -(h*wd), -Math.abs(h-wd)];
        if(!best || sc[0] > best.sc[0] || (sc[0] === best.sc[0] && (sc[1] > best.sc[1] || (sc[1] === best.sc[1] && sc[2] > best.sc[2])))) best = {sc, r, c, d};
      }
    }
  }
  if(!best) return false;
  u.forEach((x, j) => { const k = (best.d==='A' ? best.r : best.r+j) + ',' + (best.d==='A' ? best.c+j : best.c); grid.set(k, x); if(!dirs.has(k)) dirs.set(k, new Set()); dirs.get(k).add(best.d); });
  placed.push({w, r: best.r, c: best.c, d: best.d});
  return true;
}
function build(order, o){
  const grid = new Map(), dirs = new Map(), placed = [];
  const w0 = order[0], u = [...w0.r];
  u.forEach((x, i) => { grid.set('0,'+i, x); dirs.set('0,'+i, new Set(['A'])); });
  placed.push({w: w0, r: 0, c: 0, d: 'A'});
  let rest = order.slice(1), progress = true;
  while(progress){
    progress = false; const q = rest; rest = [];
    for(const w of q){
      if(placed.length >= o.cap){ rest.push(w); continue; }
      if(place(w, grid, dirs, placed, o.maxn)) progress = true; else rest.push(w);
    }
  }
  return {grid, placed};
}
function genPuzzle(pool, extra, o){
  const t0 = performance.now(); let best = null;
  for(let n = 0; n < 600 && performance.now() - t0 < 700; n++){
    const res = build(shuf(pool.slice()).concat(shuf(extra.slice())), o);
    if(res.placed.length < o.min) continue;
    const prim = res.placed.filter(p => p.w.pool).length;
    const [a,b,c1,c2] = bbox(res.grid), area = (b-a+1)*(c2-c1+1);
    const crosses = res.placed.reduce((s,p) => s + p.w.r.length, 0) - res.grid.size;
    const key = [Math.min(prim, o.cap), Math.min(res.placed.length, o.cap), crosses, -area];
    if(!best || cmp(key, best.key) > 0) best = {...res, key};
  }
  return best;
}
function cmp(a, b){ for(let i = 0; i < a.length; i++){ if(a[i] !== b[i]) return a[i] - b[i]; } return 0; }

function newPuzzle(){
  PZ.built = true;
  const o = SIZE[$('#pSize').value], sc = $('#pScope').value, small = $('#pSmall').checked, kata = $('#pKata').checked;
  const okw = w => w.r.length >= 2 && (small || !SMALL.test(w.r)) && (kata ? (HIRA.test(w.r) || KATA.test(w.r)) : HIRA.test(w.r));
  const seen = new Set(); const mk = (w, pool) => ({r: w.r, ko: w.ko, pool});
  const pool = [], extra = [];
  D.words.filter(okw).forEach(w => { if(seen.has(w.r)) return; seen.add(w.r); (inScope(w, sc) ? pool : extra).push(mk(w, inScope(w, sc))); });
  let note = '';
  if(pool.length < o.cap + 4){ note = pool.length < 4 ? '이 범위에는 퍼즐로 쓸 단어가 적어 다른 회차 단어를 많이 보충했어요.' : '이 범위의 단어가 적어 다른 회차 단어를 일부 보충했어요.'; }
  const res = genPuzzle(pool.length >= 2 ? pool : extra, pool.length >= 2 ? extra : [], o);
  if(!res){ $('#pNote').textContent = '퍼즐을 만들지 못했어요. 옵션을 바꿔 다시 눌러 주세요.'; $('#gridBox').innerHTML = ''; return; }
  const [r0, r1, c0, c1] = bbox(res.grid), H = r1-r0+1, W = c1-c0+1;
  const grid = new Map([...res.grid].map(([k, v]) => { const [r,c] = k.split(',').map(Number); return [(r-r0)+','+(c-c0), v]; }));
  const placed = res.placed.map(p => ({...p, r: p.r - r0, c: p.c - c0}));
  const starts = new Map(); let n = 0;
  for(let r = 0; r < H; r++) for(let c = 0; c < W; c++) if(placed.some(p => p.r === r && p.c === c)) starts.set(r+','+c, ++n);
  PZ.words = placed.map(p => {
    const cells = [...p.w.r].map((_, i) => (p.d==='A' ? p.r : p.r+i) + ',' + (p.d==='A' ? p.c+i : p.c));
    return {no: starts.get(p.r+','+p.c), d: p.d, ko: p.w.ko, r: p.w.r, cells};
  });
  PZ.grid = grid; PZ.H = H; PZ.W = W; PZ.sel = null; PZ.dir = 'A'; PZ.kata = kata;
  PZ.note = note;
  renderPuzzle();
}
function cellSize(){ return PZ.cs =  Math.max(26, Math.min(54, Math.floor((Math.min(window.innerWidth, 900) - 36) / PZ.W))); }
function renderPuzzle(){
  const {H, W} = PZ, cs = cellSize();
  let h = `<div class="grid" style="--cs:${cs}px;grid-template-columns:repeat(${W},${cs}px)">`;
  const nums = {}; PZ.words.forEach(w => nums[w.cells[0]] = w.no);
  for(let r = 0; r < H; r++) for(let c = 0; c < W; c++){
    const k = r+','+c;
    h += PZ.grid.has(k) ? `<div class="cell w" data-k="${k}">${nums[k] ? `<span class="n">${nums[k]}</span>` : ''}<input data-k="${k}" maxlength="2" autocomplete="off" autocapitalize="off" spellcheck="false"></div>` : '<div class="cell b"></div>';
  }
  $('#gridBox').innerHTML = h + '</div>';
  PZ.cells = {};
  $$('#gridBox .cell.w').forEach(el => { const k = el.dataset.k; PZ.cells[k] = {el, inp: el.querySelector('input'), ans: PZ.grid.get(k)}; });
  const li = d => PZ.words.filter(w => w.d === d).sort((a,b) => a.no - b.no).map(w => `<li><b>${w.no}.</b> ${esc(w.ko)} <span class="sm">(${w.r.length}칸)</span></li>`).join('');
  $('#clA').innerHTML = li('A'); $('#clD').innerHTML = li('D');
  $('#pNote').textContent = (PZ.note ? PZ.note + ' · ' : '') + `${PZ.words.length}단어 · ${W}×${H}칸`;
  $('#pMsg').textContent = ''; $('#cur').textContent = '칸을 눌러 시작하세요';
  for(const k in PZ.cells){
    const c = PZ.cells[k];
    c.el.addEventListener('click', () => pick(k, true));
    c.inp.addEventListener('compositionstart', () => c.comp = true);
    c.inp.addEventListener('compositionend', e => { c.comp = false; typed(k, e.data || c.inp.value); });
    c.inp.addEventListener('input', e => { if(!c.comp && !(e.isComposing)) typed(k, c.inp.value); });
    c.inp.addEventListener('keydown', e => {
      if(e.key === 'Backspace' && !c.inp.value){ e.preventDefault(); stepBack(k); }
      else if(e.key === 'ArrowRight'){ PZ.dir = 'A'; move(k, 0, 1); } else if(e.key === 'ArrowLeft'){ PZ.dir = 'A'; move(k, 0, -1); }
      else if(e.key === 'ArrowDown'){ PZ.dir = 'D'; move(k, 1, 0); } else if(e.key === 'ArrowUp'){ PZ.dir = 'D'; move(k, -1, 0); }
    });
  }
  buildPad(); applyInputMode();
}
function wordsAt(k){ return PZ.words.filter(w => w.cells.includes(k)); }
function curWord(){ if(!PZ.sel) return null; const ws = wordsAt(PZ.sel); return ws.find(w => w.d === PZ.dir) || ws[0] || null; }
function pick(k, tog){
  const ws = wordsAt(k);
  if(tog && PZ.sel === k && ws.length > 1) PZ.dir = PZ.dir === 'A' ? 'D' : 'A';
  else if(!ws.some(w => w.d === PZ.dir)) PZ.dir = ws[0].d;
  PZ.sel = k;
  const w = curWord();
  for(const kk in PZ.cells) PZ.cells[kk].el.classList.remove('hl', 'sel');
  w.cells.forEach(x => PZ.cells[x].el.classList.add('hl'));
  PZ.cells[k].el.classList.add('sel');
  $('#cur').textContent = `${w.no}번 ${w.d === 'A' ? '가로' : '세로'} · ${w.ko} (${w.r.length}칸)`;
  if(!$('#pPad').checked) PZ.cells[k].inp.focus();
}
function move(k, dr, dc){
  const [r, c] = k.split(',').map(Number); const nk = (r+dr)+','+(c+dc);
  if(PZ.cells[nk]) pick(nk, false);
}
function next(k){
  const w = curWord(); if(!w) return; const i = w.cells.indexOf(k);
  if(i >= 0 && i < w.cells.length - 1) pick(w.cells[i+1], false);
}
function stepBack(k){
  const w = curWord(); if(!w) return; const i = w.cells.indexOf(k);
  if(i > 0){ const pk = w.cells[i-1]; PZ.cells[pk].inp.value = ''; pick(pk, false); }
}
function typed(k, v){
  const c = PZ.cells[k]; v = [...(v || '')].pop() || ''; c.inp.value = v; c.el.classList.remove('ok', 'ng');
  if(v){ next(k); finishCheck(false); }
}
function put(ch){
  if(!PZ.sel){ const f = Object.keys(PZ.cells)[0]; pick(f, false); }
  const k = PZ.sel, c = PZ.cells[k]; c.inp.value = ch; c.el.classList.remove('ok', 'ng'); next(k); finishCheck(false);
}
let padKata = false;
function buildPad(){
  const cells = [];
  const grp = ['あいうえお','かきくけこ','さしすせそ','たちつてと','なにぬねの','はひふへほ','まみむめも','やゆよ','らりるれろ','わをん','がぎぐげご','ざじずぜぞ','だぢづでど','ばびぶべぼ','ぱぴぷぺぽ','ゃゅょっー'];
  grp.forEach((g, gi) => { if(gi === 15) cells.push('CAP:작은 글자 · 장음'); [...g].forEach(ch => cells.push(ch)); for(let i = g.length; i < 5; i++) cells.push(''); });
  $('#padBox').innerHTML = `<div class="bar"><button class="chip${padKata?'':' on'}" data-pk="0">ひらがな</button><button class="chip${padKata?' on':''}" data-pk="1">カタカナ</button></div>
    <div class="pad">${cells.map(ch => ch.startsWith('CAP:') ? `<div class="cap">${ch.slice(4)}</div>` : ch ? `<button data-ch="${ch}"${'ゃゅょっー'.includes(ch) ? ' class="small"' : ''}>${padKata ? toKata(ch) : ch}</button>` : '<span></span>').join('')}
    <button class="sp" id="pDel">⌫ 지우기</button><button class="sp" id="pNx">다음 ▶</button></div>`;
  $$('#padBox [data-pk]').forEach(b => b.onclick = () => { padKata = b.dataset.pk === '1'; buildPad(); applyInputMode(); });
  $$('#padBox [data-ch]').forEach(b => b.onclick = () => put(padKata ? toKata(b.dataset.ch) : b.dataset.ch));
  $('#pDel').onclick = () => { if(!PZ.sel) return; const c = PZ.cells[PZ.sel]; if(c.inp.value){ c.inp.value = ''; c.el.classList.remove('ok','ng'); } else stepBack(PZ.sel); };
  $('#pNx').onclick = () => { if(PZ.sel) next(PZ.sel); };
}
const toKata = s => s.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
function applyInputMode(){
  const pad = $('#pPad').checked;
  $('#padBox').style.display = pad ? '' : 'none';
  for(const k in PZ.cells){ PZ.cells[k].inp.readOnly = pad; PZ.cells[k].inp.setAttribute('inputmode', pad ? 'none' : 'text'); }
}
const same = (a, b) => toHira(a) === toHira(b);
function finishCheck(show){
  let all = true, any = false;
  for(const k in PZ.cells){
    const c = PZ.cells[k], v = c.inp.value;
    if(!v || !same(v, c.ans)) all = false;
    if(show){ c.el.classList.remove('ok', 'ng'); if(v){ any = true; c.el.classList.add(same(v, c.ans) ? 'ok' : 'ng'); } }
  }
  if(all){ $('#pMsg').textContent = '🎉 완성! 모두 맞았어요.'; for(const k in PZ.cells) PZ.cells[k].el.classList.add('ok'); }
  else if(show) $('#pMsg').textContent = any ? '초록은 맞은 칸, 빨강은 다시 확인할 칸이에요.' : '먼저 글자를 입력해 보세요.';
  else $('#pMsg').textContent = '';
}
$('#pCheck').onclick = () => finishCheck(true);
$('#pHint').onclick = () => { if(!PZ.sel){ $('#pMsg').textContent = '힌트를 볼 칸을 먼저 눌러 주세요.'; return; } const c = PZ.cells[PZ.sel]; c.inp.value = c.ans; c.el.classList.remove('ng'); c.el.classList.add('ok'); };
$('#pReveal').onclick = () => { for(const k in PZ.cells){ PZ.cells[k].inp.value = PZ.cells[k].ans; PZ.cells[k].el.classList.remove('ng'); PZ.cells[k].el.classList.add('ok'); } $('#pMsg').textContent = '정답이에요. ‘다시 하기’로 처음부터 풀 수 있어요.'; };
$('#pClear').onclick = () => { for(const k in PZ.cells){ PZ.cells[k].inp.value = ''; PZ.cells[k].el.classList.remove('ok', 'ng'); } $('#pMsg').textContent = ''; };
window.addEventListener('resize', () => { const old = PZ.cs; if(PZ.built && PZ.W && Object.keys(PZ.cells).length && Math.max(26, Math.min(54, Math.floor((Math.min(window.innerWidth, 900) - 36) / PZ.W))) !== old){ const keep = {}; for(const k in PZ.cells) keep[k] = PZ.cells[k].inp.value; const sel = PZ.sel; renderPuzzle(); for(const k in keep) PZ.cells[k].inp.value = keep[k]; if(sel) pick(sel, false); } });

/* ---------- 3) 말하기 ---------- */
const POSN = [['all','전체'], ['n','명사'], ['a','형용사'], ['v','동사'], ['x','표현'], ['b','종합 도전']];
const SP = { pos: 'all', round: 'all', onlyNew: true, deck: [], i: 0, show: 0 };
let seen = new Set(store.get('nh_seen', []));
function buildSpeak(){
  SP.deck = D.qs.map(q => ({q, i: q.q})).filter(({q, i}) => (SP.pos === 'all' || q.p === SP.pos) && (SP.round === 'all' || q.r === +SP.round) && !(SP.onlyNew && seen.has(i)));
  shuf(SP.deck); SP.i = 0; SP.show = 0;
}
function renderSpeak(){
  const box = $('#speakArea'), dk = SP.deck;
  if(!dk.length){ box.innerHTML = '<div class="card g">풀 문제가 없어요 🎉<br><span class="sm">필터를 바꾸거나 ‘안 푼 문제만’을 꺼 보세요.</span></div><div class="bar"><button class="btn alt" id="sReset">푼 기록 지우기</button></div>'; $('#sReset').onclick = () => { seen.clear(); store.set('nh_seen', []); buildSpeak(); renderSpeak(); }; return; }
  const {q, i} = dk[SP.i];
  const posName = ({n:'명사', a:'형용사', v:'동사', x:'표현', b:'종합 도전'})[q.p];
  box.innerHTML = `<div class="prog">${SP.i + 1} / ${dk.length} · 푼 문제 ${D.qs.filter(x => seen.has(x.q)).length} / ${D.qs.length}</div>
   <div class="card fade"><div><span class="tag">${posName}</span>${q.r >= 0 ? `<span class="tag">${esc(D.rounds[q.r].t.replace(/^\d+라운드 · /, ''))}</span>` : ''}</div>
    <div class="say">“${esc(q.q)}”</div>
    ${SP.show >= 1 ? `<div class="hint sm">힌트: ${esc(q.h)}</div>` : ''}
    ${SP.show >= 2 ? `<div class="ans">${q.a.map(a => `<div class="jp">${esc(a)}</div>`).join('')}</div>${q.t ? `<div class="tip">${q.k === 'g' ? '📘 문법' : '🎎 문화'} · ${esc(q.t)}</div>` : ''}` : ''}</div>
   <div class="bar"><button class="btn alt" id="sHint"${SP.show >= 1 ? ' disabled' : ''}>힌트</button><button class="btn org" id="sAns"${SP.show >= 2 ? ' disabled' : ''}>정답 보기</button><button class="btn alt" id="sSay"${SP.show >= 2 ? '' : ' disabled'}>🔊 듣기</button></div>
   <div class="bar"><button class="btn alt" id="sPrev">◀ 이전</button><button class="btn" id="sNext">다음 문제 ▶</button></div>`;
  $('#sHint').onclick = () => { SP.show = Math.max(SP.show, 1); renderSpeak(); };
  $('#sAns').onclick = () => { SP.show = 2; renderSpeak(); };
  $('#sSay').onclick = () => say(q.a[0].replace(/[○（(][^）)]*[）)]/g, '').replace(/[／/].*$/, ''));
  $('#sNext').onclick = () => { seen.add(i); store.set('nh_seen', [...seen]); SP.i = (SP.i + 1) % dk.length; SP.show = 0; if(SP.i === 0 && SP.onlyNew){ buildSpeak(); } renderSpeak(); };
  $('#sPrev').onclick = () => { SP.i = (SP.i - 1 + dk.length) % dk.length; SP.show = 0; renderSpeak(); };
}
function posBar(){
  $('#posbar').innerHTML = POSN.map(([k, n]) => `<button class="chip${SP.pos===k?' on':''}" data-p="${k}">${n}</button>`).join('');
  $$('#posbar button').forEach(b => b.onclick = () => { SP.pos = b.dataset.p; posBar(); buildSpeak(); renderSpeak(); });
}
function setRounds(){ $('#rsel').innerHTML = '<option value="all">전체 라운드</option>' + D.rounds.map((r, i) => `<option value="${i}">${esc(r.t)}</option>`).join(''); $('#rsel').value = 'all'; SP.round = 'all'; }
setRounds();
$('#rsel').onchange = e => { SP.round = e.target.value; buildSpeak(); renderSpeak(); };
$('#onlyNew').onchange = e => { SP.onlyNew = e.target.checked; buildSpeak(); renderSpeak(); };

/* ---------- 구글시트 연동 ---------- */
const SID = (new URLSearchParams(location.search).get('sheet') || SHEET_ID || '').trim();
const POSMAP = {'명사':'n','형용사':'a','동사':'v','표현':'x','도전':'b'};
const CATMAP = {'동사':'v','い형용사':'i','な형용사':'na','명사':'n','시간·부사':'t'};
function parseCSV(t){
  const rows = []; let row = [], f = '', q = false;
  for(let i = 0; i < t.length; i++){
    const c = t[i];
    if(q){ if(c === '"'){ if(t[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if(c === '"') q = true;
    else if(c === ','){ row.push(f); f = ''; }
    else if(c === '\n' || c === '\r'){ if(c === '\r' && t[i+1] === '\n') i++; row.push(f); f = ''; rows.push(row); row = []; }
    else f += c;
  }
  if(f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows;
}
function toObjs(rows){
  if(!rows.length) return [];
  const h = rows[0].map(s => s.trim());
  return rows.slice(1).filter(r => r.some(x => x.trim() !== '')).map(r => { const o = {}; h.forEach((k, i) => o[k] = (r[i] || '').trim()); return o; });
}
async function fetchTab(name){
  const url = `https://docs.google.com/spreadsheets/d/${encodeURIComponent(SID)}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}`;
  const res = await fetch(url, {cache: 'no-store'});
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const t = await res.text();
  if(/^\s*</.test(t)) throw new Error('공개되지 않은 시트이거나 탭 이름이 달라요');
  return toObjs(parseCSV(t));
}
const num = v => { const n = parseInt(v, 10); return isNaN(n) ? 0 : n; };
function buildFromSheet(W, Q, S){
  const words = W.map(r => ({
    k: r['단어'], r: r['읽기(퍼즐용)'] || (r['단어'] || '').replace(/\(な\)/g, '').split('/')[0], c: CATMAP[r['품사']],
    ko: r['뜻'], kj: r['한자'], pol: r['정중형'], pr: r['한글발음'], ex: r['예문'], xk: r['예문 뜻'], nt: r['메모'],
    s: num(r['4주 회차']), th: num(r['주제 회차'])
  })).filter(w => w.k && w.ko && w.c && w.r);
  const qs = Q.map(r => ({
    p: POSMAP[r['품사']], r: r['라운드'] === '' ? -1 : num(r['라운드']), q: r['질문(한국어)'], h: r['힌트'],
    a: [r['정답 1'], r['정답 2'], r['정답 3']].filter(Boolean), k: ({'문법':'g','문화':'c'})[r['한마디 구분']] || '', t: r['한마디 내용']
  })).filter(q => q.p && q.q && q.a.length);
  const rounds = [], s4 = {}, th = {};
  S.forEach(r => {
    const n = num(r['번호']);
    if(r['종류'] === '라운드') rounds[n] = {t: r['이름'], g: r['설명']};
    else if(r['종류'] === '4주') s4[n] = r['이름'];
    else if(r['종류'] === '주제') th[n] = r['이름'];
  });
  for(let i = 0; i < rounds.length; i++) if(!rounds[i]) rounds[i] = {t: i + '라운드', g: ''};
  if(words.length < 10 || qs.length < 10) throw new Error('단어 또는 질문이 너무 적어요 (열 이름을 확인하세요)');
  return {words, qs, rounds, s4, th};
}
function srcMsg(t){ $('#src').textContent = t; }
function refreshAll(){
  CS.idx = 0; CS.flip = false;
  const ps = $('#pScope').value;
  const ok = v => v === 'all' || (v[0] === 's' && D.s4[v.slice(1)] !== undefined) || (v[0] === 't' && D.th[v.slice(1)] !== undefined);
  scopeOptions($('#scope'), ok(CS.scope) ? CS.scope : 'all');
  scopeOptions($('#pScope'), ok(ps) ? ps : 'all');
  CS.scope = $('#scope').value;
  buildDeck(); renderCards(); setRounds(); buildSpeak(); renderSpeak();
  PZ.built = false; if(!$('#tab-puzzle').hidden) newPuzzle();
  updStat();
}
async function loadSheet(){
  if(!SID) { srcMsg('기본 단어 사용 중'); return; }
  try{
    const cached = store.get('nh_sheetcache', null);
    if(cached && cached.sid === SID && cached.data){ D = cached.data; srcMsg('저장된 시트 데이터 (' + cached.at + ') · 새로 확인하는 중'); refreshAll(); }
  }catch(e){}
  try{
    const [W, Q, S] = await Promise.all([fetchTab('단어'), fetchTab('질문'), fetchTab('설정')]);
    const nd = buildFromSheet(W, Q, S);
    D = nd; const at = new Date().toLocaleString('ko-KR', {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'});
    store.set('nh_sheetcache', {sid: SID, at, data: nd});
    srcMsg('📗 구글시트에서 불러옴 (' + at + ') · 단어 ' + nd.words.length + ' · 질문 ' + nd.qs.length);
    refreshAll();
  }catch(e){
    const cached = store.get('nh_sheetcache', null);
    srcMsg((cached && cached.sid === SID ? '저장된 시트 데이터 사용 (' + cached.at + ')' : '기본 단어 사용 중') + ' · 시트를 읽지 못했어요: ' + e.message);
  }
}

/* ---------- 시작 ---------- */
(function(){ const c = store.get('nh_sheetcache', null); if(SID && c && c.sid === SID && c.data) D = c.data; })();
scopeOptions($('#scope'), CS.scope); scopeOptions($('#pScope'), store.get('nh_pscope', 'all')); setRounds();
updStat(); catBar(); buildDeck(); renderCards(); posBar(); buildSpeak(); renderSpeak();
loadSheet();
const t0 = store.get('nh_tab', 'cards'); const tb = $(`.tabbar button[data-tab="${t0}"]`); if(tb) tb.click();
if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
