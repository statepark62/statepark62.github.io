:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --ink:#12202C; --ink2:#52606D; --line:#D3DAE1;
  --accent:#0A7468; --on-accent:#FFFFFF; --soft:#DCEFEC; --warm:#B8741A;

  --display:'Black Han Sans','Noto Sans KR',sans-serif;
  --body:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --num:'Barlow Condensed','Noto Sans KR',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E161D; --surface:#17222C; --ink:#E8EEF2; --ink2:#9AA9B5; --line:#2A3946;

}

  --fig:#E8EEF2; --figfar:#5F7282; color-scheme:dark;
}
*{box-sizing:border-box}
body{

  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:560px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.seg button{padding:12px 0;border:1px solid var(--line);background:var(--surface);border-radius:8px;text-align:center;font-weight:700;font-size:18px}
.seg button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.vnote{margin:10px 0 0;text-align:center;font-size:14px;color:var(--ink2)}
.weeks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.wk{padding:10px 0;border:1px solid var(--line);background:var(--surface);border-radius:8px;text-align:center;font-weight:700}
.wk small{display:block;font-family:var(--num);font-size:15px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums}
.wk.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.wk.on small{color:var(--on-accent)}

.day{min-width:0;padding:8px 0 7px;border:1px solid var(--line);background:var(--surface);border-radius:8px;text-align:center}
.day b{display:block;font-size:16px;font-weight:700;line-height:1.3}
.day span{display:block;font-size:12px;color:var(--ink2)}

.day.done i{background:var(--accent);border-color:var(--accent)}
.day.today b{text-decoration:underline;text-decoration-color:var(--accent);text-decoration-thickness:3px;text-underline-offset:4px}
.day.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day.on span{color:var(--bg)}
.panel{margin-top:24px;text-align:center}
.panel h2{font-size:30px}
.meta{margin:6px 0 16px;color:var(--ink2);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.exc{display:block;width:100%;min-width:0;padding:10px 8px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-align:center}
.exc .nm{margin-top:2px;font-weight:700;font-size:16px}
.exc .rp{font-family:var(--num);font-weight:700;font-size:32px;line-height:1.1;color:var(--accent);font-variant-numeric:tabular-nums}
.exc .rp small{font-family:var(--body);font-size:14px;font-weight:500;color:var(--ink2);margin-left:2px}
.exc .nt{display:block;font-size:12px;color:var(--ink2);min-height:18px}
.fig{--figbg:var(--surface)}
.fig svg{display:block;width:100%;height:auto}
.gr{stroke:var(--line);stroke-width:2;fill:none}
.lm{fill:none;stroke:var(--fig);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.lm.far,.toe.far{stroke:var(--figfar)}
.toe{stroke:var(--fig);stroke-width:5;stroke-linecap:round}
.hd{fill:var(--figbg);stroke:var(--fig);stroke-width:5}
.prop{fill:none;stroke:var(--ink2);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.txt{margin:10px 0 0;font-size:14px;color:var(--ink2)}
.c3{display:block;width:100%;height:auto;aspect-ratio:3/2}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:22px}
.modes button{padding:12px 6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:700;font-size:16px;line-height:1.35}
.modes button small{display:block;font-weight:400;font-size:12px;color:var(--ink2)}
.modes button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.modes button.on small{color:var(--on-accent)}
.lvs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.lv{padding:10px 2px;border:1px solid var(--line);background:var(--surface);border-radius:8px;text-align:center;font-weight:700;font-size:16px}
.lv small{display:block;font-size:12px;font-weight:400;color:var(--ink2)}
.lv.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.lv.on small{color:var(--bg)}
.soon{margin:16px auto 0;max-width:460px;padding:16px;border:1px dashed var(--line);border-radius:10px;color:var(--ink2);text-align:center}
.logl{list-style:none;margin:0 auto;padding:0;display:grid;gap:6px;max-width:420px;width:100%}
.logl li{padding:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:14px;color:var(--ink2);text-align:center}
.logl b{color:var(--ink)}
.views{display:flex;gap:8px;justify-content:center;margin-top:8px}
.views .ghost{padding:6px 14px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:8px 14px;color:var(--ink2);font-size:14px}
.sec{margin-top:36px;text-align:center}
.rec{display:grid;gap:6px;justify-content:center;margin-top:10px}
.rrow{display:grid;grid-template-columns:34px repeat(7,30px);gap:6px;align-items:center;justify-content:center;font-size:13px;color:var(--ink2)}
.rc{width:30px;height:30px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.rc.dn{background:var(--accent);border-color:var(--accent)}
.rc.rs{border-style:dashed;background:transparent}
.rc.cur{outline:2px solid var(--ink);outline-offset:1px}
.safe{margin:26px auto 0;max-width:460px;padding:12px 16px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:center;font-size:14px;color:var(--ink2)}
.safe b{display:block;color:var(--ink);font-size:14px;margin-bottom:2px}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);

.btn.two{background:var(--surface);color:var(--ink);border:1px solid var(--line);margin-top:10px;font-size:16px}

  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ov .fig{--figbg:var(--bg)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.chip{display:inline-block;margin:10px 0 0;padding:3px 12px;border-radius:999px;background:var(--soft);color:var(--accent);font-size:13px;font-weight:700}
.dtitle{text-align:center;margin-top:8px}
.dtitle h2{font-size:34px}
.goal{margin:12px 0 0;font-family:var(--num);font-weight:700;font-size:30px;color:var(--accent)}
.blk{margin-top:22px}
.blk h3{margin:0 0 8px;font-size:15px;text-align:center;color:var(--ink2);letter-spacing:.06em;font-weight:500}
.blk ol,.blk ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.blk li{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;text-align:center}
.blk ol{counter-reset:s}
.blk ol li{counter-increment:s}
.blk ol li::before{content:counter(s);display:block;font-family:var(--num);font-weight:700;font-size:20px;color:var(--accent);line-height:1.2}
.two2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:22px}
.two2 div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-align:center;font-size:14px}
.two2 b{display:block;font-size:13px;color:var(--ink2);font-weight:500}
.pbar{height:6px;background:var(--line);border-radius:3px;margin:12px 0 0;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.gstage{text-align:center;margin-top:14px}
.glab{margin:0;font-size:14px;letter-spacing:.1em;font-weight:700;color:var(--accent)}
.glab.rs{color:var(--warm)}
.gstage h2{font-size:34px;margin-top:4px}
.gset{margin:2px 0 0;color:var(--ink2)}
.gnum{margin:6px 0 0;font-family:var(--num);font-weight:700;font-size:96px;line-height:1;font-variant-numeric:tabular-nums}
.gnum small{font-family:var(--body);font-size:22px;font-weight:500;color:var(--ink2);margin-left:4px}
.gnum.rs{color:var(--warm)}
.gnote{margin:0;min-height:20px;font-size:13px;color:var(--ink2)}
.gcue{margin:10px auto 18px;max-width:440px;font-size:16px}
.gstage .fig{max-width:420px;margin:0 auto}

    <div class="meter" aria-hidden="true"><i id="meter"></i></div>

  <div class="modes" id="mode"></div>

  <section class="sec">

</div>

  if(k==='full'){
    var R=ROUNDS[w];
    for(var r=1;r<=R;r++){list.forEach(function(it,j){out.push({id:it[0],v:it[1][w],set:r,sets:R,rest:j===list.length-1?60:20,lab:'라운드'});});}
  }else{
    var s=SETS[w];
    list.forEach(function(it){for(var r=1;r<=s;r++){out.push({id:it[0],v:it[1][w],set:r,sets:s,rest:60,lab:'세트'});}});
  }
  out[out.length-1].rest=0;
  return out;
}
function estMin(units){var s=0;units.forEach(function(u){s+=(EX[u.id].u==='초'?u.v:u.v*3)+u.rest;});return Math.max(1,Math.round(s/60));}

/* ---------- 메인 화면 ---------- */
function render(){
  var lv=ST.mode==='lvl';
  $('#mode').innerHTML=[['lvl','단계별 챌린지','40세 이상 남성 · 월수금'],['plan','4주 프로그램','50대 이상 · 월~금']].map(function(x){
    return '<button class="'+(ST.mode===x[0]?'on':'')+'" data-act="mode" data-m="'+x[0]+'" aria-pressed="'+(ST.mode===x[0])+'">'+x[1]+'<small>'+x[2]+'</small></button>';
  }).join('');
  $('#lvwrap').hidden=!lv;$('#sexwrap').hidden=lv;$('#weekwrap').hidden=lv;
  $('#sub').textContent=lv?'40세 이상 남성 · 월·수·금 · 3D 아바타 동작 가이드':'4주 · 월~금 · 50대 이상 · 3D 아바타 동작 가이드';
  if(lv)renderLvl();else renderPlan();
}
function renderLvl(){
  var L=LV[ST.lvSel],ws=weekStart();
  var wk=ST.log.filter(function(e){return e.t>=ws;}).length;
  $('#cnt').textContent=wk;$('#cntmax').textContent=' / 3회';
  $('#cntlab').textContent='이번 주 완료 · 누적 '+ST.log.length+'회';
  $('#meter').style.width=Math.min(100,wk/3*100)+'%';
  $('#lvs').innerHTML=[1,2,3,4].map(function(i){var l=LV[i];
    return '<button class="lv'+(i===ST.lvSel?' on':'')+'" data-act="lv" data-l="'+i+'" aria-pressed="'+(i===ST.lvSel)+'">'+l.n+'<small>'+(l.soon?'준비 중':l.r+'라운드')+'</small></button>';
  }).join('');
  $('#lvnote').textContent=L.s;
  $('#days').style.gridTemplateColumns='repeat(3,minmax(0,1fr))';
  $('#days').innerHTML=LVDAYS.map(function(d,i){
    var dn=ST.log.some(function(e){return e.t>=ws&&e.lv===ST.lvSel&&e.d===d;});
    var cl='day'+(d===selL?' on':'')+(dn?' done':'')+(d===todayIdx?' today':'');
    return '<button class="'+cl+'" data-act="lday" data-d="'+d+'"><b>'+DAYS[d].d+'요일</b><span>'+(i+1)+'일차</span><i></i></button>';
  }).join('');
  var h='';
  if(L.soon){
    h='<h2>'+L.n+' · '+L.s+'</h2><div class="soon">'+L.n+' 단계는 동작 그림을 만든 뒤 추가됩니다.<br>지금은 초급과 중급을 이용해 주세요.</div>';
    $('#bar').hidden=true;
  }else{
    var list=L.days[selL],mins=estMin(buildLvUnits(selL));
    h='<h2>'+DAYS[selL].d+'요일 루틴</h2><p class="meta">'+L.n+' · '+L.r+'라운드 · 라운드당 '+list.length+'개 동작 · 약 '+mins+'분</p><div class="grid">';
    list.forEach(function(it){
      var ex=EX[it[0]];
      h+='<button class="exc" data-act="ex" data-id="'+it[0]+'" aria-label="'+esc(ex.n)+' 자세 보기"><div class="fig" data-ex="'+it[0]+'"></div><div class="nm">'+esc(ex.n)+'</div><div class="rp">'+it[1]+'<small>'+ex.u+'</small></div><span class="nt">'+esc(it[2]||ex.note||'')+'</span></button>';
    });
    h+='</div><p class="txt">위 동작을 한 라운드로 하고 '+L.r+'라운드를 반복합니다. 동작 사이 '+TRANS+'초, 라운드 사이 '+RROUND+'초 쉽니다.</p>';
    $('#bar').hidden=false;
    $('#startBtn').textContent='운동 시작 · 약 '+mins+'분';
  }
  $('#panel').innerHTML=h;
  mount($('#panel'));
  var items=ST.log.slice(-8).reverse().map(function(e){
    var dt=new Date(e.t);
    return '<li><b>'+(dt.getMonth()+1)+'/'+dt.getDate()+' ('+'일월화수목금토'.charAt(dt.getDay())+')</b> · '+LV[e.lv].n+' '+DAYS[e.d].d+'요일 루틴</li>';
  }).join('');
  $('#rec').innerHTML=items?'<ul class="logl">'+items+'</ul>':'<p class="txt" style="margin:0">아직 완료한 운동이 없습니다.</p>';
  $('#rectxt').textContent='운동을 끝까지 마치면 자동으로 기록됩니다. 기록은 이 기기의 브라우저에 저장됩니다.';
}
function renderPlan(){
  $('#days').style.gridTemplateColumns='';
  $('#cntmax').textContent=' / 20일';$('#cntlab').textContent='완료한 운동일';
  $('#rectxt').textContent='칸을 누르면 그날로 이동합니다. 기록은 이 기기의 브라우저에 저장됩니다.';
  var cnt=0;
  for(var w=0;w<4;w++)for(var d=0;d<7;d++)if(DAYS[d].k!=='rest'&&isDone(w,d))cnt++;
  $('#cnt').textContent=cnt;
  $('#meter').style.width=(cnt/20*100)+'%';

  $('#sex').innerHTML=[['M','남성'],['F','여성']].map(function(x){
    return '<button class="'+(ST.sex===x[0]?'on':'')+'" data-act="sex" data-s="'+x[0]+'" aria-pressed="'+(ST.sex===x[0])+'">'+x[1]+'</button>';
  }).join('');
  $('#vnote').textContent=VNOTE[ST.sex];

  $('#weeks').innerHTML=[0,1,2,3].map(function(w){
    var c=0;for(var d=0;d<7;d++)if(DAYS[d].k!=='rest'&&isDone(w,d))c++;
    return '<button class="wk'+(w===selW?' on':'')+'" data-act="week" data-w="'+w+'">'+(w+1)+'주차<small>'+c+'/5</small></button>';
  }).join('');

  $('#days').innerHTML=DAYS.map(function(x,d){
    var cl='day'+(d===selD?' on':'')+(x.k==='rest'?' rest':'')+(isDone(selW,d)?' done':'')+(d===todayIdx?' today':'');
    return '<button class="'+cl+'" data-act="day" data-d="'+d+'"><b>'+x.d+'</b><span>'+x.t+'</span><i></i></button>';
  }).join('');

  var day=DAYS[selD],h='';
  h+='<h2>'+day.d+'요일 · '+day.t+'</h2>';
  if(day.k==='rest'){
    var ri=RESTINFO[selD];
    h+='<p class="meta">'+esc(ri.h)+'</p><div class="blk"><ul>'+ri.l.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ul></div>';
    $('#bar').hidden=true;
  }else{
    var units=buildUnits(selD,selW),mins=estMin(units);
    var rounds=day.k==='full';
    h+='<p class="meta">'+(selW+1)+'주차 · '+(ST.sex==='M'?'남성':'여성')+' · '+(rounds?ROUNDS[selW]+'라운드 서킷':SETS[selW]+'세트')+' · 약 '+mins+'분</p><div class="grid">';
    plan(day.k).forEach(function(it){
      var ex=EX[it[0]];
      h+='<button class="exc" data-act="ex" data-id="'+it[0]+'" aria-label="'+esc(ex.n)+' 자세 보기"><div class="fig" data-ex="'+it[0]+'"></div><div class="nm">'+esc(ex.n)+'</div><div class="rp">'+it[1][selW]+'<small>'+ex.u+'</small></div><span class="nt">'+(ex.note||'')+'</span></button>';
    });
    h+='</div><p class="txt">동작 카드를 누르면 자세 설명을 볼 수 있습니다.</p>';
    h+='<p style="margin:12px 0 0"><button class="ghost" data-act="toggle">'+(isDone(selW,selD)?'완료 취소':'완료로 표시')+'</button></p>';
    $('#bar').hidden=false;
    $('#startBtn').textContent='운동 시작 · 약 '+mins+'분';
  }
  $('#panel').innerHTML=h;
  mount($('#panel'));

  var rec='';
  for(var w2=0;w2<4;w2++){
    rec+='<div class="rrow"><span>'+(w2+1)+'주</span>';
    for(var d2=0;d2<7;d2++){
      var k2=DAYS[d2].k==='rest';
      var c2='rc'+(k2?' rs':'')+(isDone(w2,d2)?' dn':'')+(w2===selW&&d2===selD?' cur':'');
      rec+='<button class="'+c2+'" data-act="jump" data-w="'+w2+'" data-d="'+d2+'" aria-label="'+(w2+1)+'주차 '+DAYS[d2].d+'요일'+(isDone(w2,d2)?' 완료':'')+'"></button>';
    }
    rec+='</div>';
  }
  var head='<div class="rrow"><span></span>'+DAYS.map(function(x){return '<span style="text-align:center">'+x.d+'</span>';}).join('')+'</div>';
  $('#rec').innerHTML=head+rec;
}

/* ---------- 동작 상세 ---------- */
function lockScroll(on){document.body.style.overflow=on?'hidden':'';}
function openDetail(id){
  var ex=EX[id],goal='',unote=ex.note||'';
  if(ST.mode==='lvl'){
    var L=LV[ST.lvSel],li=((L&&L.days&&L.days[selL])||[]).filter(function(x){return x[0]===id;})[0];
    if(li){goal=li[1]+ex.u+' × '+L.r+'라운드';unote=li[2]||ex.note||'';}
  }else{
    var day=DAYS[selD],it=(plan(day.k)||[]).filter(function(x){return x[0]===id;})[0];
    if(it)goal=it[1][selW]+ex.u+' × '+(day.k==='full'?ROUNDS[selW]+'라운드':SETS[selW]+'세트');
  }
  var h='<div class="top"><button class="ghost" data-act="closeDetail" id="dclose">닫기</button><span></span></div>';
  h+='<div class="fig" data-ex="'+id+'" style="max-width:420px;margin:8px auto 0"></div>'+viewsHtml(true,ex);
  h+='<div class="dtitle"><h2>'+esc(ex.n)+'</h2><span class="chip">'+esc(ex.m)+'</span>'+(goal?'<p class="goal">'+esc(goal)+(unote?'<small style="font-family:var(--body);font-size:13px;color:var(--ink2);font-weight:400"> ('+esc(unote)+')</small>':'')+'</p>':'')+'</div>';
  h+='<div class="blk"><h3>자세</h3><ol>'+ex.steps.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ol></div>';
  h+='<div class="blk"><h3>흔한 실수</h3><ul>'+ex.bad.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ul></div>';
  h+='<div class="two2"><div><b>더 쉽게</b>'+esc(ex.easy)+'</div><div><b>더 어렵게</b>'+esc(ex.hard)+'</div></div>';
  $('#dv').innerHTML=h;
  mount($('#dv'));
  $('#detail').hidden=false;$('#detail').scrollTop=0;lockScroll(true);
  $('#dclose').focus();
}
function closeDetail(){$('#detail').hidden=true;lockScroll(!$('#guide').hidden);}

/* ---------- 가이드 모드 ---------- */
var G=null,timer=null,wl=null,actx=null;
function beep(fq,dur){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();var o=actx.createOscillator(),g=actx.createGain();o.frequency.value=fq||880;g.gain.value=0.08;o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+(dur||0.15));}catch(e){}}
function buzz(){try{if(navigator.vibrate)navigator.vibrate(200);}catch(e){}}
function stopTimer(){if(timer){clearInterval(timer);timer=null;}}
function startTimer(secs,onEnd){
  stopTimer();
  G.endAt=Date.now()+secs*1000;G.lastRem=-1;
  timer=setInterval(function(){
    var rem=Math.max(0,Math.ceil((G.endAt-Date.now())/1000));
    var el=$('#gnum');
    if(el)el.innerHTML=rem+'<small>초</small>';
    if(rem!==G.lastRem){G.lastRem=rem;if(rem>0&&rem<=3)beep(660,0.08);}
    if(rem<=0){stopTimer();beep(990,0.3);buzz();onEnd();}
  },200);
}
function startGuide(){
  var units=buildUnits(selD,selW);if(!units.length)return;
  G={units:units,i:0,ph:'ready',t0:Date.now(),armed:false};
  $('#guide').hidden=false;$('#guide').scrollTop=0;lockScroll(true);
  try{if(navigator.wakeLock){navigator.wakeLock.request('screen').then(function(l){wl=l;}).catch(function(){});}}catch(e){}
  renderGuide();
}
function renderGuide(){
  var g=G,u=g.units[g.i],nx=g.units[g.i+1];
  if(g.ph==='done'){
    var mins=Math.max(1,Math.round((Date.now()-g.t0)/60000));
    $('#gv').innerHTML='<div class="gstage" style="margin-top:56px"><p class="glab">완료</p><h2>오늘 운동 끝</h2><p class="gset">'+g.units.length+'개 '+(ST.mode==='lvl'?'동작':(DAYS[selD].k==='full'?'라운드 동작':'세트'))+' · 약 '+mins+'분</p><div class="gnum">'+(ST.mode==='lvl'?LV[ST.lvSel].n+'<small>'+DAYS[selL].d+'요일 기록됨</small>':(selW+1)+'<small>주차 '+DAYS[selD].d+'요일 기록됨</small>')+'</div><p class="gcue">물을 마시고 가볍게 스트레칭하세요.</p><button class="btn" data-act="closeGuide">닫기</button></div>';
    return;
  }
  var show=(g.ph==='rest'&&nx)?nx:u,ex=EX[show.id];
  var done=g.ph==='rest'?g.i+1:g.i;
  var h='<div class="top"><button class="ghost" data-act="quit" id="qbtn">종료</button><span style="font-family:var(--num);font-size:20px;font-weight:700">'+(g.i+1)+' / '+g.units.length+'</span></div>';
  h+='<div class="pbar"><i style="width:'+(done/g.units.length*100).toFixed(1)+'%"></i></div><div class="gstage">';
  var lab=g.ph==='rest'?'휴식 · 다음 동작':(g.ph==='run'?'진행 중':'준비');
  h+='<p class="glab'+(g.ph==='rest'?' rs':'')+'">'+lab+'</p>';
  h+='<div class="fig" data-ex="'+show.id+'"></div>'+viewsHtml(false,ex);
  h+='<h2>'+esc(ex.n)+'</h2><p class="gset">'+show.set+' / '+show.sets+' '+show.lab+'</p>';
  var big;
  if(g.ph==='rest'||g.ph==='run'){big=Math.max(0,Math.ceil((g.endAt-Date.now())/1000))+'<small>초</small>';}
  else{big=show.v+'<small>'+ex.u+'</small>';}
  h+='<div class="gnum'+(g.ph==='rest'?' rs':'')+'" id="gnum">'+big+'</div><p class="gnote">'+esc(show.note||ex.note||'')+'</p>';
  h+='<p class="gcue">'+esc(ex.steps[1])+'</p>';
  if(g.ph==='ready'){
    h+= ex.u==='초' ? '<button class="btn" data-act="startRun">시작</button>' : '<button class="btn" data-act="done">세트 완료</button>';
    if(g.i>0)h+='<button class="btn two" data-act="prev">이전 동작</button>';
  }else if(g.ph==='run'){
    h+='<button class="btn" data-act="done">끝내기</button>';
  }else{
    h+='<button class="btn" data-act="skip">건너뛰기</button><button class="btn two" data-act="plus">+15초</button>';
  }
  h+='</div>';
  $('#gv').innerHTML=h;
  mount($('#gv'));
}
function completeUnit(){
  var g=G,u=g.units[g.i];
  stopTimer();
  if(g.i>=g.units.length-1){finishGuide();return;}
  if(u.rest>0){g.ph='rest';startTimer(u.rest,nextUnit);renderGuide();}
  else nextUnit();
}
function nextUnit(){stopTimer();G.i++;G.ph='ready';renderGuide();$('#guide').scrollTop=0;}
function finishGuide(){
  stopTimer();G.ph='done';
  if(ST.mode==='lvl')ST.log.push({t:Date.now(),lv:ST.lvSel,d:selL});
  else{ST.done[selW+'-'+selD]=Date.now();ST.week=selW;}
  save();renderGuide();render();
}
function closeGuide(){
  stopTimer();G=null;
  try{if(wl){wl.release();wl=null;}}catch(e){}
  $('#guide').hidden=true;lockScroll(!$('#detail').hidden);
  render();
}

/* ---------- 이벤트 ---------- */
var resetArmed=false,resetT=null;
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act');
  if(a==='view'){var ovv=b.closest('.ov'),bg=ovv&&bigs[ovv.id];if(bg){bg.stage.azT=parseFloat(b.getAttribute('data-az'));if(reduce){bg.stage.az=bg.stage.azT;drawFrame(0);}}}
  else if(a==='mode'){ST.mode=b.getAttribute('data-m');save();render();}
  else if(a==='lv'){ST.lvSel=+b.getAttribute('data-l');save();render();}
  else if(a==='lday'){selL=+b.getAttribute('data-d');render();}
  else if(a==='sex'){ST.sex=b.getAttribute('data-s');save();render();}
  else if(a==='week'){selW=+b.getAttribute('data-w');ST.week=selW;save();render();}
  else if(a==='day'){selD=+b.getAttribute('data-d');render();}
  else if(a==='jump'){selW=+b.getAttribute('data-w');selD=+b.getAttribute('data-d');ST.week=selW;save();render();window.scrollTo({top:0,behavior:reduce?'auto':'smooth'});}
  else if(a==='ex'){openDetail(b.getAttribute('data-id'));}
  else if(a==='closeDetail'){closeDetail();}
  else if(a==='start'){startGuide();}
  else if(a==='toggle'){var k=selW+'-'+selD;if(ST.done[k])delete ST.done[k];else ST.done[k]=Date.now();save();render();}
  else if(a==='reset'){
    if(!resetArmed){resetArmed=true;b.textContent='한 번 더 누르면 모든 기록이 지워집니다';clearTimeout(resetT);resetT=setTimeout(function(){resetArmed=false;b.textContent='기록 초기화';},3500);}
    else{resetArmed=false;clearTimeout(resetT);if(ST.mode==='lvl')ST.log=[];else ST.done={};save();b.textContent='기록 초기화';render();}
  }
  else if(a==='quit'){
    if(!G.armed){G.armed=true;b.textContent='한 번 더 누르면 종료';setTimeout(function(){if(G){G.armed=false;var q=$('#qbtn');if(q)q.textContent='종료';}},3000);}
    else closeGuide();
  }
  else if(a==='closeGuide'){closeGuide();}
  else if(a==='startRun'){G.ph='run';startTimer(G.units[G.i].v,completeUnit);renderGuide();}
  else if(a==='done'){completeUnit();}
  else if(a==='prev'){stopTimer();G.i=Math.max(0,G.i-1);G.ph='ready';renderGuide();}
  else if(a==='skip'){nextUnit();}
  else if(a==='plus'){G.endAt+=15000;var el=$('#gnum');if(el)el.innerHTML=Math.max(0,Math.ceil((G.endAt-Date.now())/1000))+'<small>초</small>';}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){if(!$('#detail').hidden)closeDetail();}
});
render();
})();
</script>
