<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>맨몸 챌린지 · 초기화면</title>
<link rel="icon" href="favicon.ico">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0A7468">
<style>
:root{--bg:#F4F7FA;--card:#fff;--ink:#16222E;--sub:#5B6B7A;--line:#DCE4EC;--blue:#1F5FA8;--org:#B4540A;--red:#9B1C1C;--grn:#2F7D32}
@media(prefers-color-scheme:dark){:root{--bg:#0F1720;--card:#18232F;--ink:#EAF0F6;--sub:#9FB0C0;--line:#2B3A49;--blue:#6FA8E8;--org:#E89A58;--red:#F08A8A;--grn:#7CC47F}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18.5px/1.65 -apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;text-align:center}
.wrap{max-width:1180px;margin:0 auto;padding:40px 20px 56px}
.logo{width:92px;height:92px;border-radius:22px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
h1{font-size:clamp(34px,6vw,50px);margin:16px 0 4px;line-height:1.2}
.sub{font-size:19.5px;color:var(--sub);margin:0 0 6px}
.week{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:22px 0 8px}
.week span{min-width:56px;padding:8px 14px;border-radius:999px;font-weight:700;background:var(--card);border:1px solid var(--line)}
.week .on{background:var(--blue);color:#fff;border-color:var(--blue)}
.week .off{color:var(--sub)}
h2{font-size:28px;margin:46px 0 6px}
.lead{color:var(--sub);margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:2px solid var(--line);border-top:8px solid var(--c);border-radius:18px;padding:24px 20px;transition:transform .15s,box-shadow .15s}
a.card:hover,a.card:focus-visible{transform:translateY(-3px);box-shadow:0 8px 22px rgba(0,0,0,.14);outline:none}
.tag{display:inline-block;font-weight:700;font-size:16px;color:#fff;background:var(--c);border-radius:999px;padding:2px 14px}
.card h3{font-size:25px;margin:12px 0 4px;color:var(--c)}
.card p{margin:0;color:var(--sub);font-size:17.5px}
a.main{display:block;max-width:560px;margin:26px auto 0;text-decoration:none;color:#fff;background:#0A7468;border-radius:20px;padding:22px 20px;font-size:26px;font-weight:800;box-shadow:0 6px 18px rgba(10,116,104,.35)}
a.main small{display:block;font-size:17px;font-weight:500;opacity:.9;margin-top:2px}
.cw{display:flex;flex-direction:column;gap:8px}
.cw .card{flex:1}
a.prt{display:block;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--c);font-weight:700;text-decoration:none;font-size:17px}
.card.sel{box-shadow:0 0 0 4px var(--c)}
.card .now{display:none;margin-top:8px;font-weight:800;color:#fff;background:var(--c);border-radius:999px;padding:2px 14px;font-size:16px}
.card.sel .now{display:inline-block}
button.card{font:inherit;width:100%;cursor:pointer;text-align:center;background:var(--card);color:var(--ink);border:2px solid var(--line);border-top:8px solid var(--c);border-radius:18px;padding:24px 20px;appearance:none;-webkit-appearance:none;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
#plan{margin-top:26px;background:var(--card);border:2px solid var(--c,var(--line));border-radius:18px;padding:26px 18px}
#plan h3{font-size:28px;margin:0 0 4px;color:var(--c)}
#plan .meta{color:var(--sub);margin:0 0 18px}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;text-align:center}
.d{background:var(--bg);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:14px;padding:14px 12px}
.d.rest{border-top-color:var(--line);color:var(--sub);display:flex;flex-direction:column;justify-content:center}
.d b{display:block;font-size:22px;color:var(--c)}
.d.rest b{color:var(--sub)}
.d ol{list-style:none;margin:8px 0 0;padding:0}
.d li{padding:6px 0;border-top:1px dashed var(--line);font-size:16.5px}
.d li:first-child{border-top:0}
.d li em{font-style:normal;font-weight:700;color:var(--c)}
.d li small{display:block;color:var(--sub);font-size:14.5px}
@media(max-width:1000px){.days{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}}
.acts{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:20px}
.acts a{display:inline-block;padding:13px 22px;border-radius:12px;font-weight:700;text-decoration:none;font-size:18px;border:2px solid var(--c);color:var(--c);background:var(--card)}
.acts a.p{background:var(--c);color:#fff}
#plan h3.gt{font-size:26px;margin:34px 0 2px;color:var(--c)}
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;margin-top:6px}
.fg{margin:0;background:var(--bg);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:14px;padding:12px;cursor:zoom-in}
.fg img{width:100%;height:190px;object-fit:contain;background:#fff;border-radius:8px;display:block}
.fg figcaption{margin-top:10px}
.fg .no{display:inline-block;min-width:28px;height:28px;line-height:28px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;font-size:15px;margin-right:6px}
.fg b{font-size:19px;color:var(--ink)}
.fg small{display:block;color:var(--sub);font-size:15px}
.fg em{display:block;font-style:normal;font-weight:700;color:var(--c);font-size:16.5px;margin-top:2px}
#zoom{border:0;border-radius:16px;padding:14px;max-width:min(96vw,1000px);background:#fff;color:#16222E;text-align:center}
#zoom::backdrop{background:rgba(0,0,0,.7)}
#zoom img{max-width:100%;max-height:78vh;background:#fff}
#zoom p{margin:8px 0 10px;font-weight:700;font-size:20px}
#zoom button{font:inherit;padding:10px 26px;border-radius:10px;border:0;background:#16222E;color:#fff;font-weight:700;font-size:17px}
.big{font-size:44px;font-weight:800;color:var(--c);line-height:1.1;margin:10px 0 0}
.big small{font-size:18px;font-weight:600;color:var(--sub)}
.go{display:inline-block;margin-top:14px;font-weight:700;color:var(--c)}
.lv{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.lv div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 12px}
.lv b{display:block;font-size:21px}
.note{margin-top:46px;padding:18px 20px;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--sub);font-size:17px}
.note b{color:var(--red)}
footer{margin-top:30px;color:var(--sub);font-size:16px}
@media print{a.card{break-inside:avoid}}
</style></head><body><div class="wrap">
<img class="logo" src="icon-192.png" alt="">
<h1>맨몸 챌린지</h1>

<h2>오늘의 운동 단계</h2>

</div>
<section id="plan" hidden aria-live="polite"></section>

<div class="note"><b>안전 안내</b> · 운동 중 통증, 어지러움, 가슴 답답함이 있으면 즉시 중단하세요. 혈압·심장·관절에 문제가 있으면 의사와 상담한 뒤 시작하고, 고급 동작은 쉬운 단계가 충분히 편해진 뒤에 합니다.</div>
<footer>맨몸 챌린지 · 개인용</footer>

 var D=DATA[l];if(!D)return;
