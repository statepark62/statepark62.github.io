name: Tenseijingo Naver

on:
  schedule:
    - cron: '7 22 * * *'    # 한국 시간 07:07 (1차)
    - cron: '7 23 * * *'    # 한국 시간 08:07 (예비 1)
    - cron: '7 0 * * *'     # 한국 시간 09:07 (예비 2)
    - cron: '7 2 * * *'     # 한국 시간 11:07 (예비 3)
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: tenseijingo-naver
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 한글·일본어 폰트 설치 (카드 렌더링용)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: 라이브러리 설치
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
          pip install beautifulsoup4

      - name: 페이지·카드 생성 및 카페 게시
        env:
          PROVIDER: openai
          OPENAI_MODEL: gpt-5
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_REFRESH_TOKEN: ${{ secrets.NAVER_REFRESH_TOKEN }}
          NAVER_CAFE_CLUB_ID: ${{ secrets.NAVER_CAFE_CLUB_ID }}
          NAVER_CAFE_MENU_ID: ${{ secrets.NAVER_CAFE_MENU_ID }}
          GAS_WORDS_URL: ${{ secrets.GAS_WORDS_URL }}
          GAS_WORDS_TOKEN: ${{ secrets.GAS_WORDS_TOKEN }}
        run: python automation_naver/daily.py

      - name: 오늘 날짜(KST) 계산
        id: kst_date
        run: echo "date=$(date -u -d '+9 hours' +%F)" >> "$GITHUB_OUTPUT"

      - name: Threads 게시 여부 확인 (중복 방지)
        id: check_posted
        run: |
          STATE_FILE="automation_naver/scripts/threads/last_posted_date.txt"
          TODAY="${{ steps.kst_date.outputs.date }}"
          if [ -f "$STATE_FILE" ] && [ "$(cat "$STATE_FILE")" = "$TODAY" ]; then
            echo "오늘($TODAY)은 이미 Threads에 게시했습니다. 건너뜁니다."
            echo "already_posted=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_posted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Threads에 요약 게시
        if: steps.check_posted.outputs.already_posted == 'false'
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: |
          python automation_naver/scripts/threads/tenseijingo_to_threads.py \
            --html "tenseijingo_naver/${{ steps.kst_date.outputs.date }}.html" \
            --base-url "https://statepark62.github.io/tenseijingo_naver"
          mkdir -p automation_naver/scripts/threads
          echo "${{ steps.kst_date.outputs.date }}" > automation_naver/scripts/threads/last_posted_date.txt

      - name: PWA 단어 동기화 (시트 → kotoba/words.json)
        if: always()    # 새 글이 없는 날도 시트 수동 편집분을 반영
        env:
          GAS_WORDS_URL: ${{ secrets.GAS_WORDS_URL }}
          GAS_WORDS_TOKEN: ${{ secrets.GAS_WORDS_TOKEN }}
        run: python automation_naver/sync_words.py

      - name: 커밋 및 푸시
        if: always()
        run: |
          git config user.name "tenseijingo-bot"
          git config user.email "actions@github.com"
          git add tenseijingo_naver/
          git add kotoba/words.json
          if [ -f automation_naver/scripts/threads/last_posted_date.txt ]; then
            git add automation_naver/scripts/threads/last_posted_date.txt
          fi
          if git diff --cached --quiet; then
            echo "변경 사항 없음 — 커밋 생략"
          else
            git commit -m "天声人語(naver) $(date -u -d '+9 hours' +%F) 발행"
            git push
          fi
