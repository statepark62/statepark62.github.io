name: Bite size Japanese - URL 지정 수동 추출

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: "처리할 유튜브 영상/채널/재생목록 URL"
        required: true
        type: string
      limit:
        description: "채널/재생목록일 때 처리할 최대 영상 수"
        required: false
        default: "5"
        type: string
      label:
        description: "목록(sources 탭)에 저장할 때 붙일 별명 (선택)"
        required: false
        default: ""
        type: string
      force:
        description: "이미 처리된 영상도 다시 처리할지 여부"
        required: false
        default: false
        type: boolean

jobs:
  extract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: YouTubeJapaness
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: yt-dlp 쿠키 파일 생성
        run: echo "${{ secrets.YTDLP_COOKIES }}" > cookies.txt

      - name: 지정 URL 처리
        env:
          BSJ_SHEET_ID: ${{ secrets.BSJ_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YTDLP_COOKIES_PATH: cookies.txt
        run: |
          FORCE_FLAG=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python run_single_url.py "${{ inputs.youtube_url }}" --limit "${{ inputs.limit }}" --label "${{ inputs.label }}" $FORCE_FLAG
